<style>
/* Layout: full-screen map, results in a bottom sheet (side panel on wide screens) */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#dde2de; --soft:#eef1ee;
  --accent:#1f6f54;
  --ok:#1f7a3f; --warn:#a86400; --no:#b3261e;
  --ok-bg:#e5f3e9; --warn-bg:#fbefd9; --no-bg:#fbe5e3;
  --f-display:"Archivo",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --panel:#1c2320; --fg:#e6ece8; --muted:#9aa8a0; --line:#2e3833; --soft:#232c28;
  --accent:#5cc49a;
  --ok:#7fd69a; --warn:#f0b65a; --no:#f2867d;
  --ok-bg:#1b3325; --warn-bg:#3a2c12; --no-bg:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-display)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;white-space:nowrap}
.ib:focus-visible,#q:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--line)}
.layers{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:900;display:flex;flex-direction:column;gap:6px}
.layers label{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;display:flex;gap:6px;align-items:center}
#panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:1001;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
#sheet,#aux{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
#grab span{width:44px;height:5px;border-radius:3px;background:var(--line)}
#tabs{display:none}
.m-only{display:none}
#menu{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.15);max-width:280px}
#lyrBtn{display:none}
#lyrList{display:flex;flex-direction:column;gap:6px}
#netbar{position:absolute;left:0;right:0;top:0;height:3px;z-index:960;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:nb 1.1s linear infinite}
body.net-busy #netbar{opacity:1}
@keyframes nb{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#netbar{animation:none;background:var(--accent)}}
@media (min-width:900px){#panel{left:auto;top:10px;right:10px;bottom:10px;width:420px;border-radius:12px;border:1px solid var(--line)} #grab{display:none} #sheet,#aux{padding-top:14px} .layers{right:440px}}
/* mobitel: karta glavna, panel s tri stanja, donja navigacija */
@media (max-width:899px){
  header h1{display:none}
  header .ib{min-width:44px;min-height:44px}
  #favBtn{display:none}
  #q{min-height:44px;font-size:16px}
  #tabs{display:flex;flex:none;background:var(--panel);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);z-index:1000}
  #tabs button{flex:1;min-height:56px;border:0;background:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

  #panel.st-peek #sheet{overflow:hidden}
  .m-only{display:block}
  .cards.m-only{display:grid}
  .tab-analiza .grp[data-g=troskovi],.tab-karta .grp[data-g=troskovi]{display:none}

  .layers{top:10px}
  #lyrBtn{display:block;min-height:44px;background:var(--panel);box-shadow:0 1px 6px rgba(0,0,0,.15)}

  input[type=checkbox]{width:20px;height:20px}
  .acc>summary{min-height:48px}

  .rp th,.rp td{display:block;width:auto;border-top:0;padding:2px 0}
  .rp tr{display:block;border-top:1px solid var(--line);padding:6px 0}
  .calc .row{flex-wrap:wrap}
  .calc .row span:first-child{flex:1 1 60%;min-width:0}
  .leaflet-control-scale{display:none}
  .leaflet-bottom.leaflet-right{top:100px;bottom:auto;left:0;right:auto}
  .leaflet-control-attribution{font-size:10px}
  .tab-troskovi .cards{display:none}
  .grp[data-g=sum]{display:flex;flex-direction:column}

  .grp[data-g=sum]>.cards{order:4}
  .bgrid>span{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
  .bgrid input[type=range]{width:auto!important;flex:1 1 90px;min-width:0;height:32px}
  .bgrid input[type=date]{width:100%;min-width:0;max-width:100%}
  .bgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
}

.bgrid>span{min-width:0}

.bgrid input[type=number],.bsel{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}
.bgrid input[type=number]{width:6em}
.actions{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.phase-d summary{font-weight:700;font-size:15px;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.docs label{display:flex;gap:6px;align-items:flex-start;font-size:14px}
.docs small{color:var(--muted)} .docs a{color:var(--accent)}
.print-only{display:none}
#printMap{display:none;height:340px;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#map.in-print{position:absolute;inset:0}
@media print{
  header,.layers,.leaflet-control-zoom,.actions,#tabs,#grab,#menu,#netbar,.cards,.m-only,#aux{display:none!important}
  .grp{display:block!important}
  #panel{position:static!important;height:auto!important;display:block!important;box-shadow:none!important;border:0!important}
  #sheet{display:block!important}
  #printMap{display:block!important;height:9cm;break-inside:avoid;border-radius:0}
  html,body{height:auto;background:#fff;color:#000}
  #app,main{position:static!important;display:block}
  #sheet{position:static!important;max-height:none!important;overflow:visible!important;width:auto!important;box-shadow:none!important;border:0!important;padding:0!important}
  .print-only{display:block;font-weight:700;margin:0 0 8px}
  details{break-inside:avoid-page}
  .docs li,.calc,.chk,.zone{break-inside:avoid}
  :root:not(#_p){--bg:#fff;--fg:#000;--muted:#444;--panel:#fff;--soft:#f2f2f2;--line:#ccc;--accent:#1f6f54;--ok:#1f7a3f;--warn:#8a5200;--no:#b3261e;--ok-bg:#e5f3e9;--warn-bg:#fbefd9;--no-bg:#fbe5e3;color-scheme:light}
}
.cmp-wrap{overflow-x:auto;margin-top:6px}
.cmp{border-collapse:collapse;font-size:13px;min-width:100%}
.cmp th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px 6px 0;white-space:nowrap;vertical-align:top;position:sticky;left:0;background:var(--panel)}
.cmp td{padding:6px 8px;border-left:1px solid var(--line);vertical-align:top;min-width:9em;font-variant-numeric:tabular-nums}
.cmp tr{border-top:1px solid var(--line)}
.actions{gap:8px}
@media print{.noprint{display:none}}
.retry{margin-left:6px;min-height:36px}
.acc{margin-top:10px;border:2px solid var(--accent);border-radius:12px;background:var(--panel);overflow:hidden;padding:0}
.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--ok-bg);cursor:pointer}

.chk-ok{background:var(--ok-bg);color:var(--ok)}

<body>
<div id="app">
  <header>
    <h1>Čestica ZG</h1>
    <input id="q" type="search" placeholder="Adresa ili čestica, npr. Šestine 4027/1" autocomplete="off">
    <button class="ib" id="go" type="button">Traži</button>
    <button class="ib" id="me" type="button" aria-label="Moja lokacija">◎</button>
    <button class="ib" id="favBtn" type="button" aria-label="Spremljene čestice">★</button>
    <button class="ib" id="menuBtn" type="button" aria-label="Izbornik">☰</button>
  </header>
  <div id="menu" hidden><p class="meta" id="ver" style="margin:0 0 6px"></p><a href="#" id="statBtn2" class="ib">Stanje servisa</a></div>
  <main>
    <div id="map"></div>
    <div class="layers" id="layers">
      <button type="button" class="ib fab" id="lyrBtn" aria-expanded="false" aria-controls="lyrList">Slojevi</button>
      <div id="lyrList">

const NET={cache:new Map(),ttl:10*60*1000,max:250,active:0,queue:[],conc:6,stat:{}};
function netBusy(){document.body&&document.body.classList.toggle("net-busy",NET.active>0)}
function netSlot(){return new Promise(r=>{if(NET.active<NET.conc){NET.active++;netBusy();r()}else NET.queue.push(r)})}
function netRelease(){NET.active--; const n=NET.queue.shift(); if(n){NET.active++;n()} netBusy();}
function svcId(url){const m=String(url).match(/services\/([^/]+)\/FeatureServer(?:\/(\d+))?/); if(m) return m[1]+(m[2]?"/"+m[2]:""); try{return new URL(url).host}catch(e){return String(url).slice(0,40)}}
function netNote(url,ok,ms,msg){const k=svcId(url), s=NET.stat[k]||(NET.stat[k]={ok:0,fail:0,ms:0,last:null}); ok?s.ok++:s.fail++; s.ms=Math.round(ms); s.last=ok?null:msg; s.t=Date.now();}
// trajna predmemorija na uređaju (12 h) za manje odgovore, da se isti podaci ne preuzimaju ponovno
const PC_TTL=12*3600*1000, PC_MAX=120000;
function pcHash(s){let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return "nc1:"+(h>>>0).toString(36)+":"+s.length}
function pcGet(key){try{const r=localStorage.getItem(pcHash(key)); if(!r) return null; const o=JSON.parse(r); if(Date.now()-o.t>PC_TTL){localStorage.removeItem(pcHash(key)); return null} return o.v}catch(e){return null}}
function pcSet(key,v){let str; try{str=JSON.stringify({t:Date.now(),v})}catch(e){return} if(str.length>PC_MAX) return;
  try{localStorage.setItem(pcHash(key),str)}catch(e){ try{const ks=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith("nc1:")) ks.push(k)} ks.sort((a,b)=>{try{return JSON.parse(localStorage.getItem(a)).t-JSON.parse(localStorage.getItem(b)).t}catch(x){return 0}}); ks.slice(0,Math.ceil(ks.length/2)).forEach(k=>localStorage.removeItem(k)); localStorage.setItem(pcHash(key),str)}catch(e2){} }}
class NetError extends Error{constructor(msg,retry){super(msg);this.retry=retry}}
async function fetchOnce(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{
    let r;
    try{ r=await fetch(url,{...opts,signal:c.signal}) }
    catch(e){ throw new NetError(e.name==="AbortError"?"nema odgovora nakon "+ms/1000+" s":"nema veze s poslužiteljem",true) }
    if(!r.ok) throw new NetError("poslužitelj javlja grešku HTTP "+r.status,r.status>=500||r.status===429);
    let j; try{ j=await r.json() }catch(e){ throw new NetError("neispravan odgovor poslužitelja",true) }
    if(j&&j.error){const code=+j.error.code||0; throw new NetError("servis javlja grešku"+(j.error.message?": "+j.error.message:""),code>=500||code===0)}
    return j;
  }finally{clearTimeout(t)}
}
async function getJSON(url,opts={},ms=10000,{retries=1,cache=true}={}){
  const key=(opts.method||"GET")+" "+url+" "+(opts.body||"");
  if(cache){const c=NET.cache.get(key); if(c&&Date.now()-c.t<NET.ttl) return c.v;
    const pc=pcGet(key); if(pc){NET.cache.set(key,{t:Date.now(),v:pc}); return pc;}}
  let err;
  for(let a=0;a<=retries;a++){
    await netSlot(); const t0=(window.performance||Date).now();
    try{
      const j=await fetchOnce(url,opts,ms);
      netNote(url,true,(window.performance||Date).now()-t0);
      if(cache){NET.cache.set(key,{t:Date.now(),v:j}); if(NET.cache.size>NET.max) NET.cache.delete(NET.cache.keys().next().value); pcSet(key,j);}
      return j;
    }catch(e){ err=e; netNote(url,false,(window.performance||Date).now()-t0,e.message); }
    finally{ netRelease(); }
    if(!err.retry||a===retries) break;
    await new Promise(r=>setTimeout(r,700*(a+1)));
  }
  throw new Error(err.message);
}
// ArcGIS vraća najviše N objekata; ako je granica dosegnuta, rezultat nije potpun
function featuresOf(g){const f=g&&g.features||[]; if(g&&(g.exceededTransferLimit||(g.properties&&g.properties.exceededTransferLimit))) f.incomplete=true; return f}
function pointQuery(url,ll,fields="*",geom=true){
  const p=new URLSearchParams({geometry:ll.lng+","+ll.lat,geometryType:"esriGeometryPoint",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(geom),outSR:"4326",f:"geojson"});
  return getJSON(url+"?"+p.toString()).then(featuresOf);
}
function polyQuery(url,geom,fields="*",withGeom=true){
  const rings=geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat();
  const p=new URLSearchParams({geometry:JSON.stringify({rings,spatialReference:{wkid:4326}}),geometryType:"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(withGeom),outSR:"4326",f:"geojson"});
  return getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()}).then(featuresOf);
}

  const parcel=ces.v&&ces.v[0]?ces.v[0]:null;
  let zones=nam.v||[], area=null;
  if(parcel){

  const rows=zones.map(z=>{
    let share=null;
    if(parcel){try{const i=turf.intersect(parcel.geometry,z.geometry);share=i?turf.area(i)/area:0}catch(e){}}
    return {p:z.properties,share,geom:z.geometry};
  }).filter(r=>r.share===null||r.share>0.005).sort((a,b)=>(b.share??0)-(a.share??0));
  rows.forEach(r=>L.geoJSON(r.geom,{style:{color:COLORS[r.p.Analitika]||"#888",weight:1,fillOpacity:.3},interactive:false}).addTo(selLayer));
  // pokaži osnovno odmah, provjere stižu za trenutak
  const base={ll,parcel,area,rows,ces,nam,up,upx,gn,checks:null};
  render(base);
  // malo smanjena čestica, da susjedni sloj koji samo dodiruje među ne bude pogodak
  let qGeom=null;
  if(parcel){try{const b=turf.buffer(parcel.geometry,-0.0008,{units:"kilometers"});qGeom=b&&b.geometry?b.geometry:parcel.geometry}catch(e){qGeom=parcel.geometry}}
  const slopeP=settle(loadSlope(parcel,ll));
  const zgradeP=parcel?settle(loadZgrade(parcel)):null;
  const checks=await Promise.all(CHECKS.map(c=>settle(
    c.corridor?corridorQuery(c,parcel,ll):
    (qGeom?polyQuery(c.url,qGeom,c.fields,!!c.draw):pointQuery(c.url,ll,c.fields,!!c.draw))
  ).then(r=>({c,...r}))));
  checks.forEach(r=>{if(r.c.corridor&&r.v) r.v.forEach(f=>L.geoJSON(f.geometry,{style:{color:/^dv/.test(r.c.id)?"#b3261e":"#a86400",weight:3,dashArray:"8 6"},interactive:false}).addTo(selLayer))});
  // gradivi dio i nagib terena
  const env2=buildEnvelope(parcel,rows,up);
  if(env2&&env2.geom) L.geoJSON(env2.geom,{style:{color:"#1f6f54",weight:2,dashArray:"4 3",fillColor:"#1f6f54",fillOpacity:.25},interactive:false}).addTo(selLayer);
  base.envelope=env2;
  window.__env=env2;
  base.zgrade=parcel?await zgradeP:null;
  if(base.zgrade&&base.zgrade.v) base.zgrade.v.geoms.forEach(gm=>L.geoJSON(gm,{style:{color:"#444",weight:1.5,fillColor:"#666",fillOpacity:.35},interactive:false}).addTo(selLayer));
  base.slope=await slopeP;
  if(id!==clickId) return;
  checks.forEach(r=>{if(r.c.draw&&r.v) r.v.forEach(f=>f.geometry&&L.geoJSON(f.geometry,{style:{color:r.c.draw,weight:2,dashArray:"5 4",fillOpacity:.15},interactive:false}).addTo(selLayer))});
  render({...base,checks});
  const envP=settle(loadEnv(ll,parcel)), infP=FEATURES.infra?settle(loadInfra(parcel,ll)):Promise.resolve(null), sunP=Promise.resolve(null);
  const [infra,sun]=await Promise.all([infP,sunP]);
  if(id!==clickId) return;
  window.__infra=infra&&infra.v||null; infraDraw(infra);
  render({...base,checks,infra,sun});
  const env=await envP;
  if(id!==clickId) return;
  render({...base,checks,infra,sun,env});
}

// --- simulator kuće: pravokutnik kuće (i garaže) koji se pomiče i okreće; provjere prema pravilu
// Zone na karti: zeleno = prostor unutar udaljenosti od međa; narančasto = pojas uz ulicu do udaljenosti građevnog pravca
// (ulica procijenjena iz OpenStreetMapa, regulacijska linija nije poznata); crveno = kuća izvan dopuštenog prostora.
const TL={w:12,d:9,rot:0,center:null,layer:null,marker:null,fl:"1",fh:3.0,podrum:false,gar:false,gw:3.5,gd:6,zones:null};
const FLOOR_OPTS=[["1","prizemnica (P)",1,0],["1.5","P + potkrovlje",1,1],["2","P + 1",2,0],["2.5","P + 1 + potkrovlje",2,1],["3","P + 2",3,0]];
const PK_SHARE=0.75; // potkrovlje u GBP-u kao 75 % tlocrta (procjena; točno ovisi o nadozidu i nagibu krova)
function tFloors(){const o=FLOOR_OPTS.find(x=>x[0]===TL.fl)||FLOOR_OPTS[0]; return {full:o[2],pk:o[3],et:o[2]+o[3],label:o[1]}}
function tRectAt(c,w,d,rot,offX=0,offY=0){
  const lat=c[1]*Math.PI/180, mx=1/(111320*Math.cos(lat)), my=1/110540;
  const x0=offX-w/2, x1=offX+w/2, y0=offY-d/2, y1=offY+d/2;
  const r=turf.polygon([[[c[0]+x0*mx,c[1]+y0*my],[c[0]+x1*mx,c[1]+y0*my],[c[0]+x1*mx,c[1]+y1*my],[c[0]+x0*mx,c[1]+y1*my],[c[0]+x0*mx,c[1]+y0*my]]]);
  return rot?turf.transformRotate(r,rot,{pivot:c}):r;
}
function tRect(){ if(!TL.center) return null; return tRectAt(TL.center,TL.w,TL.d,TL.rot); }
// garaža uz desnu stranu kuće, poravnata sa stražnjim rubom
function tGarage(){ if(!TL.center||!TL.gar) return null; return tRectAt(TL.center,TL.gw,TL.gd,TL.rot,TL.w/2+TL.gw/2,(TL.gd-TL.d)/2); }
function tFoot(){const r=tRect(), g=tGarage(); if(!r) return null; if(!g) return r; try{return turf.union(r,g)}catch(e){return r}}
function withinEnv(rect,env){
  if(!env||!rect) return false;
  const polys=env.type==="MultiPolygon"?env.coordinates.map(c=>turf.polygon(c)):[turf.polygon(env.coordinates)];
  const parts=rect.geometry.type==="MultiPolygon"?rect.geometry.coordinates.map(c=>turf.polygon(c)):[rect];
  return parts.every(pt=>polys.some(pg=>turf.booleanWithin(pt,pg)));
}
// rubovi čestice uz cestu (manje od 12 m od osi ceste iz OSM-a) i pojas do udaljenosti građevnog pravca
function streetBand(parcel,roads,dist){
  if(!parcel||!roads||!roads.length||!(dist>0)) return null;
  const lines=roads.filter(r=>r.ok&&r.geom&&r.geom.length>1).map(r=>turf.lineString(r.geom));
  if(!lines.length) return null;
  const segs=[]; const ring=parcel.geometry.type==="Polygon"?parcel.geometry.coordinates[0]:parcel.geometry.coordinates[0][0];
  for(let i=0;i<ring.length-1;i++){const a=ring[i],b=ring[i+1], len=turf.distance(a,b,{units:"kilometers"})*1000; if(len<1) continue;
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=Math.min(...lines.map(l=>turf.pointToLineDistance(turf.point(mid),l,{units:"kilometers"})*1000));
    if(d<12) segs.push([a,b]);}
  if(!segs.length) return null;
  let band=null;
  for(const s of segs){const b=turf.buffer(turf.lineString(s),dist/1000,{units:"kilometers"}); band=band?turf.union(band,b):b;}
  return band;
}
function tZones(){
  const env=window.__env&&window.__env.geom, d=window.__lastData; if(!env||!d||!d.parcel) return null;
  const envF={type:"Feature",geometry:env,properties:{}};
  const pr=window.__ruleP&&window.__ruleP.find(x=>x.id==="pravac"), pd=pr&&pr.value?parseFloat(String(pr.value).replace(/[^\d,]/g,"").replace(",",".")):null;
  const roads=d.env&&d.env.v?d.env.v.roadLines:null;
  let band=null, green=envF, orange=null;
  try{band=streetBand(d.parcel,roads,pd); if(band){orange=turf.intersect(envF,band); const g=turf.difference(envF,band); green=g||null;}}catch(e){}
  return {green,orange,pd,hasRoads:!!(roads&&roads.length),band:!!band};
}
// sve provjere za trenutni položaj i veličinu
function tChecks(){
  const grid=document.getElementById("tGrid"); if(!grid) return null;
  const A=+grid.dataset.area||0, tlMax=+grid.dataset.tl||null, gbpMax=+grid.dataset.gbp||null, kis=+grid.dataset.kis||null, teren=+grid.dataset.teren||null, etMax=+grid.dataset.et||null;
  const env=window.__env&&window.__env.geom, foot=tFoot(); if(!foot) return null;
  const F=tFloors(), hA=TL.w*TL.d, gA=TL.gar?TL.gw*TL.gd:0, tl=hA+gA;
  const gbpN=hA*F.full+hA*PK_SHARE*F.pk+gA, gbpP=TL.podrum?hA:0;
  const height=F.full*TL.fh+(F.pk?1.2:0);
  const C=[];
  const add=(label,val,st,note)=>C.push({label,val,st,note});
  const inEnv=withinEnv(foot,env);
  add("Udaljenost od međa",inEnv?"kuća je unutar dopuštenog prostora":"kuća izlazi iz dopuštenog prostora",inEnv?"ok":"no",window.__env&&window.__env.est?"udaljenost od međa je procjena: "+window.__env.est:null);
  const Z=TL.zones;
  if(Z&&Z.orange&&inEnv){let hit=false; try{hit=turf.booleanIntersects(foot,Z.orange)}catch(e){}
    add("Građevni pravac (od ulice)",hit?`kuća je u pojasu ${String(Z.pd).replace(".",",")} m od ruba čestice uz ulicu`:`kuća je izvan pojasa ${String(Z.pd).replace(".",",")} m uz ulicu`,hit?"warn":"ok","strana uz ulicu procijenjena je iz OpenStreetMapa; regulacijska linija i rezervacija proširenja ulice nisu poznate");}
  else if(Z&&Z.pd&&!Z.band) add("Građevni pravac (od ulice)",`pravilo traži najmanje ${String(Z.pd).replace(".",",")} m od regulacijske linije`,"warn",Z.hasRoads?"ulica uz česticu nije prepoznata":"ceste iz OpenStreetMapa još nisu učitane ili nisu dostupne");

  if(gbpMax) add("GBP nadzemno",`${fmt(gbpN)} od najviše ${fmt(gbpMax)} m²`,gbpN<=gbpMax?(F.pk?"warn":"ok"):"no",F.pk?"potkrovlje je uračunato kao 75 % tlocrta (procjena)":null);
  if(kis&&A) add("Kis nadzemno",`${(gbpN/A).toFixed(2).replace(".",",")} od najviše ${String(kis).replace(".",",")}`,gbpN/A<=kis+1e-9?"ok":"no",null);
  if(etMax) add("Nadzemne etaže",`${F.et} od najviše ${etMax}`,F.et<=etMax?"ok":"no",F.pk?"potkrovlje se broji kao etaža":null);
  if(teren&&A){const need=teren*A, left=A-tl;
    add("Prirodni teren",left<need?`ostaje ${fmt(left)} m², a treba najmanje ${fmt(need)} m²`:`ostaje najviše ${fmt(left)} m², treba ${fmt(need)} m²`,left<need?"no":"warn","staze, terase i parkirališta ne ulaze u prirodni teren; provjeri s projektom uređenja");}
  if(TIP!=="slob") add("Tip kuće",TIPOVI.find(t=>t[0]===TIP)[1],"warn","poluugrađena i ugrađena kuća prislanja se na među; prostor na karti računa razmak od svih međa");
  if(TL.podrum) add("Podrum",`${fmt(gbpP)} m² (ne ulazi u nadzemni GBP)`,"warn","ulazi li podrum u ograničenje GBP-a ovisi o definiciji u odluci; potrebna provjera");
  add("Visina do vijenca (procjena)",`oko ${String(height.toFixed(1)).replace(".",",")} m`,"info",`${F.full} × ${String(TL.fh).replace(".",",")} m${F.pk?" + nadozid potkrovlja oko 1,2 m":""}`);
  const st=C.some(c=>c.st==="no")?"no":C.some(c=>c.st==="warn")?"warn":"ok";
  return {C,st,tl,gbpN,gbpP,hA,gA,F,height,inEnv};
}
// bočne strane kuće u smjeru okreta: 0 = naprijed (prema jugu kad je okret 0°), 1 = desno, 2 = straga, 3 = lijevo
const SIDES=[{n:"naprijed",ang:180,off:d=>d/2,ax:"d"},{n:"desno",ang:90,off:w=>w/2,ax:"w"},{n:"straga",ang:0,off:d=>d/2,ax:"d"},{n:"lijevo",ang:270,off:w=>w/2,ax:"w"}];
const COMP=b=>["S","SI","I","JI","J","JZ","Z","SZ"][Math.round(((b%360)+360)%360/45)%8];
function sideDists(){
  const d=window.__lastData; if(!d||!d.parcel||!TL.center) return null;
  const bnd=lineParts(d.parcel.geometry), c=turf.point(TL.center), out=[];
  for(const s of SIDES){
    const brg=(s.ang+TL.rot)%360, half=s.ax==="d"?TL.d/2:TL.w/2;
    const mid=turf.destination(c,half/1000,brg,{units:"kilometers"}), far=turf.destination(mid,0.3,brg,{units:"kilometers"});
    const ray=turf.lineString([mid.geometry.coordinates,far.geometry.coordinates]);
    let best=null; for(const b of bnd){const x=turf.lineIntersect(ray,b); for(const f of x.features){const dd=turf.distance(mid,f,{units:"kilometers"})*1000; if(best==null||dd<best) best=dd;}}
    out.push({...s,brg,dist:best});
  }
  return out;
}
function tMoveSide(i,want){
  const S=sideDists(); if(!S||S[i].dist==null) return;
  const delta=S[i].dist-want; // pomak prema toj strani
  const p=turf.destination(turf.point(TL.center),delta/1000,S[i].brg,{units:"kilometers"}); TL.center=p.geometry.coordinates;
  if(TL.marker) TL.marker.setLatLng([TL.center[1],TL.center[0]]);

function tRotHandlePos(){ const p=turf.destination(turf.point(TL.center),(TL.d/2+3)/1000,(TL.rot+180)%360,{units:"kilometers"}); return p.geometry.coordinates; }
function tDraw(){

  const col=!R?"#1565c0":R.inEnv?(R.C.some(c=>c.label.startsWith("Građevni")&&c.st==="warn")?"#c77700":"#1565c0"):"#b3261e";

  if(!TL.marker){

  } else if(!TL.rotDrag) TL.rotM.setLatLng([rp[1],rp[0]]);

    `<table class="rp"><tbody>${R.C.map(c=>`<tr><th>${esc(c.label)}</th><td><b>${esc(c.val)}</b> <em class="kind st-${ST[c.st][0]}">${ST[c.st][1]}</em>${c.note?`<small class="fx">${esc(c.note)}</small>`:""}</td></tr>`).join("")}</tbody></table>`+
    tDistHtml()+`<div class="kd"><button type="button" class="ib" id="tToFin">Prenesi kuću u procjenu troškova</button></div>`;
  if(s){s.textContent=`${String(TL.w).replace(".",",")} × ${String(TL.d).replace(".",",")} m, ${R.F.label}: ${ST[R.st][1]}`; s.className=R.st==="no"?"bad":"";}

function simHtml(pp,A,area,gbpMax,RP){

// --- postojeće zgrade na čestici (Topografska osnova Grada Zagreba 2018., tlocrti)
const OBJEKTI=BASE+"Objekti/FeatureServer/1/query";
async function loadZgrade(parcel){
  const f=await polyQuery(OBJEKTI,parcel.geometry,"OBJECTID,Area",true);
  let a=0; const geoms=[];
  for(const x of f){ try{const i=turf.intersect({type:"Feature",geometry:parcel.geometry,properties:{}},x); if(i){const ar=turf.area(i); if(ar>4){a+=ar; geoms.push(i.geometry)}}}catch(e){} }
  return {area:a,n:geoms.length,geoms};
}

// --- koridori: dohvat linija u krugu i provjera stvarne udaljenosti
async function corridorQuery(c,parcel,ll){
  const geom=parcel?parcel.geometry:{type:"Point",coordinates:[ll.lng,ll.lat]};
  const p=new URLSearchParams({geometry:geom.type==="Point"?ll.lng+","+ll.lat:JSON.stringify({rings:geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat(),spatialReference:{wkid:4326}}),
    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(c.search),units:"esriSRUnit_Meter",
    outFields:c.fields,returnGeometry:"true",outSR:"4326",f:"geojson"});
  const g=await getJSON(c.url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  return (g.features||[]).filter(f=>{
    if(!f.geometry) return false;
    const d=corrDist(f.properties||{},c.corridor);
    try{const b=turf.buffer(f.geometry,d/1000,{units:"kilometers"}); return turf.booleanIntersects(b,geom)}catch(e){return true}
  });
}
// --- gradivi dio: čestica umanjena za udaljenost od međe, samo u zonama koje dopuštaju gradnju
function buildEnvelope(parcel,rows,up){
  if(!parcel) return null;
  let d=3, est=null;
  try{
    const {rule}=ruleLookup(up,rows);
    const z=rule&&rows[0]?pickZone(rule,rows[0].p.Analitika):null;
    if(z){const RP=ruleParams(z,TIP,null), md=RP.find(x=>x.id==="meda"), et=RP.find(x=>x.id==="etaze");
      if(md&&md.hHalf){const h=(et&&et.num?et.num:3)*3; d=Math.max(3,h/2); est="h/2: uzeto "+String(d).replace(".",",")+" m za visinu oko "+h+" m";}
      else if(md&&md.num) d=md.num; else est="pravilo ne navodi udaljenost od međe; uzeto 3 m";}
    else est="pravilo nije određeno; uzeto 3 m";
  }catch(e){}
  try{
    let env=turf.buffer(parcel.geometry,-d/1000,{units:"kilometers"});
    if(!env||!env.geometry) return {geom:null,area:0,d,est};
    const bz=rows.filter(r=>BUILDABLE.has(r.p.Analitika)&&r.geom);
    if(bz.length&&bz.length<rows.length){
      let u=null;
      for(const r of bz){const i=turf.intersect(env,{type:"Feature",geometry:r.geom,properties:{}}); if(i) u=u?turf.union(u,i):i;}
      env=u;
    } else if(!bz.length) env=null;
    return {geom:env?env.geometry:null,area:env?turf.area(env):0,d,est};
  }catch(e){return null}
}
// --- nagib terena (Copernicus DEM preko Open-Meteo; rezolucija oko 90 m, orijentacijski)
async function loadSlope(parcel,ll){
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const pt=turf.point(c), D=0.04; // 40 m na svaku stranu
  const pts=[0,90,180,270].map(b=>turf.destination(pt,D,b,{units:"kilometers"}).geometry.coordinates);
  pts.unshift(c);
  const q=new URLSearchParams({latitude:pts.map(p=>p[1].toFixed(6)).join(","),longitude:pts.map(p=>p[0].toFixed(6)).join(",")});
  const j=await getJSON("https://api.open-meteo.com/v1/elevation?"+q.toString(),{},10000);
  const e=j.elevation; if(!e||e.length<5) throw new Error("nema podataka o visini");
  const dz_ns=(e[1]-e[3]), dz_ew=(e[2]-e[4]);
  const slope=Math.sqrt(dz_ns*dz_ns+dz_ew*dz_ew)/(2*D*1000)*100;
  const dirs=["sjever","istok","jug","zapad"], low=[e[1],e[2],e[3],e[4]].indexOf(Math.min(e[1],e[2],e[3],e[4]));
  return {h:Math.round(e[0]),slope,down:dirs[low]};
}

// --- upit "u krugu od N metara" (za mreže i susjedne zgrade)
async function distQuery(url,parcel,ll,dist,fields="*",max=300){
  const geom=parcel?parcel.geometry:{type:"Point",coordinates:[ll.lng,ll.lat]};
  const p=new URLSearchParams({geometry:geom.type==="Point"?ll.lng+","+ll.lat:JSON.stringify({rings:geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat(),spatialReference:{wkid:4326}}),
    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(dist),units:"esriSRUnit_Meter",
    outFields:fields,returnGeometry:"true",outSR:"4326",resultRecordCount:String(max),f:"geojson"});
  const g=await getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  if(g.error) throw new Error(g.error.message||"greška servisa");
  return g.features||[];
}
// najmanja udaljenost (m) objekta mreže od čestice ili točke
function lineParts(geom){
  const out=[];
  try{
    const f=geom.type==="Polygon"||geom.type==="MultiPolygon"?turf.polygonToLine({type:"Feature",geometry:geom,properties:{}}):{type:"Feature",geometry:geom,properties:{}};
    turf.flattenEach(f,x=>{if(x.geometry&&x.geometry.type==="LineString") out.push(x)});
  }catch(e){}
  return out;
}
function coordsOf(geom){const a=[];try{turf.coordEach({type:"Feature",geometry:geom,properties:{}},c=>a.push(c))}catch(e){}return a}
function minDistM(fgeom,parcel,ll){
  if(!fgeom) return null;
  if(!parcel){const p=turf.point([ll.lng,ll.lat]);
    if(/Line/.test(fgeom.type)){let m=Infinity;for(const l of lineParts(fgeom)) m=Math.min(m,turf.pointToLineDistance(p,l,{units:"kilometers"})*1000);return m}
    return Math.min(...coordsOf(fgeom).map(c=>turf.distance(p,turf.point(c),{units:"kilometers"})*1000));}
  const pf={type:"Feature",geometry:parcel.geometry,properties:{}};
  try{if(turf.booleanIntersects({type:"Feature",geometry:fgeom,properties:{}},pf)) return 0}catch(e){}
  const bnd=lineParts(parcel.geometry); let m=Infinity;
  for(const c of coordsOf(fgeom)) for(const b of bnd) m=Math.min(m,turf.pointToLineDistance(turf.point(c),b,{units:"kilometers"})*1000);
  if(/Line/.test(fgeom.type)){const fl=lineParts(fgeom); for(const c of coordsOf(parcel.geometry)) for(const l of fl) m=Math.min(m,turf.pointToLineDistance(turf.point(c),l,{units:"kilometers"})*1000);}
  return m;
}

// --- komunalna infrastruktura
// Što je javno dostupno (provjereno 17. 10. 2026. na ArcGIS servisima Grada Zagreba):
//  * ulična mreža vodovoda i kanalizacije: NIJE javna. Servisi "Javni_vodovod" i "Javna_kanalizacija" sadrže samo godišnju
//    statistiku (km mreže, broj priključaka), bez geometrije. "Katastar infrastrukture" (KI_LINIJE) pokriva samo probno
//    područje od oko 140 × 110 m (2022.).
//  * niskonaponska mreža struje i distribucijska plinska mreža: nisu javne (HEP ODS, Gradska plinara Zagreb).
//  * GUP Grada Zagreba (karte 3b i 3c, pročišćeni tekst): magistralni vodoopskrbni cjevovodi, dalekovodi i kabeli 110 kV i jači,
//    trafostanice 110 kV, magistralni i visokotlačni plinovodi, toplovodi; postojeći i planirani. To su glavni vodovi u mjerilu
//    plana: blizina ne znači da se kuća na njih može priključiti.

  {id:"ee",kind:"ee",url:INFRA+"12/query",color:"#b3261e",desc:p=>p.EE_VODOVI_OPIS||p.LAYER||"dalekovod ili kabel 110 kV"},
  {id:"ts",kind:"ee",url:INFRA+"1/query",color:"#b3261e",point:true,filter:p=>/trafostanic|rasklopn/i.test(p.EE_OPIS||""),desc:p=>p.EE_OPIS||"trafostanica 110 kV"},
  {id:"eeSE",kind:"ee",url:INFRA+"13/query",color:"#b3261e",desc:p=>p.EE_VODOVI_OPIS||p.LAYER||"dalekovod ili kabel"},
  {id:"tsSE",kind:"ee",url:INFRA+"2/query",color:"#b3261e",point:true,filter:p=>/trafostanic|rasklopn/i.test(p.EE_OPIS||""),desc:p=>p.EE_OPIS||"trafostanica 110 kV"},
  {id:"plinSE",kind:"plin",url:INFRA+"15/query",color:"#c48a00",desc:p=>p.PLINOVOD_OPIS||p.LABELA||"plinovod"},
  {id:"plin",kind:"plin",url:INFRA+"14/query",color:"#c48a00",desc:p=>p.PLINOVOD_OPIS||p.LABELA||"plinovod"},
  {id:"top",kind:"top",url:INFRA+"22/query",color:"#8a3ffc",desc:p=>p.TP_OPIS||"toplovod"}
];
// "KABEL 110KV - PLANIRANI" ili "Plinovod VT (postojeći)" -> "kabel 110 kV", "plinovod VT"
const infDesc=t=>{let x=String(t||"").replace(/\s*[-–]?\s*\(?\b(postoje[ćc]\w*|planiran\w*)\)?\s*$/i,"").trim();
  if(x===x.toUpperCase()) x=x.toLowerCase().replace(/\bvt\b/g,"VT"); return x.replace(/(\d+)\s*kv\b/gi,"$1 kV");};
const isPlanned=(p,txt)=>/planiran/i.test(txt||"")||/planiran/i.test(Object.values(p||{}).join(" "));
async function loadInfra(parcel,ll){
  const out={};
  await Promise.all(INF_SRC.map(s=>settle(distQuery(s.url,parcel,ll,INF_R,"*",200)).then(r=>{
    if(r.e){out[s.id]={e:r.e};return}
    const fs=(r.v||[]).filter(f=>!s.filter||s.filter(f.properties||{}));
    let ex=null, pl=null;
    for(const f of fs){const p=f.properties||{}, d=minDistM(f.geometry,parcel,ll); if(d==null||!isFinite(d)) continue;
      const desc=s.desc(p), rec={d,desc:infDesc(desc),geom:f.geometry,color:s.color};
      if(isPlanned(p,desc)){if(!pl||d<pl.d) pl=rec} else {if(!ex||d<ex.d) ex=rec}}
    out[s.id]={ex,pl,n:fs.length,incomplete:!!(r.v&&r.v.incomplete)};
  })));

}
function infraHtml(inf){

}
function infraDraw(inf){

// --- sunce i sjena
// Položaj Sunca: NOAA algoritam (Meeus), točnost oko 0,1°. Sjena: tlocrt pomaknut za h/tan(visina Sunca) suprotno od Sunca.
// Nagib terena nije uključen (model visina rezolucije ~90 m nije dovoljno točan za pojedinu česticu).
function zgOffsetH(d){ // CET/CEST: ljetno vrijeme od zadnje nedjelje u ožujku do zadnje nedjelje u listopadu (u 01:00 UTC)
  const y=d.getUTCFullYear(), lastSun=m=>{const t=new Date(Date.UTC(y,m+1,0)); return Date.UTC(y,m,t.getUTCDate()-t.getUTCDay(),1)};
  const ms=d.getTime(); return ms>=lastSun(2)&&ms<lastSun(9)?2:1;
}
function zgDate(ymd,hour){ // lokalno vrijeme u Zagrebu -> Date (UTC)
  const [y,m,dd]=ymd.split("-").map(Number); const h=Math.floor(hour), mi=Math.round((hour-h)*60);
  let t=new Date(Date.UTC(y,m-1,dd,h-1,mi)); t=new Date(Date.UTC(y,m-1,dd,h-zgOffsetH(t),mi)); return t;
}
function solarPos(date,lat,lon){
  const r=Math.PI/180, jd=date.getTime()/86400000+2440587.5, T=(jd-2451545)/36525;
  const L0=(280.46646+T*(36000.76983+0.0003032*T))%360, M=357.52911+T*(35999.05029-0.0001537*T), e=0.016708634-T*(0.000042037+0.0000001267*T);
  const C=Math.sin(M*r)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*r)*(0.019993-0.000101*T)+Math.sin(3*M*r)*0.000289;
  const om=125.04-1934.136*T, lam=L0+C-0.00569-0.00478*Math.sin(om*r);
  const eps0=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60, eps=eps0+0.00256*Math.cos(om*r);
  const dec=Math.asin(Math.sin(eps*r)*Math.sin(lam*r))/r;
  const y=Math.tan(eps*r/2)**2;
  const eot=4/r*(y*Math.sin(2*L0*r)-2*e*Math.sin(M*r)+4*e*y*Math.sin(M*r)*Math.cos(2*L0*r)-0.5*y*y*Math.sin(4*L0*r)-1.25*e*e*Math.sin(2*M*r)); // minute
  const utcMin=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60;
  const tst=(utcMin+eot+4*lon+1440)%1440, ha=tst/4<0?tst/4+180:tst/4-180;
  const cz=Math.sin(lat*r)*Math.sin(dec*r)+Math.cos(lat*r)*Math.cos(dec*r)*Math.cos(ha*r), zen=Math.acos(Math.max(-1,Math.min(1,cz)))/r;
  let az=Math.acos(Math.max(-1,Math.min(1,(Math.sin(lat*r)*Math.cos(zen*r)-Math.sin(dec*r))/(Math.cos(lat*r)*Math.sin(zen*r)))))/r;
  az=ha>0?(az+180)%360:(540-az)%360;
  return {alt:90-zen,az,dec,eot};
}
function sunTimes(ymd,lat,lon){ // izlazak i zalazak (visina −0,833°), traženje po minutama
  let rise=null,set=null,prev=null;
  let ph=null;
  for(let m=180;m<=1380;m+=2){const h=m/60, a=solarPos(zgDate(ymd,h),lat,lon).alt; if(prev!=null){const f=(-0.833-prev)/(a-prev), x=ph+(h-ph)*f; if(prev<-0.833&&a>=-0.833) rise=x; if(prev>=-0.833&&a<-0.833) set=x;} prev=a; ph=h;}
  return {rise,set};
}
const hhmm=h=>h==null?"–":String(Math.floor(h)).padStart(2,"0")+":"+String(Math.round((h%1)*60)).padStart(2,"0");
const SUN={ymd:null,hour:12,hN:7,nb:null,layer:null,on:false};
function shadowPoly(feat,alt,az,h){
  if(alt<=0.5) return null;
  const L=Math.min(h/Math.tan(alt*Math.PI/180),300);
  try{
    const moved=turf.transformTranslate(feat,L/1000,(az+180)%360,{units:"kilometers"});
    const pts=coordsOf(feat.geometry).concat(coordsOf(moved.geometry)).map(c=>turf.point(c));
    return turf.convex(turf.featureCollection(pts));
  }catch(e){return null}
}
async function sunNeighbours(parcel,ll){
  const feats=await distQuery(OBJEKTI,parcel,ll,80,"*",400);
  const pf={type:"Feature",geometry:parcel.geometry,properties:{}}, out=[];
  for(const f of feats){ if(!f.geometry) continue; let own=0; try{const i=turf.intersect(pf,f); own=i?turf.area(i)/turf.area(f):0}catch(e){}
    if(own<=0.5) out.push(f); }
  return out;
}
function sunCompute(){
  const d=window.__lastData; if(!d||!d.parcel) return null;
  const c=turf.centroid(d.parcel.geometry).geometry.coordinates, lat=c[1], lon=c[0];
  const sp=solarPos(zgDate(SUN.ymd,SUN.hour),lat,lon);
  const target={type:"Feature",geometry:window.__env&&window.__env.geom?window.__env.geom:d.parcel.geometry,properties:{}}, tA=turf.area(target);
  let nbU=null, shNb=[];
  if(SUN.nb&&sp.alt>0.5) for(const f of SUN.nb){const s=shadowPoly(f,sp.alt,sp.az,SUN.hN); if(s){shNb.push(s); try{const i=turf.intersect(target,s); if(i) nbU=nbU?turf.union(nbU,i):i}catch(e){}}}
  let shHouse=null; const foot=TL.center?tFoot():null, R=window.__sim;
  if(foot&&R&&sp.alt>0.5) shHouse=shadowPoly(foot,sp.alt,sp.az,R.height+1.5);
  return {sp,lat,lon,share:nbU&&tA?Math.min(1,turf.area(nbU)/tA):0,shNb,shHouse,target:window.__env&&window.__env.geom?"prostor za kuću":"česticu",len1:sp.alt>0.5?1/Math.tan(sp.alt*Math.PI/180):null};
}
function sunPathSvg(lat,lon,curYmd,cur){
  const S=220, R=95, cx=S/2, cy=S/2;

  const path=ymd=>{let s=""; for(let h=3;h<=22;h+=0.25){const p=solarPos(zgDate(ymd,h),lat,lon); if(p.alt<0) continue; const [x,y]=P(p.alt,p.az); s+=(s?"L":"M")+x.toFixed(1)+","+y.toFixed(1)} return s};
  const y=curYmd.slice(0,4);

// --- sunčana elektrana: proizvodnja iz satnog zračenja na nagnutu plohu (Open-Meteo, ERA5 / Copernicus), prosjek 3 godine
const PV={res:{},manualKwp:false};
const PV_PR=0.80; // omjer učinkovitosti sustava: gubici temperature, izmjenjivača, kabela i prljavštine (pretpostavka)
const PV_KWP_M2=0.20; // kWp po m² panela (moduli oko 430 W na 2 m²)
const PV_AZ=[["0","jug"],["-45","jugoistok"],["45","jugozapad"],["-90","istok"],["90","zapad"]];
async function pvFetch(lat,lon,tilt,az){
  const k=[lat.toFixed(3),lon.toFixed(3),tilt,az].join("|"); if(PV.res[k]) return PV.res[k];
  const q=new URLSearchParams({latitude:lat.toFixed(4),longitude:lon.toFixed(4),start_date:"2023-01-01",end_date:"2025-12-31",hourly:"global_tilted_irradiance",tilt:String(tilt),azimuth:String(az),timezone:"UTC"});
  const j=await getJSON("https://archive-api.open-meteo.com/v1/archive?"+q.toString(),{},25000);
  const t=j.hourly&&j.hourly.time, v=j.hourly&&j.hourly.global_tilted_irradiance;
  if(!t||!v||!v.length) throw new Error("servis nije vratio podatke o zračenju");
  const mon=Array(12).fill(0), yrs=new Set(); let n=0;
  for(let i=0;i<t.length;i++){const x=v[i]; if(x==null) continue; const m=+t[i].slice(5,7)-1; mon[m]+=x/1000; yrs.add(t[i].slice(0,4)); n++;}
  const ny=yrs.size||1, monthly=mon.map(x=>x/ny), annual=monthly.reduce((a,b)=>a+b,0);
  if(n<ny*8000) throw new Error("nepotpuni podaci o zračenju");
  return PV.res[k]={annual,monthly,years:[...yrs].sort()};
}

// --- pristup i okolina iz OpenStreetMapa (Overpass)
const ROAD_OK=/^(primary|secondary|tertiary|unclassified|residential|living_street|service|trunk|primary_link|secondary_link|tertiary_link)$/;
async function loadEnv(ll,parcel){
  let ring;
  if(parcel){
    const g=parcel.geometry, r=(g.type==="Polygon"?g.coordinates[0]:g.coordinates[0][0]);
    const step=Math.max(1,Math.ceil(r.length/20));
    ring=r.filter((_,i)=>i%step===0).concat([r[0]]).map(c=>c[1].toFixed(6)+","+c[0].toFixed(6)).join(",");
  }else ring=ll.lat.toFixed(6)+","+ll.lng.toFixed(6);
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const P=c[1].toFixed(6)+","+c[0].toFixed(6);
  const q=`[out:json][timeout:15];
way(around:12,${ring})[highway]->.r; .r out tags geom;
(node(around:600,${P})[highway=bus_stop];node(around:600,${P})[railway=tram_stop];node(around:900,${P})[railway=station];
 node(around:1200,${P})[amenity=kindergarten];way(around:1200,${P})[amenity=kindergarten];
 node(around:1500,${P})[amenity=school];way(around:1500,${P})[amenity=school];
 node(around:1000,${P})[shop=supermarket];way(around:1000,${P})[shop=supermarket];
 node(around:1500,${P})[amenity=pharmacy];)->.e; .e out tags center;`;
  // više Overpass servera: prvi koji odgovori pobjeđuje
  const body="data="+encodeURIComponent(q);
  const ask=u=>getJSON(u+"?"+body,{},20000,{retries:0});
  const j=await Promise.any(["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"].map(ask))
    .catch(()=>{throw new Error("serveri za podatke o okolini trenutno ne odgovaraju, pokušaj ponovno za minutu")});
  const here=turf.point(c);
  const dist=e=>{const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon; return lat==null?null:Math.round(turf.distance(here,turf.point([lon,lat]),{units:"kilometers"})*1000)};
  const roads=[], seen=new Set();
  const out={roads, roadLines:[], stops:[], kinder:null, school:null, shop:null, pharmacy:null};
  const nearest=(key,e)=>{const d=dist(e); if(d==null) return; if(!out[key]||d<out[key].d) out[key]={n:e.tags.name||"bez naziva",d}};
  for(const e of j.elements||[]){
    const t=e.tags||{};
    if(e.type==="way"&&t.highway&&e.geometry) out.roadLines.push({ok:ROAD_OK.test(t.highway),geom:e.geometry.map(g=>[g.lon,g.lat])});
    if(e.type==="way"&&t.highway){const k=(t.name||t.highway)+"|"+t.highway; if(!seen.has(k)){seen.add(k);roads.push({name:t.name,hw:t.highway,ok:ROAD_OK.test(t.highway),surface:t.surface,width:t.width})}}
    else if(t.highway==="bus_stop"||t.railway==="tram_stop"||t.railway==="station"){const d=dist(e); if(d!=null) out.stops.push({n:t.name||"stanica",d,type:t.railway==="tram_stop"?"tramvaj":t.railway==="station"?"vlak":"autobus"})}
    else if(t.amenity==="kindergarten") nearest("kinder",e);
    else if(t.amenity==="school") nearest("school",e);
    else if(t.shop==="supermarket") nearest("shop",e);
    else if(t.amenity==="pharmacy") nearest("pharmacy",e);
  }
  // najbliža stanica po vrsti
  const byType={}; for(const s of out.stops) if(!byType[s.type]||s.d<byType[s.type].d) byType[s.type]=s;
  out.stops=Object.values(byType).sort((a,b)=>a.d-b.d);
  return out;
}
const HW_NAMES={primary:"glavna cesta",secondary:"sporedna cesta",tertiary:"lokalna cesta",unclassified:"nerazvrstana cesta",residential:"stambena ulica",living_street:"pješačko-kolna zona",service:"servisni put",track:"poljski put",path:"staza",footway:"pješačka staza",steps:"stube",trunk:"brza cesta",cycleway:"biciklistička staza"};
function envHtml(env,gbp){
  let h=`<h2>Pristup i okolina</h2>`;
  if(!env){return h+`<p class="hint"><span class="spin"></span>Tražim ceste i sadržaje u blizini…</p>`}

  const o=env.v, car=o.roads.filter(r=>r.ok), other=o.roads.filter(r=>!r.ok);
  if(car.length) h+=`<ul class="checks"><li class="chk chk-ok"><b>Kolni pristup</b><span>${car.map(r=>esc((r.name||"ulica bez naziva")+" ("+(HW_NAMES[r.hw]||r.hw)+(r.surface&&/unpaved|gravel|dirt|ground/.test(r.surface)?", neasfaltirano":"")+")")).join(", ")}</span></li></ul>`;
  else if(other.length) h+=`<ul class="checks"><li class="chk chk-warn"><b>Pristup</b><span>Uz česticu je samo ${other.map(r=>esc(HW_NAMES[r.hw]||r.hw)).join(", ")}. Za gradnju treba pristup s prometne površine propisane širine; provjeri status puta.</span></li></ul>`;
  else h+=`<ul class="checks"><li class="chk chk-warn"><b>Pristup</b><span>U OpenStreetMapu nema ceste uz česticu. Provjeri ima li čestica izlaz na javni put ili služnost prolaza.</span></li></ul>`;
  const rows=[];
  for(const s of o.stops) rows.push([`Stanica (${s.type})`,`${s.n} · ${s.d} m`]);
  if(!o.stops.length) rows.push(["Javni prijevoz","nema stanice unutar 600 m"]);

// --- izvlačenje brojeva iz teksta pravila, po tipu građevine (slob = slobodnostojeća, polu = poluugrađena, ugr = ugrađena)
const toNum=s=>parseFloat(String(s).replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
const TIPOVI=[["slob","slobodnostojeća"],["polu","poluugrađena (dvojna)"],["ugr","ugrađena (u nizu)"]];
function stemsIn(s){
  const r=[]; if(/slobodnostoje|samostoje/iu.test(s)) r.push("slob"); if(/poluugrađ|dvojn/iu.test(s)) r.push("polu");
  if(/skupn/iu.test(s)) r.push("ugr");

}
// tekst se dijeli na dijelove (zarez koji nije decimalni, točka-zarez, "a", "te"); broj pripada tipu iz istog ili prethodnog dijela
function byType(text,unit){
  const res={};
  for(const clause of String(text||"").split(";")){ // tip se prenosi samo unutar iste rečenice
    let last=null;
    for(const s of clause.split(/,(?!\d)|\sa\s|\ste\s|\si\s(?=\d)/u)){
      const n=s.match(unit), st=stemsIn(s);
      if(n){ const tgt=st.length?st:(last||["gen"]); for(const x of tgt) if(res[x]==null) res[x]=n[1]; if(st.length) last=st; }
      else if(st.length) last=st;
    }
  }
  return res;
}
function pickT(text,unit,tip){
  const r=byType(text,unit); if(r[tip]!=null) return r[tip];
  const typed=["slob","polu","ugr"].some(x=>r[x]!=null);
  if(!typed&&r.gen!=null) return r.gen;
  if(!typed){const m=String(text||"").match(unit); return m?m[1]:null}
  return null;
}
function parseParams(key,tip="slob"){
  const out={}, M2=/(\d[\d.]*)\s*m[²2](?![\d])/u, PCT=/(\d+)\s*%/u, DEC=/(\d+,\d+)/u;
  let v=pickT(key.cestica,M2,tip); if(v!=null) out.minC=toNum(v);
  v=pickT(key.izgradenost,PCT,tip); if(v!=null) out.izg=toNum(v)/100;
  v=pickT(key.kis,DEC,tip); if(v!=null) out.kis=toNum(v);
  const gtxt=((key.gbp||"")+"; "+(key.kis||"")).replace(/^.*?(?=GBP)/s,"");
  v=pickT(gtxt.replace(/kisn?[^;]*?\d+,\d+/gu,""),M2,tip); if(v!=null&&/GBP/.test(gtxt)) out.gbp=toNum(v);
  v=pickT(key.teren,PCT,tip); if(v!=null) out.teren=toNum(v)/100;
  return out;
}
let TIP=(()=>{try{return localStorage.getItem("tip")||"slob"}catch(e){return "slob"}})();
// pravilo za lokaciju: Zagreb ili Sesvete; više pravila u istom članku nađe se po oznaci u tekstu
function ruleLookup(up,rows){

  if(!p){ // izvan oba GUP-a: Prostorni plan Grada Zagreba za građevinska područja naselja
    const r0=rows&&rows[0]; const plan=r0?String(r0.p.Naziv_plana||""):"";
    if(r0&&BUILDABLE.has(r0.p.Analitika)&&!/generalni urbanisti/i.test(plan)) return {code:"PPGZ",rule:RULES_PP.PPGZ,se:false,pp:true};
    return {code:null,rule:null,se:false};

// Za svaki parametar bira se stavka koja ga propisuje za novu gradnju; stavke o rekonstrukciji i iznimkama se ne koriste
// kao opće pravilo, nego se prikazuju zasebno.
const KEY_RX={
  cestica:/najmanj\w* (površin\w*|veličin\w*) građevne čestice|najmanja građevna čestica|veličina građevne čestice/i,
  sirina:/širin\w* građevne čestice/i,
  izgradenost:/izgrađenost/i,
  kis:/\bkisn?\b/i,
  gbp:/\bGBP\b/,
  visina:/nadzemn\w* etaž|najveća visina|visina građevin/i,
  teren:/prirodn\w* teren/i,
  meda:/od međe/i,
  pravac:/građevn\w* pravac|građevinski je pravac|građevinski pravac|građevnog pravca glavne građevine od/i,
  jedinice:/samostaln\w* uporabn\w* jedinic|stambenih jedinica/i,

const NOT_GENERAL=/^(rekonstrukc|iznimno|prigodom rekonstrukc|u rekonstrukc|pri gradnji zamjensk)/i;
function normKeys(zone){
  if(!zone||zone._nk) return zone&&zone._nk;
  const out={...(zone.key||{})};
  for(const [k,rx] of Object.entries(KEY_RX)){
    let best=null, bs=-Infinity;
    for(const it of zone.items||[]){
      const m=it.match(rx); if(!m) continue;
      let s=0;
      if(NOT_GENERAL.test(it)) s-=10;
      if(/\d/.test(it)) s+=2;
      if(m.index<30) s+=3;
      if(k==="pravac"&&!/\d+(,\d+)?\s*m\b/.test(it)) s-=5; // "pomoćne građevine su iza građevnog pravca" nije udaljenost
      if(s>bs){bs=s;best=it}
    }
    // postojeći ključ iz parsera zadržava se, osim ako nedostaje ili je stavka o rekonstrukciji/iznimci
    const cur=out[k];
    if(best&&bs>-5&&(!cur||NOT_GENERAL.test(cur))) out[k]=best;
    else if(cur&&NOT_GENERAL.test(cur)&&!(best&&bs>-5)) delete out[k];
  }
  zone._nk=out; return out;
}
const NUM_W={jedna:1,jedne:1,jednu:1,dvije:2,dva:2,tri:3,"četiri":4,pet:5,"šest":6,sedam:7,osam:8,devet:9,deset:10};

const NEEDS_CHECK=/iznimno|osim|ovisno|pretežit|lokalnim uvjetima|prema grafičkom|kartografskom|u pravilu/i;

function ruleParams(zone,tip,area){

  add("gbp","Najveći GBP",base.gbp!=null?fmt(base.gbp)+" m²":null,base.gbp!=null?key.gbp:"");
  const vm=(key.visina||"").match(/(jedn\p{L}*|dvije|tri|četiri|pet|šest|sedam|osam|devet|\d+)\s+nadzemn/iu);

}

          {const ic=infcGet(favKey(parcel,ll)); const inp=(id,l,ph)=>`<div class="kd"><label for="${id}">${l}</label><input id="${id}" type="number" inputmode="decimal" min="0" step="100" placeholder="${ph}" value="${ic[id]>0?ic[id]:""}"><span>€</span></div>`;
           h+=`<p class="eyebrow" style="margin-top:8px">Radovi na priključcima (tvoj unos iz ponude)</p>`+inp("kdWorks","Kućni priključci vode, kanalizacije, struje (radovi, okna, ormarić)","ponuda")+inp("kdSeptic","Sabirna jama ili pročistač, ako nema kanalizacije","0")+inp("kdWell","Bunar, ako nema vodovoda","0");}
          h+=`<div id="costs"></div></div></details>`;

      const others=rule.zone.filter(z=>z!==zone);

// ================= JEDINSTVENI FINANCIJSKI MODEL =================
// Svi kalkulatori (komunalni doprinos, priključci, gradnja, kupnja, ukupna investicija) čitaju ulaze iz istih polja
// i računaju se jednom funkcijom finCompute(). Nijedna stavka se ne zbraja dvaput.
// Vrste iznosa: "propis" = izračun prema propisu/odluci, "procjena" = tržišna procjena s rasponom, "unos" = korisnikov iznos.

// Izvori naknada:
// HERA, Odluka o iznosu jedinične naknade za priključenje (NN 45/2026, od 1. 5. 2026.): 193 €/kW bez PDV-a;
// Uredba o Tarifi upravnih pristojbi (NN 156/2022), Tar. br. 20: građevinska dozvola za zgradu do 600 m² 106,18 €, e-zahtjev −15 %;
// Zakon o izmjenama i dopuni Zakona o financiranju vodnoga gospodarstva (NN 36/2024): vodni doprinos ukinut od 1. 7. 2024.
const HEP_EUR_KW=193.00, PDV=1.25, PRIST_GD=106.18, PRIST_GD_MIN_BIG=132.72;
const GAS_RANGE=[800,1500];
const ETAZA_M=3; // m, visina etaže za procjenu bruto obujma
// Kupnja (porezna-uprava.gov.hr "Stjecatelj nekretnine"; gov.hr "Upis prava vlasništva"):
// porez na promet nekretnina 3 % tržišne vrijednosti, plaća stjecatelj; PDV 25 % umjesto poreza na promet kad je prodavatelj
// u sustavu PDV-a i prodaje građevinsko zemljište (zemljište s pravomoćnom dozvolom za građenje); sudske pristojbe za
// uknjižbu: prijedlog 6,50 € (elektronički −50 %), rješenje 26,54 €.
const PPN=0.03, PDV_RATE=0.25, ZK_PRIJEDLOG=6.50, ZK_RJESENJE=26.54;
const REGIMES={
  ppn:{label:"Porez na promet nekretnina 3 % (prodavatelj građanin ili nije u sustavu PDV-a)"},
  pdv:{label:"PDV 25 % (prodavatelj u sustavu PDV-a, zemljište s pravomoćnom dozvolom za gradnju)"},
  osl:{label:"Oslobođeno poreza (npr. stjecanje od bračnog druga ili srodnika u ravnoj liniji)"}
};

const numv=id=>{const e=document.getElementById(id); if(!e) return null; const v=parseFloat(String(e.value).replace(",",".")); return isFinite(v)?v:null};
function kdRate(){try{return localStorage.getItem("kdRate")||""}catch(e){return ""}}
const KD_ZONES=[["I",18.35],["II",18.00],["III",16.00],["IV",12.00],["V",2.00],["VI",1.50]];
function kdZone(){try{return localStorage.getItem("kdZone")||""}catch(e){return ""}}

// ulazi kupnje po čestici
function infcStore(){try{return JSON.parse(localStorage.getItem("infc")||"{}")}catch(e){return {}}}
function infcGet(k){return infcStore()[k]||{}}
function infcSave(){const k=window.__cur&&window.__cur.key; if(!k) return; const o={}; for(const id of ["kdWorks","kdSeptic","kdWell"]){const v=numv(id); if(v>0) o[id]=v} try{const s=infcStore(); s[k]=o; localStorage.setItem("infc",JSON.stringify(s))}catch(e){}}
function buyStore(){try{return JSON.parse(localStorage.getItem("buy")||"{}")}catch(e){return {}}}
function buyGet(k){const o=buyStore()[k]||{}; if(o.price==null){const lp=landPrice(k); if(lp) o.price=parseFloat(lp)}; return o}
function buySet(k,o){try{const s=buyStore(); s[k]=o; localStorage.setItem("buy",JSON.stringify(s))}catch(e){}}

function finCompute(){
  const g=id=>document.getElementById(id);
  const F={items:[],warn:[]};
  const area=window.__cur&&window.__cur.area||null;
  // --- kuća
  const hasHouse=!!g("bArea");
  if(hasHouse){
    const pick=(id,obj,def)=>{const v=g(id)&&g(id).value; return obj[v]?v:def};
    const hA=numv("bArea")||0, t=pick("bType",BUILD,"klas"), std=pick("bStd",STD,"sred"), ph=pick("bPhase",BUILD.klas,"kljuc"), fl=FLOORS[pick("bFloors",FLOORS,"P")], base=!!(g("bBase")&&g("bBase").checked);
    const unit=BUILD[t][ph]*STD[std]*fl.f, foot=hA/fl.n;
    const gradnja=hA*unit + foot*BUILD[t].temelj + (base?foot*PODRUM_EUR[ph]*STD[std]:0);
    const autoVol=Math.round((hA+(base?foot:0))*ETAZA_M);
    const volEl=g("kdVol"); if(volEl&&volEl.dataset.manual!=="1") volEl.value=autoVol;
    const vol=numv("kdVol")||0, rate=numv("kdRate");
    const kd=rate>0&&rate<=40&&vol>0?vol*rate:null;
    const kW=parseFloat(g("kdKw")?.value||"11.04"), gas=!!g("kdGas")?.checked;
    const hep=HEP_EUR_KW*kW*PDV;
    const prist=hA>600?Math.max(PRIST_GD_MIN_BIG,gradnja*0.00025):PRIST_GD;
    const yard=numv("bYard");
    F.house={hA,foot,unit,gradnja,autoVol,vol,rate,kd,kW,gas,hep,prist,base,t,fl,yard,manualVol:volEl&&volEl.dataset.manual==="1"};
    const P=(k,label,base,lo,hi,kind,formula,group)=>F.items.push({k,label,base,lo,hi,kind,formula,group});
    P("gradnja","Gradnja",gradnja,gradnja*0.9,gradnja*1.1,"procjena",`${fmt(hA)} m² × ${fmt(unit)} €/m²${BUILD[t].temelj?" + temeljna ploča "+fmt(foot)+" m² × "+BUILD[t].temelj+" €":""}${base?" + podrum "+fmt(foot)+" m²":""}; raspon ±10 %`,"gradnja");
    P("projekti","Projekti i geodezija",gradnja*0.07,gradnja*0.9*0.07,gradnja*1.1*0.07,"procjena","7 % gradnje","gradnja");
    P("nadzor","Stručni nadzor",gradnja*0.015,gradnja*0.9*0.015,gradnja*1.1*0.015,"procjena","1,5 % gradnje","gradnja");
    if(yard!=null&&yard>0) P("okolis","Uređenje okoliša",yard,yard,yard,"unos","tvoj upis","gradnja");
    if(kd!=null) P("kd","Komunalni doprinos",kd,kd,kd,"propis",`${fmt(vol)} m³ × ${String(rate).replace(".",",")} €/m³`,"naknade");
    P("vodni","Vodni doprinos",0,0,0,"propis","ukinut od 1. 7. 2024.","naknade");
    P("hep","Priključak struje (HEP)",hep,hep,hep,"propis",`${String(kW).replace(".",",")} kW × ${HEP_EUR_KW} €/kW + 25 % PDV`,"naknade");
    P("vio","Priključak vode i kanalizacije (ViO)",0,0,0,"propis","za kućanstva plaća Grad","naknade");
    if(gas) P("plin","Priključak plina (GPZ)",(GAS_RANGE[0]+GAS_RANGE[1])/2,GAS_RANGE[0],GAS_RANGE[1],"procjena","procjena 800–1.500 €","naknade");
    for(const [id,l] of [["kdWorks","Radovi na kućnim priključcima"],["kdSeptic","Sabirna jama ili pročistač"],["kdWell","Bunar"]]){const v=numv(id); if(v>0) P(id,l,v,v,v,"unos","iz ponude","naknade");}
    P("prist","Pristojba za građevinsku dozvolu",prist,prist,prist,"propis",hA>600?"0,25 ‰ troškova gradnje, najmanje 132,72 €":"zgrada do 600 m² (e-zahtjev 15 % manje)","naknade");
    if(kd==null) F.warn.push("Komunalni doprinos nije uključen: izaberi zonu.");
    if(yard==null) F.warn.push("Uređenje okoliša nije uključeno: upiši iznos ako ga znaš.");
  }
  // --- kupnja
  const key=window.__cur&&window.__cur.key;
  const b=key?buyGet(key):{}; F.key=key;
  const price=b.price>0?b.price:null;
  if(price){
    const reg=b.regime||"ppn", rows=[];
    let tax=0, taxLabel="";
    if(reg==="ppn"){tax=price*PPN; taxLabel="Porez na promet nekretnina (3 % od cijene)";}
    else if(reg==="pdv"){ if(b.vatIncl){tax=0; taxLabel="PDV 25 % (uključen u cijenu)"} else {tax=price*PDV_RATE; taxLabel="PDV 25 % (nije uključen u cijenu)"} }
    else {tax=0; taxLabel="Oslobođeno poreza na promet";}
    rows.push({k:"porez",label:taxLabel,v:tax,kind:"propis"});
    const ag=b.agency>0?b.agency:0;
    if(ag) rows.push({k:"agencija",label:`Agencija (${String(ag).replace(".",",")} %${b.agencyVat!==false?" + 25 % PDV":""})`,v:price*ag/100*(b.agencyVat!==false?1.25:1),kind:"unos"});
    const zk=(b.efile!==false?ZK_PRIJEDLOG*0.5:ZK_PRIJEDLOG)+ZK_RJESENJE;
    rows.push({k:"zkpr",label:`Sudske pristojbe za uknjižbu (prijedlog ${b.efile!==false?"elektronički 3,25":"6,50"} € + rješenje 26,54 €)`,v:zk,kind:"propis"});
    for(const [k,l] of [["notary","Javni bilježnik"],["lawyer","Odvjetnik"],["geo","Geodet"],["other","Ostali troškovi"]]){
      if(b[k]>0) rows.push({k,label:l,v:b[k],kind:"unos"});
    }
    const missing=[["notary","javni bilježnik"],["lawyer","odvjetnik"],["geo","geodet"]].filter(([k])=>!(b[k]>0)).map(x=>x[1]);
    const costs=rows.reduce((s,r)=>s+r.v,0);
    const gross=reg==="pdv"&&!b.vatIncl?price*(1+PDV_RATE):price;
    const kap=b.kapara>0?Math.min(b.kapara,gross):0;
    // stjecanje = cijena + troškovi; PDV koji nije u cijeni nalazi se u stavci poreza, pa se ne zbraja dvaput
    const acq=price+costs;
    F.buy={price,reg,rows,costs,gross,acq,missing,kap,rest:gross-kap,area,perM2:area?price/area:null,effM2:area?acq/area:null};
  }
  // --- ukupno
  const sum=f=>F.items.reduce((s,i)=>s+f(i),0);
  F.house&&(F.build={base:sum(i=>i.base),lo:sum(i=>i.lo),hi:sum(i=>i.hi),naknade:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.base,0),
    naknadeLo:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.lo,0),naknadeHi:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.hi,0)});
  if(F.build){const g2=F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.base,0); F.build.rez=g2*0.15;}
  const acq=F.buy?F.buy.acq:0;
  F.total={base:(F.build?F.build.base:0)+acq,lo:(F.build?F.build.lo:0)+acq,hi:(F.build?F.build.hi:0)+acq,rez:F.build?F.build.rez:0,hasBuy:!!F.buy,hasBuild:!!F.build};
  return F;
}

const KIND={propis:"prema propisu",procjena:"procjena",unos:"tvoj unos"};
const frow=(a,b,opt={})=>`<div class="row${opt.cls?" "+opt.cls:""}"${opt.bold?' style="font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px"':""}><span>${a}${opt.f?`<small class="fx">${esc(opt.f)}</small>`:""}</span><span>${b}</span></div>`;
const kindTag=k=>`<em class="kind kind-${k}">${KIND[k]}</em>`;
const money=(i)=>i.lo!==i.hi?`${fmt(i.lo)}–${fmt(i.hi)} €`:`${fmt(i.base)} €`;

function finUpdate(){
  const F=finCompute(); window.__fin=F;
  const g=id=>document.getElementById(id);
  // komunalni doprinos
  if(g("kdOut")&&F.house){const H=F.house;
    g("kdOut").textContent=!(H.rate>0)?"izaberi zonu":!(H.vol>0)?"upiši obujam":H.rate>40?"iznos je nerealno velik: u Zagrebu je od 1,50 do 18,35 €/m³":fmt(H.kd)+" € (uz 10 % popusta za jednokratnu uplatu: "+fmt(H.kd*0.9)+" €)";
    if(g("kdSum")) g("kdSum").textContent=H.kd!=null?fmt(H.kd)+" €":"izaberi zonu";
    const ab=g("kdVolAuto"); if(ab) ab.style.display=H.manualVol?"":"none";
    const nt=g("kdVolNote"); if(nt) nt.textContent=H.manualVol?`Obujam si upisao ručno. Iz kuće bi bilo ${fmt(H.autoVol)} m³.`:`Obujam = (površina kuće ${fmt(H.hA)} m²${H.base?" + podrum "+fmt(H.foot)+" m²":""}) × ${ETAZA_M} m = ${fmt(H.autoVol)} m³, iz "Procjene cijene gradnje". Službeno se obračunava bruto obujam iz projekta; ako ga znaš, upiši ga.`;
  }
  // priključci i dozvole
  if(g("costs")&&F.house){
    const its=F.items.filter(i=>i.group==="naknade");
    let h=`<div class="calc" style="background:var(--panel);margin-top:8px">`+its.map(i=>frow(esc(i.label)+" "+kindTag(i.kind),money(i),{f:i.formula})).join("");
    if(F.house.kd==null) h+=frow("Komunalni doprinos","izaberi zonu");
    const s=F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`;
    h+=frow(`Ukupno naknade i priključci${F.house.kd==null?" (bez komunalnog)":""}`,s,{bold:true})+`</div>`;
    h+=`<p class="meta">Isti iznosi ulaze u procjenu gradnje i ukupnu investiciju. Radovi koje plaćaš izvođačima (vodomjerno okno, kućni priključci, elektro-ormarić) ovise o udaljenosti mreže koja nije javno objavljena, pa ih upiši iz ponude.</p>`;
    g("costs").innerHTML=h; if(g("costSum")) g("costSum").textContent=s;
  }
  // gradnja
  if(g("bOut")&&F.house){
    const H=F.house, grid=document.querySelector(".bgrid[data-gbp]"), gbp=grid?+grid.dataset.gbp||0:0, tl=grid?+grid.dataset.tlocrt||0:0;
    let h="";
    if(gbp&&H.hA>gbp*1.001) h+=`<p class="flag">Površina je veća od najvećeg dopuštenog GBP-a na ovoj čestici (${fmt(gbp)} m²).</p>`;
    if(tl&&H.foot>tl*1.001) h+=`<p class="flag">Tlocrt (${fmt(H.foot)} m²) prelazi najveću izgrađenost (${fmt(tl)} m²). Probaj više etaža ili manju površinu.</p>`;
    h+=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
    for(const i of F.items.filter(i=>i.group==="gradnja")) h+=frow(esc(i.label)+" "+kindTag(i.kind),money(i),{f:i.formula});
    h+=frow("Naknade, priključci i pristojbe "+kindTag("propis"),F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`,{f:"iz odjeljaka Komunalni doprinos i Priključci i dozvole"});
    h+=frow("Ukupno gradnja s naknadama",`${fmt(F.build.lo)} – ${fmt(F.build.hi)} €`,{bold:true,f:"osnovni iznos "+fmt(F.build.base)+" €"});
    h+=frow("Preporučena rezerva",`+ ${fmt(F.build.rez)} €`,{f:"15 % gradnje, projekata, nadzora i okoliša; nije uključena u ukupno"});
    h+=`</div>`;
    if(F.warn.length) h+=`<p class="meta">${F.warn.map(esc).join(" ")}</p>`;
    h+=`<p class="meta">Tržišne cijene za okolicu Zagreba, 2026. (izvori: trebam.hr, montazneidrvenekuce.info Q1 2026, reporter.hr). ${H.t==="mont"?"Montažna cijena uključuje temeljnu ploču (procjena 90 €/m² tlocrta). ":""}Podrum je procjena. Zemljište i troškovi kupnje su u odjeljku "Novac i kupnja". Za stvarnu cijenu traži barem tri ponude.</p>`;
    g("bOut").innerHTML=h; if(g("bSum")) g("bSum").textContent=fmt(F.build.lo)+" – "+fmt(F.build.hi)+" €";
  }
  // kupnja
  if(g("buyOut")){
    let h="";
    if(!F.buy) h=`<p class="meta">Upiši kupoprodajnu cijenu ili cijenu po m².</p>`;
    else{const B=F.buy;
      h+=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
      h+=frow("Kupoprodajna cijena "+kindTag("unos"),fmt(B.price)+" €",{f:B.perM2?fmt(B.perM2)+" €/m² za "+fmt(B.area)+" m²":""});
      for(const r of B.rows) h+=frow(esc(r.label)+" "+kindTag(r.kind),fmt(r.v)+" €");
      h+=frow("Ukupno troškovi kupnje",fmt(B.costs)+" €",{bold:true});
      h+=frow("Ukupna cijena stjecanja",fmt(B.acq)+" €",{bold:true,f:"cijena + troškovi kupnje"});
      if(B.effM2) h+=frow("Efektivna cijena po m²",fmt(B.effM2)+" €/m²",{f:"cijena stjecanja ÷ "+fmt(B.area)+" m²"});
      if(B.kap) h+=frow("Kapara (dio cijene, nije dodatni trošak)",fmt(B.kap)+" €",{f:"ostatak za uplatu pri ugovoru: "+fmt(B.rest)+" €"});
      h+=`</div>`;
      if(B.missing.length) h+=`<p class="meta">Nije upisano: ${esc(B.missing.join(", "))}. Ti iznosi ovise o ponudi pa ih aplikacija ne procjenjuje; upiši ih kad ih dobiješ.</p>`;
      if(B.reg==="pdv") h+=`<p class="meta">Kad se plaća PDV, ne plaća se porez na promet nekretnina. PDV se plaća samo ako je prodavatelj u sustavu PDV-a i zemljište ima pravomoćnu dozvolu za gradnju; sama građevinska zona nije dovoljna.</p>`;
    }
    h+=`<p class="meta">Izvori: <a href="https://porezna-uprava.gov.hr/hr/stjecatelj-nekretnine/4700" target="_blank" rel="noopener" style="color:var(--accent)">Porezna uprava, stjecatelj nekretnine</a>; <a href="https://www.gov.hr/hr/upis-prava-vlasnistva/1306" target="_blank" rel="noopener" style="color:var(--accent)">gov.hr, upis prava vlasništva</a>. Porez se plaća na tržišnu vrijednost koju utvrdi Porezna uprava, pa može biti i viši od izračuna ako je ugovorena cijena niža od tržišne.</p>`;
    g("buyOut").innerHTML=h; if(g("buySum")) g("buySum").textContent=F.buy?fmt(F.buy.acq)+" €":"upiši cijenu";
  }
  // ukupna investicija
  if(g("totOut")){
    const T=F.total; let h=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
    if(F.buy) h+=frow("Zemljište s troškovima kupnje",fmt(F.buy.acq)+" €",{f:"cijena "+fmt(F.buy.price)+" € + troškovi "+fmt(F.buy.costs)+" €"});
    else h+=frow("Zemljište","nije upisano");
    if(F.build){h+=frow("Gradnja, projekti, nadzor"+(F.items.some(i=>i.k==="okolis")?", okoliš":""),`${fmt(F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.lo,0))}–${fmt(F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.hi,0))} €`);
      h+=frow("Naknade, priključci i pristojbe",F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`);}
    else h+=frow("Gradnja","nema podataka o dopuštenoj kući za ovu česticu");
    h+=frow("Ukupna investicija",T.lo!==T.hi?`${fmt(T.lo)} – ${fmt(T.hi)} €`:`${fmt(T.base)} €`,{bold:true,f:"osnovni iznos "+fmt(T.base)+" €"});
    if(T.rez) h+=frow("S preporučenom rezervom",`do ${fmt(T.hi+T.rez)} €`,{f:"gornja granica + rezerva 15 % ("+fmt(T.rez)+" €)"});
    h+=`</div><p class="meta">Svaka stavka se računa jednom: naknade iz "Priključci i dozvole", gradnja iz "Procjene cijene gradnje", zemljište iz "Kupnje zemljišta". Raspon dolazi samo od procjena (gradnja ±10 %, plin); iznosi prema propisu i tvoji unosi su točni brojevi.</p>`;
    g("totOut").innerHTML=h; if(g("totSum")) g("totSum").textContent=T.lo!==T.hi?`${fmt(T.lo)} – ${fmt(T.hi)} €`:(T.base?fmt(T.base)+" €":"upiši cijenu");
  }
  try{cardsUpdate()}catch(e){}
  window.__budget=F.total.base?{lo:F.total.lo,hi:F.total.hi,base:F.total.base,land:F.buy?F.buy.price:null,kupnja:F.buy?F.buy.costs:null,acq:F.buy?F.buy.acq:null,build:F.build?{lo:F.build.lo,hi:F.build.hi}:null}:null;
  const fk=window.__cur&&window.__cur.key; if(fk){const a=favs(), f=a.find(x=>x.key===fk); if(f){f.budget=window.__budget; f.land=F.buy?F.buy.price:null; setFavs(a);}}
}

// odjeljak "Novac i kupnja"
function moneyHtml(key,area){
  const b=buyGet(key), reg=b.regime||"ppn";
  let h=`<h2 id="sec-novac">Novac i kupnja</h2>`;
  h+=`<details class="acc" data-k="buy"><summary><span>Kupnja zemljišta</span><b id="buySum"></b></summary><div class="acc-body">`;
  h+=`<div class="bgrid buygrid">`;
  h+=`<label for="yPrice">Kupoprodajna cijena</label><span><input id="yPrice" type="number" inputmode="decimal" min="0" step="1000" placeholder="iz oglasa" value="${b.price>0?b.price:""}"> €</span>`;
  h+=`<label for="yM2">Cijena po m²</label><span><input id="yM2" type="number" inputmode="decimal" min="0" step="1" value="${b.price>0&&area?Math.round(b.price/area):""}"${area?"":" disabled"}> €/m²${area?` <small class="meta">(${fmt(area)} m²)</small>`:""}</span>`;
  h+=`<label for="yReg">Porezni režim</label><select id="yReg" class="bsel">${Object.entries(REGIMES).map(([k,v])=>`<option value="${k}"${k===reg?" selected":""}>${v.label}</option>`).join("")}</select>`;
  h+=`<label for="yVatIncl">PDV</label><span><input type="checkbox" id="yVatIncl"${b.vatIncl?" checked":""}${reg==="pdv"?"":" disabled"}> cijena već uključuje PDV</span>`;
  h+=`<label for="yAgency">Agencija</label><span><input id="yAgency" type="number" inputmode="decimal" min="0" max="10" step="0.5" placeholder="0" value="${b.agency>0?b.agency:""}"> % <label style="display:inline"><input type="checkbox" id="yAgencyVat"${b.agencyVat!==false?" checked":""}> + PDV</label></span>`;
  h+=`<label for="yNotary">Javni bilježnik</label><span><input id="yNotary" type="number" inputmode="decimal" min="0" step="10" placeholder="ponuda" value="${b.notary>0?b.notary:""}"> €</span>`;
  h+=`<label for="yLawyer">Odvjetnik</label><span><input id="yLawyer" type="number" inputmode="decimal" min="0" step="50" placeholder="ponuda" value="${b.lawyer>0?b.lawyer:""}"> €</span>`;
  h+=`<label for="yGeo">Geodet</label><span><input id="yGeo" type="number" inputmode="decimal" min="0" step="50" placeholder="ponuda" value="${b.geo>0?b.geo:""}"> €</span>`;
  h+=`<label for="yOther">Ostalo</label><span><input id="yOther" type="number" inputmode="decimal" min="0" step="50" placeholder="0" value="${b.other>0?b.other:""}"> €</span>`;
  h+=`<label for="yEfile">Uknjižba</label><span><input type="checkbox" id="yEfile"${b.efile!==false?" checked":""}> elektronički (preko bilježnika ili odvjetnika)</span>`;
  h+=`<label for="yKapara">Kapara</label><span><input id="yKapara" type="number" inputmode="decimal" min="0" step="500" placeholder="0" value="${b.kapara>0?b.kapara:""}"> € <small class="meta">dio cijene</small></span>`;
  h+=`</div><div id="buyOut"></div></div></details>`;

    h+=`<li class="${o.d?"done":""}" data-ck="${s.id}"><label class="ckh"><input type="checkbox" data-ckd${o.d?" checked":""}> <b>${i+1}. ${esc(s.t)}</b></label><div class="ckb">`;

const mapEl=document.getElementById("map"), mapHome=mapEl.parentNode, mapNext=mapEl.nextSibling;
function preparePrintMap(){
  const pm=document.getElementById("printMap");
  if(!pm) return Promise.resolve();
  pm.style.display="block"; pm.appendChild(mapEl); mapEl.classList.add("in-print");
  map.invalidateSize();
  if(window.__lastBounds) map.fitBounds(window.__lastBounds,{padding:[30,30],maxZoom:19});
  else if(window.__lastLL) map.setView(window.__lastLL,18);
  const base=map.hasLayer(sat)?sat:osm;
  return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;setTimeout(res,300)}};base.once("load",fin);setTimeout(fin,3000);});

function serviceList(){

  const seen=new Set(), out=[];
  for(const [n,u] of L){const base=u.replace(/\/query$/,""); if(seen.has(base)) continue; seen.add(base); out.push({n,u:base+"?f=json"});}

async function ping(x){
  const t0=(window.performance||Date).now();
  try{
    if(x.raw){const c=new AbortController(), t=setTimeout(()=>c.abort(),8000); try{const r=await fetch(x.u,{signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status)}finally{clearTimeout(t)}}
    else await getJSON(x.u,{},8000,{retries:0,cache:false});
    return {ok:true,ms:Math.round((window.performance||Date).now()-t0)};
  }catch(e){return {ok:false,ms:Math.round((window.performance||Date).now()-t0),e:e.message}}
}
async function showStatus(){

}
