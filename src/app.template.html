<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Čestica Zagreb</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f6f54">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<style>
/* Layout: full-screen map, results in a bottom sheet (side panel on wide screens) */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#dde2de; --soft:#eef1ee;
  --accent:#1f6f54;
  --ok:#1f7a3f; --warn:#a86400; --no:#b3261e;
  --ok-bg:#e5f3e9; --warn-bg:#fbefd9; --no-bg:#fbe5e3;
  --f-display:"Archivo",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --panel:#1c2320; --fg:#e6ece8; --muted:#9aa8a0; --line:#2e3833; --soft:#232c28;
  --accent:#5cc49a;
  --ok:#7fd69a; --warn:#f0b65a; --no:#f2867d;
  --ok-bg:#1b3325; --warn-bg:#3a2c12; --no-bg:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-display)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;white-space:nowrap}
.ib:focus-visible,#q:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--line)}
.layers{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:900;display:flex;flex-direction:column;gap:6px}
.layers label{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;display:flex;gap:6px;align-items:center}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:950;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(0,0,0,.12)}
@media (min-width:900px){#sheet{left:auto;top:10px;right:10px;bottom:10px;width:420px;max-height:none;border-radius:12px;border:1px solid var(--line)} .layers{right:440px}}
.hint{color:var(--muted);margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
.parcel{font-family:var(--f-mono);font-size:22px;font-weight:500;margin:0}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
.verdict{margin:12px 0;padding:10px 12px;border-radius:10px;font-weight:500}
.v-ok{background:var(--ok-bg);color:var(--ok)} .v-warn{background:var(--warn-bg);color:var(--warn)} .v-no{background:var(--no-bg);color:var(--no)}
.zones{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.zone{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:3px;margin-top:3px}
.zone b{display:block;font-weight:500}
.zone small{color:var(--muted);display:block}
.pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rule-code{font-family:var(--f-mono);font-weight:500;background:var(--soft);border-radius:6px;padding:1px 6px;margin-right:6px}
.rule-title{font-weight:700;font-size:16px;margin:4px 0 2px;text-wrap:balance}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 10px;margin:8px 0 0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.calc{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.calc .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.calc .row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bgrid>span{min-width:0}
.bad{color:var(--no)} .good{color:var(--ok)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:500;font-size:14px}
details ol{padding-left:20px;margin:8px 0 0;font-size:13.5px} details li{margin:4px 0}
details p{font-size:13.5px;margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.links a{color:var(--accent);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.err{color:var(--no);font-size:13px;margin:6px 0 0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{padding:8px 10px;border-radius:8px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.chk b{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:14px;margin-top:6px}
.bgrid input[type=number],.bsel{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}
.bgrid input[type=number]{width:6em}
.actions{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.phase-d summary{font-weight:700;font-size:15px;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.docs label{display:flex;gap:6px;align-items:flex-start;font-size:14px}
.docs small{color:var(--muted)} .docs a{color:var(--accent)}
.print-only{display:none}
#printMap{display:none;height:340px;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#map.in-print{position:absolute;inset:0}
@media print{
  header,.layers,.leaflet-control-zoom,.actions{display:none!important}
  #printMap{display:block!important;height:9cm;break-inside:avoid;border-radius:0}
  html,body{height:auto;background:#fff;color:#000}
  #app,main{position:static!important;display:block}
  #sheet{position:static!important;max-height:none!important;overflow:visible!important;width:auto!important;box-shadow:none!important;border:0!important;padding:0!important}
  .print-only{display:block;font-weight:700;margin:0 0 8px}
  details{break-inside:avoid-page}
  .docs li,.calc,.chk,.zone{break-inside:avoid}
  :root:not(#_p){--bg:#fff;--fg:#000;--muted:#444;--panel:#fff;--soft:#f2f2f2;--line:#ccc;--accent:#1f6f54;--ok:#1f7a3f;--warn:#8a5200;--no:#b3261e;--ok-bg:#e5f3e9;--warn-bg:#fbefd9;--no-bg:#fbe5e3;color-scheme:light}
}
.cmp-wrap{overflow-x:auto;margin-top:6px}
.cmp{border-collapse:collapse;font-size:13px;min-width:100%}
.cmp th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px 6px 0;white-space:nowrap;vertical-align:top;position:sticky;left:0;background:var(--panel)}
.cmp td{padding:6px 8px;border-left:1px solid var(--line);vertical-align:top;min-width:9em;font-variant-numeric:tabular-nums}
.cmp tr{border-top:1px solid var(--line)}
.actions{gap:8px}
@media print{.noprint{display:none}}
.acc{margin-top:10px;border:2px solid var(--accent);border-radius:12px;background:var(--panel);overflow:hidden;padding:0}
.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--ok-bg);cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary>span{font-weight:700;font-size:15px;color:var(--fg)}
.acc>summary>span::before{content:"▸";display:inline-block;margin-right:8px;color:var(--accent);transition:transform .15s}
.acc[open]>summary>span::before{transform:rotate(90deg)}
.acc>summary>b{font-family:var(--f-mono);font-weight:500;font-size:13px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.acc>summary>b.bad{color:var(--no)}
.acc .calc{border:0;border-radius:0;margin:0}
.acc-body{padding:10px 14px 12px}
@media (prefers-reduced-motion:reduce){.acc>summary>span::before{transition:none}}
.t-handle{background:#1565c0;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chk-ok{background:var(--ok-bg);color:var(--ok)}
.kd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.kd input{width:6em;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.kd output{font-family:var(--f-mono);font-weight:500}
.chk-no{background:var(--no-bg);color:var(--no)} .chk-warn{background:var(--warn-bg);color:var(--warn)}
.flag{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.zkc{display:flex;flex-wrap:wrap;gap:6px}.zkc .ib{flex:1 1 140px}.zksteps{padding-left:18px;margin:6px 0}.zksteps li{margin:3px 0}a.ib{text-decoration:none;display:inline-block}
.fx{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.kind{font-style:normal;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:8px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.kind-propis{background:var(--ok-bg);color:var(--ok)} .kind-procjena{background:var(--warn-bg);color:var(--warn)} .kind-unos{background:#e8eefc;color:#2b4a9a}
@media (prefers-color-scheme:dark){.kind-unos{background:#1e2a44;color:#9fb6ff}}
.buygrid select{max-width:100%}
.ck li{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.ck .ckh{display:flex;gap:8px;align-items:flex-start}
.ck .ckh b{font-size:14px}
.ck .ckb{margin:4px 0 0 26px;display:flex;flex-direction:column;gap:4px}
.ck .ckb small{color:var(--muted)} .ck a{color:var(--accent)}
.ck .ckf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ck input[type=date]{font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.ck textarea{font:inherit;font-size:13px;width:100%;min-height:2.2em;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);box-sizing:border-box}
.ck .rok{color:var(--warn);font-size:12.5px}
.ck li.done .ckh b{text-decoration:line-through;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Čestica ZG</h1>
    <input id="q" type="search" placeholder="Adresa ili čestica, npr. Šestine 4027/1" autocomplete="off">
    <button class="ib" id="go" type="button">Traži</button>
    <button class="ib" id="me" type="button" aria-label="Moja lokacija">◎</button>
    <button class="ib" id="favBtn" type="button" aria-label="Spremljene čestice">★</button>
  </header>
  <main>
    <div id="map"></div>
    <div class="layers">
      <label><input type="checkbox" id="lyrSat"> Satelit</label>
      <label><input type="checkbox" id="lyrNam" checked> Namjena</label>
    </div>
    <section id="sheet" aria-live="polite">
      <p class="eyebrow">Kako radi</p>
      <p class="meta" id="ver" style="margin:0 0 6px"></p>
      <p class="hint">Dodirni zemljište na karti (zumiraj do razine ulice). Dobit ćeš katastarsku česticu, namjenu iz prostornog plana i urbano pravilo GUP-a s uvjetima gradnje.</p>
    </section>
  </main>
</div>
<script>
const RULES = /*RULES*/null;
const RULES_SE = /*RULES_SE*/null;
const RULES_PP = /*RULES_PP*/null;
const APP_VERSION = "/*VERSION*/";

const BASE = "https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/";
const SRC = {
  namjena: BASE+"Geoportal_planirana_namjena/FeatureServer/0/query",
  cestice: BASE+"KatastarskeCestice_2023/FeatureServer/3/query",
  pravila: BASE+"4a_urbana_pravila_JR_PJR_swipe/FeatureServer/253/query",
  iznimke: BASE+"4a_urbana_pravila_JR_PJR_swipe/FeatureServer/254/query",
  gupNam:  BASE+"4a_urbana_pravila_JR_PJR_swipe/FeatureServer/257/query",
  pravilaSE: BASE+"GUP_Sesvet_ponovno_4a_obuhvat/FeatureServer/0/query"
};
// Provjere za kupca: svaki sloj se presijeca s česticom (ili točkom)
const CHECKS = [
  {id:"upu", label:"Obveza UPU-a", url:BASE+"4b_procedure_JR_PJR_swipe/FeatureServer/19/query", fields:"TextString,LAYER", sev:"no",
   hit:f=>"Čestica je u obuhvatu urbanističkog plana uređenja"+(f.TextString?` (${f.TextString})`:"")+". Dok UPU nije donesen, nova gradnja u pravilu nije moguća. Provjeri status plana.",
   none:"Nije u obuhvatu obveznog UPU-a."},
  {id:"uan", label:"Natječaj", url:BASE+"4b_procedure_JR_PJR_swipe/FeatureServer/18/query", fields:"LAYER", sev:"warn",
   hit:()=>"Za gradnju na ovom području propisan je urbanističko-arhitektonski natječaj.", none:null},
  {id:"rez", label:"Proširenje ulice", url:BASE+"4a_urbana_pravila_JR_PJR_swipe/FeatureServer/258/query", fields:"LAYER", sev:"warn", line:true,
   hit:()=>"Rub rezervacije za proširenje ulice prolazi kroz česticu. Dio uz ulicu ne može se izgraditi niti se računa u prirodni teren, pa je stvarna građevinska površina manja.",
   none:"Nema rezervacije za proširenje ulice preko čestice."},
  {id:"kliz", label:"Klizište", url:BASE+"Klizista_baza/FeatureServer/0/query", fields:"POJAVA,TIP_KLIZAN,STADIJ_KLI,STAROST,DUB_KLIZ_P", sev:"no", draw:"#a0522d",
   hit:f=>{const d=[f.STADIJ_KLI&&("stadij: "+f.STADIJ_KLI),f.TIP_KLIZAN&&("tip: "+f.TIP_KLIZAN),f.DUB_KLIZ_P&&("dubina: "+f.DUB_KLIZ_P)].filter(Boolean);
     return "Čestica zahvaća evidentirano klizište"+(d.length?" ("+d.join(", ")+")":"")+". Potreban je geotehnički elaborat, a sanacija može biti skupa.";},
   none:"Nema evidentiranog klizišta na čestici."},
  {id:"kult", label:"Kulturna dobra", url:BASE+"4d_kultura_JR_PJR_swipe/FeatureServer/10/query", fields:"LAYER", sev:"warn",
   hit:(f,all)=>"Zaštita kulturne baštine: "+[...new Set(all.map(x=>x.LAYER).filter(Boolean))].join(", ")+". Za gradnju trebaju posebni uvjeti konzervatora.",
   none:"Nije u zoni zaštite kulturne baštine."},
  {id:"prir", label:"Zaštita prirode", url:BASE+"4c_zastita_JR_PJR_swipe/FeatureServer/14/query", fields:"LAYER", sev:"warn",
   hit:(f,all)=>"Zaštićeni dio prirode: "+[...new Set(all.map(x=>x.LAYER).filter(Boolean))].map(s=>s.toLowerCase()).join(", ")+". Gradnja je ograničena posebnim uvjetima.",
   none:"Nije u zaštićenom dijelu prirode."},
  {id:"voda", label:"Vodozaštita", url:BASE+"3c_voda_JR_PJR_swipe/FeatureServer/31/query", fields:"ZONA,CRPILISTE,VODOCRPILI", sev:"warn",
   hit:(f,all)=>"Vodozaštitna zona "+[...new Set(all.map(x=>x.ZONA).filter(Boolean))].join(", ")+(f.CRPILISTE||f.VODOCRPILI?` (crpilište ${f.CRPILISTE||f.VODOCRPILI})`:"")+". Ograničenja za odvodnju, sabirne jame i neke djelatnosti.",
   none:"Nije u vodozaštitnoj zoni."},
  {id:"potok", label:"Potok", url:BASE+"3c_voda_JR_PJR_swipe/FeatureServer/22/query", fields:"OBJECTID", sev:"warn", line:true,
   hit:()=>"Uz česticu ili kroz nju prolazi koridor potoka. Gradnja uz vodotok je ograničena, a moguće je i plavljenje.",
   none:null},
  {id:"popl", label:"Akumulacija", url:BASE+"3c_voda_JR_PJR_swipe/FeatureServer/28/query", fields:"LAYER", sev:"no",
   hit:()=>"Čestica je u planiranom području akumulacije ili plavljenja (hidroenergetski sustav Save).", none:null}
];
// Koridori infrastrukture (GUP čl. 50: DV 110 kV 20 m, 220 kV 25 m, 400 kV 35 m od osi; čl. 53: magistralni plinovod 30 m, VTP 10 m)
// moduli koji su u razvoju (faze C i D) i još nisu uključeni
const FEATURES={infra:false,sun:false,seis:false};
const INFRA=BASE+"GUP_Infrastruktura/FeatureServer/";
const corrDist=(f,kind)=>{
  if(kind==="ee"){const l=String(f.LAYER||"")+String(f.EE_VODOVI_OPIS||""); return /400/.test(l)?35:/220/.test(l)?25:20;}
  if(kind==="plin"){const l=String(f.LABELA||"")+String(f.PLINOVOD_OPIS||""); return /^MP|magistral/i.test(l)?30:10;}
  return 30;
};
CHECKS.push(
  {id:"dv", label:"Dalekovod", url:INFRA+"12/query", fields:"LAYER,EE_VODOVI_OPIS", sev:"no", corridor:"ee", search:40,
   hit:(f,all)=>"U koridoru posebnog režima: "+[...new Set(all.map(x=>x.EE_VODOVI_OPIS||x.LAYER).filter(Boolean))].join(", ")+". Unutar koridora (20 m od osi za 110 kV, 35 m za 400 kV) nadzemna gradnja nije dopuštena bez posebnih uvjeta HOPS-a ili HEP-a.",
   none:"Nema dalekovoda 110 kV ili jačeg u blizini."},
  {id:"plin", label:"Plinovod", url:INFRA+"14/query", fields:"LABELA,PLINOVOD_OPIS", sev:"no", corridor:"plin", search:35,
   hit:(f,all)=>"U sigurnosnoj zoni plinovoda: "+[...new Set(all.map(x=>x.PLINOVOD_OPIS||x.LABELA).filter(Boolean))].join(", ")+" (magistralni 30 m, visokotlačni 10 m od osi). Gradnja traži suglasnost Plinacra ili Gradske plinare.",
   none:"Nema magistralnog ni visokotlačnog plinovoda u sigurnosnoj zoni."},
  {id:"prod", label:"Produktovod", url:INFRA+"16/query", fields:"PRODUKTOVOD_OPIS", sev:"warn", corridor:"prod", search:35,
   hit:()=>"Uz česticu prolazi produktovod (naftovod). Udaljenost gradnje određuje upravitelj cjevovoda; računaj s ograničenjem do 30 m od osi.",
   none:null}
);
const BUILDABLE = new Set(["Stambena i mješovita","Gospodarska","Javna i društvena","Sport i rekreacija","Posebna"]);
const COLORS = {
  "Gospodarska":"#9966ff","Groblje":"#4a452a","Infrastruktura":"#bdbdbd","Javna i društvena":"#ff5050",
  "Javne zelene površine":"#00cc66","Poljoprivreda, zaštitno zelenilo, neuređeno, ostalo":"#99cc00",
  "Posebna":"#cc00cc","Promet":"#a6a6a6","Sport i rekreacija":"#66ff66","Stambena i mješovita":"#f79646",
  "Vode i vodno dobro":"#00c4ff","Šume":"#206220"
};

// --- mreža: svaki zahtjev ima rok, nikad ne visi
async function getJSON(url,opts={},ms=10000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{...opts,signal:c.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); if(j.error) throw new Error(j.error.message||"greška servisa"); return j;
  }catch(e){throw new Error(e.name==="AbortError"?"nema odgovora nakon "+ms/1000+" s":(e.message||"greška mreže"))}
  finally{clearTimeout(t)}
}
function pointQuery(url,ll,fields="*",geom=true){
  const p=new URLSearchParams({geometry:ll.lng+","+ll.lat,geometryType:"esriGeometryPoint",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(geom),outSR:"4326",f:"geojson"});
  return getJSON(url+"?"+p.toString()).then(g=>g.features||[]);
}
function polyQuery(url,geom,fields="*",withGeom=true){
  const rings=geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat();
  const p=new URLSearchParams({geometry:JSON.stringify({rings,spatialReference:{wkid:4326}}),geometryType:"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(withGeom),outSR:"4326",f:"geojson"});
  return getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()}).then(g=>g.features||[]);
}

async function inspect(ll){
  const id=++clickId;
  selLayer.clearLayers(); TL.layer=null; TL.marker=null; TL.center=null; ZK.res=null; window.__infra=null;
  L.circleMarker(ll,{radius:5,color:"#000",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(selLayer);

  let [ces,nam,up,upx,gn]=await Promise.all([
    settle(pointQuery(SRC.cestice,ll)),
    settle(pointQuery(SRC.namjena,ll)),
    settle(pointQuery(SRC.pravila,ll,"BROJ_UP",false)),
    settle(pointQuery(SRC.iznimke,ll,"LAYER",false)),
    settle(pointQuery(SRC.gupNam,ll,"NAMJENA1,NAMJENA2",false))
  ]);
  if(id!==clickId) return;
  // izvan GUP-a Zagreba: urbana pravila GUP-a Sesveta (prijedlog izmjena 2026.)
  if(!(up.v&&up.v[0])){
    const se=await settle(pointQuery(SRC.pravilaSE,ll,"TextString",false));
    const m=se.v&&se.v[0]?String(se.v[0].properties.TextString||"").match(/\d+\.\d+(?:\.\d+)?/):null;
    if(m) up={v:[{properties:{BROJ_UP:m[0]+".",SRC:"SE"}}]};
    if(id!==clickId) return;
  }
  const parcel=ces.v&&ces.v[0]?ces.v[0]:null;
  let zones=nam.v||[], area=null;
  if(parcel){
    area=turf.area(parcel.geometry);
    const pl=L.geoJSON(parcel.geometry,{style:{color:"#111",weight:3,fill:false},interactive:false}).addTo(selLayer);
    window.__lastBounds=pl.getBounds();
    try{zones=await polyQuery(SRC.namjena,parcel.geometry)}catch(e){}
    if(id!==clickId) return;
  }
  const rows=zones.map(z=>{
    let share=null;
    if(parcel){try{const i=turf.intersect(parcel.geometry,z.geometry);share=i?turf.area(i)/area:0}catch(e){}}
    return {p:z.properties,share,geom:z.geometry};
  }).filter(r=>r.share===null||r.share>0.005).sort((a,b)=>(b.share??0)-(a.share??0));
  rows.forEach(r=>L.geoJSON(r.geom,{style:{color:COLORS[r.p.Analitika]||"#888",weight:1,fillOpacity:.3},interactive:false}).addTo(selLayer));
  // pokaži osnovno odmah, provjere stižu za trenutak
  const base={ll,parcel,area,rows,ces,nam,up,upx,gn,checks:null};
  render(base);
  // malo smanjena čestica, da susjedni sloj koji samo dodiruje među ne bude pogodak
  let qGeom=null;
  if(parcel){try{const b=turf.buffer(parcel.geometry,-0.0008,{units:"kilometers"});qGeom=b&&b.geometry?b.geometry:parcel.geometry}catch(e){qGeom=parcel.geometry}}
  const slopeP=settle(loadSlope(parcel,ll));
  const zgradeP=parcel?settle(loadZgrade(parcel)):null;
  const checks=await Promise.all(CHECKS.map(c=>settle(
    c.corridor?corridorQuery(c,parcel,ll):
    (qGeom?polyQuery(c.url,qGeom,c.fields,!!c.draw):pointQuery(c.url,ll,c.fields,!!c.draw))
  ).then(r=>({c,...r}))));
  checks.forEach(r=>{if(r.c.corridor&&r.v) r.v.forEach(f=>L.geoJSON(f.geometry,{style:{color:r.c.id==="dv"?"#b3261e":"#a86400",weight:3,dashArray:"8 6"},interactive:false}).addTo(selLayer))});
  // gradivi dio i nagib terena
  const env2=buildEnvelope(parcel,rows,up);
  if(env2&&env2.geom) L.geoJSON(env2.geom,{style:{color:"#1f6f54",weight:2,dashArray:"4 3",fillColor:"#1f6f54",fillOpacity:.25},interactive:false}).addTo(selLayer);
  base.envelope=env2;
  window.__env=env2;
  base.zgrade=parcel?await zgradeP:null;
  if(base.zgrade&&base.zgrade.v) base.zgrade.v.geoms.forEach(gm=>L.geoJSON(gm,{style:{color:"#444",weight:1.5,fillColor:"#666",fillOpacity:.35},interactive:false}).addTo(selLayer));
  base.slope=await slopeP;
  if(id!==clickId) return;
  checks.forEach(r=>{if(r.c.draw&&r.v) r.v.forEach(f=>f.geometry&&L.geoJSON(f.geometry,{style:{color:r.c.draw,weight:2,dashArray:"5 4",fillOpacity:.15},interactive:false}).addTo(selLayer))});
  render({...base,checks});
  const envP=settle(loadEnv(ll,parcel)), infP=FEATURES.infra?settle(loadInfra(parcel,ll)):Promise.resolve(null), sunP=FEATURES.sun?settle(loadSun(parcel,ll,env2)):Promise.resolve(null);
  const [infra,sun]=await Promise.all([infP,sunP]);
  if(id!==clickId) return;
  window.__infra=infra&&infra.v||null;
  render({...base,checks,infra,sun});
  const env=await envP;
  if(id!==clickId) return;
  render({...base,checks,infra,sun,env});
}

// --- probni tlocrt: pravokutnik koji se pomiče i okreće unutar prostora za kuću
const TL={w:12,d:9,rot:0,center:null,layer:null,marker:null};
function tRect(){
  const c=TL.center; if(!c) return null;
  const lat=c[1]*Math.PI/180, dx=TL.w/2/(111320*Math.cos(lat)), dy=TL.d/2/110540;
  const r=turf.polygon([[[c[0]-dx,c[1]-dy],[c[0]+dx,c[1]-dy],[c[0]+dx,c[1]+dy],[c[0]-dx,c[1]+dy],[c[0]-dx,c[1]-dy]]]);
  return TL.rot?turf.transformRotate(r,TL.rot,{pivot:c}):r;
}
function withinEnv(rect,env){
  if(!env) return false;
  const polys=env.type==="MultiPolygon"?env.coordinates.map(c=>turf.polygon(c)):[turf.polygon(env.coordinates)];
  return polys.some(pg=>turf.booleanWithin(rect,pg));
}
function tDraw(){
  const env=window.__env&&window.__env.geom; if(!env) return;
  if(!TL.center){const c=turf.centroid({type:"Feature",geometry:env,properties:{}}).geometry.coordinates; TL.center=c;}
  const rect=tRect(); if(!rect) return;
  const fits=withinEnv(rect,env);
  const grid=document.getElementById("tGrid"), tl=grid?+grid.dataset.tl||null:null, pa=grid?+grid.dataset.area||0:0;
  const a=TL.w*TL.d, overTl=tl!=null&&a>tl;
  const col=fits&&!overTl?"#1565c0":"#b3261e";
  if(TL.layer) selLayer.removeLayer(TL.layer);
  TL.layer=L.geoJSON(rect,{style:{color:col,weight:2,fillColor:col,fillOpacity:.35},interactive:false}).addTo(selLayer);
  if(!TL.marker){
    TL.marker=L.marker([TL.center[1],TL.center[0]],{draggable:true,icon:L.divIcon({className:"t-handle",iconSize:[22,22]})}).addTo(selLayer);
    TL.marker.on("drag",e=>{const p=e.target.getLatLng(); TL.center=[p.lng,p.lat]; tDraw();});
  }
  const o=document.getElementById("tOut"), s=document.getElementById("tSum");
  const msg=!fits?"ne stane unutar udaljenosti od međa":overTl?`tlocrt ${fmt(a)} m² veći je od dopuštenih ${fmt(tl)} m²`:"stane";
  if(o) o.innerHTML=`<div class="row"><span>Tlocrt kuće</span><span>${fmt(a)} m²</span></div><div class="row"><span>Provjera</span><span class="${fits&&!overTl?"good":"bad"}">${msg}</span></div>${pa?`<div class="row"><span>Ostaje za dvorište i vrt</span><span>${fmt(Math.max(0,pa-a))} m²</span></div>`:""}`;
  if(s){s.textContent=`${String(TL.w).replace(".",",")} × ${String(TL.d).replace(".",",")} m: ${fits&&!overTl?"stane":"ne stane"}`; s.className=fits&&!overTl?"":"bad";}
}
function tReset(){ if(TL.layer) selLayer.removeLayer(TL.layer); if(TL.marker) selLayer.removeLayer(TL.marker); TL.layer=null; TL.marker=null; TL.center=null; }

// --- postojeće zgrade na čestici (Topografska osnova Grada Zagreba 2018., tlocrti)
const OBJEKTI=BASE+"Objekti/FeatureServer/1/query";
async function loadZgrade(parcel){
  const f=await polyQuery(OBJEKTI,parcel.geometry,"OBJECTID,Area",true);
  let a=0; const geoms=[];
  for(const x of f){ try{const i=turf.intersect({type:"Feature",geometry:parcel.geometry,properties:{}},x); if(i){const ar=turf.area(i); if(ar>4){a+=ar; geoms.push(i.geometry)}}}catch(e){} }
  return {area:a,n:geoms.length,geoms};
}

// --- koridori: dohvat linija u krugu i provjera stvarne udaljenosti
async function corridorQuery(c,parcel,ll){
  const geom=parcel?parcel.geometry:{type:"Point",coordinates:[ll.lng,ll.lat]};
  const p=new URLSearchParams({geometry:geom.type==="Point"?ll.lng+","+ll.lat:JSON.stringify({rings:geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat(),spatialReference:{wkid:4326}}),
    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(c.search),units:"esriSRUnit_Meter",
    outFields:c.fields,returnGeometry:"true",outSR:"4326",f:"geojson"});
  const g=await getJSON(c.url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  return (g.features||[]).filter(f=>{
    if(!f.geometry) return false;
    const d=corrDist(f.properties||{},c.corridor);
    try{const b=turf.buffer(f.geometry,d/1000,{units:"kilometers"}); return turf.booleanIntersects(b,geom)}catch(e){return true}
  });
}
// --- gradivi dio: čestica umanjena za udaljenost od međe, samo u zonama koje dopuštaju gradnju
function buildEnvelope(parcel,rows,up){
  if(!parcel) return null;
  let d=3;
  try{
    const {rule}=ruleLookup(up,rows);
    const z=rule&&rows[0]?pickZone(rule,rows[0].p.Analitika):null;
    const m=z&&(z.key.meda||"").match(/(\d+,\d+|\d+)\s*m\b/); if(m) d=parseFloat(m[1].replace(",","."));
  }catch(e){}
  try{
    let env=turf.buffer(parcel.geometry,-d/1000,{units:"kilometers"});
    if(!env||!env.geometry) return {geom:null,area:0,d};
    const bz=rows.filter(r=>BUILDABLE.has(r.p.Analitika)&&r.geom);
    if(bz.length&&bz.length<rows.length){
      let u=null;
      for(const r of bz){const i=turf.intersect(env,{type:"Feature",geometry:r.geom,properties:{}}); if(i) u=u?turf.union(u,i):i;}
      env=u;
    } else if(!bz.length) env=null;
    return {geom:env?env.geometry:null,area:env?turf.area(env):0,d};
  }catch(e){return null}
}
// --- nagib terena (Copernicus DEM preko Open-Meteo; rezolucija oko 90 m, orijentacijski)
async function loadSlope(parcel,ll){
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const pt=turf.point(c), D=0.04; // 40 m na svaku stranu
  const pts=[0,90,180,270].map(b=>turf.destination(pt,D,b,{units:"kilometers"}).geometry.coordinates);
  pts.unshift(c);
  const q=new URLSearchParams({latitude:pts.map(p=>p[1].toFixed(6)).join(","),longitude:pts.map(p=>p[0].toFixed(6)).join(",")});
  const j=await getJSON("https://api.open-meteo.com/v1/elevation?"+q.toString(),{},10000);
  const e=j.elevation; if(!e||e.length<5) throw new Error("nema podataka o visini");
  const dz_ns=(e[1]-e[3]), dz_ew=(e[2]-e[4]);
  const slope=Math.sqrt(dz_ns*dz_ns+dz_ew*dz_ew)/(2*D*1000)*100;
  const dirs=["sjever","istok","jug","zapad"], low=[e[1],e[2],e[3],e[4]].indexOf(Math.min(e[1],e[2],e[3],e[4]));
  return {h:Math.round(e[0]),slope,down:dirs[low]};
}

// --- upit "u krugu od N metara" (za mreže i susjedne zgrade)
async function distQuery(url,parcel,ll,dist,fields="*",max=300){
  const geom=parcel?parcel.geometry:{type:"Point",coordinates:[ll.lng,ll.lat]};
  const p=new URLSearchParams({geometry:geom.type==="Point"?ll.lng+","+ll.lat:JSON.stringify({rings:geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat(),spatialReference:{wkid:4326}}),
    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(dist),units:"esriSRUnit_Meter",
    outFields:fields,returnGeometry:"true",outSR:"4326",resultRecordCount:String(max),f:"geojson"});
  const g=await getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  if(g.error) throw new Error(g.error.message||"greška servisa");
  return g.features||[];
}
// najmanja udaljenost (m) objekta mreže od čestice ili točke
function lineParts(geom){
  const out=[];
  try{
    const f=geom.type==="Polygon"||geom.type==="MultiPolygon"?turf.polygonToLine({type:"Feature",geometry:geom,properties:{}}):{type:"Feature",geometry:geom,properties:{}};
    turf.flattenEach(f,x=>{if(x.geometry&&x.geometry.type==="LineString") out.push(x)});
  }catch(e){}
  return out;
}
function coordsOf(geom){const a=[];try{turf.coordEach({type:"Feature",geometry:geom,properties:{}},c=>a.push(c))}catch(e){}return a}
function minDistM(fgeom,parcel,ll){
  if(!fgeom) return null;
  if(!parcel){const p=turf.point([ll.lng,ll.lat]);
    if(/Line/.test(fgeom.type)){let m=Infinity;for(const l of lineParts(fgeom)) m=Math.min(m,turf.pointToLineDistance(p,l,{units:"kilometers"})*1000);return m}
    return Math.min(...coordsOf(fgeom).map(c=>turf.distance(p,turf.point(c),{units:"kilometers"})*1000));}
  const pf={type:"Feature",geometry:parcel.geometry,properties:{}};
  try{if(turf.booleanIntersects({type:"Feature",geometry:fgeom,properties:{}},pf)) return 0}catch(e){}
  const bnd=lineParts(parcel.geometry); let m=Infinity;
  for(const c of coordsOf(fgeom)) for(const b of bnd) m=Math.min(m,turf.pointToLineDistance(turf.point(c),b,{units:"kilometers"})*1000);
  if(/Line/.test(fgeom.type)){const fl=lineParts(fgeom); for(const c of coordsOf(parcel.geometry)) for(const l of fl) m=Math.min(m,turf.pointToLineDistance(turf.point(c),l,{units:"kilometers"})*1000);}
  return m;
}

// --- komunalna infrastruktura (otvoreni podaci Grada Zagreba: javna kanalizacija, javni vodovod; plinovodi iz GUP-a)
const NET=[
  {id:"kan",label:"Kanalizacija",svc:"Javna_kanalizacija",re:/.*/},
  {id:"vod",label:"Vodovod",svc:"Javni_vodovod",re:/.*/},
  {id:"plinm",label:"Plinska mreža",svc:"GUP_Infrastruktura",re:/plin/i}
];
const NET_R=150, LAYERS_CACHE={};
function svcLayers(svc){
  if(!LAYERS_CACHE[svc]) LAYERS_CACHE[svc]=getJSON(BASE+svc+"/FeatureServer?f=json").then(j=>{if(j.error) throw new Error(j.error.message||"nema servisa"); return (j.layers||[]).filter(l=>!l.subLayerIds||!l.subLayerIds.length)}).catch(e=>{delete LAYERS_CACHE[svc]; throw e});
  return LAYERS_CACHE[svc];
}
async function loadNet(n,parcel,ll){
  const layers=(await svcLayers(n.svc)).filter(l=>n.re.test(l.name||"")&&!/Polygon/i.test(l.geometryType||""));
  if(!layers.length) throw new Error("sloj nije pronađen");
  const res=await Promise.all(layers.map(l=>settle(distQuery(BASE+n.svc+"/FeatureServer/"+l.id+"/query",parcel,ll,NET_R,"*",200)).then(r=>({l,...r}))));
  if(res.every(r=>r.e)) throw new Error(res[0].e);
  let best=null;
  for(const r of res){ if(!r.v) continue;
    for(const f of r.v){const d=minDistM(f.geometry,parcel,ll); if(d!=null&&isFinite(d)&&(!best||d<best.d)) best={d,layer:r.l.name,planned:/planiran|budu/i.test(r.l.name)}; } }
  return best||{none:true};
}
async function loadInfra(parcel,ll){
  const out={};
  await Promise.all(NET.map(n=>settle(loadNet(n,parcel,ll)).then(r=>{out[n.id]=r})));
  return out;
}

// --- sunce: sjena susjednih zgrada na prostoru za kuću (21. 12. i 21. 3.) i procjena sunčane elektrane
const LAT_ZG=45.81;
function sunPos(decl,hour,lat=LAT_ZG){
  const r=Math.PI/180, H=15*(hour-12)*r, d=decl*r, f=lat*r;
  const sa=Math.sin(f)*Math.sin(d)+Math.cos(f)*Math.cos(d)*Math.cos(H), a=Math.asin(sa);
  let cA=(Math.sin(d)-sa*Math.sin(f))/(Math.cos(a)*Math.cos(f)); cA=Math.max(-1,Math.min(1,cA));
  let A=Math.acos(cA)/r; if(H>0) A=360-A;
  return {alt:a/r,az:A};
}
const H_DEFAULT=7; // m, kuća P+1 kad visina nije poznata
function bHeight(p){
  for(const k of Object.keys(p||{})){ if(/visin|height|^h_|_h$|hgt/i.test(k)){const v=parseFloat(p[k]); if(v>2&&v<150) return {h:v,known:true}} }
  for(const k of Object.keys(p||{})){ if(/etaz|katnost|floors|levels/i.test(k)){const v=parseFloat(p[k]); if(v>0&&v<40) return {h:v*3+1,known:true}} }
  return {h:H_DEFAULT,known:false};
}
function shadowOf(f,sp,h){
  if(sp.alt<=1) return null;
  const L=Math.min(h/Math.tan(sp.alt*Math.PI/180),200);
  try{
    const moved=turf.transformTranslate(f,L/1000,(sp.az+180)%360,{units:"kilometers"});
    const pts=coordsOf(f.geometry).concat(coordsOf(moved.geometry)).map(c=>turf.point(c));
    return turf.convex(turf.featureCollection(pts));
  }catch(e){return null}
}
async function loadSun(parcel,ll,env){
  if(!parcel) throw new Error("nema čestice");
  const target={type:"Feature",geometry:env&&env.geom?env.geom:parcel.geometry,properties:{}};
  const tA=turf.area(target); if(!(tA>0)) throw new Error("nema prostora za kuću");
  const feats=await distQuery(OBJEKTI,parcel,ll,60,"*",300);
  const pf={type:"Feature",geometry:parcel.geometry,properties:{}};
  const bld=[]; let known=0;
  for(const f of feats){ if(!f.geometry) continue;
    let own=0; try{const i=turf.intersect(pf,f); own=i?turf.area(i)/turf.area(f):0}catch(e){}
    if(own>0.5) continue; // zgrada na samoj čestici (može se srušiti ili je tvoja)
    const hh=bHeight(f.properties); if(hh.known) known++; bld.push({f,h:hh.h});
  }
  const cases=[["21. 12.",-23.44,10],["21. 12.",-23.44,12],["21. 12.",-23.44,14],["21. 3.",0,12]];
  const res=cases.map(([day,decl,hour])=>{
    const sp=sunPos(decl,hour); let u=null;
    for(const b of bld){const s=shadowOf(b.f,sp,b.h); if(!s) continue; try{const i=turf.intersect(target,s); if(i) u=u?turf.union(u,i):i}catch(e){}}
    return {day,hour,alt:sp.alt,share:u?Math.min(1,turf.area(u)/tA):0};
  });
  return {res,n:bld.length,known,target:env&&env.geom?"prostora za kuću":"čestice"};
}
const PV_YIELD=1150; // kWh/kWp godišnje, Zagreb, jug, nagib ~30°

// --- pristup i okolina iz OpenStreetMapa (Overpass)
const ROAD_OK=/^(primary|secondary|tertiary|unclassified|residential|living_street|service|trunk|primary_link|secondary_link|tertiary_link)$/;
async function loadEnv(ll,parcel){
  let ring;
  if(parcel){
    const g=parcel.geometry, r=(g.type==="Polygon"?g.coordinates[0]:g.coordinates[0][0]);
    const step=Math.max(1,Math.ceil(r.length/20));
    ring=r.filter((_,i)=>i%step===0).concat([r[0]]).map(c=>c[1].toFixed(6)+","+c[0].toFixed(6)).join(",");
  }else ring=ll.lat.toFixed(6)+","+ll.lng.toFixed(6);
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const P=c[1].toFixed(6)+","+c[0].toFixed(6);
  const q=`[out:json][timeout:15];
way(around:12,${ring})[highway]->.r; .r out tags;
(node(around:600,${P})[highway=bus_stop];node(around:600,${P})[railway=tram_stop];node(around:900,${P})[railway=station];
 node(around:1200,${P})[amenity=kindergarten];way(around:1200,${P})[amenity=kindergarten];
 node(around:1500,${P})[amenity=school];way(around:1500,${P})[amenity=school];
 node(around:1000,${P})[shop=supermarket];way(around:1000,${P})[shop=supermarket];
 node(around:1500,${P})[amenity=pharmacy];)->.e; .e out tags center;`;
  // više Overpass servera: prvi koji odgovori pobjeđuje
  const body="data="+encodeURIComponent(q);
  const ask=u=>getJSON(u+"?"+body,{},20000);
  const j=await Promise.any(["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"].map(ask))
    .catch(()=>{throw new Error("serveri za podatke o okolini trenutno ne odgovaraju, pokušaj ponovno za minutu")});
  const here=turf.point(c);
  const dist=e=>{const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon; return lat==null?null:Math.round(turf.distance(here,turf.point([lon,lat]),{units:"kilometers"})*1000)};
  const roads=[], seen=new Set();
  const out={roads, stops:[], kinder:null, school:null, shop:null, pharmacy:null};
  const nearest=(key,e)=>{const d=dist(e); if(d==null) return; if(!out[key]||d<out[key].d) out[key]={n:e.tags.name||"bez naziva",d}};
  for(const e of j.elements||[]){
    const t=e.tags||{};
    if(e.type==="way"&&t.highway){const k=(t.name||t.highway)+"|"+t.highway; if(!seen.has(k)){seen.add(k);roads.push({name:t.name,hw:t.highway,ok:ROAD_OK.test(t.highway),surface:t.surface,width:t.width})}}
    else if(t.highway==="bus_stop"||t.railway==="tram_stop"||t.railway==="station"){const d=dist(e); if(d!=null) out.stops.push({n:t.name||"stanica",d,type:t.railway==="tram_stop"?"tramvaj":t.railway==="station"?"vlak":"autobus"})}
    else if(t.amenity==="kindergarten") nearest("kinder",e);
    else if(t.amenity==="school") nearest("school",e);
    else if(t.shop==="supermarket") nearest("shop",e);
    else if(t.amenity==="pharmacy") nearest("pharmacy",e);
  }
  // najbliža stanica po vrsti
  const byType={}; for(const s of out.stops) if(!byType[s.type]||s.d<byType[s.type].d) byType[s.type]=s;
  out.stops=Object.values(byType).sort((a,b)=>a.d-b.d);
  return out;
}

  return h;

// --- izvlačenje brojeva iz teksta pravila, po tipu građevine (slob = slobodnostojeća, polu = poluugrađena, ugr = ugrađena)
const toNum=s=>parseFloat(String(s).replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
const TIPOVI=[["slob","slobodnostojeća"],["polu","poluugrađena (dvojna)"],["ugr","ugrađena (u nizu)"]];
function stemsIn(s){
  const r=[]; if(/slobodnostoje|samostoje/iu.test(s)) r.push("slob"); if(/poluugrađ|dvojn/iu.test(s)) r.push("polu");
  if(/skupn/iu.test(s)) r.push("ugr");
  if(/ugrađ/iu.test(s.replace(/poluugrađ\p{L}*/giu,""))) r.push("ugr"); return r;
}
// tekst se dijeli na dijelove (zarez koji nije decimalni, točka-zarez, "a", "te"); broj pripada tipu iz istog ili prethodnog dijela
function byType(text,unit){
  const res={};
  for(const clause of String(text||"").split(";")){ // tip se prenosi samo unutar iste rečenice
    let last=null;
    for(const s of clause.split(/,(?!\d)|\sa\s|\ste\s|\si\s(?=\d)/u)){
      const n=s.match(unit), st=stemsIn(s);
      if(n){ const tgt=st.length?st:(last||["gen"]); for(const x of tgt) if(res[x]==null) res[x]=n[1]; if(st.length) last=st; }
      else if(st.length) last=st;
    }
  }
  return res;
}
function pickT(text,unit,tip){
  const r=byType(text,unit); if(r[tip]!=null) return r[tip];
  const typed=["slob","polu","ugr"].some(x=>r[x]!=null);
  if(!typed&&r.gen!=null) return r.gen;
  if(!typed){const m=String(text||"").match(unit); return m?m[1]:null}
  return null;
}
function parseParams(key,tip="slob"){
  const out={}, M2=/(\d[\d.]*)\s*m[²2](?![\d])/u, PCT=/(\d+)\s*%/u, DEC=/(\d+,\d+)/u;
  let v=pickT(key.cestica,M2,tip); if(v!=null) out.minC=toNum(v);
  v=pickT(key.izgradenost,PCT,tip); if(v!=null) out.izg=toNum(v)/100;
  v=pickT(key.kis,DEC,tip); if(v!=null) out.kis=toNum(v);
  const gtxt=((key.gbp||"")+"; "+(key.kis||"")).replace(/^.*?(?=GBP)/s,"");
  v=pickT(gtxt.replace(/kisn?[^;]*?\d+,\d+/gu,""),M2,tip); if(v!=null&&/GBP/.test(gtxt)) out.gbp=toNum(v);
  v=pickT(key.teren,PCT,tip); if(v!=null) out.teren=toNum(v)/100;
  return out;
}
let TIP=(()=>{try{return localStorage.getItem("tip")||"slob"}catch(e){return "slob"}})();
// pravilo za lokaciju: Zagreb ili Sesvete; više pravila u istom članku nađe se po oznaci u tekstu
function ruleLookup(up,rows){
  const p=up&&up.v&&up.v[0]?up.v[0].properties:null;
  if(!p){ // izvan oba GUP-a: Prostorni plan Grada Zagreba za građevinska područja naselja
    const r0=rows&&rows[0]; const plan=r0?String(r0.p.Naziv_plana||""):"";
    if(r0&&BUILDABLE.has(r0.p.Analitika)&&!/generalni urbanisti/i.test(plan)) return {code:"PPGZ",rule:RULES_PP.PPGZ,se:false,pp:true};
    return {code:null,rule:null,se:false};
  }
  const code=String(p.BROJ_UP||"").trim(), se=p.SRC==="SE", set=se?RULES_SE:RULES;
  const c=code.endsWith(".")?code:code+".";
  const rule=set[c]||set[code]||Object.values(set).find(r=>r.tekst.some(x=>x.includes("("+c+")")))||null;
  return {code:c,rule,se};
}
// stavka pravila koja dopušta gradnju na česticama manjim od propisane (npr. GUP čl. 69, pravilo 2.2: "...na građevnim česticama manjim od 600 m², uz uvjet...")
function smallParcelRule(zone){
  if(!zone||!zone.items) return null;
  return zone.items.find(i=>/čestic\w*\s+manj\w*\s+od\s+(\d|propisan)/i.test(i)&&/rekonstrukc|interpolac|zamjensk/i.test(i))||null;
}
function pickZone(rule,analitika){
  if(!rule||!rule.zone||!rule.zone.length) return null;
  const keys=ZONE_KEYS[analitika]||[];
  return rule.zone.find(z=>keys.some(k=>z.zona.toLowerCase().includes(k)))||(keys.length?null:null);
}

    h+=`<div class="kd"><label class="ib" for="zkFile" style="cursor:pointer">2. Učitaj PDF izvatka</label><input id="zkFile" type="file" accept="application/pdf,.pdf" hidden></div>`;
    h+=`<div id="zkOut">${ZK.res&&ZK.res.key===favKey(parcel,ll)?ZK.res.html:""}</div>`;
    h+=`<details><summary>Kako čitati izvadak</summary><p><b>A list (posjedovnica)</b>: čestice u uložku, njihov opis i površina.</p><p><b>B list (vlastovnica)</b>: vlasnici i njihovi udjeli (npr. 1/2). Kupoprodajni ugovor moraju potpisati svi suvlasnici.</p><p><b>C list (teretovnica)</b>: hipoteke, služnosti, pravo građenja, zabrane otuđenja i druga prava trećih. Prazan C list znači da nema upisanih tereta.</p><p><b>Plomba</b> znači da je u tijeku neki upis (npr. prodaja ili hipoteka). Dok se ne riješi, izvadak nije konačan.</p></details>`;

  }else{

  // Urbano pravilo

      const mm=(zone.key.meda||"").match(/(\d+,\d+|\d+)\s*m\b/); if(mm) chips.push(`od međe ${mm[1]} m`);

          const H0=Math.min(150,Math.round(gbpMax));

          h+=`<p class="meta" id="kdVolNote">Obujam = (površina kuće + podrum) × 3 m visine etaže, iz "Procjene cijene gradnje". Službeno se obračunava bruto obujam iz projekta; ako ga znaš, upiši ga.</p>`;
          const zSel=kdZone();
          h+=`<div class="kd"><label for="kdZone">Zona</label><select id="kdZone" style="font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)"><option value="">izaberi zonu</option>${KD_ZONES.map(z=>`<option value="${z[0]}"${z[0]===zSel?" selected":""}>${z[0]}. zona · ${z[1].toFixed(2).replace(".",",")} €/m³</option>`).join("")}</select></div>`;
          h+=`<div class="kd"><label for="kdRate">Iznos</label><input id="kdRate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="€/m³" value="${esc(kdRate())}"><span>€/m³</span></div>`;
          h+=`<div class="kd"><span>Ukupno:</span><output id="kdOut"></output></div>`;
          h+=`<p class="meta">Iznosi po zonama su iz Odluke o izmjenama i dopuni Odluke o komunalnom doprinosu (Gradska skupština, 13. 12. 2023.). Zonu provjeri na <a href="https://geoportal.zagreb.hr/Karta" target="_blank" rel="noopener" style="color:var(--accent)">Geoportalu Zagreba</a> (sloj "Zone komunalnog doprinosa").</p></div></details>`;
          // 3) Priključci i dozvole
          h+=`<details class="acc" data-k="costs"><summary><span>Priključci i dozvole</span><b id="costSum"></b></summary><div class="acc-body">`;
          h+=`<div class="kd"><label for="kdKw">Priključna snaga struje</label><select id="kdKw" style="font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)">${[[7.36,"7,36 kW (jednofazno 32 A)"],[11.04,"11,04 kW (trofazno 16 A)"],[17.25,"17,25 kW (trofazno 25 A)"],[22.08,"22,08 kW (trofazno 32 A)"]].map(o=>`<option value="${o[0]}"${o[0]===11.04?" selected":""}>${o[1]}</option>`).join("")}</select></div>`;
          h+=`<div class="kd"><label><input type="checkbox" id="kdGas"> s plinskim priključkom</label></div>`;
          h+=`<div id="costs"></div></div></details>`;}
      }
      h+=`<details><summary>Sva detaljna pravila za ovu zonu (${zone.items.length})</summary><ol>${zone.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></details>`;
      const others=rule.zone.filter(z=>z!==zone);
      if(others.length) h+=`<details><summary>Ostale zone u pravilu ${esc(code)}</summary>${others.map(z=>`<p><b>${esc(z.zona)}</b></p><ol>${z.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`).join("")}</details>`;
    }else{
      if(main&&VERDICT[main.p.Analitika]&&VERDICT[main.p.Analitika][0]==="no") h+=`<p class="hint">Za ovu namjenu pravilo ne predviđa gradnju stambenih ili poslovnih građevina.</p>`;
      else if(rule.zone.length) h+=`<p class="hint">Nisam mogao automatski odrediti zonu. Pravilo ima ove zone:</p>${rule.zone.map(z=>`<details><summary>${esc(z.zona)}</summary><ol>${z.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></details>`).join("")}`;
    }
    if(rule.opca&&rule.opca.length) h+=`<details><summary>Opća pravila</summary><ol>${rule.opca.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></details>`;
    h+=`<details><summary>Cijeli članak ${esc(rule.clanak)}.</summary>${rule.tekst.map(p=>`<p>${esc(p)}</p>`).join("")}</details>`;
  }
  if(parcel) h+=moneyHtml(favKey(parcel,ll),area);
  if(checks&&parcel&&FEATURES.sun){ h+=sunHtml(sun,slope,window.__tl||null); }
  if(checks&&parcel&&FEATURES.seis){ h+=seisHtml(ll); }
  if(checks) h+=docsHtml(d);
  h+=`<div class="links"><a href="https://oss.uredjenazemlja.hr/public-services/search-cad-parcel" target="_blank" rel="noopener">Katastar (OSS)</a><a href="https://geoportal.zagreb.hr/Karta" target="_blank" rel="noopener">Geoportal Zagreb</a><a href="https://geoportal.dgu.hr/#/?lng=${ll.lng.toFixed(6)}&lat=${ll.lat.toFixed(6)}&zoom=9&layerconfig=17013&mode=2d" target="_blank" rel="noopener">Geoportal DGU</a><a href="https://www.zzpugz.hr/gup-grada-zagreba" target="_blank" rel="noopener">GUP (Zavod)</a><a href="https://www.google.com/maps?q=${ll.lat},${ll.lng}" target="_blank" rel="noopener">Google Maps</a></div>`;
  h+=`<p class="note">Izvori: katastarske čestice Grada Zagreba (2023.), GIS baza planirane namjene (2023.), karta urbanih pravila iz ponovne javne rasprave GUP-a (2024.) i tekst Odluke o GUP-u s izmjenama 2025. Granice pravila u konačnom planu mogu malo odstupati. Procjena je orijentacijska; pravno mjerodavna je lokacijska informacija Gradskog ureda.</p>`;
  restoreMap();
  sheet.innerHTML=h;
  sheet.querySelectorAll("details[data-k]").forEach(dd=>{if(OPEN.has(dd.dataset.k)) dd.open=true});
  sheet.scrollTop=keepScroll;
  try{finUpdate()}catch(err){console.error(err); const o=document.getElementById("bOut")||document.getElementById("buyOut"); if(o) o.innerHTML=`<p class="err">Izračun trenutno nije uspio (${esc(err.message)}). Ostatak aplikacije radi normalno.</p>`}
  dogUpdate();
  if(TL.layer) tDraw();
}

// --- procjena cijene gradnje (tržište, okolica Zagreba, 2026.)
// Izvori: trebam.hr (2026: Zagreb okolica, ključ u ruke prizemnica 1.400, katnica 1.300, montažna 1.600 €/m²; roh-bau 500–700 €/m²);
// montazneidrvenekuce.info, Q1 2026 (montažne: ključ u ruke prosjek 1.600, visoki roh-bau 1.100 €/m², bez temeljne ploče 55–120 €/m²);
// reporter.hr 2026 (ključ u ruke 1.500–1.700, viši standard > 2.000 €/m²).
const BUILD={
  klas:{kljuc:1400, roh:600, temelj:0},
  mont:{kljuc:1600, roh:1100, temelj:90}
};
const STD={osn:0.85, sred:1.0, vis:1.3};
const FLOORS={P:{f:1.00,n:1,label:"prizemnica"},PPk:{f:0.96,n:1.6,label:"P + potkrovlje"},P1:{f:0.93,n:2,label:"P + 1"},P1Pk:{f:0.91,n:2.6,label:"P + 1 + Pk"}};
const PODRUM_EUR={kljuc:850, roh:550}; // procjena po m² podruma
sheet.addEventListener("change",e=>{ if(e.target.id==="tipSel"){TIP=e.target.value;try{localStorage.setItem("tip",TIP)}catch(err){} OPEN.add("calc"); if(window.__lastData) render(window.__lastData);} });

// ================= JEDINSTVENI FINANCIJSKI MODEL =================
// Svi kalkulatori (komunalni doprinos, priključci, gradnja, kupnja, ukupna investicija) čitaju ulaze iz istih polja
// i računaju se jednom funkcijom finCompute(). Nijedna stavka se ne zbraja dvaput.
// Vrste iznosa: "propis" = izračun prema propisu/odluci, "procjena" = tržišna procjena s rasponom, "unos" = korisnikov iznos.

// Izvori naknada:
// HERA, Odluka o iznosu jedinične naknade za priključenje (NN 45/2026, od 1. 5. 2026.): 193 €/kW bez PDV-a;
// Uredba o Tarifi upravnih pristojbi (NN 156/2022), Tar. br. 20: građevinska dozvola za zgradu do 600 m² 106,18 €, e-zahtjev −15 %;
// Zakon o izmjenama i dopuni Zakona o financiranju vodnoga gospodarstva (NN 36/2024): vodni doprinos ukinut od 1. 7. 2024.
const HEP_EUR_KW=193.00, PDV=1.25, PRIST_GD=106.18, PRIST_GD_MIN_BIG=132.72;
const GAS_RANGE=[800,1500];
const ETAZA_M=3; // m, visina etaže za procjenu bruto obujma
// Kupnja (porezna-uprava.gov.hr "Stjecatelj nekretnine"; gov.hr "Upis prava vlasništva"):
// porez na promet nekretnina 3 % tržišne vrijednosti, plaća stjecatelj; PDV 25 % umjesto poreza na promet kad je prodavatelj
// u sustavu PDV-a i prodaje građevinsko zemljište (zemljište s pravomoćnom dozvolom za građenje); sudske pristojbe za
// uknjižbu: prijedlog 6,50 € (elektronički −50 %), rješenje 26,54 €.
const PPN=0.03, PDV_RATE=0.25, ZK_PRIJEDLOG=6.50, ZK_RJESENJE=26.54;
const REGIMES={
  ppn:{label:"Porez na promet nekretnina 3 % (prodavatelj građanin ili nije u sustavu PDV-a)"},
  pdv:{label:"PDV 25 % (prodavatelj u sustavu PDV-a, zemljište s pravomoćnom dozvolom za gradnju)"},
  osl:{label:"Oslobođeno poreza (npr. stjecanje od bračnog druga ili srodnika u ravnoj liniji)"}
};

const numv=id=>{const e=document.getElementById(id); if(!e) return null; const v=parseFloat(String(e.value).replace(",",".")); return isFinite(v)?v:null};
function kdRate(){try{return localStorage.getItem("kdRate")||""}catch(e){return ""}}
const KD_ZONES=[["I",18.35],["II",18.00],["III",16.00],["IV",12.00],["V",2.00],["VI",1.50]];
function kdZone(){try{return localStorage.getItem("kdZone")||""}catch(e){return ""}}

// ulazi kupnje po čestici
function buyStore(){try{return JSON.parse(localStorage.getItem("buy")||"{}")}catch(e){return {}}}
function buyGet(k){const o=buyStore()[k]||{}; if(o.price==null){const lp=landPrice(k); if(lp) o.price=parseFloat(lp)}; return o}
function buySet(k,o){try{const s=buyStore(); s[k]=o; localStorage.setItem("buy",JSON.stringify(s))}catch(e){}}

function finCompute(){
  const g=id=>document.getElementById(id);
  const F={items:[],warn:[]};
  const area=window.__cur&&window.__cur.area||null;
  // --- kuća
  const hasHouse=!!g("bArea");
  if(hasHouse){
    const pick=(id,obj,def)=>{const v=g(id)&&g(id).value; return obj[v]?v:def};
    const hA=numv("bArea")||0, t=pick("bType",BUILD,"klas"), std=pick("bStd",STD,"sred"), ph=pick("bPhase",BUILD.klas,"kljuc"), fl=FLOORS[pick("bFloors",FLOORS,"P")], base=!!(g("bBase")&&g("bBase").checked);
    const unit=BUILD[t][ph]*STD[std]*fl.f, foot=hA/fl.n;
    const gradnja=hA*unit + foot*BUILD[t].temelj + (base?foot*PODRUM_EUR[ph]*STD[std]:0);
    const autoVol=Math.round((hA+(base?foot:0))*ETAZA_M);
    const volEl=g("kdVol"); if(volEl&&volEl.dataset.manual!=="1") volEl.value=autoVol;
    const vol=numv("kdVol")||0, rate=numv("kdRate");
    const kd=rate>0&&rate<=40&&vol>0?vol*rate:null;
    const kW=parseFloat(g("kdKw")?.value||"11.04"), gas=!!g("kdGas")?.checked;
    const hep=HEP_EUR_KW*kW*PDV;
    const prist=hA>600?Math.max(PRIST_GD_MIN_BIG,gradnja*0.00025):PRIST_GD;
    const yard=numv("bYard");
    F.house={hA,foot,unit,gradnja,autoVol,vol,rate,kd,kW,gas,hep,prist,base,t,fl,yard,manualVol:volEl&&volEl.dataset.manual==="1"};
    const P=(k,label,base,lo,hi,kind,formula,group)=>F.items.push({k,label,base,lo,hi,kind,formula,group});
    P("gradnja","Gradnja",gradnja,gradnja*0.9,gradnja*1.1,"procjena",`${fmt(hA)} m² × ${fmt(unit)} €/m²${BUILD[t].temelj?" + temeljna ploča "+fmt(foot)+" m² × "+BUILD[t].temelj+" €":""}${base?" + podrum "+fmt(foot)+" m²":""}; raspon ±10 %`,"gradnja");
    P("projekti","Projekti i geodezija",gradnja*0.07,gradnja*0.9*0.07,gradnja*1.1*0.07,"procjena","7 % gradnje","gradnja");
    P("nadzor","Stručni nadzor",gradnja*0.015,gradnja*0.9*0.015,gradnja*1.1*0.015,"procjena","1,5 % gradnje","gradnja");
    if(yard!=null&&yard>0) P("okolis","Uređenje okoliša",yard,yard,yard,"unos","tvoj upis","gradnja");
    if(kd!=null) P("kd","Komunalni doprinos",kd,kd,kd,"propis",`${fmt(vol)} m³ × ${String(rate).replace(".",",")} €/m³`,"naknade");
    P("vodni","Vodni doprinos",0,0,0,"propis","ukinut od 1. 7. 2024.","naknade");
    P("hep","Priključak struje (HEP)",hep,hep,hep,"propis",`${String(kW).replace(".",",")} kW × ${HEP_EUR_KW} €/kW + 25 % PDV`,"naknade");
    P("vio","Priključak vode i kanalizacije (ViO)",0,0,0,"propis","za kućanstva plaća Grad","naknade");
    if(gas) P("plin","Priključak plina (GPZ)",(GAS_RANGE[0]+GAS_RANGE[1])/2,GAS_RANGE[0],GAS_RANGE[1],"procjena","procjena 800–1.500 €","naknade");
    P("prist","Pristojba za građevinsku dozvolu",prist,prist,prist,"propis",hA>600?"0,25 ‰ troškova gradnje, najmanje 132,72 €":"zgrada do 600 m² (e-zahtjev 15 % manje)","naknade");
    if(kd==null) F.warn.push("Komunalni doprinos nije uključen: izaberi zonu.");
    if(yard==null) F.warn.push("Uređenje okoliša nije uključeno: upiši iznos ako ga znaš.");
  }
  // --- kupnja
  const key=window.__cur&&window.__cur.key;
  const b=key?buyGet(key):{}; F.key=key;
  const price=b.price>0?b.price:null;
  if(price){
    const reg=b.regime||"ppn", rows=[];
    let tax=0, taxLabel="";
    if(reg==="ppn"){tax=price*PPN; taxLabel="Porez na promet nekretnina (3 % od cijene)";}
    else if(reg==="pdv"){ if(b.vatIncl){tax=0; taxLabel="PDV 25 % (uključen u cijenu)"} else {tax=price*PDV_RATE; taxLabel="PDV 25 % (nije uključen u cijenu)"} }
    else {tax=0; taxLabel="Oslobođeno poreza na promet";}
    rows.push({k:"porez",label:taxLabel,v:tax,kind:"propis"});
    const ag=b.agency>0?b.agency:0;
    if(ag) rows.push({k:"agencija",label:`Agencija (${String(ag).replace(".",",")} %${b.agencyVat!==false?" + 25 % PDV":""})`,v:price*ag/100*(b.agencyVat!==false?1.25:1),kind:"unos"});
    const zk=(b.efile!==false?ZK_PRIJEDLOG*0.5:ZK_PRIJEDLOG)+ZK_RJESENJE;
    rows.push({k:"zkpr",label:`Sudske pristojbe za uknjižbu (prijedlog ${b.efile!==false?"elektronički 3,25":"6,50"} € + rješenje 26,54 €)`,v:zk,kind:"propis"});
    for(const [k,l] of [["notary","Javni bilježnik"],["lawyer","Odvjetnik"],["geo","Geodet"],["other","Ostali troškovi"]]){
      if(b[k]>0) rows.push({k,label:l,v:b[k],kind:"unos"});
    }
    const missing=[["notary","javni bilježnik"],["lawyer","odvjetnik"],["geo","geodet"]].filter(([k])=>!(b[k]>0)).map(x=>x[1]);
    const costs=rows.reduce((s,r)=>s+r.v,0);
    const gross=reg==="pdv"&&!b.vatIncl?price*(1+PDV_RATE):price;
    const kap=b.kapara>0?Math.min(b.kapara,gross):0;
    // stjecanje = cijena + troškovi; PDV koji nije u cijeni nalazi se u stavci poreza, pa se ne zbraja dvaput
    const acq=price+costs;
    F.buy={price,reg,rows,costs,gross,acq,missing,kap,rest:gross-kap,area,perM2:area?price/area:null,effM2:area?acq/area:null};
  }
  // --- ukupno
  const sum=f=>F.items.reduce((s,i)=>s+f(i),0);
  F.house&&(F.build={base:sum(i=>i.base),lo:sum(i=>i.lo),hi:sum(i=>i.hi),naknade:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.base,0),
    naknadeLo:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.lo,0),naknadeHi:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.hi,0)});
  if(F.build){const g2=F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.base,0); F.build.rez=g2*0.15;}
  const acq=F.buy?F.buy.acq:0;
  F.total={base:(F.build?F.build.base:0)+acq,lo:(F.build?F.build.lo:0)+acq,hi:(F.build?F.build.hi:0)+acq,rez:F.build?F.build.rez:0,hasBuy:!!F.buy,hasBuild:!!F.build};
  return F;
}

const KIND={propis:"prema propisu",procjena:"procjena",unos:"tvoj unos"};
const frow=(a,b,opt={})=>`<div class="row${opt.cls?" "+opt.cls:""}"${opt.bold?' style="font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px"':""}><span>${a}${opt.f?`<small class="fx">${esc(opt.f)}</small>`:""}</span><span>${b}</span></div>`;
const kindTag=k=>`<em class="kind kind-${k}">${KIND[k]}</em>`;
const money=(i)=>i.lo!==i.hi?`${fmt(i.lo)}–${fmt(i.hi)} €`:`${fmt(i.base)} €`;

function finUpdate(){
  const F=finCompute(); window.__fin=F;
  const g=id=>document.getElementById(id);
  // komunalni doprinos
  if(g("kdOut")&&F.house){const H=F.house;
    g("kdOut").textContent=!(H.rate>0)?"izaberi zonu":!(H.vol>0)?"upiši obujam":H.rate>40?"iznos je nerealno velik: u Zagrebu je od 1,50 do 18,35 €/m³":fmt(H.kd)+" € (uz 10 % popusta za jednokratnu uplatu: "+fmt(H.kd*0.9)+" €)";
    if(g("kdSum")) g("kdSum").textContent=H.kd!=null?fmt(H.kd)+" €":"izaberi zonu";
    const ab=g("kdVolAuto"); if(ab) ab.style.display=H.manualVol?"":"none";
    const nt=g("kdVolNote"); if(nt) nt.textContent=H.manualVol?`Obujam si upisao ručno. Iz kuće bi bilo ${fmt(H.autoVol)} m³.`:`Obujam = (površina kuće ${fmt(H.hA)} m²${H.base?" + podrum "+fmt(H.foot)+" m²":""}) × ${ETAZA_M} m = ${fmt(H.autoVol)} m³, iz "Procjene cijene gradnje". Službeno se obračunava bruto obujam iz projekta; ako ga znaš, upiši ga.`;
  }
  // priključci i dozvole
  if(g("costs")&&F.house){
    const its=F.items.filter(i=>i.group==="naknade");
    let h=`<div class="calc" style="background:var(--panel);margin-top:8px">`+its.map(i=>frow(esc(i.label)+" "+kindTag(i.kind),money(i),{f:i.formula})).join("");
    if(F.house.kd==null) h+=frow("Komunalni doprinos","izaberi zonu");
    const s=F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`;
    h+=frow(`Ukupno naknade${F.house.kd==null?" (bez komunalnog)":""}`,s,{bold:true})+`</div>`;
    h+=`<p class="meta">Isti iznosi ulaze u procjenu gradnje i ukupnu investiciju. Nisu uključeni radovi koje plaćaš izvođačima: vodomjerno okno i kućne instalacije, elektro-ormarić te posebni uvjeti javnopravnih tijela.</p>`;
    g("costs").innerHTML=h; if(g("costSum")) g("costSum").textContent=s;
  }
  // gradnja
  if(g("bOut")&&F.house){
    const H=F.house, grid=document.querySelector(".bgrid[data-gbp]"), gbp=grid?+grid.dataset.gbp||0:0, tl=grid?+grid.dataset.tlocrt||0:0;
    let h="";
    if(gbp&&H.hA>gbp*1.001) h+=`<p class="flag">Površina je veća od najvećeg dopuštenog GBP-a na ovoj čestici (${fmt(gbp)} m²).</p>`;
    if(tl&&H.foot>tl*1.001) h+=`<p class="flag">Tlocrt (${fmt(H.foot)} m²) prelazi najveću izgrađenost (${fmt(tl)} m²). Probaj više etaža ili manju površinu.</p>`;
    h+=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
    for(const i of F.items.filter(i=>i.group==="gradnja")) h+=frow(esc(i.label)+" "+kindTag(i.kind),money(i),{f:i.formula});
    h+=frow("Naknade, priključci i pristojbe "+kindTag("propis"),F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`,{f:"iz odjeljaka Komunalni doprinos i Priključci i dozvole"});
    h+=frow("Ukupno gradnja s naknadama",`${fmt(F.build.lo)} – ${fmt(F.build.hi)} €`,{bold:true,f:"osnovni iznos "+fmt(F.build.base)+" €"});
    h+=frow("Preporučena rezerva",`+ ${fmt(F.build.rez)} €`,{f:"15 % gradnje, projekata, nadzora i okoliša; nije uključena u ukupno"});
    h+=`</div>`;
    if(F.warn.length) h+=`<p class="meta">${F.warn.map(esc).join(" ")}</p>`;
    h+=`<p class="meta">Tržišne cijene za okolicu Zagreba, 2026. (izvori: trebam.hr, montazneidrvenekuce.info Q1 2026, reporter.hr). ${H.t==="mont"?"Montažna cijena uključuje temeljnu ploču (procjena 90 €/m² tlocrta). ":""}Podrum je procjena. Zemljište i troškovi kupnje su u odjeljku "Novac i kupnja". Za stvarnu cijenu traži barem tri ponude.</p>`;
    g("bOut").innerHTML=h; if(g("bSum")) g("bSum").textContent=fmt(F.build.lo)+" – "+fmt(F.build.hi)+" €";
  }
  // kupnja
  if(g("buyOut")){
    let h="";

      if(B.reg==="pdv") h+=`<p class="meta">Kad se plaća PDV, ne plaća se porez na promet nekretnina. PDV se plaća samo ako je prodavatelj u sustavu PDV-a i zemljište ima pravomoćnu dozvolu za gradnju; sama građevinska zona nije dovoljna.</p>`;
    }

  }
  // ukupna investicija

    else h+=frow("Zemljište","nije upisano");
    if(F.build){h+=frow("Gradnja, projekti, nadzor"+(F.items.some(i=>i.k==="okolis")?", okoliš":""),`${fmt(F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.lo,0))}–${fmt(F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.hi,0))} €`);
      h+=frow("Naknade, priključci i pristojbe",F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`);}
    else h+=frow("Gradnja","nema podataka o dopuštenoj kući za ovu česticu");
    h+=frow("Ukupna investicija",T.lo!==T.hi?`${fmt(T.lo)} – ${fmt(T.hi)} €`:`${fmt(T.base)} €`,{bold:true,f:"osnovni iznos "+fmt(T.base)+" €"});
    if(T.rez) h+=frow("S preporučenom rezervom",`do ${fmt(T.hi+T.rez)} €`,{f:"gornja granica + rezerva 15 % ("+fmt(T.rez)+" €)"});
    h+=`</div><p class="meta">Svaka stavka se računa jednom: naknade iz "Priključci i dozvole", gradnja iz "Procjene cijene gradnje", zemljište iz "Kupnje zemljišta". Raspon dolazi samo od procjena (gradnja ±10 %, plin); iznosi prema propisu i tvoji unosi su točni brojevi.</p>`;
    g("totOut").innerHTML=h; if(g("totSum")) g("totSum").textContent=T.lo!==T.hi?`${fmt(T.lo)} – ${fmt(T.hi)} €`:(T.base?fmt(T.base)+" €":"upiši cijenu");
  }
  window.__budget=F.total.base?{lo:F.total.lo,hi:F.total.hi,base:F.total.base,land:F.buy?F.buy.price:null,kupnja:F.buy?F.buy.costs:null,acq:F.buy?F.buy.acq:null,build:F.build?{lo:F.build.lo,hi:F.build.hi}:null}:null;
  const fk=window.__cur&&window.__cur.key; if(fk){const a=favs(), f=a.find(x=>x.key===fk); if(f){f.budget=window.__budget; f.land=F.buy?F.buy.price:null; setFavs(a);}}
}

function buyRead(){

    notary:numv("yNotary"),lawyer:numv("yLawyer"),geo:numv("yGeo"),other:numv("yOther"),efile:g("yEfile").checked,kapara:numv("yKapara")};

sheet.addEventListener("input",e=>{
  const id=e.target.id||"";
  if(id==="yPrice"){const a=window.__cur&&window.__cur.area, m=document.getElementById("yM2"), v=numv("yPrice"); if(m&&a) m.value=v>0?Math.round(v/a):"";}
  if(id==="yM2"){const a=window.__cur&&window.__cur.area, p=document.getElementById("yPrice"), v=numv("yM2"); if(p&&a) p.value=v>0?Math.round(v*a):"";}
  if(/^y[A-Z]/.test(id)){buyRead(); finUpdate();}

});
sheet.addEventListener("change",e=>{

});
sheet.addEventListener("click",e=>{ if(e.target.id==="kdVolAuto"){const v=document.getElementById("kdVol"); v.dataset.manual=""; finUpdate();} });

function dogUpdate(){
  const o=document.getElementById("dogOut"); if(!o) return;
  const zf=+o.dataset.zf, tl=+o.dataset.tl||null, gbp=+o.dataset.gbp||null;
  const n=parseFloat(String(document.getElementById("eFloors").value).replace(",","."))||0;
  const eg=zf*n, r=[];
  r.push(["Postojeći GBP (procjena)",fmt(eg)+" m²"]);

  if(gbp!=null) r.push(["Preostali GBP (dogradnja i nadogradnja)",gbp-eg>0?fmt(gbp-eg)+" m²":`<span class="bad">nema (već ${fmt(eg-gbp)} m² iznad)</span>`]);
  o.innerHTML=r.map(([a,b])=>`<div class="row"><span>${a}</span><span>${b}</span></div>`).join("")+(gbp!=null&&eg>gbp?`<p class="meta">Postojeća kuća je veća od onoga što pravilo danas dopušta za novu gradnju. Kod rekonstrukcije se postojeći parametri smiju zadržati, ali ne povećavati.</p>`:"");

// područni odsjeci prema gradskoj četvrti (mpgi.gov.hr)
function prostornoOdsjek(c){
  c=(c||"").toLowerCase();
  if(/novi zagreb|peščenica|pescenica|brezovica/.test(c)) return "Drugi područni odsjek za prostorno uređenje, Avenija Dubrovnik 12 · 658 5614";
  if(/centar|donji grad|gornji grad|medveščak|črnomerec|maksimir|podsused|susedgrad|trešnjevka|podsljeme|stenjevec|trnje/.test(c)) return "Prvi područni odsjek za prostorno uređenje, Trg Francuske Republike 15 · 610 1763";
  return "Središnji odsjek za prostorno uređenje, Trg Stjepana Radića 1 · 610 1130";
}
function graditeljstvoOdsjek(c){
  c=(c||"").toLowerCase();
  if(/sesvete/.test(c)) return "Prvi područni odsjek za graditeljstvo, Trg Dragutina Domjanića 4 · 610 1608";
  if(/podsused|susedgrad|trešnjevka/.test(c)) return "Drugi područni odsjek za graditeljstvo, Sigetje 2 · 658 5935";
  if(/dubrava/.test(c)) return "Treći područni odsjek za graditeljstvo, Avenija Dubrava 49 · 658 5452";
  return "Središnji odsjek za graditeljstvo, Trg Stjepana Radića 1 · 610 1115";
}

async function pdfText(file){
  if(!window.pdfjsLib){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); // radi i bez zasebnog workera
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent(); const rows=new Map();
    for(const it of tc.items){const y=Math.round(it.transform[5]); const r=rows.get(y)||[]; r.push([it.transform[4],it.str]); rows.set(y,r);}
    [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,r])=>lines.push(r.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim()));
  }
  return lines.filter(Boolean).join("\n");
}
// analiza teksta izvatka (radi i za stari i za novi oblik)
function analyzeZK(text,ctx){
  const T=text.replace(/\u00a0/g," "), low=T.toLowerCase();
  const idx=(re)=>{const m=low.search(re); return m<0?null:m};
  const iA=idx(/posjedovnica|\ba\s*list\b/), iB=idx(/vlastovnica|\bb\s*list\b/), iC=idx(/teretovnica|\bc\s*list\b/);
  const B=iB!=null?T.slice(iB,iC!=null&&iC>iB?iC:undefined):"", C=iC!=null?T.slice(iC):"";
  const A=iA!=null?T.slice(iA,iB!=null&&iB>iA?iB:undefined):T;
  const out={flags:[],ok:[],info:[]};
  // suvlasnici
  const shares=(B.match(/\b\d{1,3}\s*\/\s*\d{1,4}\b/g)||[]).map(s=>s.replace(/\s/g,"")).filter(s=>{const [a,b]=s.split("/").map(Number);return a>0&&b>0&&a<=b});
  const nOwn=(B.match(/(su)?vlasni[čc]ki dio|vlasni[čc]ki udio|suvlasni[čc]ki/gi)||[]).length;
  if(shares.length>1||nOwn>1) out.flags.push(["warn",`Više suvlasnika (${Math.max(shares.length,nOwn)} upisa${shares.length?": "+[...new Set(shares)].slice(0,8).join(", "):""}). Ugovor moraju potpisati svi.`]);
  else if(iB!=null) out.ok.push("Jedan upisani vlasnik.");
  if(/etažn/i.test(T)) out.info.push("Upisano je etažno vlasništvo (posebni dijelovi zgrade).");
  // tereti
  const C_=C.toLowerCase();
  const terms=[[/hipotek|založn/,"no","Hipoteka (založno pravo)"],[/služnost/,"warn","Služnost (npr. prolaz, vod)"],[/pravo građenja/,"warn","Pravo građenja"],
    [/zabran\w* otuđenja|zabrana opterećenja/,"no","Zabrana otuđenja ili opterećenja"],[/ovrh/,"no","Ovrha"],[/spor|tužb/,"no","Zabilježba spora"],
    [/prvokup/,"warn","Pravo prvokupa"],[/plodouživ/,"warn","Plodouživanje"],[/zakup|najam/,"warn","Zakup ili najam"],[/stečaj/,"no","Stečaj"],[/fiducij/,"no","Fiducijarni prijenos (osiguranje kredita)"]];
  let any=false; for(const [re,sev,lab] of terms) if(re.test(C_)){out.flags.push([sev,lab+" upisana u C listu."]);any=true}
  if(iC!=null&&!any){ if(/nema upisa|bez tereta|nema tereta|\btereta nema\b/i.test(C)||C.replace(/teretovnica|c\s*list/ig,"").trim().length<40) out.ok.push("C list (tereti) je prazan."); else out.info.push("C list ima upisa koje nisam prepoznao; pročitaj ga."); }
  if(/plomb/i.test(T)) out.flags.push(["no","Plomba: u tijeku je neki upis. Pitaj koji, prije bilo kakve uplate."]);
  if(/neusklađ|nije usklađ|nesuglas/i.test(T)) out.flags.push(["warn","Napomena o neusklađenosti zemljišne knjige i katastra."]);
  // površina čestice iz A lista
  if(ctx.kc){
    const re=new RegExp(ctx.kc.replace("/","\\s*/\\s*")+"\\b[^\\n]*?(\\d{1,3}(?:[.\\s]\\d{3})*|\\d+)\\s*(?:m2|m²|čhv)?\\s*$","im");
    const lines=A.split("\n").filter(l=>l.includes(ctx.kc.split("/")[0]));
    let zkA=null; for(const l of lines){const m=l.match(/(\d{1,3}(?:\.\d{3})+|\d+)\s*(?:m2|m²)?\s*$/); if(m&&!l.trim().endsWith(ctx.kc)){zkA=parseInt(m[1].replace(/\./g,"")); break}}
    if(zkA&&ctx.area){ const d=Math.abs(zkA-ctx.area)/ctx.area;
      if(d>0.05) out.flags.push(["warn",`Površina u zemljišnoj knjizi (${fmt(zkA)} m²) razlikuje se od katastra (${fmt(ctx.area)} m²) za ${Math.round(d*100)} %. Provjeri s geodetom prije kupnje.`]);
      else out.ok.push(`Površina u zemljišnoj knjizi (${fmt(zkA)} m²) odgovara katastru.`); }
    if(!lines.length) out.flags.push(["warn",`Čestica ${ctx.kc} nije nađena u A listu. Je li izvadak za pravu česticu?`]);
  }
  if(iA==null&&iB==null&&iC==null) out.flags.push(["warn","Ne prepoznajem strukturu izvatka (A, B, C list). Je li to zemljišnoknjižni izvadak?"]);
  return out;
}
function zkHtml(r){
  return (r.flags.length?`<ul class="checks">${r.flags.map(([s,t])=>`<li class="chk chk-${s}"><span>${esc(t)}</span></li>`).join("")}</ul>`:"")
   +(r.ok.length?`<ul class="checks" style="margin-top:6px">${r.ok.map(t=>`<li class="chk chk-ok"><span>${esc(t)}</span></li>`).join("")}</ul>`:"")
   +(r.info.length?r.info.map(t=>`<p class="meta">${esc(t)}</p>`).join(""):"")
   +`<p class="meta">Automatska provjera traži ključne riječi; pravno mjerodavan je sam izvadak.</p>`;
}

  if(e.target.id!=="shareBtn"||!window.__lastLL) return;
  const url=shareUrl(), c=window.__cur, title="Čestica "+(c&&c.ces?c.ces+", k.o. "+c.ko:"Zagreb");
  try{ if(navigator.share){await navigator.share({title,url});return} }catch(err){ if(err&&err.name==="AbortError") return; }
  try{await navigator.clipboard.writeText(url); e.target.textContent="Link kopiran"}catch(err){ prompt?0:0; e.target.textContent="Kopiraj: "+url; }
  setTimeout(()=>{const b=document.getElementById("shareBtn"); if(b) b.textContent="Podijeli"},4000);
});
(function(){ // otvaranje dijeljenog linka
  const c=new URLSearchParams(location.search).get("c"); if(!c) return;
  const [la,lo]=c.split(",").map(Number); if(!isFinite(la)||!isFinite(lo)) return;
  const ll=L.latLng(la,lo); map.setView(ll,18); setTimeout(()=>inspect(ll),300);
})();

// --- pretraga po broju katastarske čestice (npr. "Šestine 4027/1" ili "kč 123 Sesvete")
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
function parcelQuery(q){
  const isParcel=/\d+\/\d+/.test(q)||/^\s*(k\.?\s*č\.?|kc|kč|čest|cest)/i.test(q)||/k\.\s*o\./i.test(q);
  if(!isParcel) return null;
  const m=q.match(/(\d+(?:\/\d+)?)/); if(!m) return null;
  const ko=q.replace(m[0]," ").replace(/k\.?\s*č\.?|\bkc\b|\bkč\b|čestica|cestica|k\.\s*o\.|\bko\b/gi," ").trim();
  return {kc:m[1],ko};
}
async function searchParcel(pq){
  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim česticu '+esc(pq.kc)+'…</p>';
  const p=new URLSearchParams({where:"KATASTARSKA_CESTICA='"+pq.kc.replace(/'/g,"")+"'",outFields:"KATASTARSKA_OPCINA,KATASTARSKA_CESTICA",returnGeometry:"true",outSR:"4326",f:"geojson",resultRecordCount:"200"});
  const g=await getJSON(SRC.cestice+"?"+p.toString());
  let f=g.features||[];
  if(pq.ko){const k=norm(pq.ko); const ff=f.filter(x=>norm(x.properties.KATASTARSKA_OPCINA).includes(k)); if(ff.length) f=ff; else if(f.length){sheet.innerHTML=`<p class="err">Čestica ${esc(pq.kc)} nije nađena u k.o. ${esc(pq.ko)}. Postoji u: ${esc([...new Set(f.map(x=>x.properties.KATASTARSKA_OPCINA))].join(", "))}.</p>`;return}}
  if(!f.length){sheet.innerHTML=`<p class="err">Čestica ${esc(pq.kc)} nije nađena u katastru Grada Zagreba (stanje 2023.). Provjeri broj ili upiši i katastarsku općinu.</p>`;return}
  if(f.length>1){
    window.__choices=f;
    sheet.innerHTML=`<p class="eyebrow">Čestica ${esc(pq.kc)} postoji u više katastarskih općina</p><div class="choices">${f.map((x,i)=>`<button type="button" class="ib" data-pick="${i}">k.o. ${esc(x.properties.KATASTARSKA_OPCINA)}</button>`).join("")}</div><p class="meta">Sljedeći put upiši i k.o., npr. "Šestine ${esc(pq.kc)}".</p>`;
    return;
  }
  goToFeature(f[0]);
}
function goToFeature(feat){
  const b=L.geoJSON(feat.geometry).getBounds(); map.fitBounds(b,{padding:[40,40],maxZoom:19});
  const c=turf.pointOnFeature(feat).geometry.coordinates; inspect(L.latLng(c[1],c[0]));
}
sheet.addEventListener("click",e=>{const i=e.target.dataset&&e.target.dataset.pick; if(i!=null&&window.__choices) goToFeature(window.__choices[+i]);});

// --- pretraga adrese (Nominatim, Zagreb)
async function search(){
  const q=document.getElementById("q").value.trim(); if(!q) return;
  const pq=parcelQuery(q);
  if(pq){try{await searchParcel(pq)}catch(e){sheet.innerHTML='<p class="err">Pretraga čestice nije uspjela: '+esc(e.message)+'</p>'} return;}
  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim adresu…</p>';
  try{
    const p=new URLSearchParams({q:q+", Zagreb",format:"json",limit:"1",countrycodes:"hr",viewbox:"15.75,46.0,16.25,45.6",bounded:"1"});
    const a=await getJSON("https://nominatim.openstreetmap.org/search?"+p.toString());
    if(!a[0]){sheet.innerHTML='<p class="err">Adresa nije pronađena. Probaj drukčije napisati ili dodirni kartu.</p>';return}
    const ll=L.latLng(+a[0].lat,+a[0].lon); map.setView(ll,18); inspect(ll);
  }catch(e){sheet.innerHTML='<p class="err">Pretraga nije uspjela: '+esc(e.message)+'</p>'}
}
document.getElementById("go").onclick=search;
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
document.getElementById("me").onclick=()=>{
  if(!navigator.geolocation){sheet.innerHTML='<p class="err">Lokacija nije dostupna u ovom pregledniku.</p>';return}
  navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,18);inspect(ll)},
    ()=>{sheet.innerHTML='<p class="err">Pristup lokaciji je odbijen.</p>'},{enableHighAccuracy:true,timeout:10000});
};
</script>
