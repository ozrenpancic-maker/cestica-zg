# Čestica HR: zahtjevi za napredni pristup, kodovi, dosje na e-mail, administracija i skupna statistika.
# Tajne (TOKEN_SECRET, CODE_PEPPER, ADMIN_SECRET, ADMIN_TOTP, BREVO_KEY, po želji TURNSTILE_SECRET) NE upisuju se ovdje,
# nego naredbom `npx wrangler secret put IME` (vidi docs/pristup-postavljanje.md).
name = "cesticahr-pristup"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGINS = "https://app.cesticahr.com,https://cesticahr.com,https://www.cesticahr.com,https://ozrenpancic-maker.github.io,http://localhost:8000"
MAIL_FROM = "dosje@cesticahr.com"      # adresa pošiljatelja (domena potvrđena u Brevu)
MAIL_REPLY = "info@cesticahr.com"      # odgovori korisnika idu ovamo
IZVJESTAJA_DNEVNO = "10"               # najviše slanja dosjea po kodu na dan
TOKEN_EPOCH = "1"                      # promjena broja odjavljuje sve korisnike
ADMIN_EMAIL = "info@cesticahr.com"     # obavijesti o novim zahtjevima i produženjima
APP_URL = "https://app.cesticahr.com/"   # poveznica za aktivaciju u e-mailu
TRAJANJE_DANA = "30"                   # zadano trajanje pristupa; mijenja se i u administraciji (Postavke)

[[d1_databases]]
binding = "DB"
database_name = "cesticahr"
database_id = "UPIŠI_ID_NAKON_wrangler_d1_create"
migrations_dir = "migrations"

[triggers]
crons = ["17 5 * * *"]                 # svaki dan oko 6:17 po našem vremenu: podsjetnici i brisanje starih podataka
