# Čestica HR: pristupni kodovi i slanje dosjea na e-mail. Tajne (TOKEN_SECRET, CODE_PEPPER, ADMIN_SECRET, BREVO_KEY)
# NE upisuju se ovdje, nego naredbom `npx wrangler secret put IME` (vidi docs/pristup-postavljanje.md).
name = "cesticahr-pristup"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGINS = "https://app.cesticahr.com,https://ozrenpancic-maker.github.io,http://localhost:8000"
MAIL_FROM = "dosje@cesticahr.com"      # adresa pošiljatelja (domena potvrđena u Brevu)
MAIL_REPLY = "info@cesticahr.com"      # odgovori korisnika idu ovamo
IZVJESTAJA_DNEVNO = "10"               # najviše slanja dosjea po kodu na dan
TOKEN_EPOCH = "1"                      # promjena broja odjavljuje sve korisnike

[[kv_namespaces]]
binding = "KODOVI"
id = "UPIŠI_ID_NAKON_wrangler_kv_namespace_create"
