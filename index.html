  v=pickT(key.izgradenost,PCT,tip); if(v!=null) out.izg=toNum(v)/100;
  v=pickT(key.kis,DEC,tip); if(v!=null) out.kis=toNum(v);
  const gtxt=((key.gbp||"")+"; "+(key.kis||"")).replace(/^.*?(?=GBP)/s,"");
  v=pickT(gtxt.replace(/kisn?[^;]*?\d+,\d+/gu,""),M2,tip); if(v!=null&&/GBP/.test(gtxt)) out.gbp=toNum(v);
  v=pickT(key.teren,PCT,tip); if(v!=null) out.teren=toNum(v)/100;

}

// ================= URBANA PRAVILA: odabir stavki i izvlačenje parametara =================
// Pravila su u zasebnim JSON datotekama (src/rules*.json) koje se ugrađuju pri sastavljanju; ovaj dio samo čita stavke.
// Za svaki parametar bira se stavka koja ga propisuje za novu gradnju; stavke o rekonstrukciji i iznimkama se ne koriste
// kao opće pravilo, nego se prikazuju zasebno.
const KEY_RX={
  cestica:/najmanj\w* (površin\w*|veličin\w*) građevne čestice|najmanja građevna čestica|veličina građevne čestice/i,
  sirina:/širin\w* građevne čestice/i,

  kis:/\bkisn?\b/i,
  gbp:/\bGBP\b/,
  visina:/nadzemn\w* etaž|najveća visina|visina građevin/i,
  teren:/prirodn\w* teren/i,
  meda:/od međe/i,
  pravac:/građevn\w* pravac|građevinski je pravac|građevinski pravac|građevnog pravca glavne građevine od/i,
  jedinice:/samostaln\w* uporabn\w* jedinic|stambenih jedinica/i,
  pgm:/\bPGM\b/

const NOT_GENERAL=/^(rekonstrukc|iznimno|prigodom rekonstrukc|u rekonstrukc|pri gradnji zamjensk)/i;
function normKeys(zone){
  if(!zone||zone._nk) return zone&&zone._nk;

  for(const [k,rx] of Object.entries(KEY_RX)){

      if(m.index<30) s+=3;
      if(k==="pravac"&&!/\d+(,\d+)?\s*m\b/.test(it)) s-=5; // "pomoćne građevine su iza građevnog pravca" nije udaljenost
      if(s>bs){bs=s;best=it}

    // postojeći ključ iz parsera zadržava se, osim ako nedostaje ili je stavka o rekonstrukciji/iznimci

  add("meda","Udaljenost od međe",hHalf?"pola visine građevine (h/2)":mm?mm[1]+" m":null,mt,hHalf?{num:null,hHalf,status:"provjera"}:{num:mm?toNum(mm[1]):null,hHalf});
  const pm=(key.pravac||"").match(/najmanje\s+(\d+,\d+|\d+)\s*m\b/)||(key.pravac||"").match(/(\d+,\d+|\d+)\s*m\b/);
  if(key.pravac&&pm) add("pravac","Građevni pravac od ulice (regulacijske linije)","najmanje "+pm[1]+" m",key.pravac,{status:"provjera",note:"nije uračunato u prostor za kuću na karti"});
  const jt=key.jedinice||"";
  const jm=jt.match(/najviše\s+(\w+)\s+samostaln/i)||jt.match(/najviše\s+(\d+)\s+samostaln/i);
  const jper=jt.match(/(\d+)\s*m²\s*građevne čestice\s*\/\s*1/i)||jt.match(/(\d+)\s*m²\s*građevne čestice po/i);
  let jmax=jm?wnum(jm[1]):null;
  if(jper&&area){const byA=Math.floor(area/parseFloat(jper[1])); jmax=jmax!=null?Math.min(jmax,byA):byA;}
  if(jt) add("jed","Najviše samostalnih jedinica",jmax!=null?String(jmax)+(jper?` (1 na ${jper[1]} m² čestice)`:""):null,jt,{num:jmax});
  const pt=key.pgm||"", pg=pt.match(/(\d+)\s*PGM\s*\/\s*(1\s*)?(stan|stambena jedinica)/i);
  if(pt) add("pgm","Parkirališna mjesta",pg?`${pg[1]} PGM po stanu${jmax?` · za ${jmax} stana najmanje ${pg[1]*jmax} PGM`:""}`:null,pt,{num:pg?+pg[1]:null});

}
// vrste zahvata (Zakon o gradnji: dogradnja i nadogradnja su oblici rekonstrukcije)
const ZAHVATI=[["nova","nova gradnja"],["dogr","dogradnja"],["nadogr","nadogradnja"],["rek","rekonstrukcija"],["interp","interpolacija"],["zamj","zamjenska građevina"]];
let ZAHVAT=(()=>{try{return localStorage.getItem("zahvat")||"nova"}catch(e){return "nova"}})();
const ZAHVAT_RX={dogr:/rekonstrukc|dograd/i,nadogr:/rekonstrukc|nadograd/i,rek:/rekonstrukc/i,interp:/interpolac/i,zamj:/zamjensk/i};
function zahvatItems(zone,z){
  if(z==="nova"||!zone) return [];
  const rx=ZAHVAT_RX[z]; return (zone.items||[]).filter(i=>rx.test(i));
}
// iznimke za pojedine ulice ili područja; ako se ime obližnje ulice spominje u iznimci, ističe se
function exceptionItems(zone,roadNames){
  const ex=(zone&&zone.items||[]).filter(i=>/^iznimno/i.test(i));
  const names=(roadNames||[]).filter(Boolean).map(n=>n.replace(/^(ulica|cesta)\s+/i,"").trim()).filter(n=>n.length>3);
  return ex.map(t=>{
    const low=t.toLowerCase();
    const hit=names.find(n=>{const ws=n.split(/\s+/).filter(w=>!/^(ulica|cesta|trg|put|odvojak|prilaz|avenija|aleja|ul\.|novi|nova|gornji|donji)$/i.test(w)); const wd=ws.sort((a,b)=>b.length-a.length)[0]||""; const stem=wd.slice(0,Math.max(4,wd.length-2)).toLowerCase(); return stem.length>=4&&low.includes(stem)});
    return {t,hit:hit||null};
  });
}

// stavka pravila koja dopušta gradnju na česticama manjim od propisane (npr. GUP čl. 69, pravilo 2.2: "...na građevnim česticama manjim od 600 m², uz uvjet...")
function smallParcelRule(zone){
  if(!zone||!zone.items) return null;
  return zone.items.find(i=>(/čestic\w*\s+manj\w*\s+od\s+(\d|propisan)/i.test(i)||/čestice\s+može\s+biti\s+manja/i.test(i))&&/rekonstrukc|interpolac|zamjensk/i.test(i))||null;
}
function pickZone(rule,analitika){
  if(!rule||!rule.zone||!rule.zone.length) return null;
  const keys=ZONE_KEYS[analitika]||[];
  return rule.zone.find(z=>keys.some(k=>z.zona.toLowerCase().includes(k)))||(keys.length?null:null);
}

        if(!pp.minC&&!pp.izg&&!pp.kis) h+=`<p class="flag">Pravilo ne navodi posebne uvjete za ovaj tip kuće; provjeri detaljna pravila.</p>`;
        if(buildArea!=null&&buildArea<area-1) h+=`<div class="row"><span>Građevinski dio čestice</span><span>${fmt(buildArea)} od ${fmt(area)} m²</span></div>`;
        if(envelope&&envelope.area!=null){const tl=pp.izg?A*pp.izg:null, lim=tl&&envelope.area<tl;
          h+=`<div class="row"><span>Prostor za kuću (${String(envelope.d).replace(".",",")} m od međa, zeleno na karti)</span><span class="${lim?"bad":""}">${fmt(envelope.area)} m²</span></div>`;
          if(envelope.est) h+=`<p class="meta">Udaljenost od međa je procjena (${esc(envelope.est)}); potrebna dodatna provjera.</p>`;
          if(lim) h+=`<p class="meta">Prostor unutar udaljenosti od međa manji je od dopuštenog tlocrta, pa oblik čestice ograničava tlocrt kuće na najviše ${fmt(envelope.area)} m².</p>`;}
        if(pp.minC){const ok=A>=pp.minC, edge=!ok&&A>=pp.minC*0.95;
          h+=`<div class="row"><span>Min. čestica ${fmt(pp.minC)} m² (nova gradnja)</span><span class="${ok?"good":edge||smallX?"":"bad"}">${ok?"ispunjeno":edge?"na granici":smallX?"potrebna dodatna provjera":"premala"}</span></div>`;
          if(edge) h+=`<p class="meta">Čestica je do 5 % manja od propisane. To je dopušteno samo ako se dio čestice ustupa za ulicu ili pristupni put.</p>`;
          if(smallX&&!edge) h+=`<p class="flag">Čestica je manja od propisane za novu gradnju, ali pravilo ima posebnu odredbu za takve čestice (npr. za rekonstrukciju, zamjensku građevinu ili interpolaciju). Je li gradnja moguća ovisi o tome postoji li građevina i o položaju među susjednim zgradama, pa to potvrđuje lokacijska informacija.</p><p class="meta">Odredba iz pravila: „${esc(smallX)}“</p>`;}
        if(pp.izg) h+=`<div class="row"><span>Najveći tlocrt (${Math.round(pp.izg*100)} %)</span><span>${fmt(A*pp.izg)} m²</span></div>`;
        if(gbpMax&&gbpEst) h+=`<div class="row"><span>Najveći GBP (procjena: tlocrt × 2,5 etaže, jer plan ne propisuje kis)</span><span>${fmt(gbpMax)} m²</span></div>`;
        else if(gbpMax) h+=`<div class="row"><span>Najveći GBP${pp.kis?" (kis "+String(pp.kis).replace(".",",")+")":""}${pp.gbp&&pp.kis&&A*pp.kis>pp.gbp?", ograničeno na "+fmt(pp.gbp):""}</span><span>${fmt(gbpMax)} m²</span></div>`;
        if(pp.teren) h+=`<div class="row"><span>Min. prirodni teren (${Math.round(pp.teren*100)} %)</span><span>${fmt(A*pp.teren)} m²</span></div>`;
        if(zgrade&&zgrade.v&&zgrade.v.n){const zf=zgrade.v.area;
          h+=`</div><div class="calc" style="border-top:1px solid var(--line)"><p class="eyebrow">Postojeće zgrade i dogradnja</p>`;
          h+=`<div class="row"><span>Postojeći tlocrt (${zgrade.v.n} ${zgrade.v.n===1?"zgrada":"zgrade"}, sivo na karti)</span><span>${fmt(zf)} m²</span></div>`;
          h+=`<div class="kd"><label for="eFloors">Etaža postojeće kuće</label><input id="eFloors" type="number" inputmode="decimal" min="1" max="9" step="0.5" value="2"><span>(npr. P+1 = 2, P+1+Pk = 2,5)</span></div>`;
          h+=`<div id="dogOut" data-zf="${Math.round(zf)}" data-tl="${pp.izg?Math.round(A*pp.izg):""}" data-gbp="${gbpMax?Math.round(gbpMax):""}"></div>`;
          h+=`<p class="meta">Tlocrti su iz Topografske osnove Grada Zagreba (2018.); novije zgrade i dogradnje možda nisu ucrtane. Postojeći GBP je procjena: tlocrt × broj etaža.</p>`;
        }
        h+=`<p class="meta" style="margin-top:6px">Računato na građevinskom dijelu čestice${rezHit?", bez odbitka za proširenje ulice (vidi upozorenje)":""}. Za druge tipove kuće izaberi tip gore.</p></div></details>`;
        if(envelope&&envelope.geom) h+=simHtml(pp,A,area,gbpMax,RP);
        if(gbpMax){
          const sel=(id,opts,def)=>`<select id="${id}" class="bsel">${opts.map(o=>`<option value="${o[0]}"${o[0]===def?" selected":""}>${o[1]}</option>`).join("")}</select>`;
          const H0=Math.min(150,Math.round(gbpMax));
          // 1) Kuća: jedini izvor podataka o veličini kuće za sve izračune ispod
          h+=`<details class="acc" data-k="build"><summary><span>Procjena cijene gradnje</span><b id="bSum"></b></summary><div class="acc-body">`;
          h+=`<div class="bgrid" data-gbp="${Math.round(gbpMax)}" data-tlocrt="${pp.izg?Math.round(A*pp.izg):""}">`;
          h+=`<label for="bArea">Površina kuće (bruto)</label><span><input id="bArea" type="number" inputmode="decimal" min="20" step="1" value="${H0}"> m²</span>`;
          h+=`<label for="bFloors">Katnost</label>${sel("bFloors",[["P","prizemnica (P)"],["PPk","P + potkrovlje"],["P1","P + 1 kat"],["P1Pk","P + 1 + potkrovlje"],["P2","P + 2 kata"]],"P")}`;
          h+=`<label for="bType">Gradnja</label>${sel("bType",[["klas","klasična (zidana)"],["mont","montažna"]],"klas")}`;
          h+=`<label for="bStd">Standard</label>${sel("bStd",[["osn","osnovni"],["sred","srednji"],["vis","viši"]],"sred")}`;
          h+=`<label for="bPhase">Faza</label>${sel("bPhase",[["kljuc","ključ u ruke"],["roh","roh-bau"]],"kljuc")}`;
          h+=`<label for="bBase">Podrum</label><span><input type="checkbox" id="bBase"> s podrumom ispod cijele kuće</span>`;
          h+=`<label for="bYard">Uređenje okoliša</label><span><input id="bYard" type="number" inputmode="decimal" min="0" step="500" placeholder="ponuda"> €</span>`;
          h+=`</div><div id="bOut"></div></div></details>`;
          // 2) Komunalni doprinos: obujam se računa iz kuće gore, osim ako ga upišeš ručno
          h+=`<details class="acc" data-k="kd"><summary><span>Komunalni doprinos</span><b id="kdSum">izaberi zonu</b></summary><div class="acc-body">`;
          h+=`<div class="kd"><label for="kdVol">Obujam kuće</label><input id="kdVol" type="number" inputmode="decimal" min="0" step="1" value="${H0*3}"><span>m³</span><button type="button" class="ib" id="kdVolAuto" style="display:none">iz kuće</button></div>`;
          h+=`<p class="meta" id="kdVolNote">Obujam = (površina kuće + podrum) × 3 m visine etaže, iz "Procjene cijene gradnje". Službeno se obračunava bruto obujam iz projekta; ako ga znaš, upiši ga.</p>`;
          const zSel=kdZone();
          h+=`<div class="kd"><label for="kdZone">Zona</label><select id="kdZone" style="font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)"><option value="">izaberi zonu</option>${KD_ZONES.map(z=>`<option value="${z[0]}"${z[0]===zSel?" selected":""}>${z[0]}. zona · ${z[1].toFixed(2).replace(".",",")} €/m³</option>`).join("")}</select></div>`;
          h+=`<div class="kd"><label for="kdRate">Iznos</label><input id="kdRate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="€/m³" value="${esc(kdRate())}"><span>€/m³</span></div>`;
          h+=`<div class="kd"><span>Ukupno:</span><output id="kdOut"></output></div>`;
          h+=`<p class="meta">Iznosi po zonama su iz Odluke o izmjenama i dopuni Odluke o komunalnom doprinosu (Gradska skupština, 13. 12. 2023.). Zonu provjeri na <a href="https://geoportal.zagreb.hr/Karta" target="_blank" rel="noopener" style="color:var(--accent)">Geoportalu Zagreba</a> (sloj "Zone komunalnog doprinosa").</p></div></details>`;
          // 3) Priključci i dozvole
          h+=`<details class="acc" data-k="costs"><summary><span>Priključci i dozvole</span><b id="costSum"></b></summary><div class="acc-body">`;
          h+=`<div class="kd"><label for="kdKw">Priključna snaga struje</label><select id="kdKw" style="font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)">${[[7.36,"7,36 kW (jednofazno 32 A)"],[11.04,"11,04 kW (trofazno 16 A)"],[17.25,"17,25 kW (trofazno 25 A)"],[22.08,"22,08 kW (trofazno 32 A)"]].map(o=>`<option value="${o[0]}"${o[0]===11.04?" selected":""}>${o[1]}</option>`).join("")}</select></div>`;
          h+=`<div class="kd"><label><input type="checkbox" id="kdGas"> s plinskim priključkom</label></div>`;
          {const ic=infcGet(favKey(parcel,ll)); const inp=(id,l,ph)=>`<div class="kd"><label for="${id}">${l}</label><input id="${id}" type="number" inputmode="decimal" min="0" step="100" placeholder="${ph}" value="${ic[id]>0?ic[id]:""}"><span>€</span></div>`;
           h+=`<p class="eyebrow" style="margin-top:8px">Radovi na priključcima (tvoj unos iz ponude)</p>`+inp("kdWorks","Kućni priključci vode, kanalizacije, struje (radovi, okna, ormarić)","ponuda")+inp("kdSeptic","Sabirna jama ili pročistač, ako nema kanalizacije","0")+inp("kdWell","Bunar, ako nema vodovoda","0");}
          h+=`<div id="costs"></div></div></details>`;}
      }
      h+=`<details><summary>Sva detaljna pravila za ovu zonu (${zone.items.length})</summary><ol>${zone.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></details>`;
      const others=rule.zone.filter(z=>z!==zone);
      if(others.length) h+=`<details><summary>Ostale zone u pravilu ${esc(code)}</summary>${others.map(z=>`<p><b>${esc(z.zona)}</b></p><ol>${z.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`).join("")}</details>`;
    }else{
      if(main&&VERDICT[main.p.Analitika]&&VERDICT[main.p.Analitika][0]==="no") h+=`<p class="hint">Za ovu namjenu pravilo ne predviđa gradnju stambenih ili poslovnih građevina.</p>`;
      else if(rule.zone.length) h+=`<p class="hint">Nisam mogao automatski odrediti zonu. Pravilo ima ove zone:</p>${rule.zone.map(z=>`<details><summary>${esc(z.zona)}</summary><ol>${z.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></details>`).join("")}`;
    }
    if(rule.opca&&rule.opca.length) h+=`<details><summary>Opća pravila</summary><ol>${rule.opca.map(i=>`<li>${esc(i)}</li>`).join("")}</ol></details>`;
    h+=`<details><summary>Cijeli članak ${esc(rule.clanak)}.</summary>${rule.tekst.map(p=>`<p>${esc(p)}</p>`).join("")}</details>`;
  }
  if(parcel) h+=moneyHtml(favKey(parcel,ll),area);
  if(parcel){ h+=`<h2>Sunce i energija</h2>`+sunHtml()+pvHtml(); h+=seisHtml(ll); }
  if(checks) h+=docsHtml(d);
  h+=`<div class="links"><a href="https://oss.uredjenazemlja.hr/public-services/search-cad-parcel" target="_blank" rel="noopener">Katastar (OSS)</a><a href="https://geoportal.zagreb.hr/Karta" target="_blank" rel="noopener">Geoportal Zagreb</a><a href="https://geoportal.dgu.hr/#/?lng=${ll.lng.toFixed(6)}&lat=${ll.lat.toFixed(6)}&zoom=9&layerconfig=17013&mode=2d" target="_blank" rel="noopener">Geoportal DGU</a><a href="https://www.zzpugz.hr/gup-grada-zagreba" target="_blank" rel="noopener">GUP (Zavod)</a><a href="https://www.google.com/maps?q=${ll.lat},${ll.lng}" target="_blank" rel="noopener">Google Maps</a></div>`;
  h+=`<p class="note">Izvori: katastarske čestice Grada Zagreba (2023.), GIS baza planirane namjene (2023.), karta urbanih pravila iz ponovne javne rasprave GUP-a (2024.) i tekst Odluke o GUP-u s izmjenama 2025. Granice pravila u konačnom planu mogu malo odstupati. Procjena je orijentacijska; pravno mjerodavna je lokacijska informacija Gradskog ureda.</p>`;
  restoreMap();
  sheet.innerHTML=h;
  sheet.querySelectorAll("details[data-k]").forEach(dd=>{if(OPEN.has(dd.dataset.k)) dd.open=true});
  sheet.scrollTop=keepScroll;
  try{finUpdate()}catch(err){console.error(err); const o=document.getElementById("bOut")||document.getElementById("buyOut"); if(o) o.innerHTML=`<p class="err">Izračun trenutno nije uspio (${esc(err.message)}). Ostatak aplikacije radi normalno.</p>`}
  dogUpdate();
  if(TL.layer){TL.zones=null; tDraw();}
  if(OPEN.has("sun")){sunDraw(); sunEnsureNb();}
}

// --- procjena cijene gradnje (tržište, okolica Zagreba, 2026.)
// Izvori: trebam.hr (2026: Zagreb okolica, ključ u ruke prizemnica 1.400, katnica 1.300, montažna 1.600 €/m²; roh-bau 500–700 €/m²);
// montazneidrvenekuce.info, Q1 2026 (montažne: ključ u ruke prosjek 1.600, visoki roh-bau 1.100 €/m², bez temeljne ploče 55–120 €/m²);
// reporter.hr 2026 (ključ u ruke 1.500–1.700, viši standard > 2.000 €/m²).
const BUILD={
  klas:{kljuc:1400, roh:600, temelj:0},
  mont:{kljuc:1600, roh:1100, temelj:90}
};
const STD={osn:0.85, sred:1.0, vis:1.3};
const FLOORS={P:{f:1.00,n:1,label:"prizemnica"},PPk:{f:0.96,n:1.75,label:"P + potkrovlje"},P1:{f:0.93,n:2,label:"P + 1"},P1Pk:{f:0.91,n:2.75,label:"P + 1 + Pk"},P2:{f:0.90,n:3,label:"P + 2"}}; // n = broj tlocrta u GBP-u (potkrovlje 75 %, kao u simulatoru); P2: nastavak trenda (procjena)
const PODRUM_EUR={kljuc:850, roh:550}; // procjena po m² podruma
sheet.addEventListener("change",e=>{ if(e.target.id==="zahvatSel"){ZAHVAT=e.target.value;try{localStorage.setItem("zahvat",ZAHVAT)}catch(err){} OPEN.add("calc"); if(window.__lastData) render(window.__lastData);} });
sheet.addEventListener("change",e=>{ if(e.target.id==="tipSel"){TIP=e.target.value;try{localStorage.setItem("tip",TIP)}catch(err){} OPEN.add("calc"); if(window.__lastData) render(window.__lastData);} });

// ================= JEDINSTVENI FINANCIJSKI MODEL =================
// Svi kalkulatori (komunalni doprinos, priključci, gradnja, kupnja, ukupna investicija) čitaju ulaze iz istih polja
// i računaju se jednom funkcijom finCompute(). Nijedna stavka se ne zbraja dvaput.
// Vrste iznosa: "propis" = izračun prema propisu/odluci, "procjena" = tržišna procjena s rasponom, "unos" = korisnikov iznos.

// Izvori naknada:
// HERA, Odluka o iznosu jedinične naknade za priključenje (NN 45/2026, od 1. 5. 2026.): 193 €/kW bez PDV-a;
// Uredba o Tarifi upravnih pristojbi (NN 156/2022), Tar. br. 20: građevinska dozvola za zgradu do 600 m² 106,18 €, e-zahtjev −15 %;
// Zakon o izmjenama i dopuni Zakona o financiranju vodnoga gospodarstva (NN 36/2024): vodni doprinos ukinut od 1. 7. 2024.
const HEP_EUR_KW=193.00, PDV=1.25, PRIST_GD=106.18, PRIST_GD_MIN_BIG=132.72;
const GAS_RANGE=[800,1500];
const ETAZA_M=3; // m, visina etaže za procjenu bruto obujma
// Kupnja (porezna-uprava.gov.hr "Stjecatelj nekretnine"; gov.hr "Upis prava vlasništva"):
// porez na promet nekretnina 3 % tržišne vrijednosti, plaća stjecatelj; PDV 25 % umjesto poreza na promet kad je prodavatelj
// u sustavu PDV-a i prodaje građevinsko zemljište (zemljište s pravomoćnom dozvolom za građenje); sudske pristojbe za
// uknjižbu: prijedlog 6,50 € (elektronički −50 %), rješenje 26,54 €.
const PPN=0.03, PDV_RATE=0.25, ZK_PRIJEDLOG=6.50, ZK_RJESENJE=26.54;
const REGIMES={
  ppn:{label:"Porez na promet nekretnina 3 % (prodavatelj građanin ili nije u sustavu PDV-a)"},
  pdv:{label:"PDV 25 % (prodavatelj u sustavu PDV-a, zemljište s pravomoćnom dozvolom za gradnju)"},
  osl:{label:"Oslobođeno poreza (npr. stjecanje od bračnog druga ili srodnika u ravnoj liniji)"}
};

const numv=id=>{const e=document.getElementById(id); if(!e) return null; const v=parseFloat(String(e.value).replace(",",".")); return isFinite(v)?v:null};
function kdRate(){try{return localStorage.getItem("kdRate")||""}catch(e){return ""}}
const KD_ZONES=[["I",18.35],["II",18.00],["III",16.00],["IV",12.00],["V",2.00],["VI",1.50]];
function kdZone(){try{return localStorage.getItem("kdZone")||""}catch(e){return ""}}

// ulazi kupnje po čestici
function infcStore(){try{return JSON.parse(localStorage.getItem("infc")||"{}")}catch(e){return {}}}
function infcGet(k){return infcStore()[k]||{}}
function infcSave(){const k=window.__cur&&window.__cur.key; if(!k) return; const o={}; for(const id of ["kdWorks","kdSeptic","kdWell"]){const v=numv(id); if(v>0) o[id]=v} try{const s=infcStore(); s[k]=o; localStorage.setItem("infc",JSON.stringify(s))}catch(e){}}
function buyStore(){try{return JSON.parse(localStorage.getItem("buy")||"{}")}catch(e){return {}}}
function buyGet(k){const o=buyStore()[k]||{}; if(o.price==null){const lp=landPrice(k); if(lp) o.price=parseFloat(lp)}; return o}
function buySet(k,o){try{const s=buyStore(); s[k]=o; localStorage.setItem("buy",JSON.stringify(s))}catch(e){}}

function finCompute(){
  const g=id=>document.getElementById(id);
  const F={items:[],warn:[]};
  const area=window.__cur&&window.__cur.area||null;
  // --- kuća
  const hasHouse=!!g("bArea");
  if(hasHouse){
    const pick=(id,obj,def)=>{const v=g(id)&&g(id).value; return obj[v]?v:def};
    const hA=numv("bArea")||0, t=pick("bType",BUILD,"klas"), std=pick("bStd",STD,"sred"), ph=pick("bPhase",BUILD.klas,"kljuc"), fl=FLOORS[pick("bFloors",FLOORS,"P")], base=!!(g("bBase")&&g("bBase").checked);
    const unit=BUILD[t][ph]*STD[std]*fl.f, foot=hA/fl.n;
    const gradnja=hA*unit + foot*BUILD[t].temelj + (base?foot*PODRUM_EUR[ph]*STD[std]:0);
    const autoVol=Math.round((hA+(base?foot:0))*ETAZA_M);
    const volEl=g("kdVol"); if(volEl&&volEl.dataset.manual!=="1") volEl.value=autoVol;
    const vol=numv("kdVol")||0, rate=numv("kdRate");
    const kd=rate>0&&rate<=40&&vol>0?vol*rate:null;
    const kW=parseFloat(g("kdKw")?.value||"11.04"), gas=!!g("kdGas")?.checked;
    const hep=HEP_EUR_KW*kW*PDV;
    const prist=hA>600?Math.max(PRIST_GD_MIN_BIG,gradnja*0.00025):PRIST_GD;
    const yard=numv("bYard");
    F.house={hA,foot,unit,gradnja,autoVol,vol,rate,kd,kW,gas,hep,prist,base,t,fl,yard,manualVol:volEl&&volEl.dataset.manual==="1"};
    const P=(k,label,base,lo,hi,kind,formula,group)=>F.items.push({k,label,base,lo,hi,kind,formula,group});
    P("gradnja","Gradnja",gradnja,gradnja*0.9,gradnja*1.1,"procjena",`${fmt(hA)} m² × ${fmt(unit)} €/m²${BUILD[t].temelj?" + temeljna ploča "+fmt(foot)+" m² × "+BUILD[t].temelj+" €":""}${base?" + podrum "+fmt(foot)+" m²":""}; raspon ±10 %`,"gradnja");
    P("projekti","Projekti i geodezija",gradnja*0.07,gradnja*0.9*0.07,gradnja*1.1*0.07,"procjena","7 % gradnje","gradnja");
    P("nadzor","Stručni nadzor",gradnja*0.015,gradnja*0.9*0.015,gradnja*1.1*0.015,"procjena","1,5 % gradnje","gradnja");
    if(yard!=null&&yard>0) P("okolis","Uređenje okoliša",yard,yard,yard,"unos","tvoj upis","gradnja");
    if(kd!=null) P("kd","Komunalni doprinos",kd,kd,kd,"propis",`${fmt(vol)} m³ × ${String(rate).replace(".",",")} €/m³`,"naknade");
    P("vodni","Vodni doprinos",0,0,0,"propis","ukinut od 1. 7. 2024.","naknade");
    P("hep","Priključak struje (HEP)",hep,hep,hep,"propis",`${String(kW).replace(".",",")} kW × ${HEP_EUR_KW} €/kW + 25 % PDV`,"naknade");
    P("vio","Priključak vode i kanalizacije (ViO)",0,0,0,"propis","za kućanstva plaća Grad","naknade");
    if(gas) P("plin","Priključak plina (GPZ)",(GAS_RANGE[0]+GAS_RANGE[1])/2,GAS_RANGE[0],GAS_RANGE[1],"procjena","procjena 800–1.500 €","naknade");
    for(const [id,l] of [["kdWorks","Radovi na kućnim priključcima"],["kdSeptic","Sabirna jama ili pročistač"],["kdWell","Bunar"]]){const v=numv(id); if(v>0) P(id,l,v,v,v,"unos","iz ponude","naknade");}
    P("prist","Pristojba za građevinsku dozvolu",prist,prist,prist,"propis",hA>600?"0,25 ‰ troškova gradnje, najmanje 132,72 €":"zgrada do 600 m² (e-zahtjev 15 % manje)","naknade");
    if(kd==null) F.warn.push("Komunalni doprinos nije uključen: izaberi zonu.");
    if(yard==null) F.warn.push("Uređenje okoliša nije uključeno: upiši iznos ako ga znaš.");
  }
  // --- kupnja
  const key=window.__cur&&window.__cur.key;
  const b=key?buyGet(key):{}; F.key=key;
  const price=b.price>0?b.price:null;
  if(price){
    const reg=b.regime||"ppn", rows=[];
    let tax=0, taxLabel="";
    if(reg==="ppn"){tax=price*PPN; taxLabel="Porez na promet nekretnina (3 % od cijene)";}
    else if(reg==="pdv"){ if(b.vatIncl){tax=0; taxLabel="PDV 25 % (uključen u cijenu)"} else {tax=price*PDV_RATE; taxLabel="PDV 25 % (nije uključen u cijenu)"} }
    else {tax=0; taxLabel="Oslobođeno poreza na promet";}
    rows.push({k:"porez",label:taxLabel,v:tax,kind:"propis"});
    const ag=b.agency>0?b.agency:0;
    if(ag) rows.push({k:"agencija",label:`Agencija (${String(ag).replace(".",",")} %${b.agencyVat!==false?" + 25 % PDV":""})`,v:price*ag/100*(b.agencyVat!==false?1.25:1),kind:"unos"});
    const zk=(b.efile!==false?ZK_PRIJEDLOG*0.5:ZK_PRIJEDLOG)+ZK_RJESENJE;
    rows.push({k:"zkpr",label:`Sudske pristojbe za uknjižbu (prijedlog ${b.efile!==false?"elektronički 3,25":"6,50"} € + rješenje 26,54 €)`,v:zk,kind:"propis"});
    for(const [k,l] of [["notary","Javni bilježnik"],["lawyer","Odvjetnik"],["geo","Geodet"],["other","Ostali troškovi"]]){
      if(b[k]>0) rows.push({k,label:l,v:b[k],kind:"unos"});
    }
    const missing=[["notary","javni bilježnik"],["lawyer","odvjetnik"],["geo","geodet"]].filter(([k])=>!(b[k]>0)).map(x=>x[1]);
    const costs=rows.reduce((s,r)=>s+r.v,0);
    const gross=reg==="pdv"&&!b.vatIncl?price*(1+PDV_RATE):price;
    const kap=b.kapara>0?Math.min(b.kapara,gross):0;
    // stjecanje = cijena + troškovi; PDV koji nije u cijeni nalazi se u stavci poreza, pa se ne zbraja dvaput
    const acq=price+costs;
    F.buy={price,reg,rows,costs,gross,acq,missing,kap,rest:gross-kap,area,perM2:area?price/area:null,effM2:area?acq/area:null};
  }
  // --- ukupno
  const sum=f=>F.items.reduce((s,i)=>s+f(i),0);
  F.house&&(F.build={base:sum(i=>i.base),lo:sum(i=>i.lo),hi:sum(i=>i.hi),naknade:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.base,0),
    naknadeLo:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.lo,0),naknadeHi:F.items.filter(i=>i.group==="naknade").reduce((s,i)=>s+i.hi,0)});
  if(F.build){const g2=F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.base,0); F.build.rez=g2*0.15;}
  const acq=F.buy?F.buy.acq:0;
  F.total={base:(F.build?F.build.base:0)+acq,lo:(F.build?F.build.lo:0)+acq,hi:(F.build?F.build.hi:0)+acq,rez:F.build?F.build.rez:0,hasBuy:!!F.buy,hasBuild:!!F.build};
  return F;
}

const KIND={propis:"prema propisu",procjena:"procjena",unos:"tvoj unos"};
const frow=(a,b,opt={})=>`<div class="row${opt.cls?" "+opt.cls:""}"${opt.bold?' style="font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px"':""}><span>${a}${opt.f?`<small class="fx">${esc(opt.f)}</small>`:""}</span><span>${b}</span></div>`;
const kindTag=k=>`<em class="kind kind-${k}">${KIND[k]}</em>`;
const money=(i)=>i.lo!==i.hi?`${fmt(i.lo)}–${fmt(i.hi)} €`:`${fmt(i.base)} €`;

function finUpdate(){
  const F=finCompute(); window.__fin=F;
  const g=id=>document.getElementById(id);
  // komunalni doprinos
  if(g("kdOut")&&F.house){const H=F.house;
    g("kdOut").textContent=!(H.rate>0)?"izaberi zonu":!(H.vol>0)?"upiši obujam":H.rate>40?"iznos je nerealno velik: u Zagrebu je od 1,50 do 18,35 €/m³":fmt(H.kd)+" € (uz 10 % popusta za jednokratnu uplatu: "+fmt(H.kd*0.9)+" €)";
    if(g("kdSum")) g("kdSum").textContent=H.kd!=null?fmt(H.kd)+" €":"izaberi zonu";
    const ab=g("kdVolAuto"); if(ab) ab.style.display=H.manualVol?"":"none";
    const nt=g("kdVolNote"); if(nt) nt.textContent=H.manualVol?`Obujam si upisao ručno. Iz kuće bi bilo ${fmt(H.autoVol)} m³.`:`Obujam = (površina kuće ${fmt(H.hA)} m²${H.base?" + podrum "+fmt(H.foot)+" m²":""}) × ${ETAZA_M} m = ${fmt(H.autoVol)} m³, iz "Procjene cijene gradnje". Službeno se obračunava bruto obujam iz projekta; ako ga znaš, upiši ga.`;

    const s=F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`;

    h+=`<p class="meta">Isti iznosi ulaze u procjenu gradnje i ukupnu investiciju. Radovi koje plaćaš izvođačima (vodomjerno okno, kućni priključci, elektro-ormarić) ovise o udaljenosti mreže koja nije javno objavljena, pa ih upiši iz ponude.</p>`;
    g("costs").innerHTML=h; if(g("costSum")) g("costSum").textContent=s;
  }
  // gradnja
  if(g("bOut")&&F.house){
    const H=F.house, grid=document.querySelector(".bgrid[data-gbp]"), gbp=grid?+grid.dataset.gbp||0:0, tl=grid?+grid.dataset.tlocrt||0:0;

    if(tl&&H.foot>tl*1.001) h+=`<p class="flag">Tlocrt (${fmt(H.foot)} m²) prelazi najveću izgrađenost (${fmt(tl)} m²). Probaj više etaža ili manju površinu.</p>`;
    h+=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
    for(const i of F.items.filter(i=>i.group==="gradnja")) h+=frow(esc(i.label)+" "+kindTag(i.kind),money(i),{f:i.formula});
    h+=frow("Naknade, priključci i pristojbe "+kindTag("propis"),F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`,{f:"iz odjeljaka Komunalni doprinos i Priključci i dozvole"});
    h+=frow("Ukupno gradnja s naknadama",`${fmt(F.build.lo)} – ${fmt(F.build.hi)} €`,{bold:true,f:"osnovni iznos "+fmt(F.build.base)+" €"});
    h+=frow("Preporučena rezerva",`+ ${fmt(F.build.rez)} €`,{f:"15 % gradnje, projekata, nadzora i okoliša; nije uključena u ukupno"});
    h+=`</div>`;
    if(F.warn.length) h+=`<p class="meta">${F.warn.map(esc).join(" ")}</p>`;
    h+=`<p class="meta">Tržišne cijene za okolicu Zagreba, 2026. (izvori: trebam.hr, montazneidrvenekuce.info Q1 2026, reporter.hr). ${H.t==="mont"?"Montažna cijena uključuje temeljnu ploču (procjena 90 €/m² tlocrta). ":""}Podrum je procjena. Zemljište i troškovi kupnje su u odjeljku "Novac i kupnja". Za stvarnu cijenu traži barem tri ponude.</p>`;
    g("bOut").innerHTML=h; if(g("bSum")) g("bSum").textContent=fmt(F.build.lo)+" – "+fmt(F.build.hi)+" €";
  }
  // kupnja
  if(g("buyOut")){
    let h="";
    if(!F.buy) h=`<p class="meta">Upiši kupoprodajnu cijenu ili cijenu po m².</p>`;
    else{const B=F.buy;
      h+=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
      h+=frow("Kupoprodajna cijena "+kindTag("unos"),fmt(B.price)+" €",{f:B.perM2?fmt(B.perM2)+" €/m² za "+fmt(B.area)+" m²":""});
      for(const r of B.rows) h+=frow(esc(r.label)+" "+kindTag(r.kind),fmt(r.v)+" €");
      h+=frow("Ukupno troškovi kupnje",fmt(B.costs)+" €",{bold:true});
      h+=frow("Ukupna cijena stjecanja",fmt(B.acq)+" €",{bold:true,f:"cijena + troškovi kupnje"});
      if(B.effM2) h+=frow("Efektivna cijena po m²",fmt(B.effM2)+" €/m²",{f:"cijena stjecanja ÷ "+fmt(B.area)+" m²"});
      if(B.kap) h+=frow("Kapara (dio cijene, nije dodatni trošak)",fmt(B.kap)+" €",{f:"ostatak za uplatu pri ugovoru: "+fmt(B.rest)+" €"});
      h+=`</div>`;
      if(B.missing.length) h+=`<p class="meta">Nije upisano: ${esc(B.missing.join(", "))}. Ti iznosi ovise o ponudi pa ih aplikacija ne procjenjuje; upiši ih kad ih dobiješ.</p>`;
      if(B.reg==="pdv") h+=`<p class="meta">Kad se plaća PDV, ne plaća se porez na promet nekretnina. PDV se plaća samo ako je prodavatelj u sustavu PDV-a i zemljište ima pravomoćnu dozvolu za gradnju; sama građevinska zona nije dovoljna.</p>`;
    }
    h+=`<p class="meta">Izvori: <a href="https://porezna-uprava.gov.hr/hr/stjecatelj-nekretnine/4700" target="_blank" rel="noopener" style="color:var(--accent)">Porezna uprava, stjecatelj nekretnine</a>; <a href="https://www.gov.hr/hr/upis-prava-vlasnistva/1306" target="_blank" rel="noopener" style="color:var(--accent)">gov.hr, upis prava vlasništva</a>. Porez se plaća na tržišnu vrijednost koju utvrdi Porezna uprava, pa može biti i viši od izračuna ako je ugovorena cijena niža od tržišne.</p>`;
    g("buyOut").innerHTML=h; if(g("buySum")) g("buySum").textContent=F.buy?fmt(F.buy.acq)+" €":"upiši cijenu";
  }
  // ukupna investicija
  if(g("totOut")){
    const T=F.total; let h=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
    if(F.buy) h+=frow("Zemljište s troškovima kupnje",fmt(F.buy.acq)+" €",{f:"cijena "+fmt(F.buy.price)+" € + troškovi "+fmt(F.buy.costs)+" €"});
    else h+=frow("Zemljište","nije upisano");
    if(F.build){h+=frow("Gradnja, projekti, nadzor"+(F.items.some(i=>i.k==="okolis")?", okoliš":""),`${fmt(F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.lo,0))}–${fmt(F.items.filter(i=>i.group==="gradnja").reduce((s,i)=>s+i.hi,0))} €`);
      h+=frow("Naknade, priključci i pristojbe",F.build.naknadeLo!==F.build.naknadeHi?`${fmt(F.build.naknadeLo)}–${fmt(F.build.naknadeHi)} €`:`${fmt(F.build.naknade)} €`);}
    else h+=frow("Gradnja","nema podataka o dopuštenoj kući za ovu česticu");
    h+=frow("Ukupna investicija",T.lo!==T.hi?`${fmt(T.lo)} – ${fmt(T.hi)} €`:`${fmt(T.base)} €`,{bold:true,f:"osnovni iznos "+fmt(T.base)+" €"});
    if(T.rez) h+=frow("S preporučenom rezervom",`do ${fmt(T.hi+T.rez)} €`,{f:"gornja granica + rezerva 15 % ("+fmt(T.rez)+" €)"});
    h+=`</div><p class="meta">Svaka stavka se računa jednom: naknade iz "Priključci i dozvole", gradnja iz "Procjene cijene gradnje", zemljište iz "Kupnje zemljišta". Raspon dolazi samo od procjena (gradnja ±10 %, plin); iznosi prema propisu i tvoji unosi su točni brojevi.</p>`;
    g("totOut").innerHTML=h; if(g("totSum")) g("totSum").textContent=T.lo!==T.hi?`${fmt(T.lo)} – ${fmt(T.hi)} €`:(T.base?fmt(T.base)+" €":"upiši cijenu");
  }
  window.__budget=F.total.base?{lo:F.total.lo,hi:F.total.hi,base:F.total.base,land:F.buy?F.buy.price:null,kupnja:F.buy?F.buy.costs:null,acq:F.buy?F.buy.acq:null,build:F.build?{lo:F.build.lo,hi:F.build.hi}:null}:null;
  const fk=window.__cur&&window.__cur.key; if(fk){const a=favs(), f=a.find(x=>x.key===fk); if(f){f.budget=window.__budget; f.land=F.buy?F.buy.price:null; setFavs(a);}}
}

function buyRead(){
  const k=window.__cur&&window.__cur.key; if(!k) return;
  const g=id=>document.getElementById(id);
  const o={price:numv("yPrice"),regime:g("yReg").value,vatIncl:g("yVatIncl").checked,agency:numv("yAgency"),agencyVat:g("yAgencyVat").checked,
    notary:numv("yNotary"),lawyer:numv("yLawyer"),geo:numv("yGeo"),other:numv("yOther"),efile:g("yEfile").checked,kapara:numv("yKapara")};
  buySet(k,o); setLand(k,o.price>0?String(o.price):"");
  g("yVatIncl").disabled=o.regime!=="pdv";
}
sheet.addEventListener("input",e=>{
  const id=e.target.id||"";
  if(id==="yPrice"){const a=window.__cur&&window.__cur.area, m=document.getElementById("yM2"), v=numv("yPrice"); if(m&&a) m.value=v>0?Math.round(v/a):"";}
  if(id==="yM2"){const a=window.__cur&&window.__cur.area, p=document.getElementById("yPrice"), v=numv("yM2"); if(p&&a) p.value=v>0?Math.round(v*a):"";}
  if(/^y[A-Z]/.test(id)){buyRead(); finUpdate();}
  if(id==="kdVol"){e.target.dataset.manual="1"; finUpdate();}
  if(id==="kdWorks"||id==="kdSeptic"||id==="kdWell"){infcSave(); finUpdate();}
  if(id==="kdRate"){const n=numv("kdRate"); try{localStorage.setItem("kdRate",n>0&&n<=40?String(n):"")}catch(err){} finUpdate();}
  if(/^b[A-Z]/.test(id)) finUpdate();
});
sheet.addEventListener("change",e=>{
  const id=e.target.id||"";
  if(/^y[A-Z]/.test(id)){buyRead(); finUpdate();}
  if(/^b[A-Z]/.test(id)||id==="kdKw"||id==="kdGas") finUpdate();
  if(id==="kdZone"){const z=KD_ZONES.find(x=>x[0]===e.target.value); if(z){document.getElementById("kdRate").value=z[1]; try{localStorage.setItem("kdRate",String(z[1]))}catch(err){}} try{localStorage.setItem("kdZone",e.target.value)}catch(err){} finUpdate();}
});
sheet.addEventListener("click",e=>{ if(e.target.id==="kdVolAuto"){const v=document.getElementById("kdVol"); v.dataset.manual=""; finUpdate();} });

function dogUpdate(){
  const o=document.getElementById("dogOut"); if(!o) return;
  const zf=+o.dataset.zf, tl=+o.dataset.tl||null, gbp=+o.dataset.gbp||null;
  const n=parseFloat(String(document.getElementById("eFloors").value).replace(",","."))||0;
  const eg=zf*n, r=[];
  r.push(["Postojeći GBP (procjena)",fmt(eg)+" m²"]);
  if(tl!=null) r.push(["Preostali tlocrt za dogradnju",tl-zf>0?fmt(tl-zf)+" m²":`<span class="bad">nema (već ${fmt(zf-tl)} m² iznad)</span>`]);
  if(gbp!=null) r.push(["Preostali GBP (dogradnja i nadogradnja)",gbp-eg>0?fmt(gbp-eg)+" m²":`<span class="bad">nema (već ${fmt(eg-gbp)} m² iznad)</span>`]);
  o.innerHTML=r.map(([a,b])=>`<div class="row"><span>${a}</span><span>${b}</span></div>`).join("")+(gbp!=null&&eg>gbp?`<p class="meta">Postojeća kuća je veća od onoga što pravilo danas dopušta za novu gradnju. Kod rekonstrukcije se postojeći parametri smiju zadržati, ali ne povećavati.</p>`:"");
}
sheet.addEventListener("input",e=>{ if(e.target.id==="eFloors") dogUpdate(); });

function prostornoOdsjek(c){

  if(/novi zagreb|peščenica|pescenica|brezovica/.test(c)) return "Drugi područni odsjek za prostorno uređenje, Avenija Dubrovnik 12 · 658 5614";
  if(/centar|donji grad|gornji grad|medveščak|črnomerec|maksimir|podsused|susedgrad|trešnjevka|podsljeme|stenjevec|trnje/.test(c)) return "Prvi područni odsjek za prostorno uređenje, Trg Francuske Republike 15 · 610 1763";

function graditeljstvoOdsjek(c){

function ckHtml(d){

  S.forEach((s,i)=>{const o=st[s.id]||{};
    h+=`<li class="${o.d?"done":""}" data-ck="${s.id}"><label class="ckh"><input type="checkbox" data-ckd${o.d?" checked":""}> <b>${i+1}. ${esc(s.t)}</b></label><div class="ckb">`;

    h+=`<div class="ckf"><label>Datum <input type="date" data-ckdt value="${esc(o.dt||"")}"></label></div><textarea data-ckn placeholder="Bilješke">${esc(o.n||"")}</textarea></div></li>`;
  });
  h+=`</ol><p class="meta">Kvačice, datumi i bilješke spremaju se za ovu česticu samo u ovom pregledniku. Navedeni su samo rokovi propisani zakonom; ostali rokovi ovise o dogovoru s prodavateljem.</p></div></details>`;
  return h;
}
function ckSave(li){

const mapEl=document.getElementById("map"), mapHome=mapEl.parentNode, mapNext=mapEl.nextSibling;
function preparePrintMap(){
  const pm=document.getElementById("printMap");

  map.invalidateSize();
  if(window.__lastBounds) map.fitBounds(window.__lastBounds,{padding:[30,30],maxZoom:19});
  else if(window.__lastLL) map.setView(window.__lastLL,18);
  const base=map.hasLayer(sat)?sat:osm;

  if(!mapEl.classList.contains("in-print")) return;

}

// --- stanje servisa: provjera dostupnosti svih izvora podataka (na zahtjev)
function serviceList(){
  const L=[["Katastarske čestice",SRC.cestice],["Planirana namjena",SRC.namjena],["Urbana pravila GUP",SRC.pravila],["Iznimke urbanih pravila",SRC.iznimke],["Urbana pravila Sesvete",SRC.pravilaSE],["Zgrade (topografska osnova)",OBJEKTI]];
  for(const c of CHECKS) L.push(["Provjera: "+c.label,c.url]);
  const seen=new Set(), out=[];
  for(const [n,u] of L){const base=u.replace(/\/query$/,""); if(seen.has(base)) continue; seen.add(base); out.push({n,u:base+"?f=json"});}
  out.push({n:"OpenStreetMap Overpass (okolina)",u:"https://overpass-api.de/api/status",raw:true});
  out.push({n:"Open-Meteo (visine terena)",u:"https://api.open-meteo.com/v1/elevation?latitude=45.81&longitude=15.98"});
  out.push({n:"Nominatim (pretraga adresa)",u:"https://nominatim.openstreetmap.org/status?format=json"});
  return out;
}
async function ping(x){
  const t0=(window.performance||Date).now();
  try{
    if(x.raw){const c=new AbortController(), t=setTimeout(()=>c.abort(),8000); try{const r=await fetch(x.u,{signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status)}finally{clearTimeout(t)}}
    else await getJSON(x.u,{},8000,{retries:0,cache:false});
    return {ok:true,ms:Math.round((window.performance||Date).now()-t0)};
  }catch(e){return {ok:false,ms:Math.round((window.performance||Date).now()-t0),e:e.message}}
}
async function showStatus(){
  const L=serviceList();
  sheet.innerHTML=`<p class="eyebrow">Stanje izvora podataka</p><p class="hint"><span class="spin"></span>Provjeravam ${L.length} servisa…</p>`; sheet.scrollTop=0;
  const R=await Promise.all(L.map(x=>ping(x).then(r=>({...x,...r}))));
  const ok=R.filter(r=>r.ok).length;
  let h=`<p class="eyebrow">Stanje izvora podataka</p><div class="verdict v-${ok===R.length?"ok":ok?"warn":"no"}">${ok} od ${R.length} servisa odgovara.</div><ul class="checks">`;
  for(const r of R) h+=`<li class="chk chk-${r.ok?(r.ms>4000?"warn":"ok"):"no"}"><b>${esc(r.n)}</b><span>${r.ok?`odgovara (${fmt(r.ms)} ms)${r.ms>4000?", sporo":""}`:esc(r.e)}</span></li>`;
  h+=`</ul>`;
  const st=Object.entries(NET.stat);
  if(st.length) h+=`<details><summary>Zahtjevi u ovoj sesiji (${st.length} servisa)</summary><table class="rp"><tbody>${st.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${v.ok} uspjelo, ${v.fail} neuspjelo${v.last?` · zadnja greška: ${esc(v.last)}`:""}</td></tr>`).join("")}</tbody></table></details>`;
  h+=`<p class="meta">Odgovori se pamte 10 minuta, pa ponovni dodir iste čestice ne šalje nove zahtjeve. Kod privremenih grešaka (isteklo vrijeme, greška poslužitelja) zahtjev se jednom ponavlja. Istodobno se šalje najviše ${NET.conc} zahtjeva.</p>`;
  sheet.innerHTML=h;
}
// --- verzija i provjera novije verzije (GitHub Pages drži stranicu u predmemoriji do 10 min)
(function(){
  const v=document.getElementById("ver"); if(v){v.textContent="Verzija "+APP_VERSION+" · "; const a=document.createElement("a"); a.href="#"; a.id="statBtn"; a.textContent="stanje servisa"; a.style.color="var(--accent)"; a.onclick=e=>{e.preventDefault(); showStatus()}; v.appendChild(a);}
  if(!/^https?:/.test(location.protocol)) return;
  fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{
    const m=t.match(/const APP_VERSION = "([^"]+)"/);
    if(m&&m[1]!==APP_VERSION&&!m[1].includes("VERSION")){
      const b=document.createElement("button"); b.className="ib"; b.id="updBtn";
      b.textContent="Nova verzija "+m[1]+": osvježi";
      b.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:2000;background:var(--accent);color:#fff;border:0";
      b.onclick=()=>location.replace(location.pathname+"?v="+Date.now());
      document.body.appendChild(b);
    }
  }).catch(()=>{});
})();

// --- zemljišnoknjižni izvadak: otvaranje OSS-a i lokalna provjera učitanog PDF-a
const ZK={res:null};
sheet.addEventListener("click",async e=>{
  const b=e.target.closest&&e.target.closest(".zkCopy"); if(!b) return;
  const v=b.dataset.v, lab=b.innerHTML;
  if(b.dataset.keep){try{navigator.clipboard.writeText(v)}catch(err){} return;}
  let ok=false; try{await navigator.clipboard.writeText(v); ok=true}catch(err){}
  if(!ok){const t=document.createElement("textarea");t.value=v;document.body.appendChild(t);t.select();try{ok=document.execCommand("copy")}catch(err){}t.remove();}
  b.textContent=ok?"✓ Kopirano: "+v:v; setTimeout(()=>{b.innerHTML=lab},2500);
});
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("ne mogu učitati čitač PDF-a"));document.head.appendChild(s);});}
async function pdfText(file){
  if(!window.pdfjsLib){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); // radi i bez zasebnog workera
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent(); const rows=new Map();
    for(const it of tc.items){const y=Math.round(it.transform[5]); const r=rows.get(y)||[]; r.push([it.transform[4],it.str]); rows.set(y,r);}
    [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,r])=>lines.push(r.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim()));
  }
  return lines.filter(Boolean).join("\n");
}
// analiza teksta izvatka (radi i za stari i za novi oblik)
function analyzeZK(text,ctx){
  const T=text.replace(/\u00a0/g," "), low=T.toLowerCase();
  const idx=(re)=>{const m=low.search(re); return m<0?null:m};
  const iA=idx(/posjedovnica|\ba\s*list\b/), iB=idx(/vlastovnica|\bb\s*list\b/), iC=idx(/teretovnica|\bc\s*list\b/);
  const B=iB!=null?T.slice(iB,iC!=null&&iC>iB?iC:undefined):"", C=iC!=null?T.slice(iC):"";
  const A=iA!=null?T.slice(iA,iB!=null&&iB>iA?iB:undefined):T;
  const out={flags:[],ok:[],info:[]};
  // suvlasnici
  const shares=(B.match(/\b\d{1,3}\s*\/\s*\d{1,4}\b/g)||[]).map(s=>s.replace(/\s/g,"")).filter(s=>{const [a,b]=s.split("/").map(Number);return a>0&&b>0&&a<=b});
  const nOwn=(B.match(/(su)?vlasni[čc]ki dio|vlasni[čc]ki udio|suvlasni[čc]ki/gi)||[]).length;
  if(shares.length>1||nOwn>1) out.flags.push(["warn",`Više suvlasnika (${Math.max(shares.length,nOwn)} upisa${shares.length?": "+[...new Set(shares)].slice(0,8).join(", "):""}). Ugovor moraju potpisati svi.`]);
  else if(iB!=null) out.ok.push("Jedan upisani vlasnik.");
  if(/etažn/i.test(T)) out.info.push("Upisano je etažno vlasništvo (posebni dijelovi zgrade).");
  // tereti
  const C_=C.toLowerCase();
  const terms=[[/hipotek|založn/,"no","Hipoteka (založno pravo)"],[/služnost/,"warn","Služnost (npr. prolaz, vod)"],[/pravo građenja/,"warn","Pravo građenja"],
    [/zabran\w* otuđenja|zabrana opterećenja/,"no","Zabrana otuđenja ili opterećenja"],[/ovrh/,"no","Ovrha"],[/spor|tužb/,"no","Zabilježba spora"],
    [/prvokup/,"warn","Pravo prvokupa"],[/plodouživ/,"warn","Plodouživanje"],[/zakup|najam/,"warn","Zakup ili najam"],[/stečaj/,"no","Stečaj"],[/fiducij/,"no","Fiducijarni prijenos (osiguranje kredita)"]];
  let any=false; for(const [re,sev,lab] of terms) if(re.test(C_)){out.flags.push([sev,lab+" upisana u C listu."]);any=true}
  if(iC!=null&&!any){ if(/nema upisa|bez tereta|nema tereta|\btereta nema\b/i.test(C)||C.replace(/teretovnica|c\s*list/ig,"").trim().length<40) out.ok.push("C list (tereti) je prazan."); else out.info.push("C list ima upisa koje nisam prepoznao; pročitaj ga."); }
  if(/plomb/i.test(T)) out.flags.push(["no","Plomba: u tijeku je neki upis. Pitaj koji, prije bilo kakve uplate."]);
  if(/neusklađ|nije usklađ|nesuglas/i.test(T)) out.flags.push(["warn","Napomena o neusklađenosti zemljišne knjige i katastra."]);
  // površina čestice iz A lista
  if(ctx.kc){
    const re=new RegExp(ctx.kc.replace("/","\\s*/\\s*")+"\\b[^\\n]*?(\\d{1,3}(?:[.\\s]\\d{3})*|\\d+)\\s*(?:m2|m²|čhv)?\\s*$","im");
    const lines=A.split("\n").filter(l=>l.includes(ctx.kc.split("/")[0]));
    let zkA=null; for(const l of lines){const m=l.match(/(\d{1,3}(?:\.\d{3})+|\d+)\s*(?:m2|m²)?\s*$/); if(m&&!l.trim().endsWith(ctx.kc)){zkA=parseInt(m[1].replace(/\./g,"")); break}}
    if(zkA&&ctx.area){ const d=Math.abs(zkA-ctx.area)/ctx.area;
      if(d>0.05) out.flags.push(["warn",`Površina u zemljišnoj knjizi (${fmt(zkA)} m²) razlikuje se od katastra (${fmt(ctx.area)} m²) za ${Math.round(d*100)} %. Provjeri s geodetom prije kupnje.`]);
      else out.ok.push(`Površina u zemljišnoj knjizi (${fmt(zkA)} m²) odgovara katastru.`); }
    if(!lines.length) out.flags.push(["warn",`Čestica ${ctx.kc} nije nađena u A listu. Je li izvadak za pravu česticu?`]);
  }
  if(iA==null&&iB==null&&iC==null) out.flags.push(["warn","Ne prepoznajem strukturu izvatka (A, B, C list). Je li to zemljišnoknjižni izvadak?"]);
  return out;
}
function zkHtml(r){
  return (r.flags.length?`<ul class="checks">${r.flags.map(([s,t])=>`<li class="chk chk-${s}"><span>${esc(t)}</span></li>`).join("")}</ul>`:"")
   +(r.ok.length?`<ul class="checks" style="margin-top:6px">${r.ok.map(t=>`<li class="chk chk-ok"><span>${esc(t)}</span></li>`).join("")}</ul>`:"")
   +(r.info.length?r.info.map(t=>`<p class="meta">${esc(t)}</p>`).join(""):"")
   +`<p class="meta">Automatska provjera traži ključne riječi; pravno mjerodavan je sam izvadak.</p>`;
}
sheet.addEventListener("change",async e=>{
  if(e.target.id!=="zkFile"||!e.target.files[0]) return;
  const o=document.getElementById("zkOut"), s=document.getElementById("zkSum"), c=window.__cur||{};
  o.innerHTML='<p class="hint"><span class="spin"></span>Čitam izvadak…</p>';
  try{
    const txt=await pdfText(e.target.files[0]);
    if(txt.length<50) throw new Error("PDF nema teksta (možda je sken); otvori ga i provjeri ručno");
    const r=analyzeZK(txt,{kc:c.ces,area:c.area});
    const sum=r.flags.some(f=>f[0]==="no")?"ima ozbiljnih upisa":r.flags.length?"provjeri upozorenja":"bez upozorenja";
    ZK.res={key:c.key,html:zkHtml(r),sum};
    o.innerHTML=ZK.res.html; if(s){s.textContent=sum; s.className=r.flags.some(f=>f[0]==="no")?"bad":"";}
  }catch(err){o.innerHTML=`<p class="err">Ne mogu pročitati izvadak: ${esc(err.message)}</p>`}
  e.target.value="";
});

// --- dijeljenje: link otvara točno ovu česticu
function shareUrl(){const ll=window.__lastLL; return location.origin+location.pathname+"?c="+ll.lat.toFixed(6)+","+ll.lng.toFixed(6);}
sheet.addEventListener("click",async e=>{
  if(e.target.id!=="shareBtn"||!window.__lastLL) return;
  const url=shareUrl(), c=window.__cur, title="Čestica "+(c&&c.ces?c.ces+", k.o. "+c.ko:"Zagreb");
  try{ if(navigator.share){await navigator.share({title,url});return} }catch(err){ if(err&&err.name==="AbortError") return; }
  try{await navigator.clipboard.writeText(url); e.target.textContent="Link kopiran"}catch(err){ prompt?0:0; e.target.textContent="Kopiraj: "+url; }
  setTimeout(()=>{const b=document.getElementById("shareBtn"); if(b) b.textContent="Podijeli"},4000);
});
(function(){ // otvaranje dijeljenog linka
  const c=new URLSearchParams(location.search).get("c"); if(!c) return;
  const [la,lo]=c.split(",").map(Number); if(!isFinite(la)||!isFinite(lo)) return;
  const ll=L.latLng(la,lo); map.setView(ll,18); setTimeout(()=>inspect(ll),300);
})();

// --- pretraga po broju katastarske čestice (npr. "Šestine 4027/1" ili "kč 123 Sesvete")
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
function parcelQuery(q){
  const isParcel=/\d+\/\d+/.test(q)||/^\s*(k\.?\s*č\.?|kc|kč|čest|cest)/i.test(q)||/k\.\s*o\./i.test(q);
  if(!isParcel) return null;
  const m=q.match(/(\d+(?:\/\d+)?)/); if(!m) return null;
  const ko=q.replace(m[0]," ").replace(/k\.?\s*č\.?|\bkc\b|\bkč\b|čestica|cestica|k\.\s*o\.|\bko\b/gi," ").trim();
  return {kc:m[1],ko};
}
async function searchParcel(pq){
  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim česticu '+esc(pq.kc)+'…</p>';
  const p=new URLSearchParams({where:"KATASTARSKA_CESTICA='"+pq.kc.replace(/'/g,"")+"'",outFields:"KATASTARSKA_OPCINA,KATASTARSKA_CESTICA",returnGeometry:"true",outSR:"4326",f:"geojson",resultRecordCount:"200"});
  const g=await getJSON(SRC.cestice+"?"+p.toString());
  let f=g.features||[];
  if(pq.ko){const k=norm(pq.ko); const ff=f.filter(x=>norm(x.properties.KATASTARSKA_OPCINA).includes(k)); if(ff.length) f=ff; else if(f.length){sheet.innerHTML=`<p class="err">Čestica ${esc(pq.kc)} nije nađena u k.o. ${esc(pq.ko)}. Postoji u: ${esc([...new Set(f.map(x=>x.properties.KATASTARSKA_OPCINA))].join(", "))}.</p>`;return}}
  if(!f.length){sheet.innerHTML=`<p class="err">Čestica ${esc(pq.kc)} nije nađena u katastru Grada Zagreba (stanje 2023.). Provjeri broj ili upiši i katastarsku općinu.</p>`;return}
  if(f.length>1){
    window.__choices=f;
    sheet.innerHTML=`<p class="eyebrow">Čestica ${esc(pq.kc)} postoji u više katastarskih općina</p><div class="choices">${f.map((x,i)=>`<button type="button" class="ib" data-pick="${i}">k.o. ${esc(x.properties.KATASTARSKA_OPCINA)}</button>`).join("")}</div><p class="meta">Sljedeći put upiši i k.o., npr. "Šestine ${esc(pq.kc)}".</p>`;
    return;
  }
  goToFeature(f[0]);
}
function goToFeature(feat){
  const b=L.geoJSON(feat.geometry).getBounds(); map.fitBounds(b,{padding:[40,40],maxZoom:19});
  const c=turf.pointOnFeature(feat).geometry.coordinates; inspect(L.latLng(c[1],c[0]));
}
sheet.addEventListener("click",e=>{const i=e.target.dataset&&e.target.dataset.pick; if(i!=null&&window.__choices) goToFeature(window.__choices[+i]);});

// --- pretraga adrese (Nominatim, Zagreb)
async function search(){
  const q=document.getElementById("q").value.trim(); if(!q) return;
  const pq=parcelQuery(q);
  if(pq){try{await searchParcel(pq)}catch(e){sheet.innerHTML='<p class="err">Pretraga čestice nije uspjela: '+esc(e.message)+'</p>'} return;}
  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim adresu…</p>';
  try{
    const p=new URLSearchParams({q:q+", Zagreb",format:"json",limit:"1",countrycodes:"hr",viewbox:"15.75,46.0,16.25,45.6",bounded:"1"});
    const a=await getJSON("https://nominatim.openstreetmap.org/search?"+p.toString());
    if(!a[0]){sheet.innerHTML='<p class="err">Adresa nije pronađena. Probaj drukčije napisati ili dodirni kartu.</p>';return}
    const ll=L.latLng(+a[0].lat,+a[0].lon); map.setView(ll,18); inspect(ll);
  }catch(e){sheet.innerHTML='<p class="err">Pretraga nije uspjela: '+esc(e.message)+'</p>'}
}
document.getElementById("go").onclick=search;
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
document.getElementById("me").onclick=()=>{
  if(!navigator.geolocation){sheet.innerHTML='<p class="err">Lokacija nije dostupna u ovom pregledniku.</p>';return}
  navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,18);inspect(ll)},
    ()=>{sheet.innerHTML='<p class="err">Pristup lokaciji je odbijen.</p>'},{enableHighAccuracy:true,timeout:10000});
};
