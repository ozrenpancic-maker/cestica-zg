<style>
/* Layout: full-screen map, results in a bottom sheet (side panel on wide screens) */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#dde2de; --soft:#eef1ee;
  --accent:#1f6f54;
  --ok:#1f7a3f; --warn:#a86400; --no:#b3261e;
  --ok-bg:#e5f3e9; --warn-bg:#fbefd9; --no-bg:#fbe5e3;
  --f-display:"Archivo",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --panel:#1c2320; --fg:#e6ece8; --muted:#9aa8a0; --line:#2e3833; --soft:#232c28;
  --accent:#5cc49a;
  --ok:#7fd69a; --warn:#f0b65a; --no:#f2867d;
  --ok-bg:#1b3325; --warn-bg:#3a2c12; --no-bg:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-display)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;white-space:nowrap}
.ib:focus-visible,#q:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--line)}
.layers{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:900;display:flex;flex-direction:column;gap:6px}
.layers label{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;display:flex;gap:6px;align-items:center}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:950;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(0,0,0,.12)}
@media (min-width:900px){#sheet{left:auto;top:10px;right:10px;bottom:10px;width:420px;max-height:none;border-radius:12px;border:1px solid var(--line)} .layers{right:440px}}
.hint{color:var(--muted);margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
.parcel{font-family:var(--f-mono);font-size:22px;font-weight:500;margin:0}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
.verdict{margin:12px 0;padding:10px 12px;border-radius:10px;font-weight:500}
.v-ok{background:var(--ok-bg);color:var(--ok)} .v-warn{background:var(--warn-bg);color:var(--warn)} .v-no{background:var(--no-bg);color:var(--no)}
.zones{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.zone{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:3px;margin-top:3px}
.zone b{display:block;font-weight:500}
.zone small{color:var(--muted);display:block}
.pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rule-code{font-family:var(--f-mono);font-weight:500;background:var(--soft);border-radius:6px;padding:1px 6px;margin-right:6px}
.rule-title{font-weight:700;font-size:16px;margin:4px 0 2px;text-wrap:balance}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 10px;margin:8px 0 0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.calc{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.calc .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.calc .row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bgrid>span{min-width:0}
.bad{color:var(--no)} .good{color:var(--ok)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}

details ol{padding-left:20px;margin:8px 0 0;font-size:13.5px} details li{margin:4px 0}
details p{font-size:13.5px;margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.links a{color:var(--accent);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.err{color:var(--no);font-size:13px;margin:6px 0 0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{padding:8px 10px;border-radius:8px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.chk b{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:14px;margin-top:6px}
.bgrid input[type=number],.bsel{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}
.bgrid input[type=number]{width:6em}
.actions{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.phase-d summary{font-weight:700;font-size:15px;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.docs label{display:flex;gap:6px;align-items:flex-start;font-size:14px}
.docs small{color:var(--muted)} .docs a{color:var(--accent)}
.print-only{display:none}
#printMap{display:none;height:340px;margin:0 0 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#map.in-print{position:absolute;inset:0}
@media print{
  header,.layers,.leaflet-control-zoom,.actions{display:none!important}
  #printMap{display:block!important;height:9cm;break-inside:avoid;border-radius:0}
  html,body{height:auto;background:#fff;color:#000}
  #app,main{position:static!important;display:block}
  #sheet{position:static!important;max-height:none!important;overflow:visible!important;width:auto!important;box-shadow:none!important;border:0!important;padding:0!important}
  .print-only{display:block;font-weight:700;margin:0 0 8px}
  details{break-inside:avoid-page}
  .docs li,.calc,.chk,.zone{break-inside:avoid}
  :root:not(#_p){--bg:#fff;--fg:#000;--muted:#444;--panel:#fff;--soft:#f2f2f2;--line:#ccc;--accent:#1f6f54;--ok:#1f7a3f;--warn:#8a5200;--no:#b3261e;--ok-bg:#e5f3e9;--warn-bg:#fbefd9;--no-bg:#fbe5e3;color-scheme:light}
}
.cmp-wrap{overflow-x:auto;margin-top:6px}
.cmp{border-collapse:collapse;font-size:13px;min-width:100%}
.cmp th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px 6px 0;white-space:nowrap;vertical-align:top;position:sticky;left:0;background:var(--panel)}
.cmp td{padding:6px 8px;border-left:1px solid var(--line);vertical-align:top;min-width:9em;font-variant-numeric:tabular-nums}
.cmp tr{border-top:1px solid var(--line)}
.actions{gap:8px}
@media print{.noprint{display:none}}
.acc{margin-top:10px;border:2px solid var(--accent);border-radius:12px;background:var(--panel);overflow:hidden;padding:0}
.acc>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--ok-bg);cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary>span{font-weight:700;font-size:15px;color:var(--fg)}
.acc>summary>span::before{content:"▸";display:inline-block;margin-right:8px;color:var(--accent);transition:transform .15s}
.acc[open]>summary>span::before{transform:rotate(90deg)}
.acc>summary>b{font-family:var(--f-mono);font-weight:500;font-size:13px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.acc>summary>b.bad{color:var(--no)}
.acc .calc{border:0;border-radius:0;margin:0}
.acc-body{padding:10px 14px 12px}
@media (prefers-reduced-motion:reduce){.acc>summary>span::before{transition:none}}
.t-handle{background:#1565c0;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chk-ok{background:var(--ok-bg);color:var(--ok)}
.kd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.kd input{width:6em;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.kd output{font-family:var(--f-mono);font-weight:500}
.chk-no{background:var(--no-bg);color:var(--no)} .chk-warn{background:var(--warn-bg);color:var(--warn)}
.flag{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.zkc{display:flex;flex-wrap:wrap;gap:6px}.zkc .ib{flex:1 1 140px}.zksteps{padding-left:18px;margin:6px 0}.zksteps li{margin:3px 0}a.ib{text-decoration:none;display:inline-block}
.fx{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.kind{font-style:normal;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:8px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.kind-propis{background:var(--ok-bg);color:var(--ok)} .kind-procjena{background:var(--warn-bg);color:var(--warn)} .kind-unos{background:#e8eefc;color:#2b4a9a}
@media (prefers-color-scheme:dark){.kind-unos{background:#1e2a44;color:#9fb6ff}}
.buygrid select{max-width:100%}
.ck li{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.ck .ckh{display:flex;gap:8px;align-items:flex-start}
.ck .ckh b{font-size:14px}
.ck .ckb{margin:4px 0 0 26px;display:flex;flex-direction:column;gap:4px}
.ck .ckb small{color:var(--muted)} .ck a{color:var(--accent)}
.ck .ckf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ck input[type=date]{font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.ck textarea{font:inherit;font-size:13px;width:100%;min-height:2.2em;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);box-sizing:border-box}
.ck .rok{color:var(--warn);font-size:12.5px}
.ck li.done .ckh b{text-decoration:line-through;opacity:.7}
.rp{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
.rp th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px 6px 0;vertical-align:top;width:38%}
.rp td{padding:6px 0;vertical-align:top;border-top:1px solid var(--line)} .rp th{border-top:1px solid var(--line)}
.rp .src{font-style:italic}
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-warn{background:var(--warn-bg);color:var(--warn)} .st-muted{background:var(--line);color:var(--muted)}
.exhit{background:var(--warn-bg)}
ol.zi{font-size:13.5px;padding-left:18px}
.pvbars{display:flex;gap:3px;align-items:flex-end;height:80px;margin:8px 0 2px}.pvbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.pvbars span{display:block;width:100%;background:var(--warn);border-radius:3px 3px 0 0}.pvbars small{font-size:10px;color:var(--muted)}
</style>

<body>
<div id="app">
  <header>
    <h1>Čestica ZG</h1>
    <input id="q" type="search" placeholder="Adresa ili čestica, npr. Šestine 4027/1" autocomplete="off">
    <button class="ib" id="go" type="button">Traži</button>
    <button class="ib" id="me" type="button" aria-label="Moja lokacija">◎</button>
    <button class="ib" id="favBtn" type="button" aria-label="Spremljene čestice">★</button>
  </header>
  <main>
    <div id="map"></div>
    <div class="layers">
      <label><input type="checkbox" id="lyrSat"> Satelit</label>
      <label><input type="checkbox" id="lyrNam" checked> Namjena</label>
    </div>
    <section id="sheet" aria-live="polite">
      <p class="eyebrow">Kako radi</p>
      <p class="meta" id="ver" style="margin:0 0 6px"></p>
      <p class="hint">Dodirni zemljište na karti (zumiraj do razine ulice). Dobit ćeš katastarsku česticu, namjenu iz prostornog plana i urbano pravilo GUP-a s uvjetima gradnje.</p>
    </section>
  </main>
</div>
<script>
const RULES = {"1.1.": {"clanak": "58", "naziv": "Zaštita i očuvanje povijesnih graditeljskih cjelina", "prostori": "Gornji grad i Kaptol s kontaktnim područjem.", "opca": ["zaštita, održavanje i uređenje povijesnih cjelina;", "zadržavanje postojeće urbane matrice bez uvođenja novih ulica;", "gradnja i uređenje prostora prema detaljno utvrđenim uvjetima;", "prigodom ulične gradnje dubinu građevine ili dvorišnih krila poluugrađenih i ugrađenih građevina uskladiti s pretežitom dubinom gradnje poteza;", "zadržavanje raznolikosti namjena i postojećeg omjera građevina namijenjenih za stanovanje, javne i društvene i druge namjene;", "zaštita stanovanja; moguća prenamjena samo substandardnoga stambenog prostora u neku drugu namjenu (podrumski prostori, prostori u dvorišnim izvorno pomoćnim građevinama i sl.);", "u Vlaškoj i Tkalčićevoj ulici zadržavanje mješovitosti namjena i uređenje podruma i prvih dviju etaža uličnih i dvorišnih građevina te dvorišnih otvorenih prostora za javno korištenje;", "onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih;", "čuvanje postojećih slobodnih površina i obvezna zaštita kvalitetnih pojedinačnih stabala;", "onemogućavanje provoza vozila kroz povijesni prostor;", "stimuliranje pristupa javnim prometom primjerenim povijesnom prostoru;", "za stambenu namjenu najviše 1 PGM/1 stan;", "onemogućavanje gradnje javnih garaža;", "provedba javnih arhitektonskih natječaja prema članku 6. točki 23. i članku 99. ovih odredbi;", "iznimno, na lokaciji Palače Jelačić u Demetrovoj ulici za rekonstrukciju, dogradnju, nadogradnju i novu gradnju građevina i sadržaja javne namjene nije potrebno provesti javni arhitektonski natječaj iz članka 6. točke 23. i članka 99. ove odluke;", "iznimno, omogućuje se realizacija javne namjene \"Muzej osjeta Zagreb\" (revitalizacija postojećeg tunela Grič), uz uvjet da se realizira unutar obuhvata tunela Grič, bez kompleksnijih zahvata i izgradnje, osobito na prostoru Vranicanijeve poljane koja je arheološki lokalitet;", "iznimno, omogućuje se realizacija Projekta Dolac;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke."], "zone": [], "tekst": ["(1) Zaštita i očuvanje povijesnih graditeljskih cjelina (1.1.) - prostori: Gornji grad i Kaptol s kontaktnim područjem.", "(2) Opća pravila: 1. zaštita, održavanje i uređenje povijesnih cjelina; 2. zadržavanje postojeće urbane matrice bez uvođenja novih ulica; 3. gradnja i uređenje prostora prema detaljno utvrđenim uvjetima; 4. prigodom ulične gradnje dubinu građevine ili dvorišnih krila poluugrađenih i ugrađenih građevina uskladiti s pretežitom dubinom gradnje poteza; 5. zadržavanje raznolikosti namjena i postojećeg omjera građevina namijenjenih za stanovanje, javne i društvene i druge namjene; 6. zaštita stanovanja; moguća prenamjena samo substandardnoga stambenog prostora u neku drugu namjenu (podrumski prostori, prostori u dvorišnim izvorno pomoćnim građevinama i sl.); 7. u Vlaškoj i Tkalčićevoj ulici zadržavanje mješovitosti namjena i uređenje podruma i prvih dviju etaža uličnih i dvorišnih građevina te dvorišnih otvorenih prostora za javno korištenje; 8. onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih; 9. čuvanje postojećih slobodnih površina i obvezna zaštita kvalitetnih pojedinačnih stabala; 10. onemogućavanje provoza vozila kroz povijesni prostor; 11. stimuliranje pristupa javnim prometom primjerenim povijesnom prostoru; 12. za stambenu namjenu najviše 1 PGM/1 stan; 13. onemogućavanje gradnje javnih garaža; 14. provedba javnih arhitektonskih natječaja prema članku 6. točki 23. i članku 99. ovih odredbi; 15. iznimno, na lokaciji Palače Jelačić u Demetrovoj ulici za rekonstrukciju, dogradnju, nadogradnju i novu gradnju građevina i sadržaja javne namjene nije potrebno provesti javni arhitektonski natječaj iz članka 6. točke 23. i članka 99. ove odluke; 16. iznimno, omogućuje se realizacija javne namjene \"Muzej osjeta Zagreb\" (revitalizacija postojećeg tunela Grič), uz uvjet da se realizira unutar obuhvata tunela Grič, bez kompleksnijih zahvata i izgradnje, osobito na prostoru Vranicanijeve poljane koja je arheološki lokalitet; 17. iznimno, omogućuje se realizacija Projekta Dolac; 18. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke."]}, "1.2.": {"clanak": "59", "naziv": "Zaštita, uređenje i dogradnja u povijesnim graditeljskim cjelinama", "prostori": "Donji grad - zapad, Donji grad - istok, Ilica - Britanski trg, Vlaška - Petrova, Maksimirska - Petrova i drugi prema grafičkom prikazu.", "opca": ["zaštita, održavanje, uređenje i dogradnja povijesnih cjelina;", "zadržavanje postojeće urbane matrice i tipologije gradnje bez dijeljenja blokova novim ulicama;", "zadržavanje postojeće raznolikosti visina uličnih građevina, posebno imajući u vidu vrijednost i oblikovnu dovršenost građevina;", "onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih;", "čuvanje i obnova postojećih drvoreda; mogućnost sadnje novih drvoreda;", "neizgrađene kvalitetne zelene površine i kvalitetna pojedinačna stabla obvezno sačuvati;", "uređenje dvorišta tako da je u unutrašnjosti bloka moguća rekonstrukcija, gradnja zamjenskih građevina i gradnja novih građevina i garaža za potrebe bloka; kod gradnje zamjenskih i novih građevina, u svrhu sanacije i afirmacije vrijednosti bloka u cjelini, obvezno je cjelovito rješenje građevne čestice; moguće je zadržati i planirati više građevina različitih namjena na istoj građevnoj čestici; pristup s javnoprometne površine preko ulične građevne čestice, odnosno kroz kolni prolaz ulične građevine;", "gradnja javnih garaža nije moguća na prostoru Gornjeg grada i Kaptola i na prostoru omeđenom ulicama: Vlaškom, Bauerovom, Trgom Petra Krešimira IV., Hrvojevom, Borninom, Domagojevom, Branimirovom, Ul. Grgura Ninskog, južnim rubom Botaničkog vrta, Runjaninovom, Vodnikovom, Savskom, Ul. I. Kršnjavoga, Kačićevom i Ilicom, radi ograničenja motornog prometa u središtu grada. U toj zoni moguća je gradnja garaža prema odredbama članka 39. ovih odredbi, odnosno prema smjernicama za izradu predmetnog UPU-a;", "unutar blokova Donjeg grada između Ulice Republike Austrije i Heinzelove ulice garaže se mogu graditi s najviše dvije podzemne etaže; za gradnju garaža s više od 100 PGM obavezna je provjera mogućnosti i utjecaja na okolni prostor prethodnom izradom prometne studije;", "iznimno, za blokove označene na grafičkom prikazu 4a. Urbana pravila, 4b. Procedure urbano prostornog uređenja i 4d. Nepokretna kulturna dobra, prostorno rješenje odredit će se urbanističkim planom uređenja. Za te se blokove omogućuje razrada prostornih rješenja detaljnijom valorizacijom - detaljna konzervatorska podloga za cjelinu bloka, koju izrađuje nadležno tijelo zaštite (članak 92. ove odluke) uz uvjet zadržavanja pretežite visine u odnosu na blok tako da kisn ne bude veći od 3,0 odnosno postojeći ukoliko je veći.", "Za sve blokove Donjeg grada na kojima se planiraju kompleksni zahvati uređenja kojima se bitno mijenja njihova postojeća prostorna i građevinska struktura / morfologija bloka potrebno je izraditi urbanistički plan uređenja temeljem urbanističkih programskih smjernica koje izrađuje Zavod (uz uvjet da kisn ne bude veći od 3,0, odnosno postojeći ukoliko je veći);", "do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija uličnih građevina prema odredbama ovog članka, a u dvorištima rekonstrukcija građevina u postojećim gabaritima i gradnja novih građevina sukladno članku 104. ovih odredbi i prema pravilima za dvorišnu gradnju ovog članka;", "urbanistički planovi uređenja izrađuju se prema općim pravilima ovog članka, detaljnim konzervatorskim podlogama i programskim smjernicama za svaki od navedenih blokova. Uređenje prostora i opseg mogućeg zahvata definirat će se detaljnim konzervatorskim propozicijama za izradu urbanističkog plana uređenja, a grafički prikaz - kategorizacija građevnog fonda sastavni je dio konzervatorske podloge za izradu urbanističkog plana uređenja;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke."], "zone": [{"zona": "u zoni stambene i mješovite namjene", "items": ["gradnja ugrađenih, poluugrađenih i slobodnostojećih građevina;", "oblik i veličina ulične građevne čestice u pravilu su postojeći;", "u granicama Povijesne urbane cjeline Grada Zagreba sustava zaštite A, ne mogu se spajati građevne čestice uz ulicu, osim za javnu i društvenu namjenu;", "promjena oblika i veličine uličnih građevnih čestica moguća je samo temeljem urbanističkog plana uređenja cijelog bloka koji u grafičkom dijelu propisuje oblik i veličinu građevnih čestica u mjerilu 1:1000 ili 1:2000; iznimno, dozvoljena je promjena oblika i veličine građevnih čestica za rekonstrukciju građevina javne i društvene namjene;", "najveća izgrađenost ulične građevne čestice je 60%, a na uglovima 80%, najveća izgrađenost dvorišne građevne čestice je 30%, osim za građevine javne i društvene namjene; u blokovima najužega gradskog središta (označeno na grafičkom prikazu 4a. Urbana pravila) moguća je i veća izgrađenost građevne čestice, ali ne veća od 80%, u cilju javnog korištenja unutrašnjosti bloka i stvaranja javnih pješačkih površina i prolaza;", "najveći kisn ulične građevne čestice uskladiti s pretežitim kisn uličnog poteza, ali ne može biti veći od 3,0, osim za javnu i društvenu namjenu prema članku 12. ove odluke;", "najmanji udio prirodnog terena je 20% površine građevne čestice kod gradnje nove građevine, osim za uglovne čestice;", "dubinu ulične građevine ili dvorišnih krila uskladiti s pretežitom dubinom gradnje uličnog poteza (predmetna strana ulice između dva prometna križanja ili potez određen 75 m lijevo i desno od mjesta zahvata); dvorišna krila ugrađenih građevina ne mogu biti udaljena manje od međe postojećih dvorišnih udaljenosti krila susjedne građevine, ali ne manje od 3 m;", "najveću visinu ulične građevine uskladiti s pretežitom visinom u uličnom potezu;", "najveća visina dvorišne građevine je četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; iznimno, za građevine javne i društvene namjene četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, uz uvjet zadržavanja pretežite visine u odnosu na blok;", "kod izgradnje novih građevina i rekonstrukcije postojećih uličnih građevina, u pravilu, u prizemlju planirati sadržaje u javnom korištenju (sadržaji kojima se osigurava intenzivno korištenje prizemlja, npr. trgovačka, ugostiteljska, poslovna, javna i društvena namjena i slično);", "pri gradnji nove dvorišne građevine razmak između dvorišne građevine i ulične građevine mora biti najmanje jednak zbroju polovica njihovih visina; ova odredba primjenjuje se i pri gradnji nove građevine u unutrašnjosti bloka;", "parkirališna mjesta za stambenu uličnu i dvorišnu gradnju osigurati, u pravilu, u bloku, prioritet podzemno, i to najviše1 PGM/1 stan;", "građevni pravac ulične građevine je postojeći, osim kad se zadržava postojeće kvalitetno zelenilo;", "ulične građevine su ugrađene, osim, iznimno, ako je razmak potreban prema lokalnim uvjetima; razmak između ulične i nove dvorišne građevine ne može biti manji od zbroja polovica njihovih visina do vijenca;", "rekonstrukcija uličnih građevina se izvodi prema pravilima za novu gradnju; rekonstrukcija dvorišnih građevina moguća je u postojećim gabaritima ili prema odredbama urbanističkog plana uređenja;", "prigodom rekonstrukcije i gradnje zamjenske građevine postojeći parametri veći od propisanih mogu se zadržati, ali bez povećavanja, osim za izgradnju dizala;", "iznimno, u bloku Ulica baruna Trenka - Trg kralja Tomislava, zadržava se u prostoru zgrada Zagrebačkog kazališta lutaka u izvedenim tlocrtnim i visinskim gabaritima, ostali lokacijski uvjeti nisu propisani;"], "key": {"izgradenost": "najveća izgrađenost ulične građevne čestice je 60%, a na uglovima 80%, najveća izgrađenost dvorišne građevne čestice je 30%, osim za građevine javne i društvene namjene; u blokovima najužega gradskog središta (označeno na grafičkom prikazu 4a. Urbana pravila) moguća je i veća izgrađenost građevne čestice, ali ne veća od 80%, u cilju javnog korištenja unutrašnjosti bloka i stvaranja javnih pješačkih površina i prolaza;", "kis": "najveći kisn ulične građevne čestice uskladiti s pretežitim kisn uličnog poteza, ali ne može biti veći od 3,0, osim za javnu i društvenu namjenu prema članku 12. ove odluke;", "visina": "najveća visina dvorišne građevine je četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; iznimno, za građevine javne i društvene namjene četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, uz uvjet zadržavanja pretežite visine u odnosu na blok;", "pgm": "parkirališna mjesta za stambenu uličnu i dvorišnu gradnju osigurati, u pravilu, u bloku, prioritet podzemno, i to najviše1 PGM/1 stan;"}}, {"zona": "u zoni javne i društvene namjene i u zoni infrastrukturnih sustava", "items": ["gradnja i rekonstrukcija prema programu i normativima osnovne namjene; najveća izgrađenost ulične građevne čestice je 80%, najmanji udio prirodnog terena je 20% površine građevne čestice, najveću visinu ulične građevine uskladiti s pretežitom visinom u uličnom potezu;", "rekonstrukcija dvorišnih građevina moguća je u postojećim gabaritima ili prema odredbama urbanističkog plana uređenja; prigodom rekonstrukcije i gradnje zamjenske građevine postojeći parametri veći od propisanih mogu se zadržati, ali bez povećavanja, osim za izgradnju dizala;", "ostale urbanističke parametre uskladiti s vrijednostima i mogućnostima prostora;", "gradnja novih građevina javne i društvene namjene prema javnom arhitektonskom natječaju u skladu s člankom 99. ovih odredbi;"], "key": {}}, {"zona": "u zoni ugostiteljsko-turističke namjene", "items": ["Gradnja zamjenskih građevina i rekonstrukcija u okviru postojećeg koeficijenta iskoristivosti. Za kompleksne zahvate uređenja primjenjuje se stavak 2. točka 11. ovog članka."], "key": {}}], "tekst": ["(1) Zaštita, uređenje i dogradnja u povijesnim graditeljskim cjelinama (1.2.) - prostori: Donji grad - zapad, Donji grad - istok, Ilica - Britanski trg, Vlaška - Petrova, Maksimirska - Petrova i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita, održavanje, uređenje i dogradnja povijesnih cjelina; 2. zadržavanje postojeće urbane matrice i tipologije gradnje bez dijeljenja blokova novim ulicama; 3. zadržavanje postojeće raznolikosti visina uličnih građevina, posebno imajući u vidu vrijednost i oblikovnu dovršenost građevina; 4. onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih; 5. čuvanje i obnova postojećih drvoreda; mogućnost sadnje novih drvoreda; 6. neizgrađene kvalitetne zelene površine i kvalitetna pojedinačna stabla obvezno sačuvati; 7. uređenje dvorišta tako da je u unutrašnjosti bloka moguća rekonstrukcija, gradnja zamjenskih građevina i gradnja novih građevina i garaža za potrebe bloka; kod gradnje zamjenskih i novih građevina, u svrhu sanacije i afirmacije vrijednosti bloka u cjelini, obvezno je cjelovito rješenje građevne čestice; moguće je zadržati i planirati više građevina različitih namjena na istoj građevnoj čestici; pristup s javnoprometne površine preko ulične građevne čestice, odnosno kroz kolni prolaz ulične građevine; 8. gradnja javnih garaža nije moguća na prostoru Gornjeg grada i Kaptola i na prostoru omeđenom ulicama: Vlaškom, Bauerovom, Trgom Petra Krešimira IV., Hrvojevom, Borninom, Domagojevom, Branimirovom, Ul. Grgura Ninskog, južnim rubom Botaničkog vrta, Runjaninovom, Vodnikovom, Savskom, Ul. I. Kršnjavoga, Kačićevom i Ilicom, radi ograničenja motornog prometa u središtu grada. U toj zoni moguća je gradnja garaža prema odredbama članka 39. ovih odredbi, odnosno prema smjernicama za izradu predmetnog UPU-a; 9. unutar blokova Donjeg grada između Ulice Republike Austrije i Heinzelove ulice garaže se mogu graditi s najviše dvije podzemne etaže; za gradnju garaža s više od 100 PGM obavezna je provjera mogućnosti i utjecaja na okolni prostor prethodnom izradom prometne studije; 10. iznimno, za blokove označene na grafičkom prikazu 4a. Urbana pravila, 4b. Procedure urbano prostornog uređenja i 4d. Nepokretna kulturna dobra, prostorno rješenje odredit će se urbanističkim planom uređenja. Za te se blokove omogućuje razrada prostornih rješenja detaljnijom valorizacijom - detaljna konzervatorska podloga za cjelinu bloka, koju izrađuje nadležno tijelo zaštite (članak 92. ove odluke) uz uvjet zadržavanja pretežite visine u odnosu na blok tako da kisn ne bude veći od 3,0 odnosno postojeći ukoliko je veći. 11. Za sve blokove Donjeg grada na kojima se planiraju kompleksni zahvati uređenja kojima se bitno mijenja njihova postojeća prostorna i građevinska struktura / morfologija bloka potrebno je izraditi urbanistički plan uređenja temeljem urbanističkih programskih smjernica koje izrađuje Zavod (uz uvjet da kisn ne bude veći od 3,0, odnosno postojeći ukoliko je veći); 12. do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija uličnih građevina prema odredbama ovog članka, a u dvorištima rekonstrukcija građevina u postojećim gabaritima i gradnja novih građevina sukladno članku 104. ovih odredbi i prema pravilima za dvorišnu gradnju ovog članka; 13. urbanistički planovi uređenja izrađuju se prema općim prav orizaciju stanja te povijesne i funkcionalne vrijednosti bloka, odnosno pojedinih građevina stambeno-poslovnih, ili poslovnih građevina u istočnom dijelu bloka; obvezno planirati drvored uz zapadnu stranu Kačićeve; najveći kisn uskladiti s pretežitim kisn bloka; visinu građevine uskladiti s pretežitom visinom gradnje u bloku; uz obveznu i prioritetnu izradu detaljne konzervatorske podloge ili utvrđivanje sustava mjera zaštite nepokretnih kulturnih dobara. 8. UPU Hebrangova - Preradovićeva - Žerjavićeva - Gundulićeva - Trg Petra Svačića Planom utvrditi namjene u okvirima mješovite namjene gradskog središta (članak 10.a); omogućuje se revitalizacija dvorišta; prenamjena; rekonstrukcije, rušenje i nova gradnja uz prethodnu integralnu valorizaciju stanja te povijesne i funkcionalne vrijednosti bloka, odnosno pojedinih građevina; prolazi kroz blok - otkriveni i natkriveni; zaštita zelenila - vrtova u Žerjavićevoj i Preradovićevoj i parkovne arhitekture u Hebrangovoj 19; najveći kisn uskladiti s pretežitim kisn bloka; visina i izgrađenost prema detaljnim pravilima ovog članka; uz obveznu i prioritetnu izradu detaljne konzervatorske podloge ili utvrđivanje sustava mjera zaštite nepokretnih kulturnih dobara. 9. UPU Vlaška - Šubićeva - Martićeva - Derenčinova Planom utvrditi namjene u okvirima mješovite namjene gradskog središta (članak 10.a); uređenje i dovršenje, uz rušenje i novu gradnju uz prethodnu integralnu valorizaciju stanja te povijesne i funkcionalne vrijednosti bloka, odnosno pojedinih građevina; zaštita i obnova zgrada bivše tvornice Badel iz doba razvoja zagrebačke industrije; prenamjena u poslovno-prodajne prostore i prostore kulture, primjerene gradskom središtu; nova gradnja javne, stambene, trgovačke, poslovne namjene; najveći kisn uskladiti s pretežitim kisn bloka; uz obveznu i prioritetnu izradu detaljne konzervatorske podloge ili utvrđivanje sustava mjera zaštite nepokretnih kulturnih dobara; prostor određen za gradske projekte u skladu sa člankom 101. ovih odredbi. 10. UPU Bornina - Erdödyjeva - Branimirova - Domagojeva Zadržavanje postojeće pretežito stambene namjene; uređenje i dovršenje i nova gradnja uz prethodnu integralnu valorizaciju stanja te povijesne i funkcionalne vrijednosti bloka, odnosno pojedinih građevina; nova gradnja uz Borninu i Branimirovu i u središnjem dijelu bloka, stambene, javne, ugostiteljsko-turističke i poslovne namjene primjerene stanovanju; najveći kisn uskladiti s pretežitim kisn bloka; visinu građevine uskladiti s pretežitom visinom gradnje u bloku; uz obveznu i prioritetnu izradu detaljne konzervatorske podloge ili utvrđivanje sustava mjera zaštite nepokretnih kulturnih dobara. Kapacitet garaže može biti veći od propisanog u stavku 2. točki 9. ovog članka, ali ne veći od 200 PGM, za potrebe stanovnika i korisnika bloka.", "(4) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja ugrađenih, poluugrađenih i slobodnostojećih građevina; 2. oblik i veličina ulične građevne čestice u pravilu su postojeći; 3. u granicama Povijesne urbane cjeline Grada Zagreba sustava zaštite A, ne mogu se spajati građevne čestice uz ulicu, osim za javnu i društvenu namjenu; 4. promjena oblika i veličine uličnih građevnih čestica moguća je samo temeljem urbanističkog plana uređenja cijelog bloka koji u grafičkom dijelu propisuje oblik i veličinu građevnih čestica u mjerilu 1:1000 ili 1:2000; iznimno, dozvoljena je promjena oblika i veličine građevnih čestica za rekonstrukciju građevina javne i društvene namjene; 5. najveća izgrađenost ulične građevne čestice je 60%, a na uglovima 80%, najveća izgrađenost dvorišne građevne čestice je 30%, osim za građevine javne i društvene namjene; u blokovima najužega gradskog središta (označeno na grafičkom prikazu 4a. Urbana pravila) moguća je i veća izgrađenost građevne čestice, ali ne veća od 80%, u cilju javnog korištenja unutrašnjosti bloka i stvaranja javnih pješačkih površina i prolaza; 6. najveći kisn ulične građevne čestice uskladiti s pretežitim krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 6. u svrhu zaštite urbaniteta, posebno uz formirane ulice, nije dozvoljeno uklanjanje postojećih građevina u svrhu gradnje parkirališta i/ili garaža kao isključive namjene; rampe za ulaz u garažu, dizala za automobile i sl. smjestiti unutar gabarita osnovne građevine; 7. uređenje i ograđivanje građevne čestice, u skladu s uvjetima iz članka 35. ovih odredbi.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. zadržavaju se oblik i veličina postojećih građevnih čestica; ne mogu se dijeliti postojeće građevne čestice radi oblikovanja dviju ili više građevnih čestica; iznimno dozvoljeno je spajanje manjih građevnih čestica na način da novoformirana građevna čestica oblikom i veličinom bude u skladu s ostalim građevnim česticama u ulici prema lokalnim uvjetima; 2. izgrađenost građevne čestice određena je postojećom izgrađenošću okolnih građevnih čestica, ali ne može biti veća od 30% za slobodnostojeće, 40% za poluugrađene i 50% za ugrađene građevine; u gradnji interpolacija, rekonstrukciji, dogradnji i nadogradnji dubina tlocrta građevine može biti u skladu s pretežitom dubinom uličnog poteza u skladu s lokalnim uvjetima i vrijednostima prostora, odnosno do najviše 12,0 m ukoliko je dubina manja; 3. najveća visina tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 4. najveći kisn 1,0; najveći GBP 400 m²; najviše tri samostalne uporabne jedinice; u rekonstrukciji i zamjenskoj gradnji može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 5. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; 6. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 7. obvezno zadržavanje postojećeg predvrta te izvedba predvrta u skladu s lokalnim uvjetima u ulici; 8. najmanje 1 PGM/1 stan, obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), druge namjene prema normativima ove odluke; 9. zadržava se kontinuirani građevni pravac postojećih građevina; 10. najmanja udaljenost građevine od međe susjedne građevne čestice 3,0 m osim od međa na koju je prislonjena; postojeća manja udaljenost može se zadržati u rekonstrukciji; 11. arhitektonsko oblikovanje građevine mora biti usklađeno s okolnom gradnjom; poluugrađene građevine građene kao dvojne te ugrađene građevine koje su dio planiranih nizova moraju biti oblikovno usklađene (visina vijenca, građevinska linija, oblik krova i dr.) s ostalim građevinama s kojima čine cjelinu; postojeće i zatečene zgrade u prostoru koje odudaraju od izvornog oblikovanja niza ili uličnog poteza ne mogu se uzimati kao referentne točke s kojima se usklađuju ostale građevine; 12. iznimno, za naselje Dr. Ante Starčević u Dubravi, rekonstrukcija u gabaritima prema izvornom konceptu naselja, maksimalna dubina građevine iznosi 15,0 m (odnosi se na prizemni aneks, prema izvornom konceptu naselja); za naselje individualne izgradnje sjeverno od Borongajske ceste na Volovčici maksimalna dubina građevina je 12,0 m, a za područje Šćitarjevske ulice maksimalna dubina građevina je 16,0 m; ostali parametri prema detaljnim pravilima; 13. iznimno, na prostoru Trnja, u Cvjetnom naselju, koje je zaštićeno kao povijesna graditeljska cjelina, gradnja novih i rekonstrukcija postojećih građevina moguća je prema konzervatorskim uvjetima nadležnog tijela zaštite; obavezno je zadržavanje postojeće parcelacije; gradnja slobodnostojećih građevina; obavezno je zadržavanje predvrta, visokog zelenila i transparentne ograde; najmanja površina prirodnog terena je 60% površine građevne čestice; najveća izgrađenost građevne čestice je 25%; najveći kisn 0,5; najveći GBP 400 m²; najmanja površina građevne čestice je 750 m²; u rekonstrukciji i gradnji zamjenskih građevina n
