m individualne i niske gradnje; 53.3. uređenje pristupne zone groblja; 53.4. preispitivanje i oblikovanje koridora Aleje tišine sukladno njezinom značaju kao težišne osi prostora plana; 53.5. oblikovanje sjevernog pročelja Oporovečke / Ulice Rudolfa Kolaka; 53.6. unapređenje prometne i infrastrukturne mreže; 53.7. planiranje i uređenje javnih prostora i sadržaja; 54. UPU Zagrebačka avenija - Anina 54.1. transformacija postojećih izgrađenih dijelova naselja u prostor visokog urbanog standarda; 54.2. površine mješovite-pretežito stambene namjene i površina javne i društvene namjene, te uređenje javnih zelenih površina; 54.3. planom preispitati mogućnost transformacije tipologije u funkciji afirmacije poteza urbaniteta uz gradsku aveniju; 54.4. komunalno opremanje zemljišta i dopunjavanje i humanizacija postojeće prometne mreže na principima rješenja temeljenih na prirodi. 55. UPU Gredelj i Glavni kolodvor 55.1. prostor određen za gradske projekte u skladu sa člankom 101. ovih odredbi; 55.2. transformacija postojeće izgrađene strukture vodeći računa o zaštićenome kulturnom dobru; 55.3. omogućava se gradnja složenih zahvata prometne infrastrukture, uključivo rješenje nivelete željezničke pruge, rješenje glavnog željezničkog kolodvora s pratećim sadržajima te rješenje prometnih veza (podzemnih, nadzemnih) Donjeg Grada s prostorom Trnja; 55.4. u sjevernom dijelu obuhvata na području infrastrukturne namjene (IS) mogućnost planiranja i sadržaja mješovite namjene (do 40% obuhvata područja IS namjene) bez mogućnosti gradnje građevina viših od devet etaža; 55.5. uređenje površine mješovite namjene planiranjem pretežito visoke gradnje; 55.6. u središnjem i južnom dijelu obuhvata (područje mješovite namjene) preispitat će se mogućnost gradnje građevina viših od 9 etaža; 55.7. gustoća stanovanja neto ne bi trebala biti veća od 600 st/ha; 55.8. osiguranje površina javne i društvene namjene primjereno položaju u gradu i u skladu sa zahtjevima javnopravnih tijela; 55.9. uređenje novih javnih prostora; 55.10. sastavni dio plana treba biti Plan krajobraznog uređenja; 55.11. moguće je u obuhvat UPU-a uzeti i širu zonu zajedno s Autobusnim kolodvorom; 55.12. obavezna je izrada prometne studije iz članka 102. ovih odredbi; rezultati studije bit će podloga za izradu programa za provedbu javnog urbanističkoarhitektonskog natječaja kao podloge za izradu UPU-a."]}, "3.2.": {"clanak": "83", "naziv": "Nova regulacija na neizgrađenom neuređenom prostoru", "prostori": "Trnava, Gajnice - zapad, Škorpikova ulica - istok, Jankomir, Oranice, Savska Opatovina, Prečko, Vrbani, Grmoščica, Degidovec, Dankovec, Slanovec, Oporovec, Zabavni park - istok, Dubrava - centar, Slavonska - sjever, Čulinečka - zapad, Resnik, Savica - Šanci, Borovje, Savica - Petruševec, Grana, RC Granešina, Mladoles I, Mladoles II, petlja Lučko - sjever, petlja Lučko - jug, Blato - jug, Botinec - zapad, Savski park - zapad, Remetinec rotor - istok, Remetinec rotor - zapad, Prudnice, Zagrebački velesajam - istok Mrzljak- Otočec, Čizmešinka, Klara, Podbrežje, Buzinski Krči, Dugave - jug,, Jakuševec, park Novi Zagreb, Središće - zapad i drugo prema grafičkom prikazu.", "opca": ["gradnja ulične mreže, mreže javnih prostora i građevina te uređenje neizgrađenih površina prema urbanističkom planu uređenja;", "obvezno je donošenje urbanističkog plana uređenja;", "obavezni dio plana treba biti plan zelenila odnosno plan zelene infrastrukture koji uključuje gospodarenje oborinskom odvodnjom na principima rješenja temeljenih na prirodi;", "sastavni dio plana treba biti i prijedlog parcelacije i formiranja fizičke strukture;", "do donošenja odgovarajuće gradske odluke tijekom pripreme i izrade urbanističkog plana uređenja treba provoditi rane participativne procese;", "programom za izradu urbanističkog plana uređenja definirat će se osnovni urbanistički parametri za korištenje prostora, način korištenja i uređenja površina, sukladno planiranoj namjeni, javnim i društvenim potrebama, poštujući vrijednosti i specifičnosti područja za koje se izrađuje urbanistički plan uređenja, primjenom mjera prilagodbe klimatskim promjenama za razvoj klimatski neutralnih dijelova grada;", "posebnu pažnju obratiti pri određivanju položaja višestambenih građevina na način da se izbjegne jednostrana orijentacija stambenih jedinica na sjever;", "ukoliko postotak zelenila nije definiran u pojedinom urbanom pravilu koje se primjenjuje za konkretno područje prilikom planiranja stambene odnosno mješovite namjene potrebno je osigurati najmanje 16 m² zelenih površina po stanovniku ili 30% od površine stambene odnosno mješovite namjene u svrhu ublažavanja klimatskih promjena. U navedene zelene površine ubrajaju se i otvorene sportsko-rekreacijske površine ako imaju svojstvo upojnosti;", "u obuhvatima urbanističkih planova uređenja koji se donose za površine mješovite namjene potrebno je osigurati površine za igrališta za djecu do 6 godina od najmanje 4m² po djetetu te najmanje 3 m² sportsko-rekreacijskih površina po stanovniku;", "u zonama javnih gradskih površina - tematskim zonama (Z4) mogu se graditi građevine iz članka 15. ovih odredbi; gradnja građevina je moguća uz uvjet da kisn nije veći od 0,2; podzemne garaže nemaju ograničenja maksimalnog GBPa;", "do donošenja urbanističkog plana uređenja mogući su zahvati u skladu s člankom 104. ove odluke;", "na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."], "zone": [], "tekst": ["(1) Nova regulacija na neizgrađenom neuređenom prostoru (3.2.) - prostori: Trnava, Gajnice - zapad, Škorpikova ulica - istok, Jankomir, Oranice, Savska Opatovina, Prečko, Vrbani, Grmoščica, Degidovec, Dankovec, Slanovec, Oporovec, Zabavni park - istok, Dubrava - centar, Slavonska - sjever, Čulinečka - zapad, Resnik, Savica - Šanci, Borovje, Savica - Petruševec, Grana, RC Granešina, Mladoles I, Mladoles II, petlja Lučko - sjever, petlja Lučko - jug, Blato - jug, Botinec - zapad, Savski park - zapad, Remetinec rotor - istok, Remetinec rotor - zapad, Prudnice, Zagrebački velesajam - istok Mrzljak- Otočec, Čizmešinka, Klara, Podbrežje, Buzinski Krči, Dugave - jug,, Jakuševec, park Novi Zagreb, Središće - zapad i drugo prema grafičkom prikazu.", "(2) Opća pravila: 1. gradnja ulične mreže, mreže javnih prostora i građevina te uređenje neizgrađenih površina prema urbanističkom planu uređenja; 2. obvezno je donošenje urbanističkog plana uređenja; 3. obavezni dio plana treba biti plan zelenila odnosno plan zelene infrastrukture koji uključuje gospodarenje oborinskom odvodnjom na principima rješenja temeljenih na prirodi; 4. sastavni dio plana treba biti i prijedlog parcelacije i formiranja fizičke strukture; 5. do donošenja odgovarajuće gradske odluke tijekom pripreme i izrade urbanističkog plana uređenja treba provoditi rane participativne procese; 6. programom za izradu urbanističkog plana uređenja definirat će se osnovni urbanistički parametri za korištenje prostora, način korištenja i uređenja površina, sukladno planiranoj namjeni, javnim i društvenim potrebama, poštujući vrijednosti i specifičnosti područja za koje se izrađuje urbanistički plan uređenja, primjenom mjera prilagodbe klimatskim promjenama za razvoj klimatski neutralnih dijelova grada; 7. posebnu pažnju obratiti pri određivanju položaja višestambenih građevina na način da se izbjegne jednostrana orijentacija stambenih jedinica na sjever; 8. ukoliko postotak zelenila nije definiran u pojedinom urbanom pravilu koje se primjenjuje za konkretno područje prilikom planiranja stambene odnosno mješovite namjene potrebno je osigurati najmanje 16 m² zelenih površina po stanovniku ili 30% od površine stambene odnosno mješovite namjene u svrhu ublažavanja klimatskih promjena. U navedene zelene površine ubrajaju se i otvorene sportsko-rekreacijske površine ako imaju svojstvo upojnosti; 9. u obuhvatima urbanističkih planova uređenja koji se donose za površine mješovite namjene potrebno je osigurati površine za igrališta za djecu do 6 godina od najmanje 4m² po djetetu te najmanje 3 m² sportsko-rekreacijskih površina po stanovniku; 10. u zonama javnih gradskih površina - tematskim zonama (Z4) mogu se graditi građevine iz članka 15. ovih odredbi; gradnja građevina je moguća uz uvjet da kisn nije veći od 0,2; podzemne garaže nemaju ograničenja maksimalnog GBPa; 11. do donošenja urbanističkog plana uređenja mogući su zahvati u skladu s člankom 104. ove odluke; 12. na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(3) Programske smjernice: 1. UPU Dubrava – centar 1.1. artikuliranje središnjeg prostora Dubrave; 1.2. definiranje odgovarajućeg mjerila i tipologije gradnje u skladu s lokalnim uvjetima; 1.3. uređenje novih javnih prostora i gradske infrastrukture; 1.4. povezivanje postojećih i planiranih sadržaja u homogenu cjelinu. 2. UPU Prečko – jug 2.1. površine stambene namjene; 2.2. uređenje prostora visoke gradnje; 2.3. uređenje neizgrađenoga komunalno neuređenog prostora u novu stambenu zonu. 3. UPU Stara Loza - Donje Prečko I definiranje potreba za sadržajima javne i društvene namjene širega gravitirajućeg područja i UPU-a Stara Loza - Donje Prečko II. prema kapacitetima zone i posebnim propisima kojima se određuje standard sadržaja javne i društvene namjene. 4. UPU Stara Loza - Donje Prečko II 4.1. javne zelene površine - tematski park; 4.2. gradnja infrastrukturnih građevina; 4.3. uređenje (sadržajna struktura, opremljenost građevinama i drugo) u skladu s obilježjima prirodnog krajolika i karakteristikama ekološkog sustava, ograničenjima prostora - vodocrpilište i važnošću prostora - Savski park; 4.4. teme parka planirati kao nastavak srodnih sportsko-rekreacijskih sadržaja na potezu prema Jarunskom jezeru; 4.5. intervencije u ovom prostoru prema propozicijama nadležnog tijela zaštite. 5. UPU Sportski park Jarun 5.1. javne zelene površine - tematski park; 5.2. uređenje prostora tematskog parka kao sportsko-rekreacijske površine, odnosno kao nastavak i sadržajnu dopunu RSC Jarun; 5.3. zaštita, čuvanje i uređenje vrijednosti kompleksa kao krajobrazne cjeline; očuvanje karakterističnih vizura, elemenata identiteta i slike kompleksa, kvalitetnih i uređenih zelenih površina. 6. UPU Vrbani III. 6.1. površine mješovite namjene i sportsko-rekreacijske namjene; 6.2. uređenje prostora pretežito visoke gradnje i sportsko-rekreacijska namjena prema pravilima za uređenje, zaštitu i urbanu obnovu kompleksa jedne namjene; 6.3. preispitat će se mogućnost gradnje građevina viših od 9 etaža; 6.4. uređenje komunalno neopremljenoga i pretežno neizgrađenoga osobito vrijednoga kontaktnog prostora s RSC Jarun; 6.5. preispitat će se mogućnost gradnje pratećih sadržaja za stanovnike naselja, infrastrukturnih građevina (javne garaže i građevina za potrebe ZET-a) te građevina za potrebe smještaja sportaša. 7. UPU Savska Opatovina 7.1. površine mješovite namjene; 7.2. uređenje prostora pretežito visoke gradnje; 7.3. uređenje komunalno neopremljenoga i pretežno neuređenoga prostora uz gradsku aveniju; 7.4. uređenje nove poslovne-stambeno zone. 8. UPU Dubravica - Karažnik 8.1. organizacija prostora i razgraničenje namjene između površina sporta i rekreacije i mješovite namjene; 8.2. udio površine mješovite namjene do 60% površine područja; 8.3. uz ulicu Karažnik predviđa se dopunjavanje poteza individualne gradnje, a za novo naselje tipologija visoke gradnje prilagođena prirodnim karakteristikama prostora i potezu zapadnog ulaza u grad; 8.4. uređenje površina za sport i rekreaciju prema urbanim pravilima za uređenje kompleksa jedne namjene; 8.5. definiranje nove prometne mreže te njeno povezivanje s postojećom mrežom naselja Gajnice i mrežom na prostoru nekadašnje Tvornice cementa u Podsusedu. 9. UPU Remetinec rotor – istok 9.1. uređenje prostora niskoga urbanog standarda u područje visokoga urbanog standarda iznimne važnosti za identitet grada, u dijelu mješovite-pretežito poslovne namjene, u skladu s novim standardima urbanističkog planiranja; 9.2. preispitati mogućnost gradnje građevina viših od 9 etaža; 9.3. omogućiti prometno povezivanje, kolno, pješačko i biciklistički, prostora u obuhvatu plana i prostora Kajzerice (na istoku, izvan obuhvata plana) povezivanjem postojećih prometnih koridora i planiranjem novih; 9.4. planirati postaju putničkoga prigradskog i gradskog prometa s prostorom 'park and ride' terminala na jugoistočnom dijelu obuhvata uz Aveniju Dubrovnik s mogućnošću povezivanja na planirane željezničke stanice izvan obuhvata Plana i intermodalnu stanicu; 9.5. obavezna provedba javnog urbanističko-arhitektonskog natječaja kao podloge za izradu UPU-a. 10. UPU Remetinec rotor – zapad 10.1. uređenje i transformacija prostora u područje visokoga urbanog standarda iznimne važnosti za identitet grada, u dijelu mješovita - pretežito poslovna namjena; 10.2. uređenje gospodarske namjene - poslovne, visokom i niskom gradnjom, uređenjem, zaštitom i urbanom obnovom kompleksa jedne namjene; 10.3. preispitat će se mogućnost gradnje građevina viših od 9 etaža; 10.4. uređenje javne zelene površine u skladu s osnovnim hidrotehničkim obilježjima, obilježjima prirodnog krajolika, karakteristikama ekološkog sustava. 11. UPU Savski park – zapad 11.1. nova regulacija prostora kojim se definira jugozapadni ulaz u grad u područje najvišeg urbanog standarda, koji u identitetskom sustavu pridonosi prepoznatljivosti Grada specifičnim tematskim i estetskim dimenzijama; 11.2. planiranje mješovite i poslovne namjene s adekvatno dimenzioniranim i pozicioniranim javnim zelenim površinama i sadrž // --- mreža: svaki zahtjev ima rok, nikad ne visi
async function getJSON(url,opts={},ms=10000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{...opts,signal:c.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json(); if(j.error) throw new Error(j.error.message||"greška servisa"); return j;
  }catch(e){throw new Error(e.name==="AbortError"?"nema odgovora nakon "+ms/1000+" s":(e.message||"greška mreže"))}
  finally{clearTimeout(t)}
}
function pointQuery(url,ll,fields="*",geom=true){
  const p=new URLSearchParams({geometry:ll.lng+","+ll.lat,geometryType:"esriGeometryPoint",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(geom),outSR:"4326",f:"geojson"});
  return getJSON(url+"?"+p.toString()).then(g=>g.features||[]);
}
function polyQuery(url,geom,fields="*",withGeom=true){
  const rings=geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat();
  const p=new URLSearchParams({geometry:JSON.stringify({rings,spatialReference:{wkid:4326}}),geometryType:"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(withGeom),outSR:"4326",f:"geojson"});
  return getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()}).then(g=>g.features||[]);
}

async function inspect(ll){
  const id=++clickId;
  selLayer.clearLayers();
  L.circleMarker(ll,{radius:5,color:"#000",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(selLayer);
  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim česticu, namjenu i urbano pravilo…</p>';
  const [ces,nam,up,upx,gn]=await Promise.all([
    settle(pointQuery(SRC.cestice,ll)),
    settle(pointQuery(SRC.namjena,ll)),
    settle(pointQuery(SRC.pravila,ll,"BROJ_UP",false)),
    settle(pointQuery(SRC.iznimke,ll,"LAYER",false)),
    settle(pointQuery(SRC.gupNam,ll,"NAMJENA1,NAMJENA2",false))
  ]);
  if(id!==clickId) return;
  const parcel=ces.v&&ces.v[0]?ces.v[0]:null;
  let zones=nam.v||[], area=null;
  if(parcel){
    area=turf.area(parcel.geometry);
    L.geoJSON(parcel.geometry,{style:{color:"#111",weight:3,fill:false},interactive:false}).addTo(selLayer);
    try{zones=await polyQuery(SRC.namjena,parcel.geometry)}catch(e){}
    if(id!==clickId) return;
  }
  const rows=zones.map(z=>{
    let share=null;
    if(parcel){try{const i=turf.intersect(parcel.geometry,z.geometry);share=i?turf.area(i)/area:0}catch(e){}}
    return {p:z.properties,share,geom:z.geometry};
  }).filter(r=>r.share===null||r.share>0.005).sort((a,b)=>(b.share??0)-(a.share??0));
  rows.forEach(r=>L.geoJSON(r.geom,{style:{color:COLORS[r.p.Analitika]||"#888",weight:1,fillOpacity:.3},interactive:false}).addTo(selLayer));
  // pokaži osnovno odmah, provjere stižu za trenutak
  const base={ll,parcel,area,rows,ces,nam,up,upx,gn,checks:null};
  render(base);
  // malo smanjena čestica, da susjedni sloj koji samo dodiruje među ne bude pogodak
  let qGeom=null;
  if(parcel){try{const b=turf.buffer(parcel.geometry,-0.0008,{units:"kilometers"});qGeom=b&&b.geometry?b.geometry:parcel.geometry}catch(e){qGeom=parcel.geometry}}
  const slopeP=settle(loadSlope(parcel,ll));
  const checks=await Promise.all(CHECKS.map(c=>settle(
    c.corridor?corridorQuery(c,parcel,ll):
    (qGeom?polyQuery(c.url,qGeom,c.fields,!!c.draw):pointQuery(c.url,ll,c.fields,!!c.draw))
  ).then(r=>({c,...r}))));
  checks.forEach(r=>{if(r.c.corridor&&r.v) r.v.forEach(f=>L.geoJSON(f.geometry,{style:{color:r.c.id==="dv"?"#b3261e":"#a86400",weight:3,dashArray:"8 6"},interactive:false}).addTo(selLayer))});
  // gradivi dio i nagib terena
  const env2=buildEnvelope(parcel,rows,up);
  if(env2&&env2.geom) L.geoJSON(env2.geom,{style:{color:"#1f6f54",weight:2,dashArray:"4 3",fillColor:"#1f6f54",fillOpacity:.25},interactive:false}).addTo(selLayer);
  base.envelope=env2;
  base.slope=await slopeP;
  if(id!==clickId) return;
  checks.forEach(r=>{if(r.c.draw&&r.v) r.v.forEach(f=>f.geometry&&L.geoJSON(f.geometry,{style:{color:r.c.draw,weight:2,dashArray:"5 4",fillOpacity:.15},interactive:false}).addTo(selLayer))});
  render({...base,checks});
  const env=await settle(loadEnv(ll,parcel));
  if(id!==clickId) return;
  render({...base,checks,env});
}

// --- koridori: dohvat linija u krugu i provjera stvarne udaljenosti
async function corridorQuery(c,parcel,ll){
  const geom=parcel?parcel.geometry:{type:"Point",coordinates:[ll.lng,ll.lat]};
  const p=new URLSearchParams({geometry:geom.type==="Point"?ll.lng+","+ll.lat:JSON.stringify({rings:geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat(),spatialReference:{wkid:4326}}),
    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(c.search),units:"esriSRUnit_Meter",
    outFields:c.fields,returnGeometry:"true",outSR:"4326",f:"geojson"});
  const g=await getJSON(c.url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  return (g.features||[]).filter(f=>{
    if(!f.geometry) return false;
    const d=corrDist(f.properties||{},c.corridor);
    try{const b=turf.buffer(f.geometry,d/1000,{units:"kilometers"}); return turf.booleanIntersects(b,geom)}catch(e){return true}
  });
}
// --- gradivi dio: čestica umanjena za udaljenost od međe, samo u zonama koje dopuštaju gradnju
function buildEnvelope(parcel,rows,up){
  if(!parcel) return null;
  let d=3;
  try{
    const code=up.v&&up.v[0]?String(up.v[0].properties.BROJ_UP||"").trim():null;
    const rule=code?RULES[code]||RULES[code+"."]:null;
    const z=rule&&rows[0]?pickZone(rule,rows[0].p.Analitika):null;
    const m=z&&(z.key.meda||"").match(/(\d+,\d+|\d+)\s*m\b/); if(m) d=parseFloat(m[1].replace(",","."));
  }catch(e){}
  try{
    let env=turf.buffer(parcel.geometry,-d/1000,{units:"kilometers"});
    if(!env||!env.geometry) return {geom:null,area:0,d};
    const bz=rows.filter(r=>BUILDABLE.has(r.p.Analitika)&&r.geom);
    if(bz.length&&bz.length<rows.length){
      let u=null;
      for(const r of bz){const i=turf.intersect(env,{type:"Feature",geometry:r.geom,properties:{}}); if(i) u=u?turf.union(u,i):i;}
      env=u;
    } else if(!bz.length) env=null;
    return {geom:env?env.geometry:null,area:env?turf.area(env):0,d};
  }catch(e){return null}
}
// --- nagib terena (Copernicus DEM preko Open-Meteo; rezolucija oko 90 m, orijentacijski)
async function loadSlope(parcel,ll){
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const pt=turf.point(c), D=0.04; // 40 m na svaku stranu
  const pts=[0,90,180,270].map(b=>turf.destination(pt,D,b,{units:"kilometers"}).geometry.coordinates);
  pts.unshift(c);
  const q=new URLSearchParams({latitude:pts.map(p=>p[1].toFixed(6)).join(","),longitude:pts.map(p=>p[0].toFixed(6)).join(",")});
  const j=await getJSON("https://api.open-meteo.com/v1/elevation?"+q.toString(),{},10000);
  const e=j.elevation; if(!e||e.length<5) throw new Error("nema podataka o visini");
  const dz_ns=(e[1]-e[3]), dz_ew=(e[2]-e[4]);
  const slope=Math.sqrt(dz_ns*dz_ns+dz_ew*dz_ew)/(2*D*1000)*100;
  const dirs=["sjever","istok","jug","zapad"], low=[e[1],e[2],e[3],e[4]].indexOf(Math.min(e[1],e[2],e[3],e[4]));
  return {h:Math.round(e[0]),slope,down:dirs[low]};
}

// --- pristup i okolina iz OpenStreetMapa (Overpass)
const ROAD_OK=/^(primary|secondary|tertiary|unclassified|residential|living_street|service|trunk|primary_link|secondary_link|tertiary_link)$/;
async function loadEnv(ll,parcel){
  let ring;
  if(parcel){
    const g=parcel.geometry, r=(g.type==="Polygon"?g.coordinates[0]:g.coordinates[0][0]);
    const step=Math.max(1,Math.ceil(r.length/20));
    ring=r.filter((_,i)=>i%step===0).concat([r[0]]).map(c=>c[1].toFixed(6)+","+c[0].toFixed(6)).join(",");
  }else ring=ll.lat.toFixed(6)+","+ll.lng.toFixed(6);
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const P=c[1].toFixed(6)+","+c[0].toFixed(6);
  const q=`[out:json][timeout:15];
way(around:12,${ring})[highway]->.r; .r out tags;
(node(around:600,${P})[highway=bus_stop];node(around:600,${P})[railway=tram_stop];node(around:900,${P})[railway=station];
 node(around:1200,${P})[amenity=kindergarten];way(around:1200,${P})[amenity=kindergarten];
 node(around:1500,${P})[amenity=school];way(around:1500,${P})[amenity=school];
 node(around:1000,${P})[shop=supermarket];way(around:1000,${P})[shop=supermarket];
 node(around:1500,${P})[amenity=pharmacy];)->.e; .e out tags center;`;
  // više Overpass servera: prvi koji odgovori pobjeđuje
  const body="data="+encodeURIComponent(q);
  const ask=u=>getJSON(u+"?"+body,{},20000);
  const j=await Promise.any(["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"].map(ask))
    .catch(()=>{throw new Error("serveri za podatke o okolini trenutno ne odgovaraju, pokušaj ponovno za minutu")});
  const here=turf.point(c);
  const dist=e=>{const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon; return lat==null?null:Math.round(turf.distance(here,turf.point([lon,lat]),{units:"kilometers"})*1000)};
  const roads=[], seen=new Set();
  const out={roads, stops:[], kinder:null, school:null, shop:null, pharmacy:null};
  const nearest=(key,e)=>{const d=dist(e); if(d==null) return; if(!out[key]||d<out[key].d) out[key]={n:e.tags.name||"bez naziva",d}};
  for(const e of j.elements||[]){
    const t=e.tags||{};
    if(e.type==="way"&&t.highway){const k=(t.name||t.highway)+"|"+t.highway; if(!seen.has(k)){seen.add(k);roads.push({name:t.name,hw:t.highway,ok:ROAD_OK.test(t.highway),surface:t.surface,width:t.width})}}
    else if(t.highway==="bus_stop"||t.railway==="tram_stop"||t.railway==="station"){const d=dist(e); if(d!=null) out.stops.push({n:t.name||"stanica",d,type:t.railway==="tram_stop"?"tramvaj":t.railway==="station"?"vlak":"autobus"})}
    else if(t.amenity==="kindergarten") nearest("kinder",e);
    else if(t.amenity==="school") nearest("school",e);
    else if(t.shop==="supermarket") nearest("shop",e);
    else if(t.amenity==="pharmacy") nearest("pharmacy",e);
  }
  // najbliža stanica po vrsti
  const byType={}; for(const s of out.stops) if(!byType[s.type]||s.d<byType[s.type].d) byType[s.type]=s;
  out.stops=Object.values(byType).sort((a,b)=>a.d-b.d);
  return out;
}
const HW_NAMES={primary:"glavna cesta",secondary:"sporedna cesta",tertiary:"lokalna cesta",unclassified:"nerazvrstana cesta",residential:"stambena ulica",living_street:"pješačko-kolna zona",service:"servisni put",track:"poljski put",path:"staza",footway:"pješačka staza",steps:"stube",trunk:"brza cesta",cycleway:"biciklistička staza"};
function envHtml(env,gbp){
  let h=`<h2>Pristup i okolina</h2>`;
  if(!env){return h+`<p class="hint"><span class="spin"></span>Tražim ceste i sadržaje u blizini…</p>`}
  if(env.e){return h+`<p class="err">OpenStreetMap: ${esc(env.e)}</p>`}
  const o=env.v, car=o.roads.filter(r=>r.ok), other=o.roads.filter(r=>!r.ok);
  if(car.length) h+=`<ul class="checks"><li class="chk chk-ok"><b>Kolni pristup</b><span>${car.map(r=>esc((r.name||"ulica bez naziva")+" ("+(HW_NAMES[r.hw]||r.hw)+(r.surface&&/unpaved|gravel|dirt|ground/.test(r.surface)?", neasfaltirano":"")+")")).join(", ")}</span></li></ul>`;
  else if(other.length) h+=`<ul class="checks"><li class="chk chk-warn"><b>Pristup</b><span>Uz česticu je samo ${other.map(r=>esc(HW_NAMES[r.hw]||r.hw)).join(", ")}. Za gradnju treba pristup s prometne površine propisane širine; provjeri status puta.</span></li></ul>`;
  else h+=`<ul class="checks"><li class="chk chk-warn"><b>Pristup</b><span>U OpenStreetMapu nema ceste uz česticu. Provjeri ima li čestica izlaz na javni put ili služnost prolaza.</span></li></ul>`;
  const rows=[];
  for(const s of o.stops) rows.push([`Stanica (${s.type})`,`${s.n} · ${s.d} m`]);
  if(!o.stops.length) rows.push(["Javni prijevoz","nema stanice unutar 600 m"]);
  if(o.kinder) rows.push(["Vrtić",`${o.kinder.n} · ${o.kinder.d} m`]);
  if(o.school) rows.push(["Škola",`${o.school.n} · ${o.school.d} m`]);
  if(o.shop) rows.push(["Trgovina",`${o.shop.n} · ${o.shop.d} m`]);
  if(o.pharmacy) rows.push(["Ljekarna",`${o.pharmacy.n} · ${o.pharmacy.d} m`]);
  h+=`<dl class="kv">${rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl><p class="meta">Udaljenosti zračnom linijom od sredine čestice. Vodovod i kanalizacija nisu javno dostupni kao podaci; provjeri kod Vodoopskrbe i odvodnje.</p>`;
  return h;
}

// --- izvlačenje brojeva iz teksta pravila (za slobodnostojeću građevinu)
const toNum=s=>parseFloat(String(s).replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
function parseParams(key){
  const out={};
  const c=key.cestica||"";
  let m=c.match(/(\d[\d.]*)\s*m²\s*za\s+slobodnostoje/u)||c.match(/slobodnostoje\p{L}*(?:\s+građevin\p{L}*)?(?:\s+je)?\s+(\d[\d.]*)\s*m²/u)||c.match(/(\d[\d.]*)\s*m²/u);
  if(m) out.minC=toNum(m[1]);
  const iz=key.izgradenost||"";
  m=iz.match(/(\d+)\s*%\s*za\s+slobodnostoje/u)||iz.match(/slobodnostoje\p{L}*[^%;]*?(\d+)\s*%/u)||iz.match(/(\d+)\s*%/u);
  if(m) out.izg=toNum(m[1])/100;
  const k=key.kis||"";
  m=k.match(/kisn?\s+(?:za\s+slobodnostoje\p{L}*(?:\s+građevin\p{L}*)?\s+)?(?:je\s+)?(\d+,\d+)/u);
  if(m) out.kis=toNum(m[1]);
  const g=(key.gbp||"")+" "+k;
  m=g.match(/GBP\s+(?:je\s+)?(\d[\d.]*)\s*m²/);
  if(m) out.gbp=toNum(m[1]);
  m=(key.teren||"").match(/(\d+)\s*%/);
  if(m) out.teren=toNum(m[1])/100;
  return out;
}
function pickZone(rule,analitika){
  if(!rule||!rule.zone||!rule.zone.length) return null;
  const keys=ZONE_KEYS[analitika]||[];
  return rule.zone.find(z=>keys.some(k=>z.zona.toLowerCase().includes(k)))||(keys.length?null:null);
}

  }
  if(checks) h+=docsHtml(d);
  h+=`<div class="links"><a href="https://oss.uredjenazemlja.hr/" target="_blank" rel="noopener">Katastar (OSS)</a><a href="https://geoportal.zagreb.hr/Karta" target="_blank" rel="noopener">Geoportal Zagreb</a><a href="https://www.zzpugz.hr/gup-grada-zagreba" target="_blank" rel="noopener">GUP (Zavod)</a><a href="https://www.google.com/maps?q=${ll.lat},${ll.lng}" target="_blank" rel="noopener">Google Maps</a></div>`;

function kdText(v,r){
  v=parseFloat(String(v).replace(",",".")); r=parseFloat(String(r).replace(",","."));
  if(!(r>0)) return "izaberi zonu";
  if(!(v>0)) return "upiši obujam";
  if(r>40) return "iznos je nerealno velik: u Zagrebu je od 1,50 do 18,35 €/m³; obujam upiši u polje iznad";
  return fmt(v*r)+" € (uz 10 % popusta za jednokratnu uplatu: "+fmt(v*r*0.9)+" €)";
}
// Ostali troškovi. Izvori: HERA, Odluka o iznosu jedinične naknade za priključenje (NN 45/2026, od 1. 5. 2026.): 193 €/kW bez PDV-a;

  const hep=HEP_EUR_KW*kW*PDV;
  const rows=[];
  rows.push(["Komunalni doprinos",kd!=null?fmt(kd)+" €":"izaberi zonu"]);
  rows.push(["Vodni doprinos","0 € (ukinut od 1. 7. 2024.)"]);
  rows.push([`Priključak struje (HEP, ${String(kW).replace(".",",")} kW, s PDV-om)`,fmt(hep)+" €"]);
  rows.push(["Priključak vode i kanalizacije (ViO)","0 € (za kućanstva plaća Grad)"]);
  if(gas) rows.push(["Priključak plina (GPZ, procjena)","800–1.500 €"]);
  rows.push(["Pristojba za građevinsku dozvolu",gbp>600?"0,25 ‰ troškova gradnje, najmanje 132,72 €":`${PRIST_GD.toFixed(2).replace(".",",")} € (e-zahtjev ${(PRIST_GD*0.85).toFixed(2).replace(".",",")} €)`]);
  const fixed=(kd||0)+hep+(gbp>600?132.72:PRIST_GD);
  const lo=fixed+(gas?800:0), hi=fixed+(gas?1500:0);
  let h=`<div class="calc" style="background:var(--panel);margin-top:8px">`+rows.map(([a,b])=>`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("");
  h+=`<div class="row" style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700"><span>Ukupno naknade${kd==null?" (bez komunalnog)":""}</span><span>${gas?fmt(lo)+"–"+fmt(hi):fmt(lo)} €</span></div></div>`;
  h+=`<p class="meta">Nisu uključeni radovi koje plaćaš izvođačima: vodomjerno okno i kućne instalacije (za vodu i kanalizaciju obično 2.500–4.500 €), elektro-ormarić, geodetski elaborat i projekti, te posebni uvjeti javnopravnih tijela (oko 200–600 €).</p>`;
  return h;
}
// --- procjena cijene gradnje (tržište, okolica Zagreba, 2026.)
// Izvori: trebam.hr (2026: Zagreb okolica, ključ u ruke prizemnica 1.400, katnica 1.300, montažna 1.600 €/m²; roh-bau 500–700 €/m²);
// montazneidrvenekuce.info, Q1 2026 (montažne: ključ u ruke prosjek 1.600, visoki roh-bau 1.100 €/m², bez temeljne ploče 55–120 €/m²);
// reporter.hr 2026 (ključ u ruke 1.500–1.700, viši standard > 2.000 €/m²).
const BUILD={
  klas:{kljuc:1400, roh:600, temelj:0},
  mont:{kljuc:1600, roh:1100, temelj:90}
};
const STD={osn:0.85, sred:1.0, vis:1.3};
const FLOORS={P:{f:1.00,n:1,label:"prizemnica"},PPk:{f:0.96,n:1.6,label:"P + potkrovlje"},P1:{f:0.93,n:2,label:"P + 1"},P1Pk:{f:0.91,n:2.6,label:"P + 1 + Pk"}};
const PODRUM_EUR={kljuc:850, roh:550}; // procjena po m² podruma
function buildUpdate(){
  const g=id=>document.getElementById(id), out=g("bOut"), grid=document.querySelector(".bgrid");
  if(!out||!grid) return;
  const area=parseFloat(String(g("bArea").value).replace(",",".")); if(!(area>0)){out.innerHTML=`<p class="meta">Upiši površinu kuće.</p>`;return}
  const t=g("bType").value, std=g("bStd").value, ph=g("bPhase").value, fl=FLOORS[g("bFloors").value], base=g("bBase").checked;
  const unit=BUILD[t][ph]*STD[std]*fl.f;
  const foot=area/fl.n;
  const gradnja=area*unit + foot*BUILD[t].temelj + (base?foot*PODRUM_EUR[ph]*STD[std]:0);
  const projekti=gradnja*0.07, nadzor=gradnja*0.015;
  // naknade iz odjeljka iznad, s obujmom ove kuće
  const vol=(area+(base?foot:0))*3;
  const R=parseFloat(String(g("kdRate")?.value||"").replace(",","."));
  const kd=R>0&&R<=40?vol*R:null;
  const kW=parseFloat(g("kdKw")?.value||"11.04"), gas=!!g("kdGas")?.checked;
  const naknade=(kd||0)+HEP_EUR_KW*kW*PDV+PRIST_GD+(gas?1150:0);
  const land=parseFloat(String(g("bLand")?.value||"").replace(",","."))||0;
  const sub=gradnja+projekti+nadzor+naknade, lo=sub*0.9+land, hi=sub*1.1+land, rez=sub*0.15;
  window.__budget={lo,hi,land,area};
  const gbp=+grid.dataset.gbp||0, tl=+grid.dataset.tlocrt||0;
  const warn=[];
  if(gbp&&area>gbp*1.001) warn.push(`Površina je veća od najvećeg dopuštenog GBP-a na ovoj čestici (${fmt(gbp)} m²).`);
  if(tl&&foot>tl*1.001) warn.push(`Tlocrt (${fmt(foot)} m²) prelazi najveću izgrađenost (${fmt(tl)} m²). Probaj više etaža ili manju površinu.`);
  const row=(a,b,bold)=>`<div class="row"${bold?' style="font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px"':""}><span>${esc(a)}</span><span>${b}</span></div>`;
  let h=warn.map(w=>`<p class="flag">${esc(w)}</p>`).join("");
  h+=`<div class="calc" style="background:var(--panel);margin-top:8px">`;
  h+=row(`Gradnja (${fmt(unit)} €/m² × ${fmt(area)} m²${BUILD[t].temelj?" + temeljna ploča":""}${base?" + podrum":""})`,fmt(gradnja)+" €");
  h+=row("Projekti i geodezija (oko 7 %)",fmt(projekti)+" €");
  h+=row("Stručni nadzor (oko 1,5 %)",fmt(nadzor)+" €");
  h+=row(`Doprinosi, priključci i pristojbe${kd==null?" (bez komunalnog: izaberi zonu)":""}`,fmt(naknade)+" €");
  if(land){const pa=window.__cur&&window.__cur.area; h+=row(`Zemljište${pa?" ("+fmt(land/pa)+" €/m²)":""}`,fmt(land)+" €");}
  h+=row(land?"Ukupno sa zemljištem":"Ukupno (bez zemljišta)",`${fmt(lo)} – ${fmt(hi)} €`,true);
  h+=row("Preporučena rezerva (15 %)",`+ ${fmt(rez)} €`);
  h+=`</div><p class="meta">Tržišne cijene za okolicu Zagreba, 2026. (izvori: trebam.hr, montazneidrvenekuce.info Q1 2026, reporter.hr). ${t==="mont"?"Montažna cijena uključuje temeljnu ploču (procjena 90 €/m² tlocrta). ":""}Podrum je procjena. Cijena zemljišta, uređenje okoliša i namještaj nisu uključeni. Za stvarnu cijenu traži barem tri ponude.</p>`;
  out.innerHTML=h;
}

function prostornoOdsjek(c){
  c=(c||"").toLowerCase();
  if(/novi zagreb|peščenica|pescenica|brezovica/.test(c)) return "Drugi područni odsjek za prostorno uređenje, Avenija Dubrovnik 12 · 658 5614";
  if(/centar|donji grad|gornji grad|medveščak|črnomerec|maksimir|podsused|susedgrad|trešnjevka|podsljeme|stenjevec|trnje/.test(c)) return "Prvi područni odsjek za prostorno uređenje, Trg Francuske Republike 15 · 610 1763";
  return "Središnji odsjek za prostorno uređenje, Trg Stjepana Radića 1 · 610 1130";
}
function graditeljstvoOdsjek(c){
  c=(c||"").toLowerCase();
  if(/sesvete/.test(c)) return "Prvi područni odsjek za graditeljstvo, Trg Dragutina Domjanića 4 · 610 1608";
  if(/podsused|susedgrad|trešnjevka/.test(c)) return "Drugi područni odsjek za graditeljstvo, Sigetje 2 · 658 5935";
  if(/dubrava/.test(c)) return "Treći područni odsjek za graditeljstvo, Avenija Dubrava 49 · 658 5452";
  return "Središnji odsjek za graditeljstvo, Trg Stjepana Radića 1 · 610 1115";
}

  h+=item("Lokacijska informacija","Službena potvrda namjene i uvjeta gradnje za česticu (pravno mjerodavna, za razliku od ove aplikacije).","ured",prostornoOdsjek(cet));
  if(hit("upu")) h+=item("Status urbanističkog plana (UPU)","Čestica je u obuhvatu obveznog UPU-a; provjeri je li plan donesen i što propisuje.","zzpu");
  if(hit("rez")) h+=item("Provjera rezervacije za proširenje ulice","Koliko čestice otpada na ulicu; traži u lokacijskoj informaciji ili od geodeta.","ured",prostornoOdsjek(cet));

  if(hit("kliz")) h+=item("Geotehnički pregled terena","Čestica zahvaća evidentirano klizište; prije kupnje traži mišljenje geotehničara.","ovlašteni inženjer geotehnike");
  h+=`</ul></details><details class="phase-d"><summary>2. Kupnja</summary><ul class="docs">`;

const favKey=(parcel,ll)=>parcel?`${parcel.properties.KATASTARSKA_OPCINA}|${parcel.properties.KATASTARSKA_CESTICA}`:`${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}`;
function favs(){try{return JSON.parse(localStorage.getItem("favs")||"[]")}catch(e){return []}}
function setFavs(a){try{localStorage.setItem("favs",JSON.stringify(a))}catch(e){}}
const isSaved=k=>favs().some(f=>f.key===k);
function landPrice(k){try{return (JSON.parse(localStorage.getItem("land")||"{}"))[k]||""}catch(e){return ""}}
function setLand(k,v){try{const o=JSON.parse(localStorage.getItem("land")||"{}");if(v)o[k]=v;else delete o[k];localStorage.setItem("land",JSON.stringify(o))}catch(e){}
  const a=favs(), f=a.find(x=>x.key===k); if(f){f.land=parseFloat(v)||null; f.budget=window.__budget||f.budget; setFavs(a);}}
function saveCurrent(){
  const c=window.__cur; if(!c) return;
  let a=favs(); const i=a.findIndex(f=>f.key===c.key);

  setFavs(a);
  const b=document.getElementById("saveBtn"); if(b) b.textContent=i>=0?"☆ Spremi":"★ Spremljeno";
}
function showFavs(){

  const rowsDef=[
    ["Čestica",f=>f.ces?`${esc(f.ces)}<br><small>k.o. ${esc(f.ko||"")}</small>`:"lokacija"],

    ["Prostor za kuću",f=>f.envelope!=null?fmt(f.envelope)+" m²":"–"],

    ["Ukupni projekt",f=>f.budget?`${fmt(f.budget.lo)} – ${fmt(f.budget.hi)} €`:"–"],
    ["Spremljeno",f=>esc(f.saved||"")]
  ];
  let h=`<div class="actions"><button type="button" class="ib" id="favPrint">Ispiši / spremi PDF</button></div><p class="eyebrow">Usporedba spremljenih čestica (${a.length})</p>`;
  h+=`<div class="cmp-wrap"><table class="cmp"><tbody>`;

  sheet.innerHTML=h; sheet.scrollTop=0;
}

async function search(){

  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim adresu…</p>';
  try{
    const p=new URLSearchParams({q:q+", Zagreb",format:"json",limit:"1",countrycodes:"hr",viewbox:"15.75,46.0,16.25,45.6",bounded:"1"});
    const a=await getJSON("https://nominatim.openstreetmap.org/search?"+p.toString());
    if(!a[0]){sheet.innerHTML='<p class="err">Adresa nije pronađena. Probaj drukčije napisati ili dodirni kartu.</p>';return}
    const ll=L.latLng(+a[0].lat,+a[0].lon); map.setView(ll,18); inspect(ll);
  }catch(e){sheet.innerHTML='<p class="err">Pretraga nije uspjela: '+esc(e.message)+'</p>'}
}

document.getElementById("me").onclick=()=>{
  if(!navigator.geolocation){sheet.innerHTML='<p class="err">Lokacija nije dostupna u ovom pregledniku.</p>';return}
  navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,18);inspect(ll)},
    ()=>{sheet.innerHTML='<p class="err">Pristup lokaciji je odbijen.</p>'},{enableHighAccuracy:true,timeout:10000});
};
</script>
</body>
</html>
