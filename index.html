vne namjene i vrijednostima prostora; 2. najveća izgrađenost građevne čestice je 30%; 3. najveća visina četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; 4. najmanji prirodni teren je 40% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen; 5. u rekonstrukciji postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren može biti postojeći; 6. gradnja novih građevina javne i društvene namjene prema javnom arhitektonskom natječaju u skladu s člankom 99. ovih odredbi."]}, "1.6.": {"clanak": "63", "naziv": "Zaštita i uređenje dovršenih naselja i dovršenih dijelova naselja", "prostori": "Voltino, Srednjaci, Jarun, Gredice, Knežija, Rudeš, Vrbani, Prečko, Špansko, Malešnica, Gajnice, Zapruđe, Savski gaj - sjever, Trnsko, Siget, Središće - istok, Sopot, Utrina, Travno, Sloboština - istok, Dugave, Ravnice, Volovčica, Folnegovićevo, Klaka, Grana, Studentski grad, Poljanice, Borovje, Poljane, Sigečica, Savica, Kanal, Martinovka, Brezje, Cvjetno naselje, prostor južno od Autobusnog kolodvora, Remetinečki gaj i drugi prema grafičkom prikazu.", "opca": ["zaštita, uređenje i urbana obnova urbanističkih cjelina naselja pretežito visoke gradnje;", "očuvanje izvorne tipologije i oblikovanja građevina, elemenata identiteta i slike naselja;", "poboljšavanje kvalitete stanovanja dovršetkom postojećih i uvođenjem novih sadržaja javne i društvene namjene iz članka 12. ovih odredbi, izgradnjom garaža za potrebe naselja i drugih sadržaja komunalnog standarda iz članka 22. ovih odredbi, sve u skladu s pravilima urbanističke struke uvažavajući koncepciju urbanističkog rješenja po kojoj je pretežiti dio naselja izgrađen;", "čuvanje i održavanje urbane matrice, javnih prostora i osobito postojećih vrijednih parkovnih površina naselja kao dijela zelenog infrastrukturnog sustava; vrijedne parkovne površine naselja prikazane su na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE UREĐENJE I ZAŠTITU PROSTORA - 4c. Zaštićeni i evidentirani dijelovi prirode - izmjene i dopune 2025. i štite se ovim planom;", "gradnja građevina iz točke 3. ovog stavka moguća je uz očuvanje vrijednog zelenila, primjenom odgovarajućih odredbi iz točke 7. UVJETI UREĐENJA POSEBNO VRIJEDNIH I/ILI OSJETLJIVIH PODRUČJA I CJELINA ovih odredbi;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obvezno je uređenje prostora prema planu na snazi: UPU Groblje Stenjevec."], "zone": [{"zona": "u zoni stambene, mješovite i poslovne namjene", "items": ["gradnja građevina iz stavka 2. točke 3. ovoga članka i rekonstrukcija građevina prema stavku 2. točke 2. ovoga članka;", "povećane parkirališne potrebe u pravilu rješavati na postojećim parkirališnim površinama gradnjom nove etaže/etaža ako ne smeta stanovanju, odnosno gradnjom garaža u skladu s izvornim urbanističkim planom naselja;", "kod rekonstrukcije postojećih građevina za nedostatak parkirališnogaražnih mjesta koja nije moguće osigurati na postojećim parkiralištima, moguće je izvršiti uplatu u skladu s člankom 39. ove odluke;", "uređenje neuređenih javnih zelenih površina i igrališta za potrebe naselja u skladu s pravilima struke;", "sanacija ravnog krova moguća je izvedbom blago skošenog krova nagiba do 6° skrivenoga u vijencu, da se ne naruši izvorno arhitektonsko oblikovanje građevine;", "omogućava se zamjena dotrajalih građevina u okviru postojećih gabarita;", "iznimno, za cjelovite prostore individualne izgradnje a koji su dijelovi starih naselja Gajnice, Špansko (između Korajčeve i Stulićeve ulice, između ulica Matije Divkovića i Dobriše Cesarića i duž ulica Špansko, Maršanići, Kaljska i Kotarnica), Malešnica, Rudeš, Prečko, Jarun te dio naselja Borongaj, Volovčica, gradnja i rekonstrukcija omogućuje se prema urbanim pravilima iz članka 71. ove odluke;", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene;"], "key": {}}, {"zona": "u zoni javne i društvene i sportsko-rekreacijske namjene - sport s gradnjom", "items": ["gradnja građevina prema programu i normativima osnovne namjene i prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije;", "rekonstrukcija postojećih građevina prema programu i normativima osnovne namjene, u pravilu uz uvjet očuvanja izvornog arhitektonskog oblikovanja;", "potreban broj PGM-a osigurati na građevnoj čestici i/ili uz ulicu, uz obvezno očuvanje postojećih uređenih zelenih površina."], "key": {"pgm": "potreban broj PGM-a osigurati na građevnoj čestici i/ili uz ulicu, uz obvezno očuvanje postojećih uređenih zelenih površina."}}], "tekst": ["(1) Zaštita i uređenje dovršenih naselja i dovršenih dijelova naselja (1.6.) - prostori: Voltino, Srednjaci, Jarun, Gredice, Knežija, Rudeš, Vrbani, Prečko, Špansko, Malešnica, Gajnice, Zapruđe, Savski gaj - sjever, Trnsko, Siget, Središće - istok, Sopot, Utrina, Travno, Sloboština - istok, Dugave, Ravnice, Volovčica, Folnegovićevo, Klaka, Grana, Studentski grad, Poljanice, Borovje, Poljane, Sigečica, Savica, Kanal, Martinovka, Brezje, Cvjetno naselje, prostor južno od Autobusnog kolodvora, Remetinečki gaj i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita, uređenje i urbana obnova urbanističkih cjelina naselja pretežito visoke gradnje; 2. očuvanje izvorne tipologije i oblikovanja građevina, elemenata identiteta i slike naselja; 3. poboljšavanje kvalitete stanovanja dovršetkom postojećih i uvođenjem novih sadržaja javne i društvene namjene iz članka 12. ovih odredbi, izgradnjom garaža za potrebe naselja i drugih sadržaja komunalnog standarda iz članka 22. ovih odredbi, sve u skladu s pravilima urbanističke struke uvažavajući koncepciju urbanističkog rješenja po kojoj je pretežiti dio naselja izgrađen; 4. čuvanje i održavanje urbane matrice, javnih prostora i osobito postojećih vrijednih parkovnih površina naselja kao dijela zelenog infrastrukturnog sustava; vrijedne parkovne površine naselja prikazane su na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE UREĐENJE I ZAŠTITU PROSTORA - 4c. Zaštićeni i evidentirani dijelovi prirode - izmjene i dopune 2025. i štite se ovim planom; 5. gradnja građevina iz točke 3. ovog stavka moguća je uz očuvanje vrijednog zelenila, primjenom odgovarajućih odredbi iz točke 7. UVJETI UREĐENJA POSEBNO VRIJEDNIH I/ILI OSJETLJIVIH PODRUČJA I CJELINA ovih odredbi; 6. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 7. obvezno je uređenje prostora prema planu na snazi: UPU Groblje Stenjevec.", "(3) Detaljna pravila a. u zoni stambene, mješovite i poslovne namjene: 1. gradnja građevina iz stavka 2. točke 3. ovoga članka i rekonstrukcija građevina prema stavku 2. točke 2. ovoga članka; 2. povećane parkirališne potrebe u pravilu rješavati na postojećim parkirališnim površinama gradnjom nove etaže/etaža ako ne smeta stanovanju, odnosno gradnjom garaža u skladu s izvornim urbanističkim planom naselja; 3. kod rekonstrukcije postojećih građevina za nedostatak parkirališnogaražnih mjesta koja nije moguće osigurati na postojećim parkiralištima, moguće je izvršiti uplatu u skladu s člankom 39. ove odluke; 4. uređenje neuređenih javnih zelenih površina i igrališta za potrebe naselja u skladu s pravilima struke; 5. sanacija ravnog krova moguća je izvedbom blago skošenog krova nagiba do 6° skrivenoga u vijencu, da se ne naruši izvorno arhitektonsko oblikovanje građevine; 6. omogućava se zamjena dotrajalih građevina u okviru postojećih gabarita; 7. iznimno, za cjelovite prostore individualne izgradnje a koji su dijelovi starih naselja Gajnice, Špansko (između Korajčeve i Stulićeve ulice, između ulica Matije Divkovića i Dobriše Cesarića i duž ulica Špansko, Maršanići, Kaljska i Kotarnica), Malešnica, Rudeš, Prečko, Jarun te dio naselja Borongaj, Volovčica, gradnja i rekonstrukcija omogućuje se prema urbanim pravilima iz članka 71. ove odluke; 8. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene; b. u zoni javne i društvene i sportsko-rekreacijske namjene - sport s gradnjom: 1. gradnja građevina prema programu i normativima osnovne namjene i prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije; 2. rekonstrukcija postojećih građevina prema programu i normativima osnovne namjene, u pravilu uz uvjet očuvanja izvornog arhitektonskog oblikovanja; 3. potreban broj PGM-a osigurati na građevnoj čestici i/ili uz ulicu, uz obvezno očuvanje postojećih uređenih zelenih površina."]}, "1.7.": {"clanak": "64", "naziv": "Zaštita urbanog koncepta i uređenje prostora visoke i niske gradnje", "prostori": "Ulica grada Vukovara, Ulica Ivana Lučića (Sveučilišna avenija) i drugi prema grafičkom prikazu.", "opca": ["zaštita urbanog koncepta i uređenje urbanih poteza visoke i niske gradnje i uređenih javnih i zelenih površina;", "očuvanje izvornog oblikovanja arhitektonski vrijednih građevina moderne arhitekture, karakterističnih vizura, elemenata identiteta i slike poteza;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "područje izrazitih urbanih i ambijentalnih vrijednosti, unutar kojeg je definiran urbani koncept nastao na principima moderne štiti se ovim Planom, prikazan je na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025.."], "zone": [{"zona": "sve zone", "items": ["gradnja novih građevina preporuča se prema javnom arhitektonskom natječaju;", "parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih parkovnih površina;", "povećane parkirališne potrebe rješavati na postojećim parkirališnim površinama gradnjom nove etaže, ako ne smeta stanovanju;", "gradnja na građevnim česticama s postojećim kvalitetnim visokim zelenilom i na uređenim zelenim površinama nije moguća;", "rekonstrukcija postojećih građevina moguća je uz uvjet očuvanja osnovnoga arhitektonskog oblikovanja građevine;", "gradnja visokih objekata nije dopuštena uz Ulicu grada Vukovara unutar koridora definiranog postojećim građevinskim pravcima objekta Vukovarska 35 (arh. Galić) na sjeveru i Vukovarska 52 (arh. Fabris) na jugu; isto i za prostor Miramarske ulice definiran objektima Miramarska 22 i Miramarska 23;", "uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina osim dovršenja kompleksa Gradske uprave u zoni javne i društvene namjene; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti;", "radi afirmacije morfoloških i strukturalnih obilježja prostora uređenih prema regulatornoj osnovi iz 1953., koju karakterizira izgradnja soliternih objekata okruženih zelenilom, omogućuje se uređenje ovih prostora isključivo izgradnjom slobodnostojećih objekata s krajobrazno uređenim okolnim prostorom gdje preteže autohtono zelenilo."], "key": {}}], "tekst": ["(1) Zaštita urbanog koncepta i uređenje prostora visoke i niske gradnje (1.7.) - prostori: Ulica grada Vukovara, Ulica Ivana Lučića (Sveučilišna avenija) i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita urbanog koncepta i uređenje urbanih poteza visoke i niske gradnje i uređenih javnih i zelenih površina; 2. očuvanje izvornog oblikovanja arhitektonski vrijednih građevina moderne arhitekture, karakterističnih vizura, elemenata identiteta i slike poteza; 3. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 4. područje izrazitih urbanih i ambijentalnih vrijednosti, unutar kojeg je definiran urbani koncept nastao na principima moderne štiti se ovim Planom, prikazan je na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025..", "(3) Detaljna pravila: 1. gradnja novih građevina preporuča se prema javnom arhitektonskom natječaju; 2. parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih parkovnih površina; 3. povećane parkirališne potrebe rješavati na postojećim parkirališnim površinama gradnjom nove etaže, ako ne smeta stanovanju; 4. gradnja na građevnim česticama s postojećim kvalitetnim visokim zelenilom i na uređenim zelenim površinama nije moguća; 5. rekonstrukcija postojećih građevina moguća je uz uvjet očuvanja osnovnoga arhitektonskog oblikovanja građevine; 6. gradnja visokih objekata nije dopuštena uz Ulicu grada Vukovara unutar koridora definiranog postojećim građevinskim pravcima objekta Vukovarska 35 (arh. Galić) na sjeveru i Vukovarska 52 (arh. Fabris) na jugu; isto i za prostor Miramarske ulice definiran objektima Miramarska 22 i Miramarska 23; 7. uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina osim dovršenja kompleksa Gradske uprave u zoni javne i društvene namjene; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti; 8. radi afirmacije morfoloških i strukturalnih obilježja prostora uređenih prema regulatornoj osnovi iz 1953., koju karakterizira izgradnja soliternih objekata okruženih zelenilom, omogućuje se uređenje ovih prostora isključivo izgradnjom slobodnostojećih objekata s krajobrazno uređenim okolnim prostorom gdje preteže autohtono zelenilo."]}, "1.8.": {"clanak": "65", "naziv": "Zaštita i uređenje cjelovitih kompleksa", "prostori": "SC Mladost, Studentski centar, RSC Jarun, kamp Jarun, Velesajam, Šestinski lagvić, groblje Mirogoj, Šalata, \"Ruđer Bošković\", Rebro, Svetice, Heinzelova, KB Dubrava, Grad mladih, Klaka, MUP - Savska, kompleks Pedagoške akademije, dvorana \"Vatroslav Lisinski\", Kemijski školski centar, Srednjoškolski centar u Držićevoj, NSK i HRT, MUP - Ilica, Brodarski institut, Rockefellerova i drugi prema grafičkom prikazu.", "opca": ["zaštita, čuvanje i uređenje vrijednosti kompleksa kao cjeline;", "očuvanje izvornog oblikovanja građevina, karakterističnih vizura, elemenata identiteta i slike kompleksa, kvalitetnih i uređenih zelenih površina (parkova i park - šuma);", "na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obavezna je izrada planova UPU RSC Jarun i UPU Zagrebački velesajam, prema smjernicama iz stavka 4. ovog članka."], "zone": [{"zona": "sve zone", "items": ["gradnja (interpolacija) novih građevina samo iznimno, u funkciji osnovne namjene, uz zadržavanje uređenih zelenih površina i prema programu i normativima osnovne namjene;", "parkirališne potrebe rješavati prema normativima ove odluke; parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih zelenih površina;", "visinu građevine uskladiti s pretežitom visinom gradnje unutar kompleksa;", "gradnja (interpolacija) novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije;", "rekonstrukcija građevina moguća je u funkciji osnovne namjene i uz zadržavanje uređenih zelenih površina;", "iznimno, za prostor SRC Svetice promet u mirovanju moguće je rješavati u kontaktnoj zoni, a pri određivanju broja PGM može se računati na preklapanje u korištenju;", "pri rekonstrukciji i/ili gradnji novog nogometnog Stadiona u Maksimiru (unutar SRC Svetice) omogućuje se izgradnja i uređenje sportskih i pratećih sadržaja (poslovne namjene i trgovački kompleksi, ugostiteljsko-turističke, javne i društvene te druge namjene); pri čemu odnos sportskih i pratećih sadržaja nije propisan;", "iznimno, za prostor Zagrebačkog velesajma moguće je uvesti nove namjene koje svojim karakterom ne mijenjaju kvalitetu i organizaciju kompleksa kao urbanističke i arhitektonske cjeline;", "iznimno, unutar groblja Mirogoj moguća je gradnja upravne zgrade i proširivanje arkada prema javnom arhitektonskom natječaju, sukladno odredbama iz točke", "MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke, omogućiti optimalnu spomeničku prezentaciju nepokretnoga kulturnog dobra - graditeljskog sklopa Kompleksa groblja Mirogoj, odnosno uklanjanje uzroka i posljedica ugroženosti na prostoru duž zapadne strane Aleje Hermanna Bollea. Za prostor zapadno od Aleje Hermanna Bollea obuhvaćen urbanim pravilima 1.8. i 2.11. i prostornim međama kulturnog dobra, propisuje se obveza izrade urbanističkog plana uređenja UPU Hermanna Bollea - zapad;", "iznimno, zapadno od RSC Jarun moguće je uređenje kampa \"Jarun\", kapaciteta do 1000 posjetilaca, a sve prema posebnim propisima, uz prethodnu valorizaciju i maksimalno zadržavanje postojećeg zelenila; u dijelu površine moguće je uređenje i kamp odmorišta;", "uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti."], "key": {"pgm": "iznimno, za prostor SRC Svetice promet u mirovanju moguće je rješavati u kontaktnoj zoni, a pri određivanju broja PGM može se računati na preklapanje u korištenju;"}}], "tekst": ["(1) Zaštita i uređenje cjelovitih kompleksa (1.8.) - prostori: SC Mladost, Studentski centar, RSC Jarun, kamp Jarun, Velesajam, Šestinski lagvić, groblje Mirogoj, Šalata, \"Ruđer Bošković\", Rebro, Svetice, Heinzelova, KB Dubrava, Grad mladih, Klaka, MUP - Savska, kompleks Pedagoške akademije, dvorana \"Vatroslav Lisinski\", Kemijski školski centar, Srednjoškolski centar u Držićevoj, NSK i HRT, MUP - Ilica, Brodarski institut, Rockefellerova i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita, čuvanje i uređenje vrijednosti kompleksa kao cjeline; 2. očuvanje izvornog oblikovanja građevina, karakterističnih vizura, elemenata identiteta i slike kompleksa, kvalitetnih i uređenih zelenih površina (parkova i park - šuma); 3. na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 4. obavezna je izrada planova UPU RSC Jarun i UPU Zagrebački velesajam, prema smjernicama iz stavka 4. ovog članka.", "(3) Detaljna pravila: 1. gradnja (interpolacija) novih građevina samo iznimno, u funkciji osnovne namjene, uz zadržavanje uređenih zelenih površina i prema programu i normativima osnovne namjene; 2. parkirališne potrebe rješavati prema normativima ove odluke; parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih zelenih površina; 3. visinu građevine uskladiti s pretežitom visinom gradnje unutar kompleksa; 4. gradnja (interpolacija) novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije; 5. rekonstrukcija građevina moguća je u funkciji osnovne namjene i uz zadržavanje uređenih zelenih površina; 6. iznimno, za prostor SRC Svetice promet u mirovanju moguće je rješavati u kontaktnoj zoni, a pri određivanju broja PGM može se računati na preklapanje u korištenju; 7. pri rekonstrukciji i/ili gradnji novog nogometnog Stadiona u Maksimiru (unutar SRC Svetice) omogućuje se izgradnja i uređenje sportskih i pratećih sadržaja (poslovne namjene i trgovački kompleksi, ugostiteljsko-turističke, javne i društvene te druge namjene); pri čemu odnos sportskih i pratećih sadržaja nije propisan; 8. iznimno, za prostor Zagrebačkog velesajma moguće je uvesti nove namjene koje svojim karakterom ne mijenjaju kvalitetu i organizaciju kompleksa kao urbanističke i arhitektonske cjeline; 9. iznimno, unutar groblja Mirogoj moguća je gradnja upravne zgrade i proširivanje arkada prema javnom arhitektonskom natječaju, sukladno odredbama iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke, omogućiti optimalnu spomeničku prezentaciju nepokretnoga kulturnog dobra - graditeljskog sklopa Kompleksa groblja Mirogoj, odnosno uklanjanje uzroka i posljedica ugroženosti na prostoru duž zapadne strane Aleje Hermanna Bollea. Za prostor zapadno od Aleje Hermanna Bollea obuhvaćen urbanim pravilima 1.8. i 2.11. i prostornim međama kulturnog dobra, propisuje se obveza izrade urbanističkog plana uređenja UPU Hermanna Bollea - zapad; 10. iznimno, zapadno od RSC Jarun moguće je uređenje kampa \"Jarun\", kapaciteta do 1000 posjetilaca, a sve prema posebnim propisima, uz prethodnu valorizaciju i maksimalno zadržavanje postojećeg zelenila; u dijelu površine moguće je uređenje i kamp odmorišta; 11. uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti.", "(4) Programske smjernice: 1. UPU Zagrebački velesajam 1.1. prostor određen za gradske projekte u skladu sa člankom 101. ovih odredbi; 1.2. zaštita, uređenje i djelomična preobrazba cjelovitog kompleksa u područje najvišeg urbanog standarda zasnovanog na principima niskougljičnog razvoja Grada - novo središte - centar Novog Zagreba; 1.3. planiranje pretežito poslovne namjene sa širokim spektrom pratećih sadržaja, mogućnost mješovite namjene (M) do 15% obuhvata plana; 1.4. svi zahvati u prostoru trebaju biti u skladu s konzervatorskim smjernicama - poštivanje mjera zaštite cjeline, paviljona Velesajma i zelenih poteza kompleksa; 1.5. preispitivanje mogućnosti gradnje građevina viših od 9 etaža; 1.6. omogućavanje sadržajnog i funkcionalno - prometnog povezivanja s prostorima užeg i šireg kontaktnog područja; 1.7. omogućavanje transparentnog, otvorenog i atraktivnog prostora za sve korisnike; 1.8. obavezna provedba javnog urbanističko-arhitektonskog natječaja kao podloge za izradu UPU-a. 2. UPU RSC Jarun 2.1. zadržati postojeću prostornu organizaciju uz zaštitu i očuvanje dvije temeljene prostorne vrijednosti: vode i krajobraza; 2.2. funkciju veslačkog centra, zagrebačkog kupališta i područja rekreacijskog kretanja u prirodi treba zadržati, uz očuvanje prirodnih resursa koji su osnova za odvijanje svih funkcija centra; 2.3. uređenje (sadržajna struktura, opremljenost građevinama i drugo) treba biti u funkciji temeljnog fenomena (vode sa svojim vodenim površinama i obalama), odnosno u funkciji sportova na vodi (veslanja i jedrenja) i kupališta, rekreacijskih i sportskih sadržaja, u skladu s podnosivim kapacitetom prostora, te obilježjima prirodnog krajolika i karakteristikama ekološkog sustava, uz obveznu primjenu rješenja temeljenih na prirodi; 2.4. izradi plana prethodi izrada prostorno-programske studije održivog razvoja."]}, "1.9.": {"clanak": "66", "naziv": "Zaštita, održavanje i njegovanje parkova i gradskih park-šuma", "prostori": "postojećih parkova i gradskih park-šuma Zelengaj - Tuškanac, Jelenovac, Pantovčak, Kraljevec, Prekrižje, Vrhovec, Cmrok, Mallinov park, Ribnjak, parkovi - trgovi Donjeg grada i Trnja, šumski kompleksi Remeta, Dotrščina, Miroševečina, Dankovečka, Oporovečka i Novoselečka šuma, Čulinečina, Resničina, parkovi Novog Zagreba, parkovi naselja i drugi prema grafičkom prikazu.", "opca": ["Parkovi: 1.1. održavanje, njegovanje i zaštita parkova, poštujući njihova oblikovna, ekološka, edukativna i rekreativna obilježja; 1.2. održavanje staza i putova te uređenje novih, ako nisu u koliziji s postojećom vegetacijom ili bitno ne mijenjaju postojeću matricu parternog uređenja parka; 1.3. zamjena i dopuna postojeće parkovne opreme te postava skulptura i rasvjete; 1.4. rekonstrukcija i prenamjena građevina u okvirima postojećih gabarita u skladu s funkcionalno-oblikovnim karakteristikama parka; 1.5. gradnja građevina koje dopunjuju komunalni standard parka (nadstrešnice za sklanjanje od nevremena, javni zahodi, paviljoni, manje komunalne građevine i TS, manje građevine što su u funkciji parka); 1.6. onemogućavanje gradnje ispod parkovnih površina, osim, iznimno, podzemne garaže ispod košarkaškog igrališta \"Cibona\" u Tuškancu i rekonstrukcije garaže sjeverno od zgrade Gradske uprave na Trgu Stjepana Radića; 1.7. omogućuje se rekonstrukcija i dogradnja građevine HNK ispod Trga Republike Hrvatske (dogradnja pratećih prostora osnovne namjene u podzemnom dijelu).", "Gradske park-šume: 2.1. njegovanje, održavanje i zaštita park-šuma za koje je izrađen program gospodarenja šumama odnosno Šumskogospodarska osnova provodi se na temelju šumskogospodarskih planova sukladno posebnim propisima iz područja šumarstva; 2.2. održavanje i rekonstrukcija postojećih putova, staza, građevina i rekreativnih sadržaja u gradskim park-šumama te oblikovanje odmorišta i postava higijensko-sanitarnih građevina moguća je samo bez sječe šume; 2.3. iznimno, u gradskoj park-šumi Tuškanac moguća je rekonstrukcija i restitucija ljetne pozornice Tuškanac; 2.4. ograničavanje mogućnosti izgradnje sukladno posebnim propisima prema uvjetima nadležnog javnopravnog tijela."], "zone": [], "tekst": ["(1) Zaštita, održavanje i njegovanje parkova i gradskih park-šuma (1.9.) - prostori postojećih parkova i gradskih park-šuma Zelengaj - Tuškanac, Jelenovac, Pantovčak, Kraljevec, Prekrižje, Vrhovec, Cmrok, Mallinov park, Ribnjak, parkovi - trgovi Donjeg grada i Trnja, šumski kompleksi Remeta, Dotrščina, Miroševečina, Dankovečka, Oporovečka i Novoselečka šuma, Čulinečina, Resničina, parkovi Novog Zagreba, parkovi naselja i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. Parkovi: 1.1. održavanje, njegovanje i zaštita parkova, poštujući njihova oblikovna, ekološka, edukativna i rekreativna obilježja; 1.2. održavanje staza i putova te uređenje novih, ako nisu u koliziji s postojećom vegetacijom ili bitno ne mijenjaju postojeću matricu parternog uređenja parka; 1.3. zamjena i dopuna postojeće parkovne opreme te postava skulptura i rasvjete; 1.4. rekonstrukcija i prenamjena građevina u okvirima postojećih gabarita u skladu s funkcionalno-oblikovnim karakteristikama parka; 1.5. gradnja građevina koje dopunjuju komunalni standard parka (nadstrešnice za sklanjanje od nevremena, javni zahodi, paviljoni, manje komunalne građevine i TS, manje građevine što su u funkciji parka); 1.6. onemogućavanje gradnje ispod parkovnih površina, osim, iznimno, podzemne garaže ispod košarkaškog igrališta \"Cibona\" u Tuškancu i rekonstrukcije garaže sjeverno od zgrade Gradske uprave na Trgu Stjepana Radića; 1.7. omogućuje se rekonstrukcija i dogradnja građevine HNK ispod Trga Republike Hrvatske (dogradnja pratećih prostora osnovne namjene u podzemnom dijelu). 2. Gradske park-šume: 2.1. njegovanje, održavanje i zaštita park-šuma za koje je izrađen program gospodarenja šumama odnosno Šumskogospodarska osnova provodi se na temelju šumskogospodarskih planova sukladno posebnim propisima iz područja šumarstva; 2.2. održavanje i rekonstrukcija postojećih putova, staza, građevina i rekreativnih sadržaja u gradskim park-šumama te oblikovanje odmorišta i postava higijensko-sanitarnih građevina moguća je samo bez sječe šume; 2.3. iznimno, u gradskoj park-šumi Tuškanac moguća je rekonstrukcija i restitucija ljetne pozornice Tuškanac; 2.4. ograničavanje mogućnosti izgradnje sukladno posebnim propisima prema uvjetima nadležnog javnopravnog tijela.", "(3) Iznimno, u gradskim park-šumama i parkovima mogu se zadržati postojeće stambene i gospodarske, te druge građevine, kad su zaštićene kao spomenici kulture ili su ovom odlukom utvrđene kao osobito vrijedne; u gradskim park-šumama i parkovima mogu se zadržati postojeće uređene površine i građevine.", "(4) Na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(5) Javna i društvena namjena: Rekonstrukcija građevina prema propozicijama nadležnog tijela zaštite, a gradnja novih građevina prema urbanim pravilima 1.8. ove odluke.", "(6) Sportsko rekreacijska namjena - sport bez gradnje - R2: 1. uređenje prostora prema propozicijama nadležnog tijela zaštite; 2. iznimno, omogućuje se gradnja podzemne garaže na lokaciji košarkaškog igrališta \"Cibone\" u Tuškancu."]}, "1.10.": {"clanak": "67", "naziv": "Održavanje i njegovanje zaštitnih zelenih površina", "prostori": "zaštitno zelenilo Okrugljak, vinogradi Oporovca, Novoselca, zaštitno zelenilo dolina potoka i drugi prema grafičkom prikazu.", "opca": ["održavanje, njegovanje i zaštita kultiviranog krajobraza (tradicionalno obrađivani vinogradi, voćnjaci, oranice i povrtnjaci);", "gradnja i rekonstrukcija građevina isključivo u funkciji zaštite nestabilnih padina, vodocrpilišta, površina drugih namjena uz ulice i drugih zaštitnih zelenih površina (potporni zidovi, zdenci, infrastruktura vodocrpilišta, zaštitni zidovi od buke i drugih zagađivanja, građevine za zaštitu od visokih voda i sl.);", "gradnja staza za šetnju i rekreaciju;", "postava skulptura i spomen-obilježja;", "na područjima zaštićenih vinograda može se graditi klijet kao jednoetažna građevina s podrumom, najvećeg GBP-a 40 m² u vinogradu površine najmanje 700 m²;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "iznimno, na prostoru Jagodišća moguće je uređenje golfskog terena. 8.2.2. KONSOLIDIRANA GRADSKA PODRUČJA"], "zone": [], "tekst": ["(1) Održavanje i njegovanje zaštitnih zelenih površina (1.10.) - prostori: zaštitno zelenilo Okrugljak, vinogradi Oporovca, Novoselca, zaštitno zelenilo dolina potoka i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. održavanje, njegovanje i zaštita kultiviranog krajobraza (tradicionalno obrađivani vinogradi, voćnjaci, oranice i povrtnjaci); 2. gradnja i rekonstrukcija građevina isključivo u funkciji zaštite nestabilnih padina, vodocrpilišta, površina drugih namjena uz ulice i drugih zaštitnih zelenih površina (potporni zidovi, zdenci, infrastruktura vodocrpilišta, zaštitni zidovi od buke i drugih zagađivanja, građevine za zaštitu od visokih voda i sl.); 3. gradnja staza za šetnju i rekreaciju; 4. postava skulptura i spomen-obilježja; 5. na područjima zaštićenih vinograda može se graditi klijet kao jednoetažna građevina s podrumom, najvećeg GBP-a 40 m² u vinogradu površine najmanje 700 m²; 6. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 7. iznimno, na prostoru Jagodišća moguće je uređenje golfskog terena. 8.2.2. KONSOLIDIRANA GRADSKA PODRUČJA"]}, "2.1.": {"clanak": "68", "naziv": "Zaštita, uređenje i dogradnja najsjevernijeg dijela podsljemenskog područja", "prostori": "Gornji i Donji Jarek, Bizek, Dubravica (sjever), Borčec, Gornje Vrapče, Mikulići - Lukšići, Šestine - sjever, Šestinski Kraljevec, Gračani - Bliznec, Gračani - Isce, Bačun, Markuševec, Markuševečka Dubrava, Jalševec, Slanovec, Čučerje i drugi prema grafičkom prikazu.", "opca": ["zaštita i uređenje vrijednosti prostora, osobito područja ekološke mreže, nalazišta strogo zaštićenih vrsta flore, park-šuma, parkova i pejsažnih i zaštitnih zelenih površina;", "čuvanje graditeljskog naslijeđa, posebno središta starih sela;", "gradnja pretežito stambenih građevina manjih gabarita na velikim građevnim česticama i gradnja pratećih građevina javne i društvene namjene;", "na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."], "zone": [{"zona": "u zoni stambene i mješovite namjene", "items": ["gradnja slobodnostojećih građevina;", "najmanja površina građevne čestice je 800 m²;", "najveća izgrađenost građevne čestice je 20%;", "najveći GBP je 400 m²;", "najveći kisn 0,5;", "građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja;", "najmanji udio prirodnog terena je 60% površine građevne čestice i nije ga moguće planirati unutar prostora rezerviranog za proširenje postojeće ulice;", "najveća visina je dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje ili uvučeni kat;", "sva potrebna garažno - parkirališna mjesta osigurati na građevnoj čestici i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, i to 2 PGM/stambena jedinica (najmanje 50% u garaži unutar glavne građevine ili izdvojenoj garaži), a za druge namjene prema normativima ovih odredbi;", "pomoćne građevine su iza građevnog pravca glavne građevine; osim na strmom terenu, gdje se garaža može graditi i bliže rubnoj liniji rezervacije proširenja ulice, odnosno regulacijskoj liniji ako za ulicu nije planirano ili nije potrebno osigurati proširenje;", "udaljenost građevnog pravca glavne građevine od rubne linije rezervacije proširenja ulice, odnosno od regulacijske linije ako za ulicu nije planirano ili nije potrebno osigurati proširenje, najmanje je 5,0 m, iznimno može i manje u skladu s kontinuiranim građevnim pravcem postojećih građevina;", "najmanja udaljenost stambene građevine od međe susjedne građevne čestice je 3,0 m;", "obvezno zadržavanje postojećeg predvrta te izvedba predvrta u skladu s lokalnim uvjetima u ulici;", "rekonstrukcija i gradnja građevina na česticama jednakim ili većim od propisanih izvodi se po pravilima za novu gradnju; u rekonstrukciji i gradnji zamjenskih građevina postojeći parametri veći od propisanih mogu se zadržati, ali bez povećanja odnosno pogoršanja uvjeta;", "rekonstrukcija i gradnja građevina i interpolacija slobodnostojećih, poluugrađenih i ugrađenih građevina isključivo kao dovršenje postojeće tipologije, i na građevnim česticama manjim od 800 m², uz uvjet da je najveći kisn 0,5, najveća visina dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje ili uvučeni kat, udaljenost građevine od međe susjedne građevne čestice prema lokalnim uvjetima, ali ne manje od 1,0 m; najmanje 1 PGM/1 stan uz obvezan smještaj vozila na građevnoj čestici u garaži, ostalo prema detaljnim pravilima; u rekonstrukciji i gradnji zamjenske građevine postojeći kisn i visina, veći od propisanih, mogu se zadržati, ali bez povećavanja;", "iznimno, uz ulicu Trdice, Vrapčansku, Šestinsku cestu i Mlinove, Gračansku, Markuševečku, Slanovečku, Ulicu Vida Ročića, ulicu Štefanovec i Čučersku cestu primjenjuju se urbana pravila članka 69. ove odluke;", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena osim javne i društvene koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene."], "key": {"cestica": "najmanja površina građevne čestice je 800 m²;", "izgradenost": "najveća izgrađenost građevne čestice je 20%;", "gbp": "najveći GBP je 400 m²;", "kis": "najveći kisn 0,5;", "jedinice": "građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja;", "visina": "najveća visina je dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje ili uvučeni kat;", "pgm": "sva potrebna garažno - parkirališna mjesta osigurati na građevnoj čestici i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, i to 2 PGM/stambena jedinica (najmanje 50% u garaži unutar glavne građevine ili izdvojenoj garaži), a za druge namjene prema normativima ovih odredbi;", "meda": "rekonstrukcija i gradnja građevina i interpolacija slobodnostojećih, poluugrađenih i ugrađenih građevina isključivo kao dovršenje postojeće tipologije, i na građevnim česticama manjim od 800 m², uz uvjet da je najveći kisn 0,5, najveća visina dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje ili uvučeni kat, udaljenost građevine od međe susjedne građevne čestice prema lokalnim uvjetima, ali ne manje od 1,0 m; najmanje 1 PGM/1 stan uz obvezan smještaj vozila na građevnoj čestici u garaži, ostalo prema detaljnim pravilima; u rekonstrukciji i gradnji zamjenske građevine postojeći kisn i visina, veći od propisanih, mogu se zadržati, ali bez povećavanja;"}}, {"zona": "u zoni javne i društvene i ugostiteljsko-turističke namjene", "items": ["gradnja i rekonstrukcija prema programu i normativima osnovne namjene i u skladu s vrijednostima prostora;", "najveća izgrađenost građevne čestice je 30%;", "visina građevine najviše tri nadzemne etaže, pri čemu je treća etaža potkrovlje bez nadozida;", "najmanji prirodni teren je 40% građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen;", "najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m;", "najveći kisn za ugostiteljsko-turističku namjenu je 1,0, a najveći GBP je 600 m²;", "u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći;", "gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije."], "key": {"izgradenost": "najveća izgrađenost građevne čestice je 30%;", "teren": "najmanji prirodni teren je 40% građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m;", "kis": "najveći kisn za ugostiteljsko-turističku namjenu je 1,0, a najveći GBP je 600 m²;", "gbp": "najveći kisn za ugostiteljsko-turističku namjenu je 1,0, a najveći GBP je 600 m²;"}}], "tekst": ["(1) Zaštita, uređenje i dogradnja najsjevernijeg dijela podsljemenskog područja (2.1.) - prostori: Gornji i Donji Jarek, Bizek, Dubravica (sjever), Borčec, Gornje Vrapče, Mikulići - Lukšići, Šestine - sjever, Šestinski Kraljevec, Gračani - Bliznec, Gračani - Isce, Bačun, Markuševec, Markuševečka Dubrava, Jalševec, Slanovec, Čučerje i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita i uređenje vrijednosti prostora, osobito područja ekološke mreže, nalazišta strogo zaštićenih vrsta flore, park-šuma, parkova i pejsažnih i zaštitnih zelenih površina; 2. čuvanje graditeljskog naslijeđa, posebno središta starih sela; 3. gradnja pretežito stambenih građevina manjih gabarita na velikim građevnim česticama i gradnja pratećih građevina javne i društvene namjene; 4. na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja slobodnostojećih građevina; 2. najmanja površina građevne čestice je 800 m²; 3. najveća izgrađenost građevne čestice je 20%; 4. najveći GBP je 400 m²; 5. najveći kisn 0,5; 6. građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 7. najmanji udio prirodnog terena je 60% površine građevne čestice i nije ga moguće planirati unutar prostora rezerviranog za proširenje postojeće ulice; 8. najveća visina je dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje ili uvučeni kat; 9. sva potrebna garažno - parkirališna mjesta osigurati na građevnoj čestici i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, i to 2 PGM/stambena jedinica (najmanje 50% u garaži unutar glavne građevine ili izdvojenoj garaži), a za druge namjene prema normativima ovih odredbi; 10. pomoćne građevine su iza građevnog pravca glavne građevine; osim na strmom terenu, gdje se garaža može graditi i bliže rubnoj liniji rezervacije proširenja ulice, odnosno regulacijskoj liniji ako za ulicu nije planirano ili nije potrebno osigurati proširenje; 11. udaljenost građevnog pravca glavne građevine od rubne linije rezervacije proširenja ulice, odnosno od regulacijske linije ako za ulicu nije planirano ili nije potrebno osigurati proširenje, najmanje je 5,0 m, iznimno može i manje u skladu s kontinuiranim građevnim pravcem postojećih građevina; 12. najmanja udaljenost stambene građevine od međe susjedne građevne čestice je 3,0 m; 13. obvezno zadržavanje postojećeg predvrta te izvedba predvrta u skladu s lokalnim uvjetima u ulici; 14. rekonstrukcija i gradnja građevina na česticama jednakim ili većim od propisanih izvodi se po pravilima za novu gradnju; u rekonstrukciji i gradnji zamjenskih građevina postojeći parametri veći od propisanih mogu se zadržati, ali bez povećanja odnosno pogoršanja uvjeta; 15. rekonstrukcija i gradnja građevina i interpolacija slobodnostojećih, poluugrađenih i ugrađenih građevina isključivo kao dovršenj ržaja; 2. čuvanje graditeljskog naslijeđa, posebno središta starih sela; 3. gradnja i rekonstrukcija prometne i komunalne infrastrukture; 4. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. najmanja površina građevne čestice je za slobodnostojeću 350 m², za poluugrađenu 220 m², a za ugrađenu građevinu 132 m²; 3. najveća izgrađenost građevne čestice je za slobodnostojeću 30%, poluugrađenu 40%, a za ugrađenu građevinu 50%; 4. najveći kisn za slobodnostojeću građevinu 1,0, za poluugrađenu i ugrađenu 1,2; najveći GBP je 400 m²; 5. građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 6. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice; 7. najveća visina je tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 8. najmanje 1 PGM/1 stan, uz obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice); druge namjene prema normativima ove odluke; 9. pomoćne građevine su iza građevnog pravca glavne građevine; na građevnoj čestici moguća je gradnja samo jedne pomoćne građevine; 10. udaljenost građevnog pravca glavne građevine od rubne linije rezervacije proširenja ulice, odnosno od regulacijske linije ako za ulicu nije planirano ili nije potrebno osigurati proširenje, najmanje je 3,0 m, iznimno može i manje u skladu s kontinuiranim građevnim pravcem postojećih građevina; 11. najmanja udaljenost građevine od međe susjedne građevne čestice je 3,0 m; 12. rekonstrukcija i gradnja građevina na česticama jednakim ili većim od propisanih izvodi se po pravilima za novu gradnju; u rekonstrukciji i gradnji zamjenskih građevina postojeći parametri koji nisu u skladu s propisanim mogu se zadržati, ali bez povećanja i pogoršanja uvjeta; 13. rekonstrukcija i gradnja građevina i interpolacija moguća je i na građevnim česticama manjim od propisanih za novu gradnju, uz uvjet da je kisn 1,0, najveća visina tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat, za rekonstrukciju udaljenost građevina od međe susjedne građevne čestice postojeća, ali ne manje od 1,0 m, za novu gradnju i interpolaciju udaljenost od međe susjedne građevne čestice prema detaljnim pravilima, potreban broj PGM osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), drugi lokacijski uvjeti prema detaljnim pravilima; u rekonstrukciji i gradnji zamjenske građevine postojeći kisn i visina, veći od propisanih, mogu se zadržati, ali bez povećavanja; 14. iznimno, uz Ilicu, Zagrebačku, produženu Medarsku, Aleju grada Bolonje, Remetinečku, produženu Ulicu Ivane Brlić-Mažuranić, produženu Šarengradsku ulicu, Branimirovu moguća je gradnja novih građevina, rekonstrukcija i interpolacija najveće visine pet nadzemnih etaža, pri čemu se peta etaža oblikuje kao potkrovlje ili uvučeni kat, dubine nadzemnih etaža najviše 16,0 m, najveći kisn 2,0, najmanje 1 PGM/1 stan, uz obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice); drugi lokacijski uvjeti prema urbanim pravilima iz članka 76. ovih odredbi; 15. iznimno, uz ulicu I. Trnava, Resnički put, Vukomeričku, produženu Vukovarsku, produženu Jarunsku, Aninu, Jezersku, Rudešku ulicu, produženu Baštijanovu ulicu, produženu Kranjčevićevu ulicu; gradnja građevina prema urbanim pravilima iz članka 74. ove odluke; 16. iznimno, na području Botinca potrebno je čuvati urbanu matricu, moguća je rekonstrukcija i gradnja građevina i interpolacija, uz na ", "(2) Opća pravila: 1. revalorizacija područja gradske periferije s karakteristikama substandardne stambene, pretežito neplanske gradnje; 2. podizanje standarda područja sanacijom, dogradnjom i transformacijom postojećih naselja, rekonstrukcijom postojeće i gradnjom nove prometne mreže, i osiguravanje prostora za realizaciju nužno potrebnih pratećih sadržaja koji će povećati urbanitet naselja; 3. poticanje transformacije slike naselja estetsko-oblikovnim komponentama (kvalitetnija gradnja u tehnološkom i oblikovnom smislu).", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja novih slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. najmanja površina građevne čestice za slobodnostojeće je 350 m², za poluugrađene 220 m², za ugrađene 132 m²; 3. najveća izgrađenost građevne čestice je 40% za slobodnostojeću i poluugrađenu, a 50% za ugrađenu građevinu; 4. najveći kisn 1,2; najveći GBP je 400 m²; 5. građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 6. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 7. najveća visina je tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 8. najmanje 1 PGM/1 stan, uz obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), druge namjene prema normativima ove odluke; 9. pomoćne građevine su iza građevnog pravca glavne građevine, na građevnoj čestici moguća je gradnja samo jedne pomoćne građevine; 10. udaljenost građevnog pravca glavne građevine od rubne linije rezervacije proširenja ulice, odnosno od regulacijske linije ako za ulicu nije planirano ili nije potrebno osigurati proširenje, najmanje je 3,0 m, iznimno, može i manje u skladu s kontinuiranim građevnim pravcem postojećih građevina; 11. najmanja BP, kis i visina građevine nisu propisani; 6. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice veća od propisane, može se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći; 7. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije. c. u zoni poslovne namjene: Gradnja prema urbanim pravilima iz članka 77. ove odluke."]}, "2.8.": {"clanak": "75", "naziv": "Uređenje i urbana obnova prostora mješovite gradnje", "prostori": "Stenjevec - sjever, Oranice, Zagorska - Selska, Petrine - Županići, Čulinečka, Peščenica - sjever, Tvornica Fotokemika, Dubec, Volovčica, Vrbik i drugi prema grafičkom prikazu.", "opca": ["obnova i dovršetak postojeće urbane matrice gradnjom novih građevina u skladu s prevladavajućom postojećom tipologijom gradnje (individualna, niska ili visoka gradnja), interpolacijom, rekonstrukcijom i zamjenom trošnih građevina;", "omogućuje se urbana transformacija (promjena postojeće tipologije gradnje) većih prostornih cjelina ako se radi o zahvatu u prostoru koji obuhvaća zonu omeđenu javnim prostorima ili je u skladu s urbanističkim planom uređenja;", "očuvanje elemenata identiteta i memorije naselja (postojeći trgovi, ulice, parkovi, karakteristični urbani potezi);", "podizanje standarda naselja rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te osiguravanjem prostora za prateće sadržaje;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obvezno je uređenje prostora prema planovima na snazi UPU Vrbik - Središnji prostor i UPU Petrine – Županići;", "obavezna je izrada plana UPU Medarska – produžena Ivane Brlić Mažuranić, prema smjernicama iz stavka 4. ovog članka."], "zone": [{"zona": "sve zone", "items": ["rekonstrukcija postojećih ili interpolacija novih građevina prema prevladavajućoj tipologiji gradnje (individualna, niska ili visoka gradnja) u pojedinoj prostornoj cjelini tj. zoni omeđenoj javnim prostorima, bez promjene tipologije – primjenjuju se urbana pravila iz članka 71. (individualna gradnja), 74. (niska gradnja) ili 76. (visoka gradnja);", "promjena tipologije moguća je za zahvate u prostoru na novim prostornim cjelinama (urbanim blokovima tj. cjelinama koje su omeđene javnim prostorom - ulicom ili uređenim parkom): primjenjuju se urbana pravila iz članaka 74. ili 76. ako su zadovoljeni uvjeti o minimalnoj širini prometnica za pojedini tip gradnje iz članka 38. ovih odredbi;", "promjena tipologije moguća je i kao zahvat urbane preobrazbe cjelovite zone urbanog pravila uz obavezno donošenje urbanističkog plana uređenja;", "u slučajevima pojedinačne transformacije prostornih cjelina u prostore visoke gradnje najmanje 20% površine prostorne cjeline potrebno je planirati kao uređenu površinu koja je uvijek dostupna javnosti (popločana površina – trg, ozelenjena površina – park, igralište; pasaž i sl.);", "transformacija prostora pojedine čestice individualne ili niske gradnje u prostor visoke gradnje nije moguća;", "kada se izrađuje urbanistički plan uređenja za urbanu preobrazbu najmanje 20% površine obuhvata plana potrebno je planirati kao javnu površinu (trg ili javni park)."], "key": {}}], "tekst": ["(1) Uređenje i urbana obnova prostora mješovite gradnje (2.8.) - prostori: Stenjevec - sjever, Oranice, Zagorska - Selska, Petrine - Županići, Čulinečka, Peščenica - sjever, Tvornica Fotokemika, Dubec, Volovčica, Vrbik i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. obnova i dovršetak postojeće urbane matrice gradnjom novih građevina u skladu s prevladavajućom postojećom tipologijom gradnje (individualna, niska ili visoka gradnja), interpolacijom, rekonstrukcijom i zamjenom trošnih građevina; 2. omogućuje se urbana transformacija (promjena postojeće tipologije gradnje) većih prostornih cjelina ako se radi o zahvatu u prostoru koji obuhvaća zonu omeđenu javnim prostorima ili je u skladu s urbanističkim planom uređenja; 3. očuvanje elemenata identiteta i memorije naselja (postojeći trgovi, ulice, parkovi, karakteristični urbani potezi); 4. podizanje standarda naselja rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te osiguravanjem prostora za prateće sadržaje; 5. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 6. obvezno je uređenje prostora prema planovima na snazi UPU Vrbik - Središnji prostor i UPU Petrine – Županići; 7. obavezna je izrada plana UPU Medarska – produžena Ivane Brlić Mažuranić, prema smjernicama iz stavka 4. ovog članka.", "(3) Detaljna pravila: 1. rekonstrukcija postojećih ili interpolacija novih građevina prema prevladavajućoj tipologiji gradnje (individualna, niska ili visoka gradnja) u pojedinoj prostornoj cjelini tj. zoni omeđenoj javnim prostorima, bez promjene tipologije – primjenjuju se urbana pravila iz članka 71. (individualna gradnja), 74. (niska gradnja) ili 76. (visoka gradnja); 2. promjena tipologije moguća je za zahvate u prostoru na novim prostornim cjelinama (urbanim blokovima tj. cjelinama koje su omeđene javnim prostorom - ulicom ili uređenim parkom): primjenjuju se urbana pravila iz članaka 74. ili 76. ako su zadovoljeni uvjeti o minimalnoj širini prometnica za pojedini tip gradnje iz članka 38. ovih odredbi; 3. promjena tipologije moguća je i kao zahvat urbane preobrazbe cjelovite zone urbanog pravila uz obavezno donošenje urbanističkog plana uređenja; 4. u slučajevima pojedinačne transformacije prostornih cjelina u prostore visoke gradnje najmanje 20% površine prostorne cjeline potrebno je planirati kao uređenu površinu koja je uvijek dostupna javnosti (popločana površina – trg, ozelenjena površina – park, igralište; pasaž i sl.); 5. transformacija prostora pojedine čestice individualne ili niske gradnje u prostor visoke gradnje nije moguća; 6. kada se izrađuje urbanistički plan uređenja za urbanu preobrazbu najmanje 20% površine obuhvata plana potrebno je planirati kao javnu površinu (trg ili javni park).", "(4) Programske smjernice: UPU Medarska - produžena Ulica Ivane Brlić Mažuranić 1. površine mješovite – pretežito stambene namjene; 2. preispitati mogućnost transformacije i uređenje postojeće izgrađene strukture u prostor niske i visoke izgradnje; 3. podizanje standarda postojeće ulične mreže, afirmacija poteza uz Ulicu Ivane Brlić Mažuranić; 4. uređenje prostora javnih zelenih površina i uvođenje elemenata zelene i pješačke infrastrukture."]}, "2.9.": {"clanak": "76", "naziv": "Uređenje i urbana obnova prostora visoke gradnje", "prostori": "Trešnjevka - centar, Voltino - sjever, ulica Dubrava, ulica Svetice, Brezje, Savska - Veslačka, Vrbik, Chromos - Radnička, Heinzelova - Vukovarska - sjever, Radnička, Sloboština, Remetinec - Lanište, blok Krešimir i drugi prema grafičkom prikazu.", "opca": ["obnova i dovršetak urbane matrice gradnjom novih građevina, interpolacijom, rekonstrukcijom i zamjenom trošnih građevina uz omogućavanje promjena oblika i veličine građevnih čestica;", "očuvanje elemenata identiteta (elementi urbane matrice s naglaskom na vrijednim neizgrađenim prostorima i pješačkim pravcima, ambijentalna obilježja i prostorni doživljaji, izvorne graditeljsko-oblikovne karakteristike i sl.);", "podizanje urbanog standarda rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te obveznim osiguravanjem prostora za prateće sadržaje;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obvezno je uređenje prostora prema planovima na snazi: UPU Oporovečka - sjever, UPU Vrbik - Savska - Slavonska, DPU Savska - Vukovarska, UPU Brezje - zona jug; DPU Vrbik - uz Ulicu Ivana Lučića (Sveučilišna aleja);", "obavezna je izrada plana UPU Kraš, prema smjernicama iz stavka 4. ovog članka."], "zone": [{"zona": "u zoni stambene i mješovite namjene", "items": ["gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina;", "na jednoj građevnoj čestici moguće je graditi više građevina;", "najveći broj samostalnih uporabnih jedinica za stambenu i/ili mješovitu stambeno-poslovnu građevinu računa se po kriteriju 50 m² građevne čestice po samostalnoj uporabnoj jedinici;", "razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca;", "izgrađenost građevne čestice je do 50%;", "najveći je koeficijent iskoristivosti nadzemno kisn 2,0 za poslovnu, stambenu i stambeno-poslovnu namjenu;", "najmanji je koeficijent iskoristivosti nadzemno kisn 1,0, osim za građevine javne i društvene namjene; u rekonstrukciji postojeći manji kisn može biti i manji od propisanog;", "građevine niže od četiri nadzemne etaže mogu se graditi samo kao dio složenih građevina i ne mogu predstavljati prvu etapu ili fazu na način da se visoka građevina izvodi u kasnijoj etapi ili fazi gradnje;", "najmanji prirodni krajobrazno uređen teren je 30%;", "za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m;", "potreban broj PGM-a treba osigurati na građevnoj čestici ili drukčije prema odredbama urbanističkog plana uređenja, u skladu sa člankom 39. ovih odredbi;", "rekonstrukcija se izvodi uz obvezu zadovoljenja PGM; rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju;", "uz gradske avenije i glavne gradske ulice omogućava se gradnja visokih građevina i s većim kisn, ali ne većim od 3,0, uz uvjet donošenja urbanističkog plana uređenja; predmetni urbanistički plan uređenja mora obavezno u grafičkom dijelu propisivati oblik i veličinu građevnih čestica i ne može obuhvaćati samo jednu građevnu česticu ukoliko je njena površina manja od 1 ha;", "izrada urbanističkog plana uređenja obavezna je za površine/građevne čestice veće od 1 ha ukoliko se predlaže urbana preobrazba (uvodi se nova ulična mreža te mijenja urbana struktura i morfologija);", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena, osim javne i društvene i sportsko-rekreacijske namjene – sport s gradnjom, koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene te sportsko-rekreacijske namjene – sport s gradnjom prema detaljnim pravilima za odgovarajuću zonu iz članka", "ovih odredbi;"], "key": {"izgradenost": "izgrađenost građevne čestice je do 50%;", "pgm": "potreban broj PGM-a treba osigurati na građevnoj čestici ili drukčije prema odredbama urbanističkog plana uređenja, u skladu sa člankom 39. ovih odredbi;"}}, {"zona": "u zoni javne i društvenenamjene", "items": ["gradnja i rekonstrukcija moguća je prema programu osnovne namjene;", "najveća izgrađenost građevne čestice je 40%; najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; najmanji prirodni, krajobrazno uređen teren je 30%, drugi lokacijski uvjeti nisu ograničeni;", "u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren može biti postojeći;", "gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije;"], "key": {"izgradenost": "najveća izgrađenost građevne čestice je 40%; najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; najmanji prirodni, krajobrazno uređen teren je 30%, drugi lokacijski uvjeti nisu ograničeni;"}}, {"zona": "u zoni poslovne i ugostiteljsko-turističke namjene", "items": ["gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina;", "na jednoj građevnoj čestici moguće je graditi više građevina;", "izgrađenost građevne čestice je do 50%;", "najveći je koeficijent iskoristivosti nadzemno kisn 3,0;", "najmanji je koeficijent iskoristivosti nadzemno kisn 1,5, osim za građevine javne i društvene namjene;", "najmanji prirodni krajobrazno uređen teren je 30%;", "za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m;", "potreban broj PGM-a treba osigurati na građevnoj čestici ili drugačije prema odredbama urbanističkog plana uređenja;", "rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju;", "iznimno, na prostoru Trnja, istočno od ogranka Radničke ceste u zoni K1 označenom na kartografskom prikazu 4a. Urbana pravila - izmjene i dopune 2025., udaljenost nove visoke građevine od međe pripadajuće građevne čestice može biti i manja od h/2, ali ne manja od 6,0 m, osim od onih međa na koje je prislonjena i javnoprometnih površina. Ostali parametri prema detaljnim pravilima. Na jugoistočnom dijelu prostora omogućava se zadržavanje, rekonstrukcija i zamjena ugrađene građevine;", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni poslovne namjene."], "key": {"izgradenost": "izgrađenost građevne čestice je do 50%;", "pgm": "potreban broj PGM-a treba osigurati na građevnoj čestici ili drugačije prema odredbama urbanističkog plana uređenja;"}}], "tekst": ["(1) Uređenje i urbana obnova prostora visoke gradnje (2.9.) - prostori: Trešnjevka - centar, Voltino - sjever, ulica Dubrava, ulica Svetice, Brezje, Savska - Veslačka, Vrbik, Chromos - Radnička, Heinzelova - Vukovarska - sjever, Radnička, Sloboština, Remetinec - Lanište, blok Krešimir i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. obnova i dovršetak urbane matrice gradnjom novih građevina, interpolacijom, rekonstrukcijom i zamjenom trošnih građevina uz omogućavanje promjena oblika i veličine građevnih čestica; 2. očuvanje elemenata identiteta (elementi urbane matrice s naglaskom na vrijednim neizgrađenim prostorima i pješačkim pravcima, ambijentalna obilježja i prostorni doživljaji, izvorne graditeljsko-oblikovne karakteristike i sl.); 3. podizanje urbanog standarda rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te obveznim osiguravanjem prostora za prateće sadržaje; 4. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 5. obvezno je uređenje prostora prema planovima na snazi: UPU Oporovečka - sjever, UPU Vrbik - Savska - Slavonska, DPU Savska - Vukovarska, UPU Brezje - zona jug; DPU Vrbik - uz Ulicu Ivana Lučića (Sveučilišna aleja); 6. obavezna je izrada plana UPU Kraš, prema smjernicama iz stavka 4. ovog članka.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. na jednoj građevnoj čestici moguće je graditi više građevina; 3. najveći broj samostalnih uporabnih jedinica za stambenu i/ili mješovitu stambeno-poslovnu građevinu računa se po kriteriju 50 m² građevne čestice po samostalnoj uporabnoj jedinici; 4. razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca; 5. izgrađenost građevne čestice je do 50%; 6. najveći je koeficijent iskoristivosti nadzemno kisn 2,0 za poslovnu, stambenu i stambeno-poslovnu namjenu; 7. najmanji je koeficijent iskoristivosti nadzemno kisn 1,0, osim za građevine javne i društvene namjene; u rekonstrukciji postojeći manji kisn može biti i manji od propisanog; 8. građevine niže od četiri nadzemne etaže mogu se graditi samo kao dio složenih građevina i ne mogu predstavljati prvu etapu ili fazu na način da se visoka građevina izvodi u kasnijoj etapi ili fazi gradnje; 9. najmanji prirodni krajobrazno uređen teren je 30%; 10. za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m; 11. potreban broj PGM-a treba osigurati na građevnoj čestici ili drukčije prema odredbama urbanističkog plana uređenja, u skladu sa člankom 39. ovih odredbi; 12. rekonstrukcija se izvodi uz obvezu zadovoljenja PGM; rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju; 13. uz gradske avenije i glavne gradske ulice omogućava se gradnja visokih građevina i s većim kisn, ali ne većim od 3,0, uz uvjet donošenja urbanističkog plana uređenja; predmetni urbanistički plan uređenja mora obavezno u grafičkom dijelu propisivati oblik i veličinu građevnih čestica i ne može obuhvaćati samo jednu građevnu česticu ukoliko je njena površina manja od 1 ha; 14. izrada urbanističkog plana uređenja obavezna je za površine/građevne čestice veće od 1 ha ukoliko se predlaže urbana preobrazba (uvodi se nova ulična mreža te mijenja urbana struktura i morfologija); 15. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena, osim javne i društvene i sportsko-rekreacijske namjene – sport s gradnjom, koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene te sportsko-rekreacijske namjene – sport s gradnjom prema detaljnim pravilima za odgovarajuću zonu iz članka 77. ovih odredbi; b. u zoni javne i društvenenamjene: 1. gradnja i rekonstrukcija moguća je prema programu osnovne namjene; 2. najveća izgrađenost građevne čestice je 40%; najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; najmanji prirodni, krajobrazno uređen teren je 30%, drugi lokacijski uvjeti nisu ograničeni; 3. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren može biti postojeći; 4. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije; c. u zoni poslovne i ugostiteljsko-turističke namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. na jednoj građevnoj čestici moguće je graditi više građevina; 3. izgrađenost građevne čestice je do 50%; 4. najveći je koeficijent iskoristivosti nadzemno kisn 3,0; 5. najmanji je koeficijent iskoristivosti nadzemno kisn 1,5, osim za građevine javne i društvene namjene; 6. najmanji prirodni krajobrazno uređen teren je 30%; 7. za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m; 8. potreban broj PGM-a treba osigurati na građevnoj čestici ili drugačije prema odredbama urbanističkog plana uređenja; 9. rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju; 10. iznimno, na prostoru Trnja, istočno od ogranka Radničke ceste u zoni K1 označenom na kartografskom prikazu 4a. Urbana pravila - izmjene i dopune 2025., udaljenost nove visoke građevine od međe pripadajuće građevne čestice može biti i manja od h/2, ali ne manja od 6,0 m, osim od onih međa na koje je prislonjena i javnoprometnih površina. Ostali parametri prema detaljnim pravilima. Na jugoistočnom dijelu prostora omogućava se zadržavanje, rekonstrukcija i zamjena ugrađene građevine; 11. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni poslovne namjene.", "(4) Programske smjernice: UPU Kraš 1. transformacija u prostor mješovite namjene visokoga urbanog standarda; 2. promjena postojeće parcelacije; 3. planiranje urbanističke cjeline naselja pretežito visoke gradnje kao nastavak tipologije i oblikovanja građevina izvornog planskog koncepta naselja Ravnice; 4. povezivanje s okolnom izgrađenom strukturom; 5. uređenje novih gradskih prostora i javne infrastrukture; 6. osiguranje površina javne i društvene namjene u skladu s potrebama naselja i zahtjevima javnopravnih tijela; 7. preispitati mogućnost otvaranja potoka uz ulicu Ravnice; 8. najveći koeficijent iskoristivosti nadzemno kisn 2,5."]}, "2.10.": {"clanak": "77", "naziv": "Uređenje, zaštita i urbana obnova kompleksa jedne namjene", "prostori": "javne i društvene namjene (Aleja G. Šuška, Klin, Jankomir, bolnice), zona gospodarske namjene (Klara, Radnička cesta, Žitnjak, Slavonska avenija - sjever, Ravnice, Ulica Rudolfa Kolaka, Prilaz baruna Filipovića, Ilica, Šanci, Dugave - jug, Sloboština - jug, Blato - Lanište, URIHO, Avenija Većeslava Holjevca - zapad, istok, Delci, Jakuševec - jug, Novi Petruševec i Jankomir), malo poduzetništvo (Servisna zona Retkovec, Savica - Šanci, Melištice - zona zapadno od Ulice Luje Naletilića), sportsko-rekreacijska namjena s gradnjom (SRC Veslačka, SRC Chromos - Savica, Kruge, Cvjetno, Termalno kupalište Blato, SRC Jakuševec, SRC Siget, SRC Sloboština), sportsko- rekreacijska namjena bez gradnje (Mrzlo polje, dolina potoka Bliznec, dolina potoka Štefanovec, Trokut, Otočec, Klara, Dugave, Jakuševec, Golf centar Zagreb, Hipodrom, zona uz Mandlovu ulicu), posebna namjena, infrastrukturni sustavi (Resnik, TE-TO, Petruševec, Autobusni kolodvor), groblja i drugi prema grafičkom prikazu.", "opca": ["uređenje cjelina, vrijednih građevina i zelenih površina te komunalne opreme;", "dovršetak prostora novom gradnjom i uređenje otvorenih površina u funkciji osnovne namjene;", "za novu gradnju, za rekonstrukciju i za gradnju zamjenske građevine, u skladu s prostornim mogućnostima i programom određene namjene, poželjno je planirati zelene krovove, krovne vrtove i zelena pročelja;", "u svim namjenama omogućuje se gradnja više građevina na jednoj građevnoj čestici;", "na površinama javne i društvene, gospodarske, sportsko-rekreacijske, posebne namjene te na površinama infrastrukturnih sustava i groblja ograde se mogu graditi i više od 1,50 m radi zaštite građevine ili načina njezina korištenja;", "omogućuje se zadržavanje postojećih građevina kojih namjena nije u skladu s planiranom namjenom i njihova rekonstrukcija u postojećim gabaritima bez mogućnosti povećanja;", "zadržavanje kvalitetnih uređenih parkovnih površina i osobito stablašica;", "na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obavezna je izrada planova: UPU proširenje groblja Mirogoj, UPU Groblje Miroševec - istok, UPU Groblje Sv. Klara, UPU Groblje Čučerje, UPU Groblje Šestine, UPU Termalno kupalište Blato prema smjernicama iz podstavka g) stavka 3. i stavka 4. ovog članka."], "zone": [{"zona": "sve zone a. javna i društvena namjena", "items": ["gradnja novih građevina;", "građevna čestica oblikuje se prema normativima za određenu namjenu (škole, dječje ustanove i sl.);", "najveća izgrađenost građevne čestice je 40%;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen s najmanje 40% površine pokriveno krošnjama kada stabla dosegnu vegetacijsku zrelost;", "najveća visina je šest nadzemnih etaža; građevina može imati i veći broj etaža ako je to vezano uz funkciju građevine ili lokalne uvjete; novu gradnju nije moguće planirati na postojećim krajobrazno uređenim površinama;", "obvezan je smještaj vozila na građevnoj čestici prema normativima ove odluke (ne unutar rezervacije proširenja postojeće ulice);", "najmanja udaljenost građevine od međa građevne čestice je h/2 (polovica visina), osim od postojeće ili planirane javnoprometne površine; za gradnju građevine vjerske namjene primjenjuje se članak 56. stavak 27. ovih odredbi;", "za gradnju novih građevina obvezan je javni arhitektonski natječaj osim ako člankom 99. ove odluke nije određeno drugačije;", "rekonstrukcija, gradnja zamjenske građevine i interpolacija moguća je prema pravilima za novu gradnju, bez obaveze javnog arhitektonskog natječaja; u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren nije određen; b. gospodarska namjena (proizvodna, poslovna, trgovački kompleksi i ugostiteljsko-turistička namjena):", "gradnja novih i rekonstrukcija postojećih građevina;", "najmanja građevna čestica je 1000 m², osim prigodom rekonstrukcija i interpolacija na postojećim manjim građevnim česticama;", "omogućuje se gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina;", "najveća izgrađenost građevne čestice je 60%;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice; u rekonstrukciji postojećeg kompleksa mogući je i manji udio postojećeg terena, ali ne manji od 20%;", "najveći kisn 2,0; kisn može biti i veći ako je to rezultat razrade prostora urbanističkim planom uređenja;", "visina i broj etaža građevine određuje se ovisno o tehnologiji i namjeni;", "obvezan smještaj vozila na građevnoj čestici prema normativima ove odluke za određenu namjenu (ne unutar rezervacije proširenja postojeće ulice); iznimno u predjelima gospodarske namjene – proizvodne (I, G) omogućuje se parkiranje na zasebnoj čestici unutar pojedine gospodarske zone ili drukčije prema odredbama urbanističkog plana uređenja;", "građevni pravac u skladu s kontinuiranim građevnim pravcem postojećih građevina u pretežito izgrađenom uličnom potezu; kada ne postoji kontinuirani građevni pravac udaljenost od javnoprometne površine ili površine rezervirane za proširenje postojeće ulice je najmanje 10 m;", "najmanja udaljenost građevine od međa građevne čestice je h/2, ali ne manje od 3,0 m, iznimno u predjelima gospodarske namjene – proizvodne (I, G) udaljenost od međa drugih g
