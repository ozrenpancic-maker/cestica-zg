onstrukcija postojećih ili interpolacija novih građevina prema prevladavajućoj tipologiji gradnje (individualna, niska ili visoka gradnja) u pojedinoj prostornoj cjelini tj. zoni omeđenoj javnim prostorima, bez promjene tipologije – primjenjuju se urbana pravila iz članka 71. (individualna gradnja), 74. (niska gradnja) ili 76. (visoka gradnja);", "promjena tipologije moguća je za zahvate u prostoru na novim prostornim cjelinama (urbanim blokovima tj. cjelinama koje su omeđene javnim prostorom - ulicom ili uređenim parkom): primjenjuju se urbana pravila iz članaka 74. ili 76. ako su zadovoljeni uvjeti o minimalnoj širini prometnica za pojedini tip gradnje iz članka 38. ovih odredbi;", "promjena tipologije moguća je i kao zahvat urbane preobrazbe cjelovite zone urbanog pravila uz obavezno donošenje urbanističkog plana uređenja;", "u slučajevima pojedinačne transformacije prostornih cjelina u prostore visoke gradnje najmanje 20% površine prostorne cjeline potrebno je planirati kao uređenu površinu koja je uvijek dostupna javnosti (popločana površina – trg, ozelenjena površina – park, igralište; pasaž i sl.);", "transformacija prostora pojedine čestice individualne ili niske gradnje u prostor visoke gradnje nije moguća;", "kada se izrađuje urbanistički plan uređenja za urbanu preobrazbu najmanje 20% površine obuhvata plana potrebno je planirati kao javnu površinu (trg ili javni park)."], "key": {}}], "tekst": ["(1) Uređenje i urbana obnova prostora mješovite gradnje (2.8.) - prostori: Stenjevec - sjever, Oranice, Zagorska - Selska, Petrine - Županići, Čulinečka, Peščenica - sjever, Tvornica Fotokemika, Dubec, Volovčica, Vrbik i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. obnova i dovršetak postojeće urbane matrice gradnjom novih građevina u skladu s prevladavajućom postojećom tipologijom gradnje (individualna, niska ili visoka gradnja), interpolacijom, rekonstrukcijom i zamjenom trošnih građevina; 2. omogućuje se urbana transformacija (promjena postojeće tipologije gradnje) većih prostornih cjelina ako se radi o zahvatu u prostoru koji obuhvaća zonu omeđenu javnim prostorima ili je u skladu s urbanističkim planom uređenja; 3. očuvanje elemenata identiteta i memorije naselja (postojeći trgovi, ulice, parkovi, karakteristični urbani potezi); 4. podizanje standarda naselja rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te osiguravanjem prostora za prateće sadržaje; 5. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 6. obvezno je uređenje prostora prema planovima na snazi UPU Vrbik - Središnji prostor i UPU Petrine – Županići; 7. obavezna je izrada plana UPU Medarska – produžena Ivane Brlić Mažuranić, prema smjernicama iz stavka 4. ovog članka.", "(3) Detaljna pravila: 1. rekonstrukcija postojećih ili interpolacija novih građevina prema prevladavajućoj tipologiji gradnje (individualna, niska ili visoka gradnja) u pojedinoj prostornoj cjelini tj. zoni omeđenoj javnim prostorima, bez promjene tipologije – primjenjuju se urbana pravila iz članka 71. (individualna gradnja), 74. (niska gradnja) ili 76. (visoka gradnja); 2. promjena tipologije moguća je za zahvate u prostoru na novim prostornim cjelinama (urbanim blokovima tj. cjelinama koje su omeđene javnim prostorom - ulicom ili uređenim parkom): primjenjuju se urbana pravila iz članaka 74. ili 76. ako su zadovoljeni uvjeti o minimalnoj širini prometnica za pojedini tip gradnje iz članka 38. ovih odredbi; 3. promjena tipologije moguća je i kao zahvat urbane preobrazbe cjelovite zone urbanog pravila uz obavezno donošenje urbanističkog plana uređenja; 4. u slučajevima pojedinačne transformacije prostornih cjelina u prostore visoke gradnje najmanje 20% površine prostorne cjeline potrebno je planirati kao uređenu površinu koja je uvijek dostupna javnosti (popločana površina – trg, ozelenjena površina – park, igralište; pasaž i sl.); 5. transformacija prostora pojedine čestice individualne ili niske gradnje u prostor visoke gradnje nije moguća; 6. kada se izrađuje urbanistički plan uređenja za urbanu preobrazbu najmanje 20% površine obuhvata plana potrebno je planirati kao javnu površinu (trg ili javni park).", "(4) Programske smjernice: UPU Medarska - produžena Ulica Ivane Brlić Mažuranić 1. površine mješovite – pretežito stambene namjene; 2. preispitati mogućnost transformacije i uređenje postojeće izgrađene strukture u prostor niske i visoke izgradnje; 3. podizanje standarda postojeće ulične mreže, afirmacija poteza uz Ulicu Ivane Brlić Mažuranić; 4. uređenje prostora javnih zelenih površina i uvođenje elemenata zelene i pješačke infrastrukture."]}, "2.9.": {"clanak": "76", "naziv": "Uređenje i urbana obnova prostora visoke gradnje", "prostori": "Trešnjevka - centar, Voltino - sjever, ulica Dubrava, ulica Svetice, Brezje, Savska - Veslačka, Vrbik, Chromos - Radnička, Heinzelova - Vukovarska - sjever, Radnička, Sloboština, Remetinec - Lanište, blok Krešimir i drugi prema grafičkom prikazu.", "opca": ["obnova i dovršetak urbane matrice gradnjom novih građevina, interpolacijom, rekonstrukcijom i zamjenom trošnih građevina uz omogućavanje promjena oblika i veličine građevnih čestica;", "očuvanje elemenata identiteta (elementi urbane matrice s naglaskom na vrijednim neizgrađenim prostorima i pješačkim pravcima, ambijentalna obilježja i prostorni doživljaji, izvorne graditeljsko-oblikovne karakteristike i sl.);", "podizanje urbanog standarda rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te obveznim osiguravanjem prostora za prateće sadržaje;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obvezno je uređenje prostora prema planovima na snazi: UPU Oporovečka - sjever, UPU Vrbik - Savska - Slavonska, DPU Savska - Vukovarska, UPU Brezje - zona jug; DPU Vrbik - uz Ulicu Ivana Lučića (Sveučilišna aleja);", "obavezna je izrada plana UPU Kraš, prema smjernicama iz stavka 4. ovog članka."], "zone": [{"zona": "u zoni stambene i mješovite namjene", "items": ["gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina;", "na jednoj građevnoj čestici moguće je graditi više građevina;", "najveći broj samostalnih uporabnih jedinica za stambenu i/ili mješovitu stambeno-poslovnu građevinu računa se po kriteriju 50 m² građevne čestice po samostalnoj uporabnoj jedinici;", "razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca;", "izgrađenost građevne čestice je do 50%;", "najveći je koeficijent iskoristivosti nadzemno kisn 2,0 za poslovnu, stambenu i stambeno-poslovnu namjenu;", "najmanji je koeficijent iskoristivosti nadzemno kisn 1,0, osim za građevine javne i društvene namjene; u rekonstrukciji postojeći manji kisn može biti i manji od propisanog;", "građevine niže od četiri nadzemne etaže mogu se graditi samo kao dio složenih građevina i ne mogu predstavljati prvu etapu ili fazu na način da se visoka građevina izvodi u kasnijoj etapi ili fazi gradnje;", "najmanji prirodni krajobrazno uređen teren je 30%;", "za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m;", "potreban broj PGM-a treba osigurati na građevnoj čestici ili drukčije prema odredbama urbanističkog plana uređenja, u skladu sa člankom 39. ovih odredbi;", "rekonstrukcija se izvodi uz obvezu zadovoljenja PGM; rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju;", "uz gradske avenije i glavne gradske ulice omogućava se gradnja visokih građevina i s većim kisn, ali ne većim od 3,0, uz uvjet donošenja urbanističkog plana uređenja; predmetni urbanistički plan uređenja mora obavezno u grafičkom dijelu propisivati oblik i veličinu građevnih čestica i ne može obuhvaćati samo jednu građevnu česticu ukoliko je njena površina manja od 1 ha;", "izrada urbanističkog plana uređenja obavezna je za površine/građevne čestice veće od 1 ha ukoliko se predlaže urbana preobrazba (uvodi se nova ulična mreža te mijenja urbana struktura i morfologija);", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena, osim javne i društvene i sportsko-rekreacijske namjene – sport s gradnjom, koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene te sportsko-rekreacijske namjene – sport s gradnjom prema detaljnim pravilima za odgovarajuću zonu iz članka", "ovih odredbi;"], "key": {"izgradenost": "izgrađenost građevne čestice je do 50%;", "pgm": "potreban broj PGM-a treba osigurati na građevnoj čestici ili drukčije prema odredbama urbanističkog plana uređenja, u skladu sa člankom 39. ovih odredbi;"}}, {"zona": "u zoni javne i društvenenamjene", "items": ["gradnja i rekonstrukcija moguća je prema programu osnovne namjene;", "najveća izgrađenost građevne čestice je 40%; najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; najmanji prirodni, krajobrazno uređen teren je 30%, drugi lokacijski uvjeti nisu ograničeni;", "u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren može biti postojeći;", "gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije;"], "key": {"izgradenost": "najveća izgrađenost građevne čestice je 40%; najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; najmanji prirodni, krajobrazno uređen teren je 30%, drugi lokacijski uvjeti nisu ograničeni;"}}, {"zona": "u zoni poslovne i ugostiteljsko-turističke namjene", "items": ["gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina;", "na jednoj građevnoj čestici moguće je graditi više građevina;", "izgrađenost građevne čestice je do 50%;", "najveći je koeficijent iskoristivosti nadzemno kisn 3,0;", "najmanji je koeficijent iskoristivosti nadzemno kisn 1,5, osim za građevine javne i društvene namjene;", "najmanji prirodni krajobrazno uređen teren je 30%;", "za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m;", "potreban broj PGM-a treba osigurati na građevnoj čestici ili drugačije prema odredbama urbanističkog plana uređenja;", "rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju;", "iznimno, na prostoru Trnja, istočno od ogranka Radničke ceste u zoni K1 označenom na kartografskom prikazu 4a. Urbana pravila - izmjene i dopune 2025., udaljenost nove visoke građevine od međe pripadajuće građevne čestice može biti i manja od h/2, ali ne manja od 6,0 m, osim od onih međa na koje je prislonjena i javnoprometnih površina. Ostali parametri prema detaljnim pravilima. Na jugoistočnom dijelu prostora omogućava se zadržavanje, rekonstrukcija i zamjena ugrađene građevine;", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni poslovne namjene."], "key": {"izgradenost": "izgrađenost građevne čestice je do 50%;", "pgm": "potreban broj PGM-a treba osigurati na građevnoj čestici ili drugačije prema odredbama urbanističkog plana uređenja;"}}], "tekst": ["(1) Uređenje i urbana obnova prostora visoke gradnje (2.9.) - prostori: Trešnjevka - centar, Voltino - sjever, ulica Dubrava, ulica Svetice, Brezje, Savska - Veslačka, Vrbik, Chromos - Radnička, Heinzelova - Vukovarska - sjever, Radnička, Sloboština, Remetinec - Lanište, blok Krešimir i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. obnova i dovršetak urbane matrice gradnjom novih građevina, interpolacijom, rekonstrukcijom i zamjenom trošnih građevina uz omogućavanje promjena oblika i veličine građevnih čestica; 2. očuvanje elemenata identiteta (elementi urbane matrice s naglaskom na vrijednim neizgrađenim prostorima i pješačkim pravcima, ambijentalna obilježja i prostorni doživljaji, izvorne graditeljsko-oblikovne karakteristike i sl.); 3. podizanje urbanog standarda rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te obveznim osiguravanjem prostora za prateće sadržaje; 4. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 5. obvezno je uređenje prostora prema planovima na snazi: UPU Oporovečka - sjever, UPU Vrbik - Savska - Slavonska, DPU Savska - Vukovarska, UPU Brezje - zona jug; DPU Vrbik - uz Ulicu Ivana Lučića (Sveučilišna aleja); 6. obavezna je izrada plana UPU Kraš, prema smjernicama iz stavka 4. ovog članka.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. na jednoj građevnoj čestici moguće je graditi više građevina; 3. najveći broj samostalnih uporabnih jedinica za stambenu i/ili mješovitu stambeno-poslovnu građevinu računa se po kriteriju 50 m² građevne čestice po samostalnoj uporabnoj jedinici; 4. razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca; 5. izgrađenost građevne čestice je do 50%; 6. najveći je koeficijent iskoristivosti nadzemno kisn 2,0 za poslovnu, stambenu i stambeno-poslovnu namjenu; 7. najmanji je koeficijent iskoristivosti nadzemno kisn 1,0, osim za građevine javne i društvene namjene; u rekonstrukciji postojeći manji kisn može biti i manji od propisanog; 8. građevine niže od četiri nadzemne etaže mogu se graditi samo kao dio složenih građevina i ne mogu predstavljati prvu etapu ili fazu na način da se visoka građevina izvodi u kasnijoj etapi ili fazi gradnje; 9. najmanji prirodni krajobrazno uređen teren je 30%; 10. za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m; 11. potreban broj PGM-a treba osigurati na građevnoj čestici ili drukčije prema odredbama urbanističkog plana uređenja, u skladu sa člankom 39. ovih odredbi; 12. rekonstrukcija se izvodi uz obvezu zadovoljenja PGM; rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju; 13. uz gradske avenije i glavne gradske ulice omogućava se gradnja visokih građevina i s većim kisn, ali ne većim od 3,0, uz uvjet donošenja urbanističkog plana uređenja; predmetni urbanistički plan uređenja mora obavezno u grafičkom dijelu propisivati oblik i veličinu građevnih čestica i ne može obuhvaćati samo jednu građevnu česticu ukoliko je njena površina manja od 1 ha; 14. izrada urbanističkog plana uređenja obavezna je za površine/građevne čestice veće od 1 ha ukoliko se predlaže urbana preobrazba (uvodi se nova ulična mreža te mijenja urbana struktura i morfologija); 15. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena, osim javne i društvene i sportsko-rekreacijske namjene – sport s gradnjom, koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene te sportsko-rekreacijske namjene – sport s gradnjom prema detaljnim pravilima za odgovarajuću zonu iz članka 77. ovih odredbi; b. u zoni javne i društvenenamjene: 1. gradnja i rekonstrukcija moguća je prema programu osnovne namjene; 2. najveća izgrađenost građevne čestice je 40%; najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; najmanji prirodni, krajobrazno uređen teren je 30%, drugi lokacijski uvjeti nisu ograničeni; 3. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren može biti postojeći; 4. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije; c. u zoni poslovne i ugostiteljsko-turističke namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. na jednoj građevnoj čestici moguće je graditi više građevina; 3. izgrađenost građevne čestice je do 50%; 4. najveći je koeficijent iskoristivosti nadzemno kisn 3,0; 5. najmanji je koeficijent iskoristivosti nadzemno kisn 1,5, osim za građevine javne i društvene namjene; 6. najmanji prirodni krajobrazno uređen teren je 30%; 7. za gradnju na regulacijskoj liniji najmanja širina koridora ulice je 18,0 m; 8. potreban broj PGM-a treba osigurati na građevnoj čestici ili drugačije prema odredbama urbanističkog plana uređenja; 9. rekonstrukcija i gradnja novih građevina i interpolacija izvode se prema pravilima za novu gradnju; 10. iznimno, na prostoru Trnja, istočno od ogranka Radničke ceste u zoni K1 označenom na kartografskom prikazu 4a. Urbana pravila - izmjene i dopune 2025., udaljenost nove visoke građevine od međe pripadajuće građevne čestice može biti i manja od h/2, ali ne manja od 6,0 m, osim od onih međa na koje je prislonjena i javnoprometnih površina. Ostali parametri prema detaljnim pravilima. Na jugoistočnom dijelu prostora omogućava se zadržavanje, rekonstrukcija i zamjena ugrađene građevine; 11. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni poslovne namjene.", "(4) Programske smjernice: UPU Kraš 1. transformacija u prostor mješovite namjene visokoga urbanog standarda; 2. promjena postojeće parcelacije; 3. planiranje urbanističke cjeline naselja pretežito visoke gradnje kao nastavak tipologije i oblikovanja građevina izvornog planskog koncepta naselja Ravnice; 4. povezivanje s okolnom izgrađenom strukturom; 5. uređenje novih gradskih prostora i javne infrastrukture; 6. osiguranje površina javne i društvene namjene u skladu s potrebama naselja i zahtjevima javnopravnih tijela; 7. preispitati mogućnost otvaranja potoka uz ulicu Ravnice; 8. najveći koeficijent iskoristivosti nadzemno kisn 2,5."]}, "2.10.": {"clanak": "77", "naziv": "Uređenje, zaštita i urbana obnova kompleksa jedne namjene", "prostori": "javne i društvene namjene (Aleja G. Šuška, Klin, Jankomir, bolnice), zona gospodarske namjene (Klara, Radnička cesta, Žitnjak, Slavonska avenija - sjever, Ravnice, Ulica Rudolfa Kolaka, Prilaz baruna Filipovića, Ilica, Šanci, Dugave - jug, Sloboština - jug, Blato - Lanište, URIHO, Avenija Većeslava Holjevca - zapad, istok, Delci, Jakuševec - jug, Novi Petruševec i Jankomir), malo poduzetništvo (Servisna zona Retkovec, Savica - Šanci, Melištice - zona zapadno od Ulice Luje Naletilića), sportsko-rekreacijska namjena s gradnjom (SRC Veslačka, SRC Chromos - Savica, Kruge, Cvjetno, Termalno kupalište Blato, SRC Jakuševec, SRC Siget, SRC Sloboština), sportsko- rekreacijska namjena bez gradnje (Mrzlo polje, dolina potoka Bliznec, dolina potoka Štefanovec, Trokut, Otočec, Klara, Dugave, Jakuševec, Golf centar Zagreb, Hipodrom, zona uz Mandlovu ulicu), posebna namjena, infrastrukturni sustavi (Resnik, TE-TO, Petruševec, Autobusni kolodvor), groblja i drugi prema grafičkom prikazu.", "opca": ["uređenje cjelina, vrijednih građevina i zelenih površina te komunalne opreme;", "dovršetak prostora novom gradnjom i uređenje otvorenih površina u funkciji osnovne namjene;", "za novu gradnju, za rekonstrukciju i za gradnju zamjenske građevine, u skladu s prostornim mogućnostima i programom određene namjene, poželjno je planirati zelene krovove, krovne vrtove i zelena pročelja;", "u svim namjenama omogućuje se gradnja više građevina na jednoj građevnoj čestici;", "na površinama javne i društvene, gospodarske, sportsko-rekreacijske, posebne namjene te na površinama infrastrukturnih sustava i groblja ograde se mogu graditi i više od 1,50 m radi zaštite građevine ili načina njezina korištenja;", "omogućuje se zadržavanje postojećih građevina kojih namjena nije u skladu s planiranom namjenom i njihova rekonstrukcija u postojećim gabaritima bez mogućnosti povećanja;", "zadržavanje kvalitetnih uređenih parkovnih površina i osobito stablašica;", "na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obavezna je izrada planova: UPU proširenje groblja Mirogoj, UPU Groblje Miroševec - istok, UPU Groblje Sv. Klara, UPU Groblje Čučerje, UPU Groblje Šestine, UPU Termalno kupalište Blato prema smjernicama iz podstavka g) stavka 3. i stavka 4. ovog članka."], "zone": [{"zona": "sve zone a. javna i društvena namjena", "items": ["gradnja novih građevina;", "građevna čestica oblikuje se prema normativima za određenu namjenu (škole, dječje ustanove i sl.);", "najveća izgrađenost građevne čestice je 40%;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen s najmanje 40% površine pokriveno krošnjama kada stabla dosegnu vegetacijsku zrelost;", "najveća visina je šest nadzemnih etaža; građevina može imati i veći broj etaža ako je to vezano uz funkciju građevine ili lokalne uvjete; novu gradnju nije moguće planirati na postojećim krajobrazno uređenim površinama;", "obvezan je smještaj vozila na građevnoj čestici prema normativima ove odluke (ne unutar rezervacije proširenja postojeće ulice);", "najmanja udaljenost građevine od međa građevne čestice je h/2 (polovica visina), osim od postojeće ili planirane javnoprometne površine; za gradnju građevine vjerske namjene primjenjuje se članak 56. stavak 27. ovih odredbi;", "za gradnju novih građevina obvezan je javni arhitektonski natječaj osim ako člankom 99. ove odluke nije određeno drugačije;", "rekonstrukcija, gradnja zamjenske građevine i interpolacija moguća je prema pravilima za novu gradnju, bez obaveze javnog arhitektonskog natječaja; u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren nije određen; b. gospodarska namjena (proizvodna, poslovna, trgovački kompleksi i ugostiteljsko-turistička namjena):", "gradnja novih i rekonstrukcija postojećih građevina;", "najmanja građevna čestica je 1000 m², osim prigodom rekonstrukcija i interpolacija na postojećim manjim građevnim česticama;", "omogućuje se gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina;", "najveća izgrađenost građevne čestice je 60%;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice; u rekonstrukciji postojećeg kompleksa mogući je i manji udio postojećeg terena, ali ne manji od 20%;", "najveći kisn 2,0; kisn može biti i veći ako je to rezultat razrade prostora urbanističkim planom uređenja;", "visina i broj etaža građevine određuje se ovisno o tehnologiji i namjeni;", "obvezan smještaj vozila na građevnoj čestici prema normativima ove odluke za određenu namjenu (ne unutar rezervacije proširenja postojeće ulice); iznimno u predjelima gospodarske namjene – proizvodne (I, G) omogućuje se parkiranje na zasebnoj čestici unutar pojedine gospodarske zone ili drukčije prema odredbama urbanističkog plana uređenja;", "građevni pravac u skladu s kontinuiranim građevnim pravcem postojećih građevina u pretežito izgrađenom uličnom potezu; kada ne postoji kontinuirani građevni pravac udaljenost od javnoprometne površine ili površine rezervirane za proširenje postojeće ulice je najmanje 10 m;", "najmanja udaljenost građevine od međa građevne čestice je h/2, ali ne manje od 3,0 m, iznimno u predjelima gospodarske namjene – proizvodne (I, G) udaljenost od međa drugih građevnih čestica unutar iste namjene (I, G) može biti i manja od h/2, ali ne manje od 3,0 m;", "za proizvodnu namjenu i trgovačke komplekse planirati zelenu tamponzonu kao prirodni teren s visokim zelenilom širine minimalno 10 m prema namjenama S, M, M1, M2 i svim javnim i društvenim namjenama;", "u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice, kisn i visina veći od propisanih mogu se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći;", "arhitektonska kompozicija i oblikovanje građevina moraju biti primjereni karakteru zone, osobito na potezima uz gradske avenije koji definiraju ulaz u grad;", "prigodom prenamjene (restrukturiranja) i promjene prostorne organizacije većih postojećih radnih kompleksa moguća je prenamjena dijela ili cjeline u različite prostore uredskog poslovanja, trgovine, kulture, znanosti, zabave, rekreacije i hotele; na lokacijama postojećih industrijskih pogona mogu se smjestiti i trgovački centri koji moraju biti prilagođeni urbanom prostoru tipologijom i ponudom \"gradske robne kuće\" (trgovački kompleksi K2 su isključeni), te s parkiralištem na površini terena koje osigurava najviše trećinu potreba za parkiranjem (ostatak potrebnih PGM-a podzemno ili u sklopu građevine); eventualno, dijeljenje na manje cjeline moguće u skladu s propozicijama za gradnju novih i rekonstrukciju postojećih građevina, uz uvjet da se ne može graditi na uređenim zelenim površinama;", "iznimno, na prostoru zone planske oznake I. u Vukomercu, omogućuje se gradnja tehničko-putničkog kolodvora prema detaljnim pravilima za infrastrukturne sustave ovog članka;", "iznimno, na prostorima određenima za malo poduzetništvo (Servisna zona Retkovec, Savica - Šanci i Melištica - zona zapadno od Ulice Luje Naletilića u Novom Zagrebu) najmanja površina građevne čestice je 500 m², a najveća 3.000 m²; najveća visina građevine je četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; na istoj građevnoj čestici moguće je planirati jedan stan najveće bruto stambene površine do 150 m²; ostalo prema detaljnim pravilima;", "iznimno, za novu gradnju u zonama poslovne namjene uz Ulicu Republike Njemačke, Heinzelovu, Slavonsku aveniju, Ulicu grada Gospića i Aveniju V. Holjevca najmanje je visine pet nadzemnih etaža, ostalo prema detaljnim pravilima;", "iznimno u zoni gospodarske namjene dio Sisačke ceste I. odvojka i dio Saljske ulice određen je za malo poduzetništvo, namjene pretežno uslužne djelatnosti, najmanja površina parcele 350 m²; najveća visina građevine je četiri nadzemne etaže. Na istoj građevnoj čestici moguće je planirati jedan stan najveće bruto površine 150 m², najmanja udaljenost od međe h/2, iznimno 1,0 m, ostalo prema detaljnim pravilima;", "iznimno, za gradnju građevine Zagreb arene u prostoru planske namjene oznake K2 u Laništu, drugi lokacijski uvjeti nisu ograničeni;", "iznimno, između Zagrebačke avenije i ulice Kotarnica, prema grafičkom prikazu, omogućuje se najveća izgrađenost građevne čestice 70% i najveće kisn 2,2, ostalo prema detaljnim pravilima;", "iznimno, na lokaciji zatvorenih industrijskih kompleksa u Jankomiru, Borongaju i Fallerovom šetalištu prema grafičkom prikazu, omogućuje se najveća izgrađenost građevne čestice 80%, najveće kisn 2,2 i rješenje priključka građevne čestice na prometnu površinu prema postojećem stanju izvedenosti; ukoliko je udio prirodnog terena manji od 20% potrebno ga je u potpunosti zadržati;", "iznimno na prostoru zone K1 na Kajzerici, istočno od željezničke pruge omogućuje se gradnja kompleksa URIHO-a, što uključuje polivalentni rehabilitacijski centar i proizvodni pogon, dom za osobe s invaliditetom, te ostale prateće sadržaje, a na preostalom dijelu zone K1 istočno od planirane prometnice, sjeverno od Avenije Dubrovnik i zapadno od Zagrebačkog velesajma, omogućuje se gradnja i stambenih i stambenoposlovnih građevina;", "iznimno, za gradnju građevina javne i društvene namjene na prostoru Kozari puteva, unutar zone K1, lokacijski uvjeti nisu propisani, obvezna je provedba javnog arhitektonskog natječaja osim ako člankom 99. ove odluke nije određeno drugačije; c. sportsko-rekreacijska namjena - sport s gradnjom:", "gradnja novih građevina i rekonstrukcija;", "građevna čestica površine, u pravilu, najmanje 5.000 m²; iznimno, može se zadržati manja površina ako je građevna čestica cijela u zoni određenoj kartografskim prikazom 1. KORIŠTENJE I NAMJENA PROSTORA - izmjene i dopune 2025., ali ne manja od 2.000 m²;", "najveća izgrađenost građevne čestice 40%;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice, osim u kontaktnom području priobalja rijeke Save i u podsljemenskoj zoni, gdje najmanje 50% građevne čestice mora biti prirodno tlo (uređena zelena površina);", "visina građevine uvjetovana je specifičnim zahtjevima vrste sporta; građevina (ili njezin dio) u kojoj je smješten prateći sadržaj može biti viša od građevine osnovne namjene;", "u ukupnom GBP-u sportski sadržaji moraju biti zastupljeni s najmanje 70%, drugo mogu biti prateći sadržaji, osim za stadione gdje udio pratećih sadržaja može biti i veći;", "iznimno, za gradnju u priobalju Save uz Veslačko naselje, najmanja građevna čestica je 4000 m², a rekonstrukcije su moguće na postojećim manjim česticama;", "iznimno, na prostoru zone rekonstrukcije Doma sportova omogućuje se izgradnja i uređenje sportskih i pratećih sadržaja te javne garaže, pri čemu odnos sportskih i pratećih sadržaja može biti i drugačiji od propisanoga; ostali lokacijski uvjeti nisu propisani;", "iznimno, na lokaciji bazena Špansko s obzirom na lokalne uvjete i blizinu javnog prijevoza pri određivanju broja PGM računa se na preklapanje u korištenju na način da se omogući gradnja po provedenom javnom arhitektonskom natječaju uz rješavanje ukupno potrebnog broja od 90 PGM-a uz postojeće obodne ulice;", "u rekonstrukciji i gradnji zamjenskih građevina postojeća izgrađenost građevne čestice veća od propisane može se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći; d. sportsko-rekreacijska namjena - sport bez gradnje:", "građevna čestica površine, u pravilu, najmanje 5000 m²; iznimno, može se zadržati manja površina ako obuhvaća cijelu zonu određenu kartografskim prikazom 1. KORIŠTENJE I NAMJENA PROSTORA - izmjene i dopune 2025.;", "na ovim se prostorima mogu uređivati otvorena igrališta te graditi manje prateće građevine koje upotpunjuju i služe osnovnoj djelatnosti (garderobe, sanitarije, manji ugostiteljski sadržaji i sl.), ukupan GBP do 1000 m²/ha cjelovite uređene sportsko-rekreacijske površine - građevne čestice, a proporcionalno manje na manjima; ukupni GBP ne može biti veći od 5000 m²; otvorena igrališta mogu se sezonski natkriti; prateći se sadržaji mogu graditi istodobno ili nakon uređenja otvorenih sportsko-rekreacijskih igrališta;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice, osim u kontaktnom području priobalja rijeke Save, u podsljemenskoj zoni, gdje najmanje 50% građevne čestice mora biti prirodni teren;", "sportsko-rekreacijsku namjenu – sport s gradnjom (R1) na lokaciji Mandlova moguće je realizirati u južnom dijelu zone prema iznimci na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025. u skladu s urbanim pravilima iz točki 1. - 6. podstavka c. sportsko-rekreacijska namjena - sport s gradnjom stavka 3. ovog članka; e. posebna namjena:", "površine posebne namjene uređuju se prema posebnim propisima;", "unutar površina posebne namjene mogu se graditi i rekonstruirati građevine i postavljati uređaji koji služe osnovnoj namjeni;", "visina građevina uvjetovana je specifičnim zahtjevima osnovne namjene uz obvezu poštivanja lokalnih uvjeta; f. infrastrukturni sustavi:", "gradnja novih građevina i rekonstrukcija;", "veličina građevne čestice, građevine i pratećih sadržaja određeni su tehnološkim zahtjevima i posebnim propisima;", "primijeniti mjere prilagodbe klimatskim promjenama; poštovati mjere zaštite okoliša; što je moguće više sadržaja smjestiti podzemno; neizgrađene dijelove građevne čestice krajobrazno urediti na temelju projekta krajobraznog uređenja;", "rubove građevnih čestica prema drugim namjenama treba urediti kao zaštitni vegetacijski pojas najmanje širine 10 m, iznimno i manje za donju stanicu žičare; g. groblje:", "prostore groblja oblikovati kao zelene parkovne površine kvalitetnim parkovno-pejsažnim rješenjima i osiguravanjem standarda najmanje površine po grobnom mjestu u skladu s posebnim propisima o grobljima;", "na prostorima groblja mogu se graditi prateće građevine, tj. građevine koje služe osnovnoj funkciji groblja (crkve, kapele, obredne dvorane, mrtvačnice i sl.), te komunalna infrastruktura;", "uređenje svih groblja, gradnja pratećih građevina, te oblikovanje opreme što se na groblju postavlja, mora biti primjereno oblikovanju, uređenosti i tradiciji takvih prostora;", "uz granicu groblja, a unutar površine groblja, treba osigurati zaštitni vegetacijski pojas najmanje širine 10,0 m prema namjenama S, M, M1, M2 i svim javnim i društvenim namjenama;", "uređenje groblja uskladiti s posebnim propisima o grobljima;", "gradnja novih groblja uz obavezu izrade UPU-a;"], "key": {"izgradenost": "najveća izgrađenost građevne čestice je 40%;", "teren": "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen s najmanje 40% površine pokriveno krošnjama kada stabla dosegnu vegetacijsku zrelost;", "visina": "najveća visina je šest nadzemnih etaža; građevina može imati i veći broj etaža ako je to vezano uz funkciju građevine ili lokalne uvjete; novu gradnju nije moguće planirati na postojećim krajobrazno uređenim površinama;", "cestica": "najmanja građevna čestica je 1000 m², osim prigodom rekonstrukcija i interpolacija na postojećim manjim građevnim česticama;", "kis": "najveći kisn 2,0; kisn može biti i veći ako je to rezultat razrade prostora urbanističkim planom uređenja;", "pgm": "prigodom prenamjene (restrukturiranja) i promjene prostorne organizacije većih postojećih radnih kompleksa moguća je prenamjena dijela ili cjeline u različite prostore uredskog poslovanja, trgovine, kulture, znanosti, zabave, rekreacije i hotele; na lokacijama postojećih industrijskih pogona mogu se smjestiti i trgovački centri koji moraju biti prilagođeni urbanom prostoru tipologijom i ponudom \"gradske robne kuće\" (trgovački kompleksi K2 su isključeni), te s parkiralištem na površini terena koje osigurava najviše trećinu potreba za parkiranjem (ostatak potrebnih PGM-a podzemno ili u sklopu građevine); eventualno, dijeljenje na manje cjeline moguće u skladu s propozicijama za gradnju novih i rekonstrukciju postojećih građevina, uz uvjet da se ne može graditi na uređenim zelenim površinama;"}}], "tekst": ["(1) Uređenje, zaštita i urbana obnova kompleksa jedne namjene (2.10.) - prostori javne i društvene namjene (Aleja G. Šuška, Klin, Jankomir, bolnice), zona gospodarske namjene (Klara, Radnička cesta, Žitnjak, Slavonska avenija - sjever, Ravnice, Ulica Rudolfa Kolaka, Prilaz baruna Filipovića, Ilica, Šanci, Dugave - jug, Sloboština - jug, Blato - Lanište, URIHO, Avenija Većeslava Holjevca - zapad, istok, Delci, Jakuševec - jug, Novi Petruševec i Jankomir), malo poduzetništvo (Servisna zona Retkovec, Savica - Šanci, Melištice - zona zapadno od Ulice Luje Naletilića), sportsko-rekreacijska namjena s gradnjom (SRC Veslačka, SRC Chromos - Savica, Kruge, Cvjetno, Termalno kupalište Blato, SRC Jakuševec, SRC Siget, SRC Sloboština), sportskorekreacijska namjena bez gradnje (Mrzlo polje, dolina potoka Bliznec, dolina potoka Štefanovec, Trokut, Otočec, Klara, Dugave, Jakuševec, Golf centar Zagreb, Hipodrom, zona uz Mandlovu ulicu), posebna namjena, infrastrukturni sustavi (Resnik, TE-TO, Petruševec, Autobusni kolodvor), groblja i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. uređenje cjelina, vrijednih građevina i zelenih površina te komunalne opreme; 2. dovršetak prostora novom gradnjom i uređenje otvorenih površina u funkciji osnovne namjene; 3. za novu gradnju, za rekonstrukciju i za gradnju zamjenske građevine, u skladu s prostornim mogućnostima i programom određene namjene, poželjno je planirati zelene krovove, krovne vrtove i zelena pročelja; 4. u svim namjenama omogućuje se gradnja više građevina na jednoj građevnoj čestici; 5. na površinama javne i društvene, gospodarske, sportsko-rekreacijske, posebne namjene te na površinama infrastrukturnih sustava i groblja ograde se mogu graditi i više od 1,50 m radi zaštite građevine ili načina njezina korištenja; 6. omogućuje se zadržavanje postojećih građevina kojih namjena nije u skladu s planiranom namjenom i njihova rekonstrukcija u postojećim gabaritima bez mogućnosti povećanja; 7. zadržavanje kvalitetnih uređenih parkovnih površina i osobito stablašica; 8. na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 9. obavezna je izrada planova: UPU proširenje groblja Mirogoj, UPU Groblje Miroševec - istok, UPU Groblje Sv. Klara, UPU Groblje Čučerje, UPU Groblje Šestine, UPU Termalno kupalište Blato prema smjernicama iz podstavka g) stavka 3. i stavka 4. ovog članka.", "(3) Detaljna pravila a. javna i društvena namjena: 1. gradnja novih građevina; 2. građevna čestica oblikuje se prema normativima za određenu namjenu (škole, dječje ustanove i sl.); 3. najveća izgrađenost građevne čestice je 40%; 4. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen s najmanje 40% površine pokriveno krošnjama kada stabla dosegnu vegetacijsku zrelost; 5. najveća visina je šest nadzemnih etaža; građevina može imati i veći broj etaža ako je to vezano uz funkciju građevine ili lokalne uvjete; novu gradnju nije moguće planirati na postojećim krajobrazno uređenim površinama; 6. obvezan je smještaj vozila na građevnoj čestici prema normativima ove odluke (ne unutar rezervacije proširenja postojeće ulice); 7. najmanja udaljenost građevine od međa građevne čestice je h/2 (polovica visina), osim od postojeće ili planirane javnoprometne površine; za gradnju građevine vjerske namjene primjenjuje se članak 56. stavak 27. ovih odredbi; 8. za gradnju novih građevina obvezan je javni arhitektonski natječaj osim ako člankom 99. ove odluke nije određeno drugačije; 9. rekonstrukcija, gradnja zamjenske građevine i interpolacija moguća je prema pravilima za novu gradnju, bez obaveze javnog arhitektonskog natječaja; u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren nije određen; b. gospodarska namjena (proizvodna, poslovna, trgovački kompleksi i ugostiteljsko-turistička namjena): 1. gradnja novih i rekonstrukcija postojećih građevina; 2. najmanja građevna čestica je 1000 m², osim prigodom rekonstrukcija i interpolacija na postojećim manjim građevnim česticama; 3. omogućuje se gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 4. najveća izgrađenost građevne čestice je 60%; 5. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice; u rekonstrukciji postojećeg kompleksa mogući je i manji udio postojećeg terena, ali ne manji od 20%; 6. najveći kisn 2,0; kisn može biti i veći ako je to rezultat razrade prostora urbanističkim planom uređenja; 7. visina i broj etaža građevine određuje se ovisno o tehnologiji i namjeni; 8. obvezan smještaj vozila na građevnoj čestici prema normativima ove odluke za određenu namjenu (ne unutar rezervacije proširenja postojeće ulice); iznimno u predjelima gospodarske namjene – proizvodne (I, G) omogućuje se parkiranje na zasebnoj čestici unutar pojedine gospodarske zone ili drukčije prema odredbama urbanističkog plana uređenja; 9. građevni pravac u skladu s kontinuiranim građevnim pravcem postojećih građevina u pretežito izgrađenom uličnom potezu; kada ne postoji kontinuirani građevni pravac udaljenost od javnoprometne površine ili površine rezervirane za proširenje postojeće ulice je najmanje 10 m; 10. najmanja udaljenost građevine od međa građevne čestice je h/2, ali ne manje od 3,0 m, iznimno u predjelima gospodarske namjene – proizvodne (I, G) udaljenost od međa drugih građevnih čestica unutar iste namjene (I, G) može biti i manja od h/2, ali ne manje od 3,0 m; 11. za proizvodnu namjenu i trgovačke komplekse planirati zelenu tamponzonu kao prirodni teren s visokim zelenilom širine minimalno 10 m prema namjenama S, M, M1, M2 i svim javnim i društvenim namjenama; 12. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice, kisn i visina veći od propisanih mogu se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći; 13. arhitektonska kompozicija i oblikovanje građevina moraju biti primjereni karakteru zone, osobito na potezima uz gradske avenije koji definiraju ulaz u grad; 14. prigodom prenamjene (restrukturiranja) i promjene prostorne organizacije većih postojećih radnih kompleksa moguća je prenamjena dijela ili cjeline u različite prostore uredskog poslovanja, trgovine, kulture, znanosti, zabave, rekreacije i hotele; na lokacijama postojećih industrijskih pogona mogu se smjestiti i trgovački centri koji moraju biti prilagođeni urbanom prostoru tipologijom i ponudom \"gradske robne kuće\" (trgovački kompleksi K2 su isključeni), te s parkiralištem na površini terena koje osigurava najviše trećinu potreba za parkiranjem (ostatak potrebnih PGM-a podzemno ili u sklopu građevine); eventualno, dijeljenje na manje cjeline moguće u skladu s propozicijama za gradnju novih i rekonstrukciju postojećih građevina, uz uvjet da se ne može graditi na uređenim zelenim površinama; 15. iznimno, na prostoru zone planske oznake I. u Vukomercu, omogućuje se gradnja tehničko-putničkog kolodvora prema detaljnim pravilima za infrastrukturne sustave ovog članka; 16. iznimno, na prostorima određenima za malo poduzetništvo (Servisna zona Retkovec, Savica - Šanci i Melištica - zona zapadno od Ulice Luje Naletilića u Novom Zagrebu) najmanja površina građevne čestice je 500 m², a najveća 3.000 m²; najveća visina građevine je četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; na istoj građevnoj čestici moguće je planirati jedan stan najveće bruto stambene površine do 150 m²; ostalo prema detaljnim pravilima; 17. iznimno, za novu gradnju u zonama poslovne namjene uz Ulicu Republike Njemačke, Heinzelovu, Slavonsku aveniju, Ulicu grada Gospića i Aveniju V. Holjevca najmanje je visine pet nadzemnih etaža, ostalo prema detaljnim pravilima; 18. iznimno u zoni gospodarske namjene dio Sisačke ceste I. odvojka i dio Saljske ulice određen je za malo poduzetništvo, namjene pretežno uslužne djelatnosti, najmanja površina parcele 350 m²; najveća visina građevine je četiri nadzemne etaže. Na istoj građevnoj čestici moguće je planirati jedan stan najveće bruto površine 150 m², najmanja udaljenost od međe h/2, iznimno 1,0 m, ostalo prema detaljnim pravilima; 19. iznimno, za gradnju građevine Zagreb arene u prostoru planske namjene oznake K2 u Laništu, drugi lokacijski uvjeti nisu ograničeni; 20. iznimno, između Zagrebačke avenije i ulice Kotarnica, prema grafičkom prikazu, omogućuje se najveća izgrađenost građevne čestice 70% i najveće kisn 2,2, ostalo prema detaljnim pravilima; 21. iznimno, na lokaciji zatvorenih industrijskih kompleksa u Jankomiru, Borongaju i Fallerovom šetalištu prema grafičkom prikazu, omogućuje se najveća izgrađenost građevne čestice 80%, najveće kisn 2,2 i rješenje priključka građevne čestice na prometnu površinu prema postojećem stanju izvedenosti; ukoliko je udio prirodnog terena manji od 20% potrebno ga je u potpunosti zadržati; 22. iznimno na prostoru zone K1 na Kajzerici, istočno od željezničke pruge omogućuje se gradnja kompleksa URIHO-a, što uključuje polivalentni rehabilitacijski centar i proizvodni pogon, dom za osobe s invaliditetom, te ostale prateće sadržaje, a na preostalom dijelu zone K1 istočno od planirane prometnice, sjeverno od Avenije Dubrovnik i zapadno od Zagrebačkog velesajma, omogućuje se gradnja i stambenih i stambenoposlovnih građevina; 23. iznimno, za gradnju građevina javne i društvene namjene na prostoru Kozari puteva, unutar zone K1, lokacijski uvjeti nisu propisani, obvezna je provedba javnog arhitektonskog natječaja osim ako člankom 99. ove odluke nije određeno drugačije; c. sportsko-rekreacijska namjena - sport s gradnjom: 1. gradnja novih građevina i rekonstrukcija; 2. građevna čestica površine, u pravilu, najmanje 5.000 m²; iznimno, može se zadržati manja površina ako je građevna čestica cijela u zoni određenoj kartografskim prikazom 1. KORIŠTENJE I NAMJENA PROSTORA - izmjene i dopune 2025., ali ne manja od 2.000 m²; 3. najveća izgrađenost građevne čestice 40%; 4. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice, osim u kontaktnom području priobalja rijeke Save i u podsljemenskoj zoni, gdje najmanje 50% građevne čestice mora biti prirodno tlo (uređena zelena površina); 5. visina građevine uvjetovana je specifičnim zahtjevima vrste sporta; građevina (ili njezin dio) u kojoj je smješten prateći sadržaj može biti viša od građevine osnovne namjene; 6. u ukupnom GBP-u sportski sadržaji moraju biti zastupljeni s najmanje 70%, drugo mogu biti prateći sadržaji, osim za stadione gdje udio pratećih sadržaja može biti i veći; 7. iznimno, za gradnju u priobalju Save uz Veslačko naselje, najmanja građevna čestica je 4000 m², a rekonstrukcije su moguće na postojećim manjim česticama; 8. iznimno, na prostoru zone rekonstrukcije Doma sportova omogućuje se izgradnja i uređenje sportskih i pratećih sadržaja te javne garaže, pri čemu odnos sportskih i pratećih sadržaja može biti i drugačiji od propisanoga; ostali lokacijski uvjeti nisu propisani; 9. iznimno, na lokaciji bazena Špansko s obzirom na lokalne uvjete i blizinu javnog prijevoza pri određivanju broja PGM računa se na preklapanje u korištenju na način da se omogući gradnja po provedenom javnom arhitektonskom natječaju uz rješavanje ukupno potrebnog broja od 90 PGM-a uz postojeće obodne ulice; 10. u rekonstrukciji i gradnji zamjenskih građevina postojeća izgrađenost građevne čestice veća od propisane može se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći; d. sportsko-rekreacijska namjena - sport bez gradnje: 1. građevna čestica površine, u pravilu, najmanje 5000 m²; iznimno, može se zadržati manja površina ako obuhvaća cijelu zonu određenu kartografskim prikazom 1. KORIŠTENJE I NAMJENA PROSTORA - izmjene i dopune 2025.; 2. na ovim se prostorima mogu uređivati otvorena igrališta te graditi manje prateće građevine koje upotpunjuju i služe osnovnoj djelatnosti (garderobe, sanitarije, manji ugostiteljski sadržaji i sl.), ukupan GBP do 1000 m²/ha cjelovite uređene sportsko-rekreacijske površine - građevne čestice, a proporcionalno manje na manjima; ukupni GBP ne može biti veći od 5000 m²; otvorena igrališta mogu se sezonski natkriti; prateći se sadržaji mogu graditi istodobno ili nakon uređenja otvorenih sportsko-rekreacijskih igrališta; 3. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja ulice, osim u kontaktnom području priobalja rijeke Save, u podsljemenskoj zoni, gdje najmanje 50% građevne čestice mora biti prirodni teren; 4. sportsko-rekreacijsku namjenu – sport s gradnjom (R1) na lokaciji Mandlova moguće je realizirati u južnom dijelu zone prema iznimci na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025. u skladu s urbanim pravilima iz točki 1. - 6. podstavka c. sportsko-rekreacijska namjena - sport s gradnjom stavka 3. ovog članka; e. posebna namjena: 1. površine posebne namjene uređuju se prema posebnim propisima; 2. unutar površina posebne namjene mogu se graditi i rekonstruirati građevine i postavljati uređaji koji služe osnovnoj namjeni; 3. visina građevina uvjetovana je specifičnim zahtjevima osnovne namjene uz obvezu poštivanja lokalnih uvjeta; f. infrastrukturni sustavi: 1. gradnja novih građevina i rekonstrukcija; 2. veličina građevne čestice, građevine i pratećih sadržaja određeni su tehnološkim zahtjevima i posebnim propisima; 3. primijeniti mjere prilagodbe klimatskim promjenama; poštovati mjere zaštite okoliša; što je moguće više sadržaja smjestiti podzemno; neizgrađene dijelove građevne čestice krajobrazno urediti na temelju projekta krajobraznog uređenja; 4. rubove građevnih čestica prema drugim namjenama treba urediti kao zaštitni vegetacijski pojas najmanje širine 10 m, iznimno i manje za donju stanicu žičare; g. groblje: 1. prostore groblja oblikovati kao zelene parkovne površine kvalitetnim parkovno-pejsažnim rješenjima i osiguravanjem standarda najmanje površine po grobnom mjestu u skladu s posebnim propisima o grobljima; 2. na prostorima groblja mogu se graditi prateće građevine, tj. građevine koje služe osnovnoj funkciji groblja (crkve, kapele, obredne dvorane, mrtvačnice i sl.), te komunalna infrastruktura; 3. uređenje svih groblja, gradnja pratećih građevina, te oblikovanje opreme što se na groblju postavlja, mora biti primjereno oblikovanju, uređenosti i tradiciji takvih prostora; 4. uz granicu groblja, a unutar površine groblja, treba osigurati zaštitni vegetacijski pojas najmanje širine 10,0 m prema namjenama S, M, M1, M2 i svim javnim i društvenim namjenama; 5. uređenje groblja uskladiti s posebnim propisima o grobljima; 6. gradnja novih groblja uz obavezu izrade UPU-a;", "(4) Programske smjernice: UPU Termalno kupalište Blato 1. prostor određen za gradske projekte u skladu sa člankom 101. ovih odredbi; 2. uređenje prostora sportsko-rekreacijske namjene - sport s gradnjom; 3. omogućiti izgradnju i uređenje turističkih i javnih sadržaja, uz renaturalizaciju dijela nekadašnjeg potoka Starča namjene V3; 4. najveća ukupna površina prostora koji upotpunjuju osnovnu namjenu je najviše 45% ukupno izgrađenog GBP-a osnovne namjene; 5. obavezna provedba javnog urbanističko-arhitektonskog natječaja kao podloge za izradu UPU-a."]}, "2.11.": {"clanak": "78", "naziv": "Uređenje javnih zelenih površina", "prostori": "Bundek, Racinjak, dolina potoka Ribnjak - Gračani, Podrebernica, Kulmerove livade, Park Šestine, Gornji Lukšić, Pongratzov park, Park Mikulići, Park Črnomerec, Park Gornje Prekrižje, Park Vrhovec, Pantovčak - Zelengaj, Park Pepeljarka, Martinovka - dio, Park Babonićeva - Šalata, Park Jurkovićeva, Trg S. Radića i potez središnje osi, Park Lanište, Park Kajzerica jug (URIHO), Park Botinec, Park Remetinečki gaj, parkovi u Klari, Park u Sloboštini, Park u Dugavama, Park Naravnica (Staro Sajmište), Savski park – istok, Park Čučerje, Park Markuševec, Park Kozjak, Park Čulinec, Park Resnik i drugi prema grafičkom prikazu.", "opca": ["Parkovi: 1.1. formiranje parkova tako da oblikovnim karakteristikama, sadržajima i opremom zadovolje potrebe korištenja kao rekreacijski, edukativni, ekološki i estetski gradski prostori; 1.2. uređenje sukladno postojećim obilježjima, planiranom načinu korištenja, zaštitnoj funkciji i očuvanju postojećeg zelenila; 1.3. uređenje parkovnih površina ponajprije održavanjem i sadnjom visokog zelenila; minimalna pokrivenost krošnjama 30%; 1.4. uređenje putova, biciklističkih prometnih površina, rekreacijskih površina, oblikovanje i rekonstrukcija ili dopuna parkovne opreme; 1.5. na površinama manjim od 2 ha mogu se graditi građevine koje su u funkciji korištenja parka kao što su paviljoni i odmorišta, manje infrastrukturne građevine, građevine sanitarno-higijenskog standarda, uz uvjet da kisn nije veći od 0,02; 1.6. na površinama većim od 2 ha mogu se graditi građevine iz prethodne podtočke te manje javne i ugostiteljske građevine, do ukupno 500 m² GBPa na svakih najmanje 2 ha uređene parkovne površine; 1.7. iznimno, na prostoru Bundeka moguća je izgradnja pratećih sadržaja do 1500 m² GBP-a; 1.8. iznimno, na javnim gradskim površinama - tematskim zonama (Z4) na području Trnja (zapadno od Paromlina, na Krugama, južno od Autobusnog kolodvora)i za prostor Ciglenice mogu se graditi građevine iz članka 15. ovih odredbi; gradnja građevina je moguća uz uvjet da kisn nije veći od 0,2; podzemne garaže nemaju ograničenja maksimalnog GBP-a; 1.9. iznimno u zoni Z4 južno od Strossmayerovog šetališta mogu se graditi ugostiteljske i druge prateće građevine u funkciji obnove prostora nestalih poljoprivrednih kultura (vinograda i dr.) uz uvjet da kisn nije veći od 0,2, uz obavezu izrade krajobrazne studije; 1.10. obavezno je donošenja plana UPU Gračanski Ribnjak, prema smjernicama iz stavka 4. ovog članka; 1.11. iznimno omogućuje se podzemna garaža na dijelu površine Trga dr. Franje Tuđmana; 1.12. za prostor zapadno od Aleje Hermanna Bollea obuhvaćen urbanim pravilima 1.8. i 2.11. propisuje se obveza izrade urbanističkog plana uređenja UPU Hermanna Bollea - zapad (s krajobraznom studijom i konzervatorskom podlogom) radi optimalne spomeničke prezentacije nepokretnoga kulturnog dobra - kompleksa groblja Mirogoj i uklanjanja uzroka i posljedica ugroženosti ovog graditeljskog sklopa; 1.13. iznimno, za prostor odlagališta Prudinec omogućuje se građenje komunalnih građevina i uređaja infrastrukturnog sustava u svrhu sanacije odlagališta do realizacije novog sustava gospodarenja otpadom u gradu Zagrebu, prema odredbama u članku 49. i 77. ovih odredbi;", "Gradske park-šume: 2.1. zadržavanje izvorne strukture vegetacije prema vrstama i obraslosti gradskih park-šuma te gospodarenje u skladu sa šumsko-gospodarskim planovima; 2.2. gospodarenje se provodi ponajprije s ciljem uzgoja i zaštite, a u skladu s održivim gospodarenjem šumama, unapređenjem biološke i krajobrazne raznolikosti te zaštitom ekološkog sustava; 2.3. uređenje šumske infrastrukture i/ili građevina za potrebe šumarstva, livada, staza, putova, gradnja vidikovaca, paviljona, nadstrešnica, higijenskosanitarnih građevina ili druge opreme park-šume odredit će se urbanističkim planovima uređenja i projektnom dokumentacijom, vodeći računa o tome da se ne ugrozi njihova prirodi bliska struktura i druge općekorisne funkcije temeljne namjene."], "zone": [], "tekst": ["(1) Uređenje javnih zelenih površina (2.11.) - prostori: Bundek, Racinjak, dolina potoka Ribnjak - Gračani, Podrebernica, Kulmerove livade, Park Šestine, Gornji Lukšić, Pongratzov park, Park Mikulići, Park Črnomerec, Park Gornje Prekrižje, Park Vrhovec, Pantovčak - Zelengaj, Park Pepeljarka, Martinovka - dio, Park Babonićeva - Šalata, Park Jurkovićeva, Trg S. Radića i potez središnje osi, Park Lanište, Park Kajzerica jug (URIHO), Park Botinec, Park Remetinečki gaj, parkovi u Klari, Park u Sloboštini, Park u Dugavama, Park Naravnica (Staro Sajmište), Savski park – istok, Park Čučerje, Park Markuševec, Park Kozjak, Park Čulinec, Park Resnik i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. Parkovi: 1.1. formiranje parkova tako da oblikovnim karakteristikama, sadržajima i opremom zadovolje potrebe korištenja kao rekreacijski, edukativni, ekološki i estetski gradski prostori; 1.2. uređenje sukladno postojećim obilježjima, planiranom načinu korištenja, zaštitnoj funkciji i očuvanju postojećeg zelenila; 1.3. uređenje parkovnih površina ponajprije održavanjem i sadnjom visokog zelenila; minimalna pokrivenost krošnjama 30%; 1.4. uređenje putova, biciklističkih prometnih površina, rekreacijskih površina, oblikovanje i rekonstrukcija ili dopuna parkovne opreme; 1.5. na površinama manjim od 2 ha mogu se graditi građevine koje su u funkciji korištenja parka kao što su paviljoni i odmorišta, manje infrastrukturne građevine, građevine sanitarno-higijenskog standarda, uz uvjet da kisn nije veći od 0,02; 1.6. na površinama većim od 2 ha mogu se graditi građevine iz prethodne podtočke te manje javne i ugostiteljske građevine, do ukupno 500 m² GBPa na svakih najmanje 2 ha uređene parkovne površine; 1.7. iznimno, na prostoru Bundeka moguća je izgradnja pratećih sadržaja do 1500 m² GBP-a; 1.8. iznimno, na javnim gradskim površinama - tematskim zonama (Z4) na području Trnja (zapadno od Paromlina, na Krugama, južno od Autobusnog kolodvora)i za prostor Ciglenice mogu se graditi građevine iz članka 15. ovih odredbi; gradnja građevina je moguća uz uvjet da kisn nije veći od 0,2; podzemne garaže nemaju ograničenja maksimalnog GBP-a; 1.9. iznimno u zoni Z4 južno od Strossmayerovog šetališta mogu se graditi ugostiteljske i druge prateće građevine u funkciji obnove prostora nestalih poljoprivrednih kultura (vinograda i dr.) uz uvjet da kisn nije veći od 0,2, uz obavezu izrade krajobrazne studije; 1.10. obavezno je donošenja plana UPU Gračanski Ribnjak, prema smjernicama iz stavka 4. ovog članka; 1.11. iznimno omogućuje se podzemna garaža na dijelu površine Trga dr. Franje Tuđmana; 1.12. za prostor zapadno od Aleje Hermanna Bollea obuhvaćen urbanim pravilima 1.8. i 2.11. propisuje se obveza izrade urbanističkog plana uređenja UPU Hermanna Bollea - zapad (s krajobraznom studijom i konzervatorskom podlogom) radi optimalne spomeničke prezentacije nepokretnoga kulturnog dobra - kompleksa groblja Mirogoj i uklanjanja uzroka i posljedica ugroženosti ovog graditeljskog sklopa; 1.13. iznimno, za prostor odlagališta Prudinec omogućuje se građenje komunalnih građevina i uređaja infrastrukturnog sustava u svrhu sanacije odlagališta do realizacije novog sustava gospodarenja otpadom u gradu Zagrebu, prema odredbama u članku 49. i 77. ovih odredbi; 2. Gradske park-šume: 2.1. zadržavanje izvorne strukture vegetacije prema vrstama i obraslosti gradskih park-šuma te gospodarenje u skladu sa šumsko-gospodarskim planovima; 2.2. gospodarenje se provodi ponajprije s ciljem uzgoja i zaštite, a u skladu s održivim gospodarenjem šumama, unapređenjem biološke i krajobrazne raznolikosti te zaštitom ekološkog sustava; 2.3. uređenje šumske infrastrukture i/ili građevina za potrebe šumarstva, livada, staza, putova, gradnja vidikovaca, paviljona, nadstrešnica, higijenskosanitarnih građevina ili druge opreme park-šume odredit će se urbanističkim planovima uređenja i projektnom dokumentacijom, vodeći računa o tome da se ne ugrozi njihova prirodi bliska struktura i druge općekorisne funkcije temeljne namjene.", "(3) Na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(4) Programske smjernice: UPU Gračanski Ribnjak 1. funkcionalno oblikovanje parka odrediti u odnosu na prirodne karakteristike prostora i kontaktne namjene; 2. park je potrebno planirati u više cjelina u svrhu ekoloških, edukativnoestetskih, rekreativnih i znanstvenih potreba (botanički vrt i sl.); 3. gradnja građevina moguća je u funkciji korištenja parka; 4. postojeće građevine i uređene površine mogu se zadržati uz propisivanje urbanističkih uvjeta i uvjete oblikovanja; 5. izradi plana prethodi izrada krajobrazne studije."]}, "2.12.": {"clanak": "79", "naziv": "Uređenje zaštitnih zelenih površina", "prostori": "Vinovrh, Kulmerov dvor, dolina potoka Bliznec i dolina potoka Reka, Botinec - jug, Glogovec, Vučjak, Brodišće, vinogradi Brezinščaka i Gornjeg Bukovca i drugi prema grafičkom prikazu.", "opca": ["onemogućavanje gradnje na površinama zaštitnog zelenila, na klizištima, strminama, vodocrpilištima i uz vodotoke, osim građevina koje služe zaštiti kao što su potporni zidovi, nasipi, retencije, ograde i slično;", "očuvanjem autohtonih elemenata pejzaža - šuma, livada, oranica, voćnjaka;", "zaštitom vodotoka i njihovih karakterističnih krajobraznih obilježja;", "na postojećim zaštitnim zelenim površinama mogu se zadržati postojeće građevine i uređene površine", "uređenje, sukladno postojećim obilježjima, planiranom načinu korištenja, funkciji zaštite i održavanja slike karakterističnih poljodjelskih krajobraza;", "uređenje površina za rekreaciju na otvorenom, putova, staza, paviljona i nadstrešnica, tako da njihova ukupna površina ne prelazi 5% površine zahvata;", "postava skulptura i spomen-obilježja;", "na područjima zaštićenih vinograda mogu se graditi klijeti kao jednoetažne građevine s podrumom, najveći GBP-a 20 m² u vinogradu površine najmanje 700 m²;", "iznimno na površinama povremeno pod vodom (V2), omogućuje se gradnja i uređenje prostora u skladu s člankom 20. ove odluke;", "iznimno, na prostoru Gornjeg Bukovca moguće je preseljenje postojećih klijeti južnije u odnosu na postojeću lokaciju;", "iznimno, na lokaciji između Botinca i južne zagrebačke obilaznice za potrebe udruge Krila moguće je izgraditi halu, nadstrešnice, štalu, sjenik i alatnicu;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."], "zone": [], "tekst": ["(1) Uređenje zaštitnih zelenih površina (2.12.) - prostori: Vinovrh, Kulmerov dvor, dolina potoka Bliznec i dolina potoka Reka, Botinec - jug, Glogovec, Vučjak, Brodišće, vinogradi Brezinščaka i Gornjeg Bukovca i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. onemogućavanje gradnje na površinama zaštitnog zelenila, na klizištima, strminama, vodocrpilištima i uz vodotoke, osim građevina koje služe zaštiti kao što su potporni zidovi, nasipi, retencije, ograde i slično; 2. očuvanjem autohtonih elemenata pejzaža - šuma, livada, oranica, voćnjaka; 3. zaštitom vodotoka i njihovih karakterističnih krajobraznih obilježja; 4. na postojećim zaštitnim zelenim površinama mogu se zadržati postojeće građevine i uređene površine 5. uređenje, sukladno postojećim obilježjima, planiranom načinu korištenja, funkciji zaštite i održavanja slike karakterističnih poljodjelskih krajobraza; 6. uređenje površina za rekreaciju na otvorenom, putova, staza, paviljona i nadstrešnica, tako da njihova ukupna površina ne prelazi 5% površine zahvata; 7. postava skulptura i spomen-obilježja; 8. na područjima zaštićenih vinograda mogu se graditi klijeti kao jednoetažne građevine s podrumom, najveći GBP-a 20 m² u vinogradu površine najmanje 700 m²; 9. iznimno na površinama povremeno pod vodom (V2), omogućuje se gradnja i uređenje prostora u skladu s člankom 20. ove odluke; 10. iznimno, na prostoru Gornjeg Bukovca moguće je preseljenje postojećih klijeti južnije u odnosu na postojeću lokaciju; 11. iznimno, na lokaciji između Botinca i južne zagrebačke obilaznice za potrebe udruge Krila moguće je izgraditi halu, nadstrešnice, štalu, sjenik i alatnicu; 12. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."]}, "2.13.": {"clanak": "80", "naziv": "Gradnja na građevnim česticama najmanje površine 5000 m² na zaštitnim zelenim površinama", "prostori": "Završje, Müllerov breg, Mikulići, Lukšići, Šestine, Mlinovi, Jelenovac, Fučkov jarek, Remete, Miroševec i drugi prema grafičkom prikazu.", "opca": [], "zone": [], "tekst": ["(1) Gradnja na građevnim česticama najmanje površine 5000 m² na zaštitnim zelenim površinama (2.13.) - prostori: Završje, Müllerov breg, Mikulići, Lukšići, Šestine, Mlinovi, Jelenovac, Fučkov jarek, Remete, Miroševec i drugi prema grafičkom prikazu.", "(2) Na zaštitnim zelenim površinama, osim u šumi i na šumskom zemljištu, a sukladno karakteristikama krajolika, mogu se graditi manje građevine javne i društvene namjene, turističko - ugostiteljske ili stambene građevine s najviše tri stana na građevnoj čestici, površine najmanje 5000 m² tako da GBP ne prelazi 400 m² a visina je, najviše, podrum, jedna etaža i potkrovlje ili uvučeni kat s tim da je na građevnoj čestici moguće smjestiti jednu glavnu građevinu.", "(3) Na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."]}, "2.14.": {"clanak": "81", "naziv": "Uređenje rijeke Save", "prostori": "", "opca": [], "zone": [], "tekst": ["Uređenje rijeke Save (2.14.)", "(1) Uređenje rijeke Save s priobaljem, uključujući i sustav odteretnih kanala, vodnih stepenica i dr., provodit će se tako da se zadrže prirodna obilježja prostora i osigura zaštita podzemnih voda.", "(2) Na vodnom dobru koje se povremeno nalazi pod vodom mogu se uređivati otvorena igrališta za sport i rekreaciju bez sadnje visoke vegetacije, graditi infrastrukturne građevine, te uređivati vodotoci sukladno posebnim propisima o korištenju vodnog dobra.", "(3) Na površinama vode i vodnog dobra (u riječnom koritu i u inundaciji) omogućuje se uređenje plovnog puta, pristup rijeci i postava plutajućih pristanišnih građevina s nužnom popratnom infrastrukturom na lokacijama: Jarun istok, Lanište, Hendrixov most, Most slobode i Most mladosti sukladno posebnim propisima i uvjetima nadležnih javnopravnih tijela.", "(4) Na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke. 8.2.3. NISKOKONSOLIDIRANA GRADSKA PODRUČJA"]}, "3.1.": {"clanak": "82", "naziv": "Urbana preobrazba", "prostori": "Sv. Duh, Črnomerec, Franck, Heinzelova, Ferenščica, Branimirova, Njivice - Pile, Martinovka, Kruge, Brezje, Staro Trnje, Sigečica, središnji dio Savice (Ujevićeva - Jeđutova), industrijska baština u Trnju (bivša industrija uz Radničku cestu), Cvjetno naselje (istočno i zapadno od HRT-a), prostor između Save i ulice Prisavlje, Istočni kolodvor, Tvornica autobusa, Ulica grada Gospića, Ciglana, Ul. kneza Lj. Posavskog - Heinzelova - Branimirova, Tvornica cementa u Podsusedu, Oranice, Savska - Šarengradska, središte Trešnjevke, Klanječka - Tomislavova, Studentski kampus Borongaj i drugi prema grafičkom prikazu.", "opca": ["uklanjanje i zamjena gradskog tkiva stanje i namjena kojega nisu adekvatni položaju u gradu;", "promjena postojeće namjene i morfologije te definiranje nove ulične mreže i urbane strukture;", "obvezno je donošenje urbanističkog plana uređenja;", "programom za izradu urbanističkog plana uređenja definirat će se osnovni urbanistički parametri za korištenje prostora, način korištenja i uređenja površina, sukladno planiranoj namjeni, javnim i društvenim potrebama, poštujući vrijednosti i specifičnosti područja za koje se izrađuje urbanistički plan uređenja, primjenom mjera prilagodbe klimatskim promjenama;", "u obuhvatima urbanističkih planova uređenja koji se donose za površine mješovite namjene potrebno je osigurati površine za igrališta za djecu do 6 godina od najmanje 4m² po djetetu;", "na javnim gradskim površinama - tematskim zonama (Z4) mogu se graditi građevine iz članka 15. ovih odredbi; gradnja građevina je moguća uz uvjet da kisn nije veći od 0,2; podzemne garaže nemaju ograničenja maksimalnog GBPa;, udaljenost građevine od susjedne međe nije propisana;", "do donošenja urbanističkog plana uređenja mogući su zahvati u skladu s člankom 104. ove odluke;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."], "zone": [], "tekst": ["(1) Urbana preobrazba (3.1.) - prostori: Sv. Duh, Črnomerec, Franck, Heinzelova, Ferenščica, Branimirova, Njivice - Pile, Martinovka, Kruge, Brezje, Staro Trnje, Sigečica, središnji dio Savice (Ujevićeva - Jeđutova), industrijska baština u Trnju (bivša industrija uz Radničku cestu), Cvjetno naselje (istočno i zapadno od HRT-a), prostor između Save i ulice Prisavlje, Istočni kolodvor, Tvornica autobusa, Ulica grada Gospića, Ciglana, Ul. kneza Lj. Posavskog - Heinzelova - Branimirova, Tvornica cementa u Podsusedu, Oranice, Savska - Šarengradska, središte Trešnjevke, Klanječka - Tomislavova, Studentski kampus Borongaj i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. uklanjanje i zamjena gradskog tkiva stanje i namjena kojega nisu adekvatni položaju u gradu; 2. promjena postojeće namjene i morfologije te definiranje nove ulične mreže i urbane strukture; 3. obvezno je donošenje urbanističkog plana uređenja; 4. programom za izradu urbanističkog plana uređenja definirat će se osnovni urbanistički parametri za korištenje prostora, način korištenja i uređenja površina, sukladno planiranoj namjeni, javnim i društvenim potrebama, poštujući vrijednosti i specifičnosti područja za koje se izrađuje urbanistički plan uređenja, primjenom mjera prilagodbe klimatskim promjenama; 5. u obuhvatima urbanističkih planova uređenja koji se donose za površine mješovite namjene potrebno je osigurati površine za igrališta za djecu do 6 godina od najmanje 4m² po djetetu; 6. na javnim gradskim površinama - tematskim zonama (Z4) mogu se graditi građevine iz članka 15. ovih odredbi; gradnja građevina je moguća uz uvjet da kisn nije veći od 0,2; podzemne garaže nemaju ograničenja maksimalnog GBPa;, udaljenost građevine od susjedne međe nije propisana; 7. do donošenja urbanističkog plana uređenja mogući su zahvati u skladu s člankom 104. ove odluke; 8. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(3) Programske smjernice: 1. UPU Ulica Lj. Posavskog - Zavrtnica - Branimirova - Crvenog križa 1.1. transformacija u prostor visokoga urbanog standarda stambeno-poslovne namjene; 1.2. gradnja i uređenje prema interpretaciji urbane matrice i tipologije Donjeg grada uz mogućnost gradnje i slobodnostojećih visokih građevina; uređenje javnog parka i otvorenih sportskih igrališta, uređenje i dopuna ulične mreže i javnih prostora. 2. UPU Banjavčićeva - Heinzelova - Branimirova - Zavrtnica 2.1. transformacija u prostor pretežito poslovne namjene visokoga urbanog standarda; 2.2. prostor visoke gradnje interpretacijom urbane matrice i tipologije Donjeg grada uz mogućnost gradnje i slobodnostojećih građevina; 2.3. uređenje i dopuna ulične mreže, javnih prostora i zelenila. 3. UPU Ciglana 3.1. transformacija zone \"stare industrije\" u prostor visokoga urbanog standarda; 3.2. uređenje novih zona mješovite i poslovne namjene, javnih parkova, te uređenje terminala javnog prijevoza; 3.3. uređenje i dopuna ulične mreže, javnih prostora i sustava gradske infrastrukture; 3.4. nova gradnja visokih, odnosno niskih građevina, ovisno o usklađenju s postojećom okolnom izgrađenom strukturom; 3.5. očuvanje prostora posebnih prirodnih i graditeljskih vrijednosti; 3.6. afirmacija poteza uz Ilicu; 3.7. studija prostornih i prometnih mogućnosti užeg i šireg područja (povezivanje s okolnom mrežom - Ilica, Kustošijanska, ulica Črnomerec, Prilaz baruna Filipovića...); 3.8. obavezna provedba javnog urbanističko-arhitektonskog natječaja kao podloge za izradu UPU-a. 4. UPU Sveti Duh 4.1. zaštita, uređenje i dogradnja zapadnog dijela podsljemenskog predjela kao cjeline, osobito pejsažnih i zaštitnih zelenih površina i komunalne opreme; 4.2. u zoni mješovite namjene, gradnja pretežito stambenih građevina manjih gabarita; 4.3. u zoni javne i društvene namjene gradnja prema programu i normativima osnovne namjene i u skladu s okolnom gradnjom dio terena parkovno uređen; 4.4. osigurati poprečne pješačke veze. 5. UPU Savska - Šarengradska - jug 5.1. uređenje prostora od važnosti za čitav grad; 5.2. uređenje prostora mješovite namjene pretežito visokom gradnjom i sportskorekreacijske zone; uređenje prostora u kontekstu povezivanja gradskog tkiva sa sjeverne i južne strane rijeke; 5.3. preispitat će se mogućnost gradnje građevina viših od 9 etaža, uz uvjet realizacije produžene Šarengradske ulice (Splitske ulice); 5.4. transformacija postojeće izgrađene strukture u prostor visokoga urbanog standarda, 5.5. definiranje fizionomijskih elemenata slike grada; 5.6. afirmacija prostora ispod pruge i uz nju; 5.7. planom osigurati mogućnost povezivanja s ostalim prostorom Trešnjevke pješačkim i kolnim prolazima ispod pruge; 5.8. obavezno planirati najmanje 20% obuhvata kao javne hortikulturno uređene otvorene površine. 6. UPU Savska - Šarengradska - sjever 6.1. uređenje prostora od važnosti za čitav grad; 6.2. površine mješovite namjene; 6.3. uređenje prostora pretežito visoke gradnje; 6.4. preispitat će se mogućnost gradnje građevina viših od 9 etaža, uz uvjet realizacije produžene Šarengradske ulice (Splitske ulice); 6.5. planom osigurati mogućnost povezivanja s ostalim prostorom Trešnjevke pješačkim i kolnim prolazima ispod pruge; 6.6. transformacija u prostor visokog urbanog standarda na temelju valorizacije svih prostora, izgrađenih i neizgrađenih, unutar obuhvata plana. 7. UPU Savska ulica - Prisavlje 7.1. uređenje prostora mješovite namjene i planiranje pretežito visoke gradnje; 7.2. transformacija postojeće izgrađene strukture u prostor visokoga urbanog standarda; 7.3. sadržajno, funkcionalno i oblikovno usklađenje s okolnim visokokonsolidiranim prostorom. 8. UPU područja nekadašnje Tvornice cementa u Podsusedu 8.1. Za površinu poslovne namjene te javne i društvene namjene između planirane ulice Karažnik i Aleje grada Bolonje (južni dio) predviđa se: 8.1.1. transformacija u prostor visokoga urbanog standarda, oblikovanjem i sadržajima prilagođen značenju zapadnog ulaza u grad; 8.1.2. omogućiti integraciju stambene namjene visine do 5 etaža, kao i supstituciju objekata cementare javnim i poslovnim sadržajima; 8.1.3. omogućiti poboljšanje komunalne infrastrukture - osobito odvodnje kao preduvjeta sanacije klizišta; 8.1.4. preispitati mogućnosti dreniranja i korištenje podzemnih voda; 8.1.5. preispitati mogućnosti uređenja reciklažnog dvorišta na jugozapadnom dijelu prostora. 8.2. U širem području nekadašnje Tvornice cementa, sjeverno od planirane ulice Karažnik (sjeverni dio plana): 8.2.1. planirati površine gospodarske, stambene, mješovite, sportskorekreacijske namjene i društvene namjene; 8.2.2. omogućavanje dopunjavanja prostora jednostavnim građevinama i radovima na prostorima javne i društvene namjene bez prethodne sanacije klizišta cijele zone, uz izradu geomehaničkog elaborata na građevnoj čestici; 8.2.3. preduvjet gradnje u utjecajnoj zoni klizišta je provedena sanacija klizišta; 8.2.4. uređenje reciklažnog dvorišta za građevni otpad i odlaganje zemlje, u funkciji sanacije klizišta; 8.2.5. tipologiju gradnje sjeverno od planirane ulice Karažnik prilagoditi gradnji u kontaktnoj zoni; 8.2.6. najveći GBP zone R2 prema odredbama članka 14. ovih odredbi. 9. UPU Oranice - TEP - Tematski park 9.1. uređenje prostora uz transformaciju postojeće izgrađene strukture; 9.2. artikuliranje poteza uz planiranu gradsku aveniju ulicu Oranice; 9.3. uređenje prostora mješovitom gradnjom, u pravilu visokom, niskom, uz mogućnost individualne gradnje; 9.4. afirmacija vodotoka kao prirodnog elementa u urbanoj matrici; 9.5. uređenje prostora javne zelene površine - tematskog parka kao sportskorekreacijske zone u skladu s važnošću prostora za budući gradski identitet te u skladu s očekivanom transformacijom i prenamjenom okolnog prostora; 10. UPU stambenog naselja na lokaciji vojarne Špansko – Oranice 10.1. površina mješovite - pretežito stambene namjene; 10.2. transformacija u prostor visokoga urbanog standarda, uz poštivanje postojeće vegetacije i afirmaciju vodotoka. 11. UPU Tvornica autobusa 11.1. transformacija nekadašnje industrijske strukture u novu stambenoposlovnu zonu visokoga urbanog standarda; 11.2. uređenje prostora uz mogućnost planiranja pretežito visoke gradnje; 11.3. preispitat će se mogućnost gradnje građevina viših od 9 etaža; 11.4. uređenje novih javnih prostora, gradske infrastrukture i odgovarajućih pratećih sadržaja; 11.5. povezivanje s okolnim stanovanjem u homogenu cjelinu. 12. UPU Ferenščica - zapad 12.1. transformacija postojeće strukture uz glavne gradske prometnice u zonu mješovite stambeno-poslovne namjene visokoga urbanog standarda; 12.2. uređenje prostora uz mogućnost planiranja pretežito visoke gradnje; 12.3. mogućnost sanacije dijela postojeće gusto izgrađene strukture odabirom odgovarajuće tipologije (niska i individualna gradnja); 12.4. uređenje novih javnih prostora i gradske infrastrukture; 12.5. afirmacija poteza uz Ulicu grada Vukovara i Donje Svetice. 13. UPU Ferenščica - istok 13.1. transformacija postojeće strukture u zonu mješovite stambeno-poslovne namjene visokoga urbanog standarda; 13.2. uređenje prostora planiranjem visoke i niske gradnje; 13.3. mogućnost sanacije dijela postojeće gusto izgrađene strukture odabirom odgovarajuće tipologije (niska i individualna gradnja); 13.4. uređenje novih javnih prostora i gradske infrastrukture. 14. UPU Istočni kolodvor 14.1. transformacija nekadašnje industrijske zone u prostor mješovite namjene visokoga urbanog standarda; 14.2. uređenje prostora planiranjem visoke i niske gradnje; 14.3. uređenje novih javnih prostora i gradske infrastrukture; 14.4. afirmacija prostora uz Heinzelovu ulicu i ulicu Svetice; 14.5. istraživanje mogućnosti povezivanja s prostorom sjeverno od željezničke pruge. 15. UPU Studentski kampus Borongaj 15.1. prostor određen za gradske projekte u skladu sa člankom 101. ovih odredbi; 15.2. transformacija zone bivše vojarne Borongaj u zonu javne i društvene namjene - Studentski kampus, obrazovno-znanstveno-istraživački centar sa svim pratećim sadržajima; 15.3. očuvanje postojećeg kvalitetnoga visokog zelenila i postojećeg vodotoka; 15.4. uređenje novih javnih prostora i gradske infrastrukture; 15.5. planiranje parkovnih površina osobito formiranje javne parkovne površine duž zapadnog ruba obuhvata plana; 15.6. planiranje sportsko-rekreacijskih površina i sadržaja. 16. UPU Ulica grada Gospića - sjeveroistok 16.1. transformacija industrijske zone u prostor mješovite namjene visokoga urbanog standarda; 16.2. uređenje nove stambeno-poslovne zone; 16.3. uređenje prostora planiranjem pretežito visoke gradnje uz respektiranje kvalitetne parkovne vegetacije; 16.4. uređenje novih javnih prostora i gradske infrastrukture; 16.5. afirmacija poteza uz Ulicu grada Gospića; 16.6. u obuhvatu plana omogućiti gradnju stambenih i poslovnih građevina viših od devet nadzemnih etaža, tlocrtne izgrađenosti nadzemnih etaža do 40%, uz osiguranje prirodnog terena minimalno 30%; 16.7. planirati u središnjem dijelu obuhvata zonu javnog gradskog parka ne manju od 0,5 ha krajobrazno uređenu visokom vegetacijom; 16.8. obvezno cjelovito parkovno uređenje obuhvata plana prema krajobraznoj studiji. 17. UPU Ulica grada Gospića - jugozapad 17.1. transformacija industrijske zone i zone postojeće individualne gradnje u prostor mješovite namjene; 17.2. uređenje nove stambeno-poslovne zone; 17.3. uređenje prostora planiranjem pretežito visoke gradnje; 17.4. uređenje novih javnih prostora i gradske infrastrukture; 17.5. mogućnost sanacije dijela postojeće gusto izgrađene strukture odabirom odgovarajuće tipologije (niska i individualna gradnja); 17.6. afirmacija parkovnog poteza uz otvoreno korito potoka Bliznec. 18. UPU Peščenica sjever - Štrigina 18.1. transformacija postojeće strukture u prostor mješovite namjene; 18.2.
