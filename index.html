 namjene;", "najveća visina građevina je tri nadzemne etaže uz mogućnost gradnje najviše dva prostorna akcenta visine 12 nadzemnih etaža čija pojedina tlocrtna površina ne prelazi 500 m²;", "moguća je gradnja više podzemnih etaža;", "površina građevne čestice približno je jednaka površini planirane zone;", "na građevnoj čestici moguće je graditi više građevina;", "najveća izgrađenost građevne čestice je 40%;", "najveći kisn je 2,0;", "građevinski pravac udaljen je od regulacijske linije postojećih i planiranih prometnica najmanje 10 m, a prema koridoru željezničke pruge preporuča se predvidjeti i potez visokog zelenila širine najmanje 20 m;", "razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca;", "prirodni teren mora biti najmanje 30% površine građevne čestice;", "nije dozvoljena gradnja pomoćnih građevina;", "uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke;", "priključenje na prometnu i infrastrukturnu mrežu potrebno je predvidjeti sa planirane nekategorizirane prometnice;", "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);", "oblikovanjem građevina potrebno je očuvati memoriju mjesta (industrija vrenja) i uzeti u obzir važnost lokacije čijom transformacijom se stvara novi identitet Sesveta, zbog čega se za prostorni akcent preporučuje provođenje javnog natječaja za idejno rješenje;"], "key": {"visina": "najveća visina građevina je tri nadzemne etaže uz mogućnost gradnje najviše dva prostorna akcenta visine 12 nadzemnih etaža čija pojedina tlocrtna površina ne prelazi 500 m²;", "izgradenost": "najveća izgrađenost građevne čestice je 40%;", "kis": "najveći kisn je 2,0;", "teren": "prirodni teren mora biti najmanje 30% površine građevne čestice;", "pgm": "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);"}}, {"zona": "Na površinama javne i društvene namjene", "items": ["obvezan je smještaj ustanove predškolskog odgoja, a moguće je uređenje i dodatnih sadržaja javne i društvene namjene (upravne, socijalne, zdravstvene, školske, kulturne, vjerske ili sportsko-rekreacijske namjene);", "gradnja slobodnostojećih građevina;", "površina građevne čestice približno je jednaka površini planirane zone;", "najveća visina građevina je podzemna etaža i tri nadzemne etaže;", "najveća izgrađenost građevne čestice je 40%;", "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2;", "prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama;", "gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 82. ove odluke nije određeno drugačije, izuzev pratećih građevina javne i društvene namjene koje upotpunjuju osnovnu namjenu te infrastrukturnih objekata."], "key": {"visina": "najveća visina građevina je podzemna etaža i tri nadzemne etaže;", "izgradenost": "najveća izgrađenost građevne čestice je 40%;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2;", "teren": "prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "pgm": "potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama;"}}], "tekst": ["Zona Badel (4.2.)", "(1) Opća pravila: 1. na prostoru bivšeg postrojenja industrije vrenja Badel planira se transformacija izgrađene strukture u cilju stvaranja urbane zone mješovitih i poslovnih sadržaja komplementarnih središnjim prostorima Sesveta, prepoznatljivih ambijentalnih i oblikovnih vrijednosti; 2. omogućuje se nova gradnja, rekonstrukcija i zamjena postojećih građevina s mogućnošću promjene oblika i veličine građevnih čestica; 3. prostorom obuhvata planira se gradska prometnica kao nastavak Ulice Otona Ivekovića kojom se omogućuje bolja protočnost šire zone. Također, planira se i nekategorizirana prometnica koja omogućuje pristup građevnim česticama, a u kojoj je potrebno primijeniti mjere smirivanja prometa.", "(2) Detaljna pravila: a. Na površinama mješovite-pretežito stambene namjene: 1. gradnja slobodnostojećih građevina; 2. udio stambene namjene nije ograničen, ali je obavezno planiranje poslovnih, uslužnih ili javnih sadržaja u prizemlju građevina; nije dozvoljena gradnja isključivo poslovnih građevina na zasebnim građevnim česticama; 3. najveća visina građevina je dvije podzemne etaže i šest nadzemnih etaža od kojih je šesta etaža uvučena i iznosi ukupno 50% površine dobivene vertikalnom projekcijom svih zatvorenih nadzemnih dijelova građevine, a preostala površina je neprohodni zeleni krov; 4. najmanja površina građevne čestice je 2.000 m²; na jednoj građevnoj čestici moguće je graditi više građevina; 5. najmanje 40 m² građevne čestice / 1 samostalna uporabna jedinica; 6. najveća izgrađenost građevne čestice je 50%; 7. najveći kisn je 2,5; 8. građevinski pravac prema planiranoj gradskoj prometnici udaljen je od regulacijske linije najmanje 10 m, a prema planiranoj nekategoriziranoj prometnici 5 m; 9. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2; 10. razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca; 11. prirodni teren mora biti najmanje 30% površine građevne čestice; 12. obvezno je krajobrazno uređenje čestice; 13. obavezno je uređenje pješačke šetnice sukladno kartografskom prikazu 3.a PROMETNA MREŽA – izmjene i dopune 2026. kako bi se osiguralo povezivanje Zone Badel sa središtem Sesveta; 14. uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke; 15. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 16. potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke; b. Na površinama mješovite namjene: 1. gradnja slobodnostojećih građevina; 2. udio stambene namjene iznosi najviše 50% ukupne GBP, a moguća je gradnja jednonamjenskih građevina poslovne ili javne i društvene namjene; 3. najveća visina građevina je tri nadzemne etaže uz mogućnost gradnje najviše dva prostorna akcenta visine 12 nadzemnih etaža čija pojedina tlocrtna površina ne prelazi 500 m²; 4. moguća je gradnja više podzemnih etaža; 5. površina građevne čestice približno je jednaka površini planirane zone; 6. na građevnoj čestici moguće je graditi više građevina; 7. najveća izgrađenost građevne čestice je 40%; 8. najveći kisn je 2,0; 9. građevinski pravac udaljen je od regulacijske linije postojećih i planiranih prometnica najmanje 10 m, a prema koridoru željezničke pruge preporuča se predvidjeti i potez visokog zelenila širine najmanje 20 m; 10. razmak između građevina i/ili nadzemnih dijelova građevine na istoj građevnoj čestici ne može biti manji od zbroja polovica njihovih visina do vijenca; 11. prirodni teren mora biti najmanje 30% površine građevne čestice; 12. nije dozvoljena gradnja pomoćnih građevina; 13. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 14. priključenje na prometnu i infrastrukturnu mrežu potrebno je predvidjeti sa planirane nekategorizirane prometnice; 15. potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 16. oblikovanjem građevina potrebno je očuvati memoriju mjesta (industrija vrenja) i uzeti u obzir važnost lokacije čijom transformacijom se stvara novi identitet Sesveta, zbog čega se za prostorni akcent preporučuje provođenje javnog natječaja za idejno rješenje; c. Na površinama javne i društvene namjene: 1. obvezan je smještaj ustanove predškolskog odgoja, a moguće je uređenje i dodatnih sadržaja javne i društvene namjene (upravne, socijalne, zdravstvene, školske, kulturne, vjerske ili sportsko-rekreacijske namjene); 2. gradnja slobodnostojećih građevina; 3. površina građevne čestice približno je jednaka površini planirane zone; 4. najveća visina građevina je podzemna etaža i tri nadzemne etaže; 5. najveća izgrađenost građevne čestice je 40%; 6. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2; 7. prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 8. potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama; 9. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 82. ove odluke nije određeno drugačije, izuzev pratećih građevina javne i društvene namjene koje upotpunjuju osnovnu namjenu te infrastrukturnih objekata."]}, "4.3.": {"clanak": "67.c", "naziv": "Zona Ciglana", "prostori": "", "opca": [], "zone": [], "tekst": ["Zona Ciglana (4.3.)", "(1) Na prostoru bivšeg kompleksa ciglane planira se izgradnja i transformacija prostora s ciljem stvaranja urbane zone mješovitih i poslovnih sadržaja lokalnog i gradskog značaja.", "(2) Na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026., prikazane su granice obuhvata prostora za koje se propisuje obveza donošenja urbanističkog plana uređenja.", "(3) Smjernice za izradu UPU zona Ciglana: 1. namjena: planira se raznolikost budućih programa od lokalnog i gradskog značenja (stanovanje i kulturni, poslovni, trgovački i ugostiteljsko-turistički sadržaji); 2. promet: prostorom obuhvata UPU-a planirana je nova gradska prometnica na koju se iznimno dopušta neposredno priključenje građevnih čestica, ali se preporučuje planiranje sekundarne prometne mreže; 3. morfologija: najveća visina građevina do četiri nadzemne etaže, osim za građevine uz Sesvetsku cestu do pet nadzemnih etaža, najveća ki zone nadzemno je 2,0; 4. najmanji udio javnih i zaštitnih zelenih površina je najmanje 25% površine obuhvata plana.", "(4) Smjernice za izradu UPU zona Ciglana -sjever: 1. namjena: planirati stanovanje i kulturne, poslovne, trgovačke i ugostiteljskoturističke sadržaje u zapadnom dijelu obuhvata, a javnu i društvenu namjenu (osnovna škola, sportski centar, predškolska ustanova i ambulanta) planirati u istočnom dijelu obuhvata; 2. promet: prostorom obuhvata UPU-a planirana je nova gradska prometnica na koju se ne dopušta neposredno priključenje građevnih čestica stambene i mješovite namjene već je potrebno planom odrediti sekundarnu prometnu mrežu; 3. morfologija: najveća visina građevina je podrum i četiri nadzemne etaže. Ukupni koeficijent iskoristivosti nadzemno (kisn) zone, odnosno prostora obuhvata UPUa, iznosi 1,0, a najmanji udio javnih i zaštitnih zelenih površina je 25% površine obuhvata."]}, "4.4.": {"clanak": "67.d", "naziv": "Farma Sesvetski Kraljevec", "prostori": "", "opca": [], "zone": [], "tekst": ["Farma Sesvetski Kraljevec (4.4.)", "(1) Na prostoru nekadašnje farme izgrađeno je novo stambeno naselje Iver u skladu s Detaljnim planom uređenja Farme Sesvetski Kraljevec.", "(2) Planira se zona stanovanja s javnim, sportsko-rekreacijsko-turističkim i trgovačkim sadržajima kao pratećim sadržajem naselja.", "(3) Ukupni koeficijent iskoristivosti nadzemno (kisn) zone, odnosno prostora obuhvata, iznosi 1,5, a najveća visina građevina je podzemna etaža i četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat. Javne i zaštitne površine su najmanje 30% površine zone."]}, "4.5.": {"clanak": "67.e", "naziv": "Sopnica - Jelkovec", "prostori": "", "opca": [], "zone": [], "tekst": ["Sopnica - Jelkovec (4.5.)", "(1) Na prostoru nekadašnje svinjogojske farme izgrađeno je naselje Novi Jelkovec u skladu s Detaljnim planom uređenja stambenog naselja na lokaciji Sopnica – Jelkovec.", "(2) Planira se zona mješovite namjene pretežito stambenih programa s pratećim sadržajima."]}, "4.6.": {"clanak": "67.f", "naziv": "Duboki jarak", "prostori": "", "opca": [], "zone": [], "tekst": ["Duboki jarak (4.6.)", "(1) Na prostoru nekadašnjeg vojnog skladišta uz produženu Ulicu kneza Branimira planira se novo naselje gustoće stanovništva do 150 st/ha.", "(2) Na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026., prikazane su granice obuhvata javnog urbanističkog natječaja i prostora za koji postoji obveza donošenja urbanističkog plana uređenja.", "(3) Na kartografskom prikazu 4.b UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Zaštićeni i evidentirani dijelovi prirode i nepokretna kulturna dobra – izmjene i dopune 2026. za ovo područje evidentirana je vrijedna sesvetska šuma Selčina. S obzirom da se radi o području koje je u prošlosti značajno oštećeno eksplozijom vojnog streljiva, u skladu sa člankom 75. ove odluke potrebno je izraditi elaborat valorizacije šumskog prostora, i po potrebi izraditi plan sanacije.", "(4) Smjernice za izradu UPU Duboki jarak: 1. planiranje novog stambenog naselja s pratećim sadržajima pažljivo definirajući sjevernu granicu naselja Sesvete prema okolnim šumskim prostorima te uzimajući u obzir zatečeno stanje vegetacije i mjere zaštite evidentiranih dijelova prirode i arheološkog područja (prema člancima 70, 75. i 77. ove odluke). Također, potrebno je propitati mogućnosti realizacije priuštivog stanovanja; 2. namjena: planirati novu stambenu, stambeno-poslovnu i poslovnu namjenu te površine za mrežu javnih i društvenih sadržaja (osnovna škola i predškolska ustanova kapacitetom predviđene i za potrebe šireg područja) prema zahtjevima javnopravnih tijela. Sve navedeno u ukupnom udjelu do najviše 50% obuhvata UPU-a. Potrebno je planirati sportsko-rekreacijsku namjenu bez gradnje, te javne i zaštitne zelene površine koje zajedno čine najmanje 30% površine obuhvata; 3. promet: južnim rubom obuhvata UPU-a planirana je nova glavna gradska prometnica (produžena Ulica kneza Branimira) na koju se ne dopušta neposredno priključenje građevnih čestica, kao ni na postojeću Varaždinsku cestu, jer je natječajem za urbanističko rješenje potrebno odrediti koncepciju razmještaja javnih sadržaja, a UPU-om odrediti sekundarnu prometnu mrežu i pješačke komunikacije sa okolnim naseljem; 4. morfologija: natječajem za urbanističko rješenje moguće je predložiti sve tipologije gradnje uzimajući u obzir da ukupni koeficijent iskoristivosti (nadzemno) zone, odnosno prostora obuhvata UPU-a, iznosi 1,0. 5. SPORTSKO - REKREACIJSKI KOMPLEKSI"]}, "5.1.": {"clanak": "68", "naziv": "Sportsko-rekreacijski kompleks s gradnjom", "prostori": "", "opca": [], "zone": [], "tekst": ["(1) Sportsko-rekreacijski kompleks s gradnjom (5.1.) 1. gradnja slobodnostojećih građevina, te rekonstrukcija i gradnja zamjenskih građevina na temelju cjelovitoga prostornog rješenja kompleksa; 2. građevna čestica mora imati površinu najmanje 5.000 m²; 3. najveća izgrađenost kompleksa, odnosno građevne čestice je 40%; 4. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2; 5. visina građevine uvjetovana je specifičnim zahtjevima pojedine vrste sporta; 6. prirodni teren mora biti najmanje 30% površine kompleksa, odnosno pojedine građevne čestice, nije ga moguće planirati unutar rezervacije proširenja postojeće ulice i obvezno se parkovno uređuje; 7. sportski sadržaji moraju zauzimati najmanje 70% GBP-a građevine, a drugo mogu biti prateći sadržaji; 8. potreban broj PGM-a prema normativima iz članka 39. ove odluke moguće je osigurati na građevnoj čestici u potpunosti (ne unutar rezervacije proširenja postojeće ulice) ili dijelom i na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama; 9. za prostore Sportsko-rekreacijski kompleks Sesvete i Sportsko-rekreacijski kompleks Sesvetski Kraljevec propisana je obveza donošenja urbanističkog plana uređenja čije granice su označene na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026.; 10. do donošenja urbanističkog plana uređenja moguća je gradnja građevina i rekonstrukcija prema odredbama članka 86. ove odluke; 11. iznimno, na lokaciji sportskog kompleksa NK Croatia Sesvete (oznaka iznimke 13), do donošenja Urbanističkog plana uređenja Sportsko-rekreacijski kompleks Sesvete omogućuje se rekonstrukcija nogometnog igrališta s tribinom do 4.000 gledatelja i pratećim sportskim sadržajima (svlačionice, sanitarni čvorovi i sl.); 12. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 82. ove odluke nije određeno drugačije, izuzev pratećih građevina javne i društvene namjene koje upotpunjuju osnovnu namjenu te infrastrukturnih objekata; 13. za izradu UPU Sportsko-rekreacijski kompleks Sesvete primjenjuju se i sljedeće smjernice: 13.1. gradnja i uređenje sportsko-rekreacijskog kompleksa koji osim postojećih nogometnih sadržaja predviđa i bazenski kompleks te druge sportske i rekreacijske sadržaje. Osim pratećih sportskih sadržaja omogućuje se planiranje pratećih prodajno-poslovnih sadržaja čija površina iznosi najviše 10% ukupne GBP; 13.2. kao polazište za izradu plana moguće je koristiti koncepciju rješenja prvonagrađenog rada arhitektonsko-urbanističkog natječaja koji je za ovaj prostor proveden; 13.3. na prostoru sportsko-rekreacijske namjene s gradnjom (istočno od potoka Vuger), odrediti uvjete gradnje načelno prema detaljnim pravilima ovog članka, a iznimno za pojedine zahvate moguće je odrediti i veću izgrađenost građevne čestice, ali ne veću od 60%; 13.4. u zapadnom dijelu obuhvata potrebno je preispitati mogućnost renaturalizacije toka, odnosno revitalizacije potoka Vuger te obazrivo odrediti uvjete uređenja prema pravilima za sportsko-rekreacijsku namjenu bez gradnje; 13.5. pri izradi plana poštovati mjere zaštite u članku 75. ove odluke; 14. na području UPU Sportsko-rekreacijski kompleks Sesvetski Kraljevec planirati sportsko-rekreacijsku namjenu s gradnjom kao proširenje postojećih nogometnih sadržaja načelno prema odredbama ovog članka.", "(2) Sportsko-rekreacijski kompleks bez gradnje (5.2.) 1. uređenje otvorenih igrališta bez gledališta i gradnja građevine za prateće sadržaje koji upotpunjuju i služe osnovnoj djelatnosti na temelju cjelovitoga prostornog rješenja kompleksa; 2. gledališta je moguće urediti kao dio krajobraznog rješenja/uređenja terena, bez natkrivanja; 3. ukupni GBP građevina za prateće sadržaje do 150 m²/ha sportsko-rekreacijskog kompleksa, odnosno građevne čestice; 4. najveća visina građevine je podzemna etaža, dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje bez nadozida ili uvučeni kat; 5. prateće građevine mogu se graditi istodobno ili nakon uređenja otvorenih rekreacijskih sadržaja; 6. potreban broj PGM-a prema normativima iz članka 39. ove odluke moguće je osigurati na građevnoj čestici u potpunosti (ne unutar rezervacije proširenja postojeće ulice) ili dijelom i na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama; 7. na prostoru sjeverno od naselja Dubec i potoka Čučerska Reka Prostornim planom Grada Zagreba određena je zona za gradnju i uređenje golf igrališta koja se samo južnim dijelom nalazi unutar granica Generalnog urbanističkog plana. Za navedeni prostor ovim planom propisuje se obveza donošenja UPU Površine sporta i rekreacije - golf igralište, a čije granice obuhvata su označene na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026. Navedenim urbanističkim planom uređenja potrebno je planirati sportsko-rekreacijsku namjenu bez gradnje, odnosno golf igralište s pratećim sadržajima, načelno prema odredbama ovog stavka i u skladu s posebnim propisima; 8. do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija građevina u skladu s odredbama članka 86. ove odluke. 6. JAVNE I ZAŠTITNE ZELENE POVRŠINE JAVNI PARK"]}, "6.1.": {"clanak": "69", "naziv": "Gradski park", "prostori": "", "opca": [], "zone": [], "tekst": ["Gradski park (6.1.)", "(1) Gradski se park formira kao ekološki, estetski, rekreacijski i edukativni gradski prostor koji sadržajima i opremom i oblikovnim karakteristikama zadovoljava potrebe korištenja.", "(2) Gradski se park oblikuje pretežito visokom vegetacijom. Posebnog je pejsažnog izraza, naglašene razine opremljenosti i dobre dostupnosti.", "(3) Za gradske je parkove potrebno izraditi cjelovito prostorno i krajobrazno rješenje na temelju kojega se uređuju parkovne površine, pješački putevi, biciklističke staze, sadržaji i oprema parka, te iznimno, grade građevine sa sadržajima koji moraju biti u funkciji parkovnih površina.", "(4) U gradskim se parkovima može omogućiti gradnja građevina kao što su paviljoni, sjenice i odmorišta, dječja igrališta, manje javne i ugostiteljske građevine, manje elektroenergetske i komunalne građevine i građevine sanitarno-higijenskog standarda.", "(5) Ukupna izgrađenost parkovne površine, u koju se uračunavaju sve površine koje nisu upojne, može biti najviše do 10%. Linearni gradski park - Rimski put (6.1.1.)", "(6) Linearni gradski park - Rimski put je potez tematskih zona (Z3) naglašene vegetacijske (krajobrazne) komponente u kojima je moguća izgradnja niskog intenziteta, a čija funkcija je prometno, sadržajno, krajobrazno i tematsko povezivanje središta Sesveta s prostorom južno od željezničke pruge uz valorizaciju kulturno-povijesnog kontinuiteta evidentiranog kroz arheološko područje Sesvete – Rimska cesta.", "(7) Omogućuje se gradnja građevina javne i društvene namjene (kulturne, znanstvene, tehnološke, memorijalne i ostale namjene koje pridonose prethodno navedenoj funkciji), ugostiteljsko-turističke (hoteli), sportsko-rekreacijske kao i manjih infrastrukturnih građevina te uređenje javnih parkova i trgova.", "(8) U svakoj definiranoj zoni (bloku omeđenom prometnicama ili granicom namjene određenim ovim planom) gradnja građevina omogućuje se na temelju cjelovitog prostornog rješenja zone. Koeficijent iskoristivosti zone iznosi najviše 0,2, a najmanji udio prirodnog terena iznosi 60%. Obavezno je poštivanje mjera očuvanja i zaštite propisanih člankom 77. ove odluke.", "(9) Zbog potrebe cjelovitog sagledavanja i povezivanja središta Sesveta, prostora bivše tvornice Sljeme i naselja Novi Jelkovec propisana je obveza provođenja javnog anketnog urbanističkog natječaja kojim će se osigurati povezanost i usklađenost sadržaja nove razvojne osi i tematske zone. Detaljni uvjeti gradnje i uređenja odredit će se UPU-om Gospodarska zona Sesvete – sjever čije granice obuhvata, kao i granice minimalnog obuhvata anketnog natječaja, su prikazane na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026. Park susjedstva (6.2.)", "(10) Parkovi susjedstva su funkcionalna cjelina sa susjedstvom. Njihova je površina određena brojem stanovnika, a opremanje parkovne površine prilagođeno je dobnim skupinama korisnika (dječja igrališta, rekreativne površine).", "(11) Oblikuju se pretežito visokom vegetacijom i trebaju zadovoljiti potrebe boravka, odmora i šetnje stanovnika iz susjedstva.", "(12) Rekreativne površine dimenzioniraju se tako da zadovolje 4 m² po djetetu dobne skupine do 6 godina, te 3 m² za druge dobne skupine.", "(13) Za parkove susjedstva potrebno je izraditi cjelovito prostorno i krajobrazno rješenje na temelju kojega se uređuju parkovne površine, pješački putevi, biciklističke staze, sadržaji i oprema parka, te iznimno, grade građevine.", "(14) U parkovima susjedstva mogu se graditi samo paviljoni, sjenice i dječja igrališta.", "(15) Ukupna izgrađenost parkovne površine, u koju se uračunavaju sve površine koje nisu upojne, može biti najviše do 10%. SESVETSKE ŠUME"]}, "6.3.": {"clanak": "70", "naziv": "Sesvetske šume bez rekreacije", "prostori": "", "opca": [], "zone": [], "tekst": ["Sesvetske šume bez rekreacije (6.3.)", "(1) Sesvetskim šumama koje nemaju naglašenu rekreativnu funkciju gospodari se na temelju gospodarskih osnova i programa gospodarenja šumama.", "(2) Zaštitne zelene površine uz šume uređuju se prema urbanim pravilima iz članka 71. ove odluke.", "(3) Površine posebne namjene uređuju se prema posebnim propisima. Sesvetske šume s rekreacijom (6.4.)", "(4) Sesvetske šume s rekreativnom funkcijom zadržavaju izvornu strukturu vegetacije po vrstama i obraslosti vegetacijom, uz mogućnost oblikovanja staza, odmorišta i opreme tako da se izbjegne uklanjanje postojeće vegetacije, a sukladno propozicijama osnova za gospodarenje šumama.", "(5) Na površinama sesvetskih šuma nije moguća gradnja građevina.", "(6) Režim opremanja i uređenja, te posebne uvjete koje je obvezno pribaviti za gradnju u pojasu od 50 m od ruba šume, utvrđuje nadležno tijelo za gospodarenje šumama i šumskim zemljištem, a u zaštićenim dijelovima prirode i tijelo nadležno za zaštitu prirode.", "(7) Za područje Sesvetske šume s rekreacijom sjeverno od Ulice 144. brigade Hrvatske vojske ovim planom predviđa se propitivanje uređenja tog područja kroz javni anketni urbanistički natječaj, a detaljni uvjeti uređenja odredit će se UPU-om Gospodarska zona Sesvete – sjever čije granice obuhvata, kao i granice minimalnog obuhvata anketnog natječaja, su prikazane na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026.", "(8) Iznimno, na području sesvetske šume s rekreacijom uz potok Vuger (oznaka iznimke 14), za postojeće građevine sportsko-rekreacijske namjene i/ili kulturne namjene omogućuje se zadržavanje i rekonstrukcija unutar postojećih gabarita. ZAŠTITNE ZELENE POVRŠINE"]}, "6.5.": {"clanak": "71", "naziv": "Zaštitne zelene površine uz infrastrukturne sustave", "prostori": "", "opca": [], "zone": [], "tekst": ["Zaštitne zelene površine uz infrastrukturne sustave (6.5.)", "(1) Zaštitne zelene površine uz infrastrukturne sustave oblikuju se prije svega sadnjom i održavanjem visoke vegetacije.", "(2) Uz prethodno vrednovanje prostora omogućuje se uređenje pješačkih puteva i biciklističkih staza.", "(3) Gradnja građevina nije moguća osim građevina u funkciji zaštite klizišta, strmina i vodotoka kao što su potporni zidovi, nasipi, retencije, ograde, zidovi za zaštitu od buke i slično.", "(4) Površine infrastrukturnih sustava uređuju se prema urbanim pravilima iz članka 65. ove odluke. Zaštitne zelene površine uz šume, naselja (6.6.)", "(5) Zaštitne zelene površine uz šume i naselja oblikuju se kao krajobrazni prostori koji štite rub šume ili naselja od gradnje ili negativnih utjecaja drugih namjena.", "(6) Površine se oblikuju sukladno karakteristikama prostorne krajobrazne cjeline (sesvetsko prigorje, sesvetski nizinski prostor) kojega su dio.", "(7) Uz prethodno vrednovanje prostora omogućuje se uređenje i gradnja ulica, pješačkih puteva i biciklističkih staza.", "(8) Gradnja građevina nije moguća osim građevina u funkciji zaštite klizišta, strmina i vodotoka kao što su potporni zidovi, nasipi, retencije i slično."]}};
const RULES_PP = {"PPGZ": {"clanak": "2.3.1.", "naziv": "Građevinska područja naselja (Prostorni plan Grada Zagreba)", "prostori": "68 naselja izvan GUP-a Zagreba i GUP-a Sesveta", "opca": ["Način izgradnje nove građevine određuje se prema veličini građevne čestice i načinu izgradnje na susjednim česticama. Kod izgradnje zamjenske građevine način izgradnje ne može se promijeniti, osim iznimno, kad to uvjetuje način izgradnje na susjednim građevnim česticama.", "Na jednoj građevnoj čestici, namijenjenoj (pretežito) stanovanju, mogu se, uz jednu stambenu građevinu ili stambeno-gospodarsku građevinu, graditi i pomoćne, poljoprivredne gospodarske i manje gospodarske građevine."], "zone": [{"zona": "u zoni stambene namjene (pretežito stanovanje)", "items": ["(1.) Veličina građevne čestice za građenje stambene građevine ne može biti manja od: - za samostojeće građevine - 350 m² s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 14 m; - za poluugrađene građevine - 300 m², s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 12 m; - za skupne građevine - 225 m², s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 9 m.", "Ako se gradi nova niska građevina, gradi se, u pravilu, kao samostojeća i, u pravilu, veličina građevne čestice ne može biti manja od 600 m².", "Ako se gradi stambeno-gospodarska građevina, ili se uz stambenu građevinu na istoj građevnoj čestici smješta poljoprivredna gospodarska ili (i) manja gospodarska građevina, veličina građevne čestice ne može biti manja od: - za samostojeće građevine - 600 m² ; - za poluugrađene građevine - 480 m² ; - za skupne građevine - 360 m² .", "Dubina građevne čestice iznosi, u pravilu, najmanje 25 m.", "(2.) Ukupna izgrađenost građevne čestice može biti: - za samostojeće građevine - najviše 30%, uz najmanje 30% prirodnog terena; - za poluugrađene građevine - najviše 40%, uz najmanje 30% prirodnog terena; - za skupne građevine - najviše 50%, a na česticama većim od 600 m² najviše 20%, uz najmanje 20% prirodnog terena;", "(3.) U izgrađenim dijelovima građevinskog područja naselja, na građevnim česticama što su manje od utvrđenih u podtočki (1.) ove točke i s izgrađenošću većom od utvrđene u podtočki (2.) ove točke kod rekonstrukcije građevine ne smije se povećati izgrađenost parcele. Odredbe o veličini građevne čestice ne primjenjuju se pri interpolacijama u gusto izgrađenim dijelovima građevinskog područja naselja ako su ispunjeni uvjeti o najvećoj dopuštenoj ukupnoj izgrađenosti građevne čestice i odredbe o najmanjoj udaljenosti građevine od prometnih površina, međa i drugih građevina, uzimajući u obzir lokalne uvjete.", "(1.) Stambena i stambeno-gospodarska građevina ako se gradi na samostojeći način, mora biti udaljena najmanje pola visine (h/2) od međe susjednih građevnih čestica, ali ne manje od 3 m. Iznimno od stavka 1. ove podtočke, u već izgrađenim dijelovima naselja, u skladu s lokalnim uvjetima, građevina može biti udaljena i manje od 3 m od jedne susjedne međe građevne čestice, ali ne manje od 1 m, pod sljedećim uvjetima: - ako udaljenost od druge susjedne međe građevne čestice nije manja od 3 m; - na građevini koja je udaljena od susjedne građevne čestice manje od 3 m, ne smiju se graditi otvori prema toj međi. Otvorima iz stavka 2. alineje 2. ove podtočke ne smatraju se otvori s neprozirnim staklom najveće veličine 60 x 60 cm i dijelovi zida od staklene opeke.", "(3.) Građevina što će se graditi na poluugrađen način tako da će se jednom stranom prislanjati uz susjednu građevinu ili među, mora s drugim dijelovima građevine (istakom) biti udaljena od granice susjedne građevne čestice najmanje h/2, ali ne manje od 3 m.", "(4.) Građevina što će se graditi kao skupna, bočnim će stranama biti prislonjena na granice susjednih građevnih čestica, a od stražnje će granice čestice biti udaljena najmanje h/2, ali ne manje od 3 m.", "Individualna građevina može: - se graditi kao građevina stambene ili pretežito stambene namjene (stambenogospodarska); - biti visine najviše tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat, s mogućnošću gradnje podzemne etaže.", "Niska građevina može: - se graditi kao građevina stambene ili pretežito stambene namjene (stambenogospodarska); - biti visine četri nadzemne etaže pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, s mogućnošću gradnje podzemne etaže.", "Visina (h) stambene građevine i stambeno-gospodarske građevine kada se gradi jedna nadzemna etaža najviše je 5,5 m, kada se grade dvije nadzemne etaže najviše je 8,5 m, kada se grade tri nadzemne etaže najviše je 11,5 m, a kada se grade četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, najviše je 14,5 m, s mogućnošću gradnje podzemne etaže.", "Neizgrađeni dio građevne čestice - prirodni teren najmanje je 30% za samostojeće i poluugrađene građevine i 20% za skupne građevine, uređen visokim i niskim zelenilom i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice.", "Na površinama za gradnju što graniče s vodotokom, planiranom ili postojećom regulacijskom i zaštitnom vodnom građevinom, te drugim vodnim građevinama, u svrhu sprečavanja nepovoljnih utjecaja na pogoršanje vodnog režima ograničavaju se prava vlasnika i korisnika zemljišta za gradnju tako da se ne mogu graditi stambene, stambeno-gospodarske, pomoćne, poljoprivredne gospodarske ili manje gospodarske građevine te podizati ograde:  na udaljenosti od 5 m od obale postojećeg odnosno planiranog korita potoka u naselju, ili melioracijskog kanala odnosno vanjske nožice obrambenog nasipa;  20 m od zaobalne nožice postojećeg/izvedenog obrambenog nasipa na rijeci Savi, Krapini i kanalu \"Sava-Odra-Sava\"."], "key": {"cestica": "(1.) Veličina građevne čestice za građenje stambene građevine ne može biti manja od: - za samostojeće građevine - 350 m² s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 14 m; - za poluugrađene građevine - 300 m², s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 12 m; - za skupne građevine - 225 m², s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 9 m.", "izgradenost": "(2.) Ukupna izgrađenost građevne čestice može biti: - za samostojeće građevine - najviše 30%, uz najmanje 30% prirodnog terena; - za poluugrađene građevine - najviše 40%, uz najmanje 30% prirodnog terena; - za skupne građevine - najviše 50%, a na česticama većim od 600 m² najviše 20%, uz najmanje 20% prirodnog terena;", "visina": "Individualna građevina može: - se graditi kao građevina stambene ili pretežito stambene namjene (stambenogospodarska); - biti visine najviše tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat, s mogućnošću gradnje podzemne etaže.", "teren": "Neizgrađeni dio građevne čestice - prirodni teren najmanje je 30% za samostojeće i poluugrađene građevine i 20% za skupne građevine, uređen visokim i niskim zelenilom i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice.", "meda": "(1.) Stambena i stambeno-gospodarska građevina ako se gradi na samostojeći način, mora biti udaljena najmanje pola visine (h/2) od međe susjednih građevnih čestica, ali ne manje od 3 m. Iznimno od stavka 1. ove podtočke, u već izgrađenim dijelovima naselja, u skladu s lokalnim uvjetima, građevina može biti udaljena i manje od 3 m od jedne susjedne međe građevne čestice, ali ne manje od 1 m, pod sljedećim uvjetima: - ako udaljenost od druge susjedne međe građevne čestice nije manja od 3 m; - na građevini koja je udaljena od susjedne građevne čestice manje od 3 m, ne smiju se graditi otvori prema toj međi. Otvorima iz stavka 2. alineje 2. ove podtočke ne smatraju se otvori s neprozirnim staklom najveće veličine 60 x 60 cm i dijelovi zida od staklene opeke."}}, {"zona": "u gospodarskoj zoni naselja (poslovna namjena)", "items": ["(2.) U gospodarskim zonama veličina građevne čestice ne može biti manja od 600 m², širina parcele ne može biti manja od, u pravilu, 20 m, a najveći omjer širine i dužine određen je, u pravilu, 1:5. Ukupna tlocrtna zauzetost građevne čestice građevinama iznosi najviše 50%, a najmanje 10%.", "Visina gospodarske građevine od kote zaravnanog terena do vijenca krova mora biti u skladu s namjenom i funkcijom građevine te tehnologijom proizvodnog procesa, u pravilu, ne više od 12 m, osim za silos, mlin i u slučaju kada to zahtijevaju tehnološki procesi.", "Najmanja udaljenost građevine od međa susjednih građevnih čestica iznosi pola visine građevine. Ako je h/2 manje od 3 m, najmanja udaljenost je 3 m.", "(3.) Najmanje 30% površine građevne čestice mora biti prirodni teren uređen kao parkovno, pejzažno ili zaštitno zelenilo, a prema drugim namjenama realiziraju se parkovni, pejzažni ili zaštitni vegetacijski tamponi u skladu s uvjetima zaštite okoliša."], "key": {"cestica": "(2.) U gospodarskim zonama veličina građevne čestice ne može biti manja od 600 m², širina parcele ne može biti manja od, u pravilu, 20 m, a najveći omjer širine i dužine određen je, u pravilu, 1:5. Ukupna tlocrtna zauzetost građevne čestice građevinama iznosi najviše 50%, a najmanje 10%.", "izgradenost": "(2.) U gospodarskim zonama veličina građevne čestice ne može biti manja od 600 m², širina parcele ne može biti manja od, u pravilu, 20 m, a najveći omjer širine i dužine određen je, u pravilu, 1:5. Ukupna tlocrtna zauzetost građevne čestice građevinama iznosi najviše 50%, a najmanje 10%.", "meda": "Najmanja udaljenost građevine od međa susjednih građevnih čestica iznosi pola visine građevine. Ako je h/2 manje od 3 m, najmanja udaljenost je 3 m.", "teren": "(3.) Najmanje 30% površine građevne čestice mora biti prirodni teren uređen kao parkovno, pejzažno ili zaštitno zelenilo, a prema drugim namjenama realiziraju se parkovni, pejzažni ili zaštitni vegetacijski tamponi u skladu s uvjetima zaštite okoliša."}}], "tekst": ["2.3.1. Površine za gradnju Površine za gradnju (za budući razvoj i gradske projekte, pretežito za stanovanje, javnu i društvenu namjenu, gospodarsku namjenu, sportsko-rekreacijsku namjenu i groblja) prikazane su na kartografskom prikazu Građevinska područja naselja - izmjene i dopune 2017. u mjerilu 1:5000. Za građevine što se grade unutar površina za gradnju, a obuhvaćene su prostornom granicom zaštićenog kulturnog dobra, posebne uvjete gradnje utvrđuje gradsko tijelo nadležno za zaštitu kulturnih dobara. Način izgradnje nove građevine određuje se prema veličini građevne čestice i načinu izgradnje na susjednim česticama. Kod izgradnje zamjenske građevine način izgradnje ne može se promijeniti, osim iznimno, kad to uvjetuje način izgradnje na susjednim građevnim česticama. Na površinama za gradnju što graniče s vodotokom, planiranom ili postojećom regulacijskom i zaštitnom vodnom građevinom, te drugim vodnim građevinama, u svrhu sprečavanja nepovoljnih utjecaja na pogoršanje vodnog režima ograničavaju se prava vlasnika i korisnika zemljišta za gradnju tako da se ne mogu graditi stambene, stambeno-gospodarske, pomoćne, poljoprivredne gospodarske ili manje gospodarske građevine te podizati ograde:  na udaljenosti od 5 m od obale postojećeg odnosno planiranog korita potoka u naselju, ili melioracijskog kanala odnosno vanjske nožice obrambenog nasipa;  20 m od zaobalne nožice postojećeg/izvedenog obrambenog nasipa na rijeci Savi, Krapini i kanalu \"Sava-Odra-Sava\". Za građenje na građevnoj čestici koja graniči s vodotokom, kanalom, zaštitnom vodnom građevinom odnosno parcelom javnog vodnog dobra potrebno je pribaviti vodopravne uvjete. Prilikom građenja građevina mora se poštivati propisana udaljenost od infrastrukturnih koridora što je određena u točki 5. ovog plana. A. Pretežito stanovanje Na jednoj građevnoj čestici, namijenjenoj (pretežito) stanovanju, mogu se, uz jednu stambenu građevinu ili stambeno-gospodarsku građevinu, graditi i pomoćne, poljoprivredne gospodarske i manje gospodarske građevine. Individualna građevina može: - se graditi kao građevina stambene ili pretežito stambene namjene (stambenogospodarska); - biti visine najviše tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat, s mogućnošću gradnje podzemne etaže. Niska građevina može: - se graditi kao građevina stambene ili pretežito stambene namjene (stambenogospodarska); - biti visine četri nadzemne etaže pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, s mogućnošću gradnje podzemne etaže.", "2.3.1.1. Veličina i izgrađenost građevne čestice (1.) Veličina građevne čestice za građenje stambene građevine ne može biti manja od: - za samostojeće građevine - 350 m² s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 14 m; - za poluugrađene građevine - 300 m², s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 12 m; - za skupne građevine - 225 m², s tim da širina građevne čestice, mjerene na mjestu građevnog pravca građevine, ne može biti manja od 9 m. Ako se gradi nova niska građevina, gradi se, u pravilu, kao samostojeća i, u pravilu, veličina građevne čestice ne može biti manja od 600 m². Ako se gradi stambeno-gospodarska građevina, ili se uz stambenu građevinu na istoj građevnoj čestici smješta poljoprivredna gospodarska ili (i) manja gospodarska građevina, veličina građevne čestice ne može biti manja od: - za samostojeće građevine - 600 m² ; - za poluugrađene građevine - 480 m² ; - za skupne građevine - 360 m² . Dubina građevne čestice iznosi, u pravilu, najmanje 25 m. (2.) Ukupna izgrađenost građevne čestice može biti: - za samostojeće građevine - najviše 30%, uz najmanje 30% prirodnog terena; - za poluugrađene građevine - najviše 40%, uz najmanje 30% prirodnog terena; - za skupne građevine - najviše 50%, a na česticama većim od 600 m² najviše 20%, uz najmanje 20% prirodnog terena; Prirodni teren nije moguće planirati unutar rezervacije proširenja postojeće ulice. (3.) U izgrađenim dijelovima građevinskog područja naselja, na građevnim česticama što su manje od utvrđenih u podtočki (1.) ove točke i s izgrađenošću većom od utvrđene u podtočki (2.) ove točke kod rekonstrukcije građevine ne smije se povećati izgrađenost parcele. Odredbe o veličini građevne čestice ne primjenjuju se pri interpolacijama u gusto izgrađenim dijelovima građevinskog područja naselja ako su ispunjeni uvjeti o najvećoj dopuštenoj ukupnoj izgrađenosti građevne čestice i odredbe o najmanjoj udaljenosti građevine od prometnih površina, međa i drugih građevina, uzimajući u obzir lokalne uvjete.", "2.3.1.2. Udaljenost građevine od susjedne građevne čestice (1.) Stambena i stambeno-gospodarska građevina ako se gradi na samostojeći način, mora biti udaljena najmanje pola visine (h/2) od međe susjednih građevnih čestica, ali ne manje od 3 m. Iznimno od stavka 1. ove podtočke, u već izgrađenim dijelovima naselja, u skladu s lokalnim uvjetima, građevina može biti udaljena i manje od 3 m od jedne susjedne međe građevne čestice, ali ne manje od 1 m, pod sljedećim uvjetima: - ako udaljenost od druge susjedne međe građevne čestice nije manja od 3 m; - na građevini koja je udaljena od susjedne građevne čestice manje od 3 m, ne smiju se graditi otvori prema toj međi. Otvorima iz stavka 2. alineje 2. ove podtočke ne smatraju se otvori s neprozirnim staklom najveće veličine 60 x 60 cm i dijelovi zida od staklene opeke. (2.) Balkoni, terase i otvorena stubišta ne mogu se graditi na udaljenosti manjoj od 3 m od međe susjedne građevne čestice. (3.) Građevina što će se graditi na poluugrađen način tako da će se jednom stranom prislanjati uz susjednu građevinu ili među, mora s drugim dijelovima građevine (istakom) biti udaljena od granice susjedne građevne čestice najmanje h/2, ali ne manje od 3 m. (4.) Građevina što će se graditi kao skupna, bočnim će stranama biti prislonjena na granice susjednih građevnih čestica, a od stražnje će granice čestice biti udaljena najmanje h/2, ali ne manje od 3 m.", "2.3.1.3. Visina građevine Stambena i stambeno-gospodarska građevina mogu se graditi nadzemno kao jednoetažna, dvoetažna, troetažna ili četveroetažna, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, s mogućnošću gradnje podzemne etaže. Visina (h) stambene građevine i stambeno-gospodarske građevine kada se gradi jedna nadzemna etaža najviše je 5,5 m, kada se grade dvije nadzemne etaže najviše je 8,5 m, kada se grade tri nadzemne etaže najviše je 11,5 m, a kada se grade četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, najviše je 14,5 m, s mogućnošću gradnje podzemne etaže. Unutar zaštićenih i evidentiranih seoskih naselja najveću visinu građevine određuje gradsko tijelo nadležno za zaštitu kulturnih dobara.", "2.3.1.4. Pomoćne, manje gospodarske i poljoprivredne gospodarske građevine (1.) Pomoćne i manje gospodarske građevine mogu se graditi nadzemno najviše kao dvoetažne pri čemu se druga etaža oblikuje kao potkrovlje kojem je visina nadozida najviše 40 cm mjereno u ravnini pročelja građevine s nagibom krova do 45º s mogućnošću gradnje podzemne etaže tako da: - visina od kote konačno zaravnanog terena do vijenca građevine nije viša od visine glavne ulične stambene građevine i ne prelazi visinu 4 m; - visina od kote konačno zaravnanog terena do sljemena krova ne prelazi visinu sljemena ulične stambene građevine i nije viša od 7 m; - tlocrtna zauzetost manjom gospodarskom i/ili pomoćnom građevinom nije veća od 150 m²; - građevinski pravac je, u pravilu, iza građevinskog pravca glavne građevine; - iznimno, na strmom terenu garaža se može graditi na regulacijskoj liniji, u skladu s lokalnim uvjetima. Pomoćne i manje gospodarske građevine nije moguće smjestiti na dijelu građevne čestice rezerviranom za proširenje postojeće ulice. Najmanja udaljenost građevina iz stavka 1. ove podtočke od susjednih građevnih čestica mora biti: - ako se grade kao samostojeće građevine - 1m; - ako se grade kao poluugrađene građevine moraju biti smještene s jedne strane uz pretpostavljenu susjednu građevinu odijeljene vatrobranim zidom, uz uvjet da nagib krova nije prema susjednoj građevnoj čestici; - ako se grade kao skupne moraju biti dvjema stranama prislonjene uz pretpostavljenu susjednu građevinu i odijeljene vatrobranim zidom, uz uvjet da nagib krova nije prema susjednim građevnim česticama. Ako građevine imaju otvore prema susjednoj građevnoj čestici, moraju biti udaljene od te čestice najmanje 3 m. Ako krov građevine ima nagib prema susjednoj građevnoj čestici i ako je streha udaljena od međe susjedne čestice manje od 3 m, krov mora imati snjegobrane i oluke. Kod građenja manjih gospodarskih građevina koje imaju prostore za rad, osigurat će se odgovarajući prostor za parkiranje u okviru građevne čestice. (2.) Poljoprivredne gospodarske građevine mogu se graditi nadzemno najviše kao dvoetažne pri čemu se druga etaža oblikuje kao potkrovlje kojem je visina nadozida najviše 40 cm mjereno u ravnini pročelja građevine s nagibom krova do 45º s mogućnošću gradnje podzemne etaže tako da: - potkrovlje se može koristiti samo za spremanje ljetine i sličnih proizvoda poljodjelskih gospodarstava; - visina građevine do vijenca krova može biti najviše 5 m, a do sljemena krova 7 m; - tlocrtna zauzetost poljoprivrednim gospodarskim građevinama ne smije biti veća od 150 m² ; - građevni pravac u pravilu je iza građevnog pravca glavne građevine; - građevine moraju biti udaljene najmanje 10 m od stambene građevine na istoj građevnoj čestici, odnosno 15 m od stambene građevine na susjednoj građevnoj čestici; - najmanja udaljenost od susjedne građevne čestice iznosi 5 m, ako su građevine građene od drveta, i u njima se sprema sijeno, slama i sl.; - najmanja udaljenost od susjedne građevne čestice iznosi 1 m, ako se građevine grade od opeke ili betona; - na udaljenosti manjoj od 3 m do susjedne građevne čestice, ne smiju se prema istoj graditi otvori; - krov mora imati snjegobrane i oluke ako mu je nagib prema susjednoj građevnoj čestici, a udaljenost je od međe manja od 3 m. (3.) Postojeće pomoćne, manje gospodarske i poljoprivredne gospodarske građevine mogu se rekonstruirati u postojećim gabaritima.", "2.3.1.5. Arhitektonsko oblikovanje građevina Arhitektonsko oblikovanje građevina i izbor građevinskog materijala što će se upotrijebiti moraju osiguravati racionalno korištenje energije, biti primjereni Zagrebu i zagrebačkom prostoru i tradiciji, u skladu s uobičajenim načinom građenja s okolnim građevinama i krajobrazom. U starim dijelovima naselja s vrijednom autohtonom arhitekturom koristit će se građevinski elementi i materijali što su za taj prostor uobičajeni, u skladu s lokalnim uvjetima. Krovišta građevina mogu biti kosa, jednostrešna, dvostrešna, s nagibom 30-450 , pokrivena crijepom ili pokrovom boje crijepa, a iznimno mogu biti ravna, ili s blagim nagibom, te bačvasta. Krovišta stambenih i drugih građevina, osim građevina u povijesnim jezgrama, moguće je oblikovati za ugradnju sunčanih pretvornika. Na kosom terenu sljeme krova treba biti, u pravilu, usporedno sa slojnicama zemljišta.", "2.3.1.6. Uređenje građevne čestice Prostor na građevnoj čestici namijenjenoj pretežito stanovanju uređivat će se, u pravilu, na tradicionalan način uređivanja okućnice poštujući funkcionalne i oblikovne karakteristike krajobraza, uz upotrebu autohtonog biljnog materijala. Terase i potporni zidovi moraju se graditi tako da nisu u suprotnosti s oblikovnim obilježjima naselja. Predvrtovi se hortikulturno uređuju bez mogućnosti smještaja dodatnih pokretnih gospodarskih sadržaja. Neizgrađeni dio građevne čestice - prirodni teren najmanje je 30% za samostojeće i poluugrađene građevine i 20% za skupne građevine, uređen visokim i niskim zelenilom i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice. Postojeće i planirano zelenilo mora biti prikazano u lokacijskoj, odnosno građevinskoj dozvoli. Ograde se, u pravilu, izrađuju kao kombinacija perforiranih elemenata sa živicom, visine do 1,5 m. Ograde između građevnih čestica ne mogu biti više od 2,0 m. Iznimno od stavka 5. ove točke ograde mogu biti i više od 1,5 m, odnosno 2,0 m, kada je to nužno radi zaštite građevine ili načina njezina korištenja. Ograde, predvrtovi, terase, potporni zidovi, stube, kolne i pješačke rampe za pristup građevinama, potrebna parkirališna mjesta i prirodni teren, kao i ostali elementi uređenja građevne čestice, ne mogu se smjestiti na dijelu građevne čestice rezerviranom za proširenje postojeće ulice."]}};

// --- mreža: rok za svaki zahtjev, ponovni pokušaj kod privremenih grešaka, predmemorija, ograničen broj istodobnih zahtjeva
// i bilježenje stanja servisa. Neuspjeh jednog servisa nikad ne ruši ostatak aplikacije.
const NET={cache:new Map(),ttl:10*60*1000,max:250,active:0,queue:[],conc:6,stat:{}};
function netSlot(){return new Promise(r=>{if(NET.active<NET.conc){NET.active++;r()}else NET.queue.push(r)})}
function netRelease(){NET.active--; const n=NET.queue.shift(); if(n){NET.active++;n()}}
function svcId(url){const m=String(url).match(/services\/([^/]+)\/FeatureServer(?:\/(\d+))?/); if(m) return m[1]+(m[2]?"/"+m[2]:""); try{return new URL(url).host}catch(e){return String(url).slice(0,40)}}
function netNote(url,ok,ms,msg){const k=svcId(url), s=NET.stat[k]||(NET.stat[k]={ok:0,fail:0,ms:0,last:null}); ok?s.ok++:s.fail++; s.ms=Math.round(ms); s.last=ok?null:msg; s.t=Date.now();}
class NetError extends Error{constructor(msg,retry){super(msg);this.retry=retry}}
async function fetchOnce(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{
    let r;
    try{ r=await fetch(url,{...opts,signal:c.signal}) }
    catch(e){ throw new NetError(e.name==="AbortError"?"nema odgovora nakon "+ms/1000+" s":"nema veze s poslužiteljem",true) }
    if(!r.ok) throw new NetError("poslužitelj javlja grešku HTTP "+r.status,r.status>=500||r.status===429);
    let j; try{ j=await r.json() }catch(e){ throw new NetError("neispravan odgovor poslužitelja",true) }
    if(j&&j.error){const code=+j.error.code||0; throw new NetError("servis javlja grešku"+(j.error.message?": "+j.error.message:""),code>=500||code===0)}
    return j;
  }finally{clearTimeout(t)}
}
async function getJSON(url,opts={},ms=10000,{retries=1,cache=true}={}){
  const key=(opts.method||"GET")+" "+url+" "+(opts.body||"");
  if(cache){const c=NET.cache.get(key); if(c&&Date.now()-c.t<NET.ttl) return c.v;}
  let err;
  for(let a=0;a<=retries;a++){
    await netSlot(); const t0=(window.performance||Date).now();
    try{
      const j=await fetchOnce(url,opts,ms);
      netNote(url,true,(window.performance||Date).now()-t0);
      if(cache){NET.cache.set(key,{t:Date.now(),v:j}); if(NET.cache.size>NET.max) NET.cache.delete(NET.cache.keys().next().value);}
      return j;
    }catch(e){ err=e; netNote(url,false,(window.performance||Date).now()-t0,e.message); }
    finally{ netRelease(); }
    if(!err.retry||a===retries) break;
    await new Promise(r=>setTimeout(r,700*(a+1)));
  }
  throw new Error(err.message);
}
// ArcGIS vraća najviše N objekata; ako je granica dosegnuta, rezultat nije potpun
function featuresOf(g){const f=g&&g.features||[]; if(g&&(g.exceededTransferLimit||(g.properties&&g.properties.exceededTransferLimit))) f.incomplete=true; return f}
function pointQuery(url,ll,fields="*",geom=true){
  const p=new URLSearchParams({geometry:ll.lng+","+ll.lat,geometryType:"esriGeometryPoint",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(geom),outSR:"4326",f:"geojson"});
  return getJSON(url+"?"+p.toString()).then(featuresOf);
}
function polyQuery(url,geom,fields="*",withGeom=true){
  const rings=geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat();
  const p=new URLSearchParams({geometry:JSON.stringify({rings,spatialReference:{wkid:4326}}),geometryType:"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",outFields:fields,returnGeometry:String(withGeom),outSR:"4326",f:"geojson"});
  return getJSON(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()}).then(featuresOf);
}

async function inspect(ll){
  const id=++clickId;
  selLayer.clearLayers(); TL.layer=null; TL.marker=null; TL.center=null; TL.zl=null; TL.zones=null; SUN.nb=null; SUN.layer=null; SUN.nbErr=null; ZK.res=null; window.__infra=null;
  L.circleMarker(ll,{radius:5,color:"#000",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(selLayer);
  sheet.innerHTML='<p class="hint"><span class="spin"></span>Tražim česticu, namjenu i urbano pravilo…</p>';
  let [ces,nam,up,upx,gn]=await Promise.all([
    settle(pointQuery(SRC.cestice,ll)),
    settle(pointQuery(SRC.namjena,ll)),
    settle(pointQuery(SRC.pravila,ll,"BROJ_UP",false)),
    settle(pointQuery(SRC.iznimke,ll,"LAYER",false)),
    settle(pointQuery(SRC.gupNam,ll,"NAMJENA1,NAMJENA2",false))
  ]);
  if(id!==clickId) return;
  // izvan GUP-a Zagreba: urbana pravila GUP-a Sesveta (prijedlog izmjena 2026.)
  if(!(up.v&&up.v[0])){
    const se=await settle(pointQuery(SRC.pravilaSE,ll,"TextString",false));
    const m=se.v&&se.v[0]?String(se.v[0].properties.TextString||"").match(/\d+\.\d+(?:\.\d+)?/):null;
    if(m) up={v:[{properties:{BROJ_UP:m[0]+".",SRC:"SE"}}]};
    if(id!==clickId) return;
  }
  const parcel=ces.v&&ces.v[0]?ces.v[0]:null;
  let zones=nam.v||[], area=null;
  if(parcel){
    area=turf.area(parcel.geometry);
    const pl=L.geoJSON(parcel.geometry,{style:{color:"#111",weight:3,fill:false},interactive:false}).addTo(selLayer);
    window.__lastBounds=pl.getBounds();
    try{zones=await polyQuery(SRC.namjena,parcel.geometry)}catch(e){}
    if(id!==clickId) return;
  }
  const rows=zones.map(z=>{
    let share=null;
    if(parcel){try{const i=turf.intersect(parcel.geometry,z.geometry);share=i?turf.area(i)/area:0}catch(e){}}
    return {p:z.properties,share,geom:z.geometry};
  }).filter(r=>r.share===null||r.share>0.005).sort((a,b)=>(b.share??0)-(a.share??0));
  rows.forEach(r=>L.geoJSON(r.geom,{style:{color:COLORS[r.p.Analitika]||"#888",weight:1,fillOpacity:.3},interactive:false}).addTo(selLayer));
  // pokaži osnovno odmah, provjere stižu za trenutak
  const base={ll,parcel,area,rows,ces,nam,up,upx,gn,checks:null};
  render(base);
  // malo smanjena čestica, da susjedni sloj koji samo dodiruje među ne bude pogodak
  let qGeom=null;
  if(parcel){try{const b=turf.buffer(parcel.geometry,-0.0008,{units:"kilometers"});qGeom=b&&b.geometry?b.geometry:parcel.geometry}catch(e){qGeom=parcel.geometry}}
  const slopeP=settle(loadSlope(parcel,ll));
  const zgradeP=parcel?settle(loadZgrade(parcel)):null;
  const checks=await Promise.all(CHECKS.map(c=>settle(
    c.corridor?corridorQuery(c,parcel,ll):
    (qGeom?polyQuery(c.url,qGeom,c.fields,!!c.draw):pointQuery(c.url,ll,c.fields,!!c.draw))
  ).then(r=>({c,...r}))));
  checks.forEach(r=>{if(r.c.corridor&&r.v) r.v.forEach(f=>L.geoJSON(f.geometry,{style:{color:/^dv/.test(r.c.id)?"#b3261e":"#a86400",weight:3,dashArray:"8 6"},interactive:false}).addTo(selLayer))});
  // gradivi dio i nagib terena
  const env2=buildEnvelope(parcel,rows,up);
  if(env2&&env2.geom) L.geoJSON(env2.geom,{style:{color:"#1f6f54",weight:2,dashArray:"4 3",fillColor:"#1f6f54",fillOpacity:.25},interactive:false}).addTo(selLayer);
  base.envelope=env2;
  window.__env=env2;
  base.zgrade=parcel?await zgradeP:null;
  if(base.zgrade&&base.zgrade.v) base.zgrade.v.geoms.forEach(gm=>L.geoJSON(gm,{style:{color:"#444",weight:1.5,fillColor:"#666",fillOpacity:.35},interactive:false}).addTo(selLayer));
  base.slope=await slopeP;
  if(id!==clickId) return;
  checks.forEach(r=>{if(r.c.draw&&r.v) r.v.forEach(f=>f.geometry&&L.geoJSON(f.geometry,{style:{color:r.c.draw,weight:2,dashArray:"5 4",fillOpacity:.15},interactive:false}).addTo(selLayer))});
  render({...base,checks});
  const envP=settle(loadEnv(ll,parcel)), infP=FEATURES.infra?settle(loadInfra(parcel,ll)):Promise.resolve(null), sunP=Promise.resolve(null);
  const [infra,sun]=await Promise.all([infP,sunP]);
  if(id!==clickId) return;
  window.__infra=infra&&infra.v||null; infraDraw(infra);
  render({...base,checks,infra,sun});
  const env=await envP;
  if(id!==clickId) return;
  render({...base,checks,infra,sun,env});
}

// --- simulator kuće: pravokutnik kuće (i garaže) koji se pomiče i okreće; provjere prema pravilu
// Zone na karti: zeleno = prostor unutar udaljenosti od međa; narančasto = pojas uz ulicu do udaljenosti građevnog pravca
// (ulica procijenjena iz OpenStreetMapa, regulacijska linija nije poznata); crveno = kuća izvan dopuštenog prostora.
const TL={w:12,d:9,rot:0,center:null,layer:null,marker:null,fl:"1",fh:3.0,podrum:false,gar:false,gw:3.5,gd:6,zones:null};
const FLOOR_OPTS=[["1","prizemnica (P)",1,0],["1.5","P + potkrovlje",1,1],["2","P + 1",2,0],["2.5","P + 1 + potkrovlje",2,1],["3","P + 2",3,0]];
const PK_SHARE=0.75; // potkrovlje u GBP-u kao 75 % tlocrta (procjena; točno ovisi o nadozidu i nagibu krova)
function tFloors(){const o=FLOOR_OPTS.find(x=>x[0]===TL.fl)||FLOOR_OPTS[0]; return {full:o[2],pk:o[3],et:o[2]+o[3],label:o[1]}}
function tRectAt(c,w,d,rot,offX=0,offY=0){
  const lat=c[1]*Math.PI/180, mx=1/(111320*Math.cos(lat)), my=1/110540;
  const x0=offX-w/2, x1=offX+w/2, y0=offY-d/2, y1=offY+d/2;
  const r=turf.polygon([[[c[0]+x0*mx,c[1]+y0*my],[c[0]+x1*mx,c[1]+y0*my],[c[0]+x1*mx,c[1]+y1*my],[c[0]+x0*mx,c[1]+y1*my],[c[0]+x0*mx,c[1]+y0*my]]]);
  return rot?turf.transformRotate(r,rot,{pivot:c}):r;
}
function tRect(){ if(!TL.center) return null; return tRectAt(TL.center,TL.w,TL.d,TL.rot); }
// garaža uz desnu stranu kuće, poravnata sa stražnjim rubom
function tGarage(){ if(!TL.center||!TL.gar) return null; return tRectAt(TL.center,TL.gw,TL.gd,TL.rot,TL.w/2+TL.gw/2,(TL.gd-TL.d)/2); }
function tFoot(){const r=tRect(), g=tGarage(); if(!r) return null; if(!g) return r; try{return turf.union(r,g)}catch(e){return r}}
function withinEnv(rect,env){

// rubovi čestice uz cestu (manje od 12 m od osi ceste iz OSM-a) i pojas do udaljenosti građevnog pravca
function streetBand(parcel,roads,dist){

  if(!lines.length) return null;
  const segs=[]; const ring=parcel.geometry.type==="Polygon"?parcel.geometry.coordinates[0]:parcel.geometry.coordinates[0][0];
  for(let i=0;i<ring.length-1;i++){const a=ring[i],b=ring[i+1], len=turf.distance(a,b,{units:"kilometers"})*1000; if(len<1) continue;
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=Math.min(...lines.map(l=>turf.pointToLineDistance(turf.point(mid),l,{units:"kilometers"})*1000));
    if(d<12) segs.push([a,b]);}

  for(const s of segs){const b=turf.buffer(turf.lineString(s),dist/1000,{units:"kilometers"}); band=band?turf.union(band,b):b;}
  return band;

async function loadZgrade(parcel){

// --- koridori: dohvat linija u krugu i provjera stvarne udaljenosti
async function corridorQuery(c,parcel,ll){
  const geom=parcel?parcel.geometry:{type:"Point",coordinates:[ll.lng,ll.lat]};
  const p=new URLSearchParams({geometry:geom.type==="Point"?ll.lng+","+ll.lat:JSON.stringify({rings:geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat(),spatialReference:{wkid:4326}}),
    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(c.search),units:"esriSRUnit_Meter",
    outFields:c.fields,returnGeometry:"true",outSR:"4326",f:"geojson"});
  const g=await getJSON(c.url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p.toString()});
  return (g.features||[]).filter(f=>{
    if(!f.geometry) return false;
    const d=corrDist(f.properties||{},c.corridor);

// --- gradivi dio: čestica umanjena za udaljenost od međe, samo u zonama koje dopuštaju gradnju
function buildEnvelope(parcel,rows,up){
  if(!parcel) return null;
  let d=3, est=null;
  try{
    const {rule}=ruleLookup(up,rows);
    const z=rule&&rows[0]?pickZone(rule,rows[0].p.Analitika):null;
    if(z){const RP=ruleParams(z,TIP,null), md=RP.find(x=>x.id==="meda"), et=RP.find(x=>x.id==="etaze");
      if(md&&md.hHalf){const h=(et&&et.num?et.num:3)*3; d=Math.max(3,h/2); est="h/2: uzeto "+String(d).replace(".",",")+" m za visinu oko "+h+" m";}
      else if(md&&md.num) d=md.num; else est="pravilo ne navodi udaljenost od međe; uzeto 3 m";}
    else est="pravilo nije određeno; uzeto 3 m";
  }catch(e){}
  try{
    let env=turf.buffer(parcel.geometry,-d/1000,{units:"kilometers"});
    if(!env||!env.geometry) return {geom:null,area:0,d,est};
    const bz=rows.filter(r=>BUILDABLE.has(r.p.Analitika)&&r.geom);
    if(bz.length&&bz.length<rows.length){
      let u=null;
      for(const r of bz){const i=turf.intersect(env,{type:"Feature",geometry:r.geom,properties:{}}); if(i) u=u?turf.union(u,i):i;}
      env=u;
    } else if(!bz.length) env=null;
    return {geom:env?env.geometry:null,area:env?turf.area(env):0,d,est};
  }catch(e){return null}
}
// --- nagib terena (Copernicus DEM preko Open-Meteo; rezolucija oko 90 m, orijentacijski)
async function loadSlope(parcel,ll){
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const pt=turf.point(c), D=0.04; // 40 m na svaku stranu
  const pts=[0,90,180,270].map(b=>turf.destination(pt,D,b,{units:"kilometers"}).geometry.coordinates);
  pts.unshift(c);
  const q=new URLSearchParams({latitude:pts.map(p=>p[1].toFixed(6)).join(","),longitude:pts.map(p=>p[0].toFixed(6)).join(",")});
  const j=await getJSON("https://api.open-meteo.com/v1/elevation?"+q.toString(),{},10000);
  const e=j.elevation; if(!e||e.length<5) throw new Error("nema podataka o visini");
  const dz_ns=(e[1]-e[3]), dz_ew=(e[2]-e[4]);
  const slope=Math.sqrt(dz_ns*dz_ns+dz_ew*dz_ew)/(2*D*1000)*100;
  const dirs=["sjever","istok","jug","zapad"], low=[e[1],e[2],e[3],e[4]].indexOf(Math.min(e[1],e[2],e[3],e[4]));
  return {h:Math.round(e[0]),slope,down:dirs[low]};
}

async function distQuery(url,parcel,ll,dist,fields="*",max=300){

    geometryType:geom.type==="Point"?"esriGeometryPoint":"esriGeometryPolygon",inSR:"4326",spatialRel:"esriSpatialRelIntersects",distance:String(dist),units:"esriSRUnit_Meter",

// najmanja udaljenost (m) objekta mreže od čestice ili točke
function lineParts(geom){
  const out=[];
  try{
    const f=geom.type==="Polygon"||geom.type==="MultiPolygon"?turf.polygonToLine({type:"Feature",geometry:geom,properties:{}}):{type:"Feature",geometry:geom,properties:{}};
    turf.flattenEach(f,x=>{if(x.geometry&&x.geometry.type==="LineString") out.push(x)});
  }catch(e){}
  return out;
}
function coordsOf(geom){const a=[];try{turf.coordEach({type:"Feature",geometry:geom,properties:{}},c=>a.push(c))}catch(e){}return a}
function minDistM(fgeom,parcel,ll){
  if(!fgeom) return null;
  if(!parcel){const p=turf.point([ll.lng,ll.lat]);
    if(/Line/.test(fgeom.type)){let m=Infinity;for(const l of lineParts(fgeom)) m=Math.min(m,turf.pointToLineDistance(p,l,{units:"kilometers"})*1000);return m}
    return Math.min(...coordsOf(fgeom).map(c=>turf.distance(p,turf.point(c),{units:"kilometers"})*1000));}
  const pf={type:"Feature",geometry:parcel.geometry,properties:{}};
  try{if(turf.booleanIntersects({type:"Feature",geometry:fgeom,properties:{}},pf)) return 0}catch(e){}
  const bnd=lineParts(parcel.geometry); let m=Infinity;
  for(const c of coordsOf(fgeom)) for(const b of bnd) m=Math.min(m,turf.pointToLineDistance(turf.point(c),b,{units:"kilometers"})*1000);
  if(/Line/.test(fgeom.type)){const fl=lineParts(fgeom); for(const c of coordsOf(parcel.geometry)) for(const l of fl) m=Math.min(m,turf.pointToLineDistance(turf.point(c),l,{units:"kilometers"})*1000);}
  return m;
}

const isPlanned=(p,txt)=>/planiran/i.test(txt||"")||/planiran/i.test(Object.values(p||{}).join(" "));
async function loadInfra(parcel,ll){
  const out={};
  await Promise.all(INF_SRC.map(s=>settle(distQuery(s.url,parcel,ll,INF_R,"*",200)).then(r=>{
    if(r.e){out[s.id]={e:r.e};return}
    const fs=(r.v||[]).filter(f=>!s.filter||s.filter(f.properties||{}));
    let ex=null, pl=null;
    for(const f of fs){const p=f.properties||{}, d=minDistM(f.geometry,parcel,ll); if(d==null||!isFinite(d)) continue;
      const desc=s.desc(p), rec={d,desc:String(desc).replace(/\s*\((postojeći|postojeci|planirani|planirana)\)\s*/i,""),geom:f.geometry,color:s.color};
      if(isPlanned(p,desc)){if(!pl||d<pl.d) pl=rec} else {if(!ex||d<ex.d) ex=rec}}
    out[s.id]={ex,pl,n:fs.length,incomplete:!!(r.v&&r.v.incomplete)};
  })));
  return out;
}
function infraHtml(inf){

  if(!inf) return h+`<p class="hint"><span class="spin"></span>Tražim vodove iz GUP-a u blizini…</p>`;
  const o=inf.v||{}, dm=x=>x.d<1?"uz česticu ili kroz nju":"oko "+fmt(Math.max(1,Math.round(x.d)))+" m";
  const gup=(ids,what)=>{const parts=[]; let err=null;
    for(const id of ids){const r=o[id]; if(!r) continue; if(r.e){err=r.e;continue}
      if(r.ex) parts.push(`${esc(r.ex.desc)} (postojeći) ${dm(r.ex)}`);
      if(r.pl) parts.push(`${esc(r.pl.desc)} (planirani) ${dm(r.pl)}`);}
    if(parts.length) return "U GUP-u: "+parts.join("; ")+".";
    if(err) return "Podatak iz GUP-a trenutno nije dostupan ("+esc(err)+").";
    return `U GUP-u nema ${what} u krugu ${INF_R} m.`;
  };
  const row=(label,status,text)=>`<li class="chk chk-${status==="nedostupno"?"warn":"ok"}"><b>${label} <em class="kind st-${status==="nedostupno"?"muted":"ok"}">${status==="nedostupno"?"nema dostupnih podataka":"podatak iz GUP-a"}</em></b><span>${text}</span></li>`;
  h+=`<ul class="checks">`;
  h+=row("Vodovod","nedostupno",`Ulična vodovodna mreža nije javno objavljena. Provjeri kod Vodoopskrbe i odvodnje. ${gup(["vod"],"magistralnih vodoopskrbnih cjevovoda")} Na magistralni cjevovod kuća se ne priključuje izravno.`);
  h+=row("Kanalizacija","nedostupno","Kanalizacijska mreža nije javno objavljena. Ako u ulici nema kanalizacije, treba sabirna jama ili mali pročistač; u vodozaštitnoj zoni vrijede posebni uvjeti.");
  h+=row("Struja","nedostupno",`Niskonaponska mreža i trafostanice 10(20)/0,4 kV nisu javno objavljene; uvjete priključenja daje HEP ODS (elektroenergetska suglasnost). ${gup(["ee","ts","eeSE","tsSE"],"dalekovoda, kabela ni trafostanica 110 kV")}`);
  h+=row("Plin","nedostupno",`Distribucijska plinska mreža nije javno objavljena; provjeri kod Gradske plinare Zagreb. ${gup(["plin","plinSE"],"magistralnih ni visokotlačnih plinovoda")} Na magistralni i visokotlačni plinovod kuća se ne priključuje izravno.`);
  {const r=o.top; if(r&&!r.e&&(r.ex||r.pl)) h+=row("Toplovod","gup",gup(["top"],"toplovoda"));}
  h+=`</ul><p class="meta">Blizina voda ne znači da je priključak moguć; to potvrđuju posebni uvjeti priključenja. Vodovi iz GUP-a ucrtani su na karti (plavo voda, crveno struja, žuto plin, ljubičasto toplovod). Izvor: GUP Grada Zagreba, karte 3b i 3c (javna rasprava 2024.), ArcGIS Grada Zagreba.</p>`;
  return h;
}

// --- sunce i sjena
// Položaj Sunca: NOAA algoritam (Meeus), točnost oko 0,1°. Sjena: tlocrt pomaknut za h/tan(visina Sunca) suprotno od Sunca.
// Nagib terena nije uključen (model visina rezolucije ~90 m nije dovoljno točan za pojedinu česticu).
function zgOffsetH(d){ // CET/CEST: ljetno vrijeme od zadnje nedjelje u ožujku do zadnje nedjelje u listopadu (u 01:00 UTC)
  const y=d.getUTCFullYear(), lastSun=m=>{const t=new Date(Date.UTC(y,m+1,0)); return Date.UTC(y,m,t.getUTCDate()-t.getUTCDay(),1)};
  const ms=d.getTime(); return ms>=lastSun(2)&&ms<lastSun(9)?2:1;
}
function zgDate(ymd,hour){ // lokalno vrijeme u Zagrebu -> Date (UTC)
  const [y,m,dd]=ymd.split("-").map(Number); const h=Math.floor(hour), mi=Math.round((hour-h)*60);
  let t=new Date(Date.UTC(y,m-1,dd,h-1,mi)); t=new Date(Date.UTC(y,m-1,dd,h-zgOffsetH(t),mi)); return t;
}
function solarPos(date,lat,lon){
  const r=Math.PI/180, jd=date.getTime()/86400000+2440587.5, T=(jd-2451545)/36525;
  const L0=(280.46646+T*(36000.76983+0.0003032*T))%360, M=357.52911+T*(35999.05029-0.0001537*T), e=0.016708634-T*(0.000042037+0.0000001267*T);
  const C=Math.sin(M*r)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*r)*(0.019993-0.000101*T)+Math.sin(3*M*r)*0.000289;
  const om=125.04-1934.136*T, lam=L0+C-0.00569-0.00478*Math.sin(om*r);
  const eps0=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60, eps=eps0+0.00256*Math.cos(om*r);
  const dec=Math.asin(Math.sin(eps*r)*Math.sin(lam*r))/r;
  const y=Math.tan(eps*r/2)**2;
  const eot=4/r*(y*Math.sin(2*L0*r)-2*e*Math.sin(M*r)+4*e*y*Math.sin(M*r)*Math.cos(2*L0*r)-0.5*y*y*Math.sin(4*L0*r)-1.25*e*e*Math.sin(2*M*r)); // minute
  const utcMin=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60;
  const tst=(utcMin+eot+4*lon+1440)%1440, ha=tst/4<0?tst/4+180:tst/4-180;
  const cz=Math.sin(lat*r)*Math.sin(dec*r)+Math.cos(lat*r)*Math.cos(dec*r)*Math.cos(ha*r), zen=Math.acos(Math.max(-1,Math.min(1,cz)))/r;
  let az=Math.acos(Math.max(-1,Math.min(1,(Math.sin(lat*r)*Math.cos(zen*r)-Math.sin(dec*r))/(Math.cos(lat*r)*Math.sin(zen*r)))))/r;
  az=ha>0?(az+180)%360:(540-az)%360;
  return {alt:90-zen,az,dec,eot};
}
function sunTimes(ymd,lat,lon){ // izlazak i zalazak (visina −0,833°), traženje po minutama
  let rise=null,set=null,prev=null;
  let ph=null;
  for(let m=180;m<=1380;m+=2){const h=m/60, a=solarPos(zgDate(ymd,h),lat,lon).alt; if(prev!=null){const f=(-0.833-prev)/(a-prev), x=ph+(h-ph)*f; if(prev<-0.833&&a>=-0.833) rise=x; if(prev>=-0.833&&a<-0.833) set=x;} prev=a; ph=h;}
  return {rise,set};
}
const hhmm=h=>h==null?"–":String(Math.floor(h)).padStart(2,"0")+":"+String(Math.round((h%1)*60)).padStart(2,"0");
const SUN={ymd:null,hour:12,hN:7,nb:null,layer:null,on:false};
function shadowPoly(feat,alt,az,h){
  if(alt<=0.5) return null;
  const L=Math.min(h/Math.tan(alt*Math.PI/180),300);
  try{
    const moved=turf.transformTranslate(feat,L/1000,(az+180)%360,{units:"kilometers"});
    const pts=coordsOf(feat.geometry).concat(coordsOf(moved.geometry)).map(c=>turf.point(c));
    return turf.convex(turf.featureCollection(pts));
  }catch(e){return null}
}
async function sunNeighbours(parcel,ll){
  const feats=await distQuery(OBJEKTI,parcel,ll,80,"*",400);
  const pf={type:"Feature",geometry:parcel.geometry,properties:{}}, out=[];
  for(const f of feats){ if(!f.geometry) continue; let own=0; try{const i=turf.intersect(pf,f); own=i?turf.area(i)/turf.area(f):0}catch(e){}
    if(own<=0.5) out.push(f); }
  return out;
}
function sunCompute(){
  const d=window.__lastData; if(!d||!d.parcel) return null;
  const c=turf.centroid(d.parcel.geometry).geometry.coordinates, lat=c[1], lon=c[0];
  const sp=solarPos(zgDate(SUN.ymd,SUN.hour),lat,lon);
  const target={type:"Feature",geometry:window.__env&&window.__env.geom?window.__env.geom:d.parcel.geometry,properties:{}}, tA=turf.area(target);
  let nbU=null, shNb=[];
  if(SUN.nb&&sp.alt>0.5) for(const f of SUN.nb){const s=shadowPoly(f,sp.alt,sp.az,SUN.hN); if(s){shNb.push(s); try{const i=turf.intersect(target,s); if(i) nbU=nbU?turf.union(nbU,i):i}catch(e){}}}
  let shHouse=null; const foot=TL.center?tFoot():null, R=window.__sim;
  if(foot&&R&&sp.alt>0.5) shHouse=shadowPoly(foot,sp.alt,sp.az,R.height+1.5);
  return {sp,lat,lon,share:nbU&&tA?Math.min(1,turf.area(nbU)/tA):0,shNb,shHouse,target:window.__env&&window.__env.geom?"prostor za kuću":"česticu",len1:sp.alt>0.5?1/Math.tan(sp.alt*Math.PI/180):null};
}
function sunPathSvg(lat,lon,curYmd,cur){
  const S=220, R=95, cx=S/2, cy=S/2;
  const P=(alt,az)=>{const rr=R*(90-Math.max(0,alt))/90, a=(az-90)*Math.PI/180; return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)]};
  const path=ymd=>{let s=""; for(let h=3;h<=22;h+=0.25){const p=solarPos(zgDate(ymd,h),lat,lon); if(p.alt<0) continue; const [x,y]=P(p.alt,p.az); s+=(s?"L":"M")+x.toFixed(1)+","+y.toFixed(1)} return s};
  const y=curYmd.slice(0,4);
  let g=`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="Putanja Sunca" style="max-width:100%">`;
  for(const a of [0,30,60]){g+=`<circle cx="${cx}" cy="${cy}" r="${R*(90-a)/90}" fill="none" stroke="var(--line)"/>`;}
  g+=`<text x="${cx}" y="12" text-anchor="middle" font-size="11" fill="var(--muted)">S</text><text x="${cx}" y="${S-3}" text-anchor="middle" font-size="11" fill="var(--muted)">J</text><text x="${S-8}" y="${cy+4}" text-anchor="middle" font-size="11" fill="var(--muted)">I</text><text x="8" y="${cy+4}" text-anchor="middle" font-size="11" fill="var(--muted)">Z</text>`;
  g+=`<path d="${path(y+"-06-21")}" fill="none" stroke="var(--warn)" stroke-width="1.5"/><path d="${path(y+"-12-21")}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><path d="${path(curYmd)}" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  if(cur.alt>0){const [x,yy]=P(cur.alt,cur.az); g+=`<circle cx="${x}" cy="${yy}" r="6" fill="#f2b705" stroke="var(--fg)"/>`;}
  g+=`</svg><p class="meta" style="margin:2px 0 0">Narančasto 21. lipnja, plavo 21. prosinca, iscrtkano izabrani dan; krug je trenutni položaj Sunca. Rubovi kruga su obzor (0°), krugovi 30° i 60° iznad obzora.</p>`;
  return g;
}
function sunDraw(){
  const out=document.getElementById("sunOut"); if(!out) return;

  if(SUN.layer){selLayer.removeLayer(SUN.layer); SUN.layer=null}

    for(const s of R.shNb) L.geoJSON(s,{style:{color:"#333",weight:0,fillColor:"#222",fillOpacity:.28},interactive:false}).addTo(SUN.layer);
    if(R.shHouse) L.geoJSON(R.shHouse,{style:{color:"#1565c0",weight:1,fillColor:"#1565c0",fillOpacity:.18,dashArray:"3 3"},interactive:false}).addTo(SUN.layer);}

  if(SUN.nb) h+=`<div class="row"><span>Sjena susjednih zgrada na ${esc(R.target)}</span><span>${Math.round(R.share*100)} %</span></div>`;

}

// --- sunčana elektrana: proizvodnja iz satnog zračenja na nagnutu plohu (Open-Meteo, ERA5 / Copernicus), prosjek 3 godine
const PV={res:{},manualKwp:false};
const PV_PR=0.80; // omjer učinkovitosti sustava: gubici temperature, izmjenjivača, kabela i prljavštine (pretpostavka)
const PV_KWP_M2=0.20; // kWp po m² panela (moduli oko 430 W na 2 m²)
const PV_AZ=[["0","jug"],["-45","jugoistok"],["45","jugozapad"],["-90","istok"],["90","zapad"]];
async function pvFetch(lat,lon,tilt,az){
  const k=[lat.toFixed(3),lon.toFixed(3),tilt,az].join("|"); if(PV.res[k]) return PV.res[k];
  const q=new URLSearchParams({latitude:lat.toFixed(4),longitude:lon.toFixed(4),start_date:"2023-01-01",end_date:"2025-12-31",hourly:"global_tilted_irradiance",tilt:String(tilt),azimuth:String(az),timezone:"UTC"});
  const j=await getJSON("https://archive-api.open-meteo.com/v1/archive?"+q.toString(),{},25000);
  const t=j.hourly&&j.hourly.time, v=j.hourly&&j.hourly.global_tilted_irradiance;
  if(!t||!v||!v.length) throw new Error("servis nije vratio podatke o zračenju");
  const mon=Array(12).fill(0), yrs=new Set(); let n=0;
  for(let i=0;i<t.length;i++){const x=v[i]; if(x==null) continue; const m=+t[i].slice(5,7)-1; mon[m]+=x/1000; yrs.add(t[i].slice(0,4)); n++;}
  const ny=yrs.size||1, monthly=mon.map(x=>x/ny), annual=monthly.reduce((a,b)=>a+b,0);
  if(n<ny*8000) throw new Error("nepotpuni podaci o zračenju");
  return PV.res[k]={annual,monthly,years:[...yrs].sort()};
}
function pvHtml(){
  const R=window.__sim, roof=R?Math.round(R.hA*0.5):40;
  let h=`<details class="acc" data-k="pv"><summary><span>Sunčana elektrana</span><b id="pvSum">izračunaj</b></summary><div class="acc-body">`;
  h+=`<div class="bgrid"><label for="pvRoof">Površina krova za panele</label><span><input id="pvRoof" type="number" inputmode="decimal" min="5" step="1" value="${roof}"> m²</span>`;
  h+=`<label for="pvTilt">Nagib krova</label><span><input id="pvTilt" type="number" inputmode="decimal" min="0" max="90" step="1" value="30"> °</span>`;

  }else ring=ll.lat.toFixed(6)+","+ll.lng.toFixed(6);
  const c=parcel?turf.centroid(parcel.geometry).geometry.coordinates:[ll.lng,ll.lat];
  const P=c[1].toFixed(6)+","+c[0].toFixed(6);
  const q=`[out:json][timeout:15];
way(around:12,${ring})[highway]->.r; .r out tags geom;
(node(around:600,${P})[highway=bus_stop];node(around:600,${P})[railway=tram_stop];node(around:900,${P})[railway=station];
 node(around:1200,${P})[amenity=kindergarten];way(around:1200,${P})[amenity=kindergarten];
 node(around:1500,${P})[amenity=school];way(around:1500,${P})[amenity=school];
 node(around:1000,${P})[shop=supermarket];way(around:1000,${P})[shop=supermarket];
 node(around:1500,${P})[amenity=pharmacy];)->.e; .e out tags center;`;
  // više Overpass servera: prvi koji odgovori pobjeđuje
  const body="data="+encodeURIComponent(q);

  const byType={}; for(const s of out.stops) if(!byType[s.type]||s.d<byType[s.type].d) byType[s.type]=s;
  out.stops=Object.values(byType).sort((a,b)=>a.d-b.d);

}

// --- izvlačenje brojeva iz teksta pravila, po tipu građevine (slob = slobodnostojeća, polu = poluugrađena, ugr = ugrađena)
const toNum=s=>parseFloat(String(s).replace(/\.(?=\d{3}\b)/g,"").replace(",","."));
const TIPOVI=[["slob","slobodnostojeća"],["polu","poluugrađena (dvojna)"],["ugr","ugrađena (u nizu)"]];
function stemsIn(s){
  const r=[]; if(/slobodnostoje|samostoje/iu.test(s)) r.push("slob"); if(/poluugrađ|dvojn/iu.test(s)) r.push("polu");

// tekst se dijeli na dijelove (zarez koji nije decimalni, točka-zarez, "a", "te"); broj pripada tipu iz istog ili prethodnog dijela
function byType(text,unit){
  const res={};
  for(const clause of String(text||"").split(";")){ // tip se prenosi samo unutar iste rečenice
    let last=null;
    for(const s of clause.split(/,(?!\d)|\sa\s|\ste\s|\si\s(?=\d)/u)){
      const n=s.match(unit), st=stemsIn(s);
      if(n){ const tgt=st.length?st:(last||["gen"]); for(const x of tgt) if(res[x]==null) res[x]=n[1]; if(st.length) last=st; }
      else if(st.length) last=st;
    }
  }
  return res;
}
function pickT(text,unit,tip){

  const typed=["slob","polu","ugr"].some(x=>r[x]!=null);

  if(!typed){const m=String(text||"").match(unit); return m?m[1]:null}
  return null;
}
function parseParams(key,tip="slob"){
