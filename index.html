<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Čestica Zagreb</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f6f54">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<style>
/* Layout: full-screen map, results in a bottom sheet (side panel on wide screens) */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#dde2de; --soft:#eef1ee;
  --accent:#1f6f54;
  --ok:#1f7a3f; --warn:#a86400; --no:#b3261e;
  --ok-bg:#e5f3e9; --warn-bg:#fbefd9; --no-bg:#fbe5e3;
  --f-display:"Archivo",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --panel:#1c2320; --fg:#e6ece8; --muted:#9aa8a0; --line:#2e3833; --soft:#232c28;
  --accent:#5cc49a;
  --ok:#7fd69a; --warn:#f0b65a; --no:#f2867d;
  --ok-bg:#1b3325; --warn-bg:#3a2c12; --no-bg:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-display)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
header h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;white-space:nowrap}
.ib:focus-visible,#q:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--line)}
.layers{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));z-index:900;display:flex;flex-direction:column;gap:6px}
.layers label{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;display:flex;gap:6px;align-items:center}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:950;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(0,0,0,.12)}
@media (min-width:900px){#sheet{left:auto;top:10px;right:10px;bottom:10px;width:420px;max-height:none;border-radius:12px;border:1px solid var(--line)} .layers{right:440px}}
.hint{color:var(--muted);margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
.parcel{font-family:var(--f-mono);font-size:22px;font-weight:500;margin:0}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}
.verdict{margin:12px 0;padding:10px 12px;border-radius:10px;font-weight:500}
.v-ok{background:var(--ok-bg);color:var(--ok)} .v-warn{background:var(--warn-bg);color:var(--warn)} .v-no{background:var(--no-bg);color:var(--no)}
.zones{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.zone{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.sw{width:14px;height:14px;border-radius:3px;margin-top:3px}
.zone b{display:block;font-weight:500}
.zone small{color:var(--muted);display:block}
.pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rule-code{font-family:var(--f-mono);font-weight:500;background:var(--soft);border-radius:6px;padding:1px 6px;margin-right:6px}
.rule-title{font-weight:700;font-size:16px;margin:4px 0 2px;text-wrap:balance}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 10px;margin:8px 0 0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.calc{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.calc .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.calc .row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.bad{color:var(--no)} .good{color:var(--ok)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:500;font-size:14px}
details ol{padding-left:20px;margin:8px 0 0;font-size:13.5px} details li{margin:4px 0}
details p{font-size:13.5px;margin:6px 0}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.links a{color:var(--accent);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.err{color:var(--no);font-size:13px;margin:6px 0 0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{padding:8px 10px;border-radius:8px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.chk b{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:14px;margin-top:6px}
.bgrid input[type=number],.bsel{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);max-width:100%}
.bgrid input[type=number]{width:6em}
.actions{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.phase-d summary{font-weight:700;font-size:15px;padding:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chips span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.docs li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.docs label{display:flex;gap:6px;align-items:flex-start;font-size:14px}
.docs small{color:var(--muted)} .docs a{color:var(--accent)}
.print-only{display:none}
@media print{
  header,#map,.layers,.leaflet-control-container,.actions{display:none!important}
  html,body{height:auto;background:#fff;color:#000}
  #app,main{position:static!important;display:block}
  #sheet{position:static!important;max-height:none!important;overflow:visible!important;width:auto!important;box-shadow:none!important;border:0!important;padding:0!important}
  .print-only{display:block;font-weight:700;margin:0 0 8px}
  details{break-inside:avoid-page}
  .docs li,.calc,.chk,.zone{break-inside:avoid}
  :root:not(#_p){--bg:#fff;--fg:#000;--muted:#444;--panel:#fff;--soft:#f2f2f2;--line:#ccc;--accent:#1f6f54;--ok:#1f7a3f;--warn:#8a5200;--no:#b3261e;--ok-bg:#e5f3e9;--warn-bg:#fbefd9;--no-bg:#fbe5e3;color-scheme:light}
}
.cmp-wrap{overflow-x:auto;margin-top:6px}
.cmp{border-collapse:collapse;font-size:13px;min-width:100%}
.cmp th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px 6px 0;white-space:nowrap;vertical-align:top;position:sticky;left:0;background:var(--panel)}
.cmp td{padding:6px 8px;border-left:1px solid var(--line);vertical-align:top;min-width:9em;font-variant-numeric:tabular-nums}
.cmp tr{border-top:1px solid var(--line)}
.actions{gap:8px}
@media print{.noprint{display:none}}
.chk-ok{background:var(--ok-bg);color:var(--ok)}
.kd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:14px}
.kd input{width:6em;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.kd output{font-family:var(--f-mono);font-weight:500}
.chk-no{background:var(--no-bg);color:var(--no)} .chk-warn{background:var(--warn-bg);color:var(--warn)}
.flag{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Čestica ZG</h1>
    <input id="q" type="search" placeholder="Adresa, npr. Ilica 200" autocomplete="off">
    <button class="ib" id="go" type="button">Traži</button>
    <button class="ib" id="me" type="button" aria-label="Moja lokacija">◎</button>
    <button class="ib" id="favBtn" type="button" aria-label="Spremljene čestice">★</button>
  </header>
  <main>
    <div id="map"></div>
    <div class="layers">
      <label><input type="checkbox" id="lyrSat"> Satelit</label>
      <label><input type="checkbox" id="lyrNam" checked> Namjena</label>
    </div>
    <section id="sheet" aria-live="polite">
      <p class="eyebrow">Kako radi</p>
      <p class="hint">Dodirni zemljište na karti (zumiraj do razine ulice). Dobit ćeš katastarsku česticu, namjenu iz prostornog plana i urbano pravilo GUP-a s uvjetima gradnje.</p>
    </section>
  </main>
</div>
<script>
const RULES = {"1.1.": {"clanak": "58", "naziv": "Zaštita i očuvanje povijesnih graditeljskih cjelina", "prostori": "Gornji grad i Kaptol s kontaktnim područjem.", "opca": ["zaštita, održavanje i uređenje povijesnih cjelina;", "zadržavanje postojeće urbane matrice bez uvođenja novih ulica;", "gradnja i uređenje prostora prema detaljno utvrđenim uvjetima;", "prigodom ulične gradnje dubinu građevine ili dvorišnih krila poluugrađenih i ugrađenih građevina uskladiti s pretežitom dubinom gradnje poteza;", "zadržavanje raznolikosti namjena i postojećeg omjera građevina namijenjenih za stanovanje, javne i društvene i druge namjene;", "zaštita stanovanja; moguća prenamjena samo substandardnoga stambenog prostora u neku drugu namjenu (podrumski prostori, prostori u dvorišnim izvorno pomoćnim građevinama i sl.);", "u Vlaškoj i Tkalčićevoj ulici zadržavanje mješovitosti namjena i uređenje podruma i prvih dviju etaža uličnih i dvorišnih građevina te dvorišnih otvorenih prostora za javno korištenje;", "onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih;", "čuvanje postojećih slobodnih površina i obvezna zaštita kvalitetnih pojedinačnih stabala;", "onemogućavanje provoza vozila kroz povijesni prostor;", "stimuliranje pristupa javnim prometom primjerenim povijesnom prostoru;", "za stambenu namjenu najviše 1 PGM/1 stan;", "onemogućavanje gradnje javnih garaža;", "provedba javnih arhitektonskih natječaja prema članku 6. točki 23. i članku 99. ovih odredbi;", "iznimno, na lokaciji Palače Jelačić u Demetrovoj ulici za rekonstrukciju, dogradnju, nadogradnju i novu gradnju građevina i sadržaja javne namjene nije potrebno provesti javni arhitektonski natječaj iz članka 6. točke 23. i članka 99. ove odluke;", "iznimno, omogućuje se realizacija javne namjene \"Muzej osjeta Zagreb\" (revitalizacija postojećeg tunela Grič), uz uvjet da se realizira unutar obuhvata tunela Grič, bez kompleksnijih zahvata i izgradnje, osobito na prostoru Vranicanijeve poljane koja je arheološki lokalitet;", "iznimno, omogućuje se realizacija Projekta Dolac;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke."], "zone": [], "tekst": ["(1) Zaštita i očuvanje povijesnih graditeljskih cjelina (1.1.) - prostori: Gornji grad i Kaptol s kontaktnim područjem.", "(2) Opća pravila: 1. zaštita, održavanje i uređenje povijesnih cjelina; 2. zadržavanje postojeće urbane matrice bez uvođenja novih ulica; 3. gradnja i uređenje prostora prema detaljno utvrđenim uvjetima; 4. prigodom ulične gradnje dubinu građevine ili dvorišnih krila poluugrađenih i ugrađenih građevina uskladiti s pretežitom dubinom gradnje poteza; 5. zadržavanje raznolikosti namjena i postojećeg omjera građevina namijenjenih za stanovanje, javne i društvene i druge namjene; 6. zaštita stanovanja; moguća prenamjena samo substandardnoga stambenog prostora u neku drugu namjenu (podrumski prostori, prostori u dvorišnim izvorno pomoćnim građevinama i sl.); 7. u Vlaškoj i Tkalčićevoj ulici zadržavanje mješovitosti namjena i uređenje podruma i prvih dviju etaža uličnih i dvorišnih građevina te dvorišnih otvorenih prostora za javno korištenje; 8. onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih; 9. čuvanje postojećih slobodnih površina i obvezna zaštita kvalitetnih pojedinačnih stabala; 10. onemogućavanje provoza vozila kroz povijesni prostor; 11. stimuliranje pristupa javnim prometom primjerenim povijesnom prostoru; 12. za stambenu namjenu najviše 1 PGM/1 stan; 13. onemogućavanje gradnje javnih garaža; 14. provedba javnih arhitektonskih natječaja prema članku 6. točki 23. i članku 99. ovih odredbi; 15. iznimno, na lokaciji Palače Jelačić u Demetrovoj ulici za rekonstrukciju, dogradnju, nadogradnju i novu gradnju građevina i sadržaja javne namjene nije potrebno provesti javni arhitektonski natječaj iz članka 6. točke 23. i članka 99. ove odluke; 16. iznimno, omogućuje se realizacija javne namjene \"Muzej osjeta Zagreb\" (revitalizacija postojećeg tunela Grič), uz uvjet da se realizira unutar obuhvata tunela Grič, bez kompleksnijih zahvata i izgradnje, osobito na prostoru Vranicanijeve poljane koja je arheološki lokalitet; 17. iznimno, omogućuje se realizacija Projekta Dolac; 18. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke."]}, "1.2.": {"clanak": "59", "naziv": "Zaštita, uređenje i dogradnja u povijesnim graditeljskim cjelinama", "prostori": "Donji grad - zapad, Donji grad - istok, Ilica - Britanski trg, Vlaška - Petrova, Maksimirska - Petrova i drugi prema grafičkom prikazu.", "opca": ["zaštita, održavanje, uređenje i dogradnja povijesnih cjelina;", "zadržavanje postojeće urbane matrice i tipologije gradnje bez dijeljenja blokova novim ulicama;", "zadržavanje postojeće raznolikosti visina uličnih građevina, posebno imajući u vidu vrijednost i oblikovnu dovršenost građevina;", "onemogućavanje gradnje u parkovima i na drugim kvalitetnim javnim zelenim površinama i ispod njih;", "čuvanje i obnova postojećih drvoreda; mogućnost sadnje novih drvoreda;", "neizgrađene kvalitetne zelene površine i kvalitetna pojedinačna stabla obvezno sačuvati;", "uređenje dvorišta tako da je u unutrašnjosti bloka moguća rekonstrukcija, gradnja zamjenskih građevina i gradnja novih građevina i garaža za potrebe bloka; kod gradnje zamjenskih i novih građevina, u svrhu sanacije i afirmacije vrijednosti bloka u cjelini, obvezno je cjelovito rješenje građevne čestice; moguće je zadržati i planirati više građevina različitih namjena na istoj građevnoj čestici; pristup s javnoprometne površine preko ulične građevne čestice, odnosno kroz kolni prolaz ulične građevine;", "gradnja javnih garaža nije moguća na prostoru Gornjeg grada i Kaptola i na prostoru omeđenom ulicama: Vlaškom, Bauerovom, Trgom Petra Krešimira IV., Hrvojevom, Borninom, Domagojevom, Branimirovom, Ul. Grgura Ninskog, južnim rubom Botaničkog vrta, Runjaninovom, Vodnikovom, Savskom, Ul. I. Kršnjavoga, Kačićevom i Ilicom, radi ograničenja motornog prometa u središtu grada. U toj zoni moguća je gradnja garaža prema odredbama članka 39. ovih odredbi, odnosno prema smjernicama za izradu predmetnog UPU-a;", "unutar blokova Donjeg grada između Ulice Republike Austrije i Heinzelove ulice garaže se mogu graditi s najviše dvije podzemne etaže; za gradnju garaža s više od 100 PGM obavezna je provjera mogućnosti i utjecaja na okolni prostor prethodnom izradom prometne studije;", "iznimno, za blokove označene na grafičkom prikazu 4a. Urbana pravila, 4b. Procedure urbano prostornog uređenja i 4d. Nepokretna kulturna dobra, prostorno rješenje odredit će se urbanističkim planom uređenja. Za te se blokove omogućuje razrada prostornih rješenja detaljnijom valorizacijom - detaljna konzervatorska podloga za cjelinu bloka, koju izrađuje nadležno tijelo zaštite (članak 92. ove odluke) uz uvjet zadržavanja pretežite visine u odnosu na blok tako da kisn ne bude veći od 3,0 odnosno postojeći ukoliko je veći.", "Za sve blokove Donjeg grada na kojima se planiraju kompleksni zahvati uređenja kojima se bitno mijenja njihova postojeća prostorna i građevinska struktura / morfologija bloka potrebno je izraditi urbanistički plan uređenja temeljem urbanističkih programskih smjernica koje izrađuje Zavod (uz uvjet da kisn ne bude veći od 3,0, odnosno postojeći ukoliko je veći);", "do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija uličnih građevina prema odredbama ovog članka, a u dvorištima rekonstrukcija građevina u postojećim gabaritima i gradnja novih građevina sukladno članku 104. ovih odredbi i prema pravilima za dvorišnu gradnju ov rostoru Gornjeg grada i Kaptola i na prostoru omeđenom ulicama: Vlaškom, Bauerovom, Trgom Petra Krešimira IV., Hrvojevom, Borninom, Domagojevom, Branimirovom, Ul. Grgura Ninskog, južnim rubom Botaničkog vrta, Runjaninovom, Vodnikovom, Savskom, Ul. I. Kršnjavoga, Kačićevom i Ilicom, radi ograničenja motornog prometa u središtu grada. U toj zoni moguća je gradnja garaža prema odredbama članka 39. ovih odredbi, odnosno prema smjernicama za izradu predmetnog UPU-a; 9. unutar blokova Donjeg grada između Ulice Republike Austrije i Heinzelove ulice garaže se mogu graditi s najviše dvije podzemne etaže; za gradnju garaža s više od 100 PGM obavezna je provjera mogućnosti i utjecaja na okolni prostor prethodnom izradom prometne studije; 10. iznimno, za blokove označene na grafičkom prikazu 4a. Urbana pravila, 4b. Procedure urbano prostornog uređenja i 4d. Nepokretna kulturna dobra, prostorno rješenje odredit će se urbanističkim planom uređenja. Za te se blokove omogućuje razrada prostornih rješenja detaljnijom valorizacijom - detaljna konzervatorska podloga za cjelinu bloka, koju izrađuje nadležno tijelo zaštite (članak 92. ove odluke) uz uvjet zadržavanja pretežite visine u odnosu na blok tako da kisn ne bude veći od 3,0 odnosno postojeći ukoliko je veći. 11. Za sve blokove Donjeg grada na kojima se planiraju kompleksni zahvati uređenja kojima se bitno mijenja njihova postojeća prostorna i građevinska struktura / morfologija bloka potrebno je izraditi urbanistički plan uređenja temeljem urbanističkih programskih smjernica koje izrađuje Zavod (uz uvjet da kisn ne bude veći od 3,0, odnosno postojeći ukoliko je veći); 12. do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija uličnih građevina prema odredbama ovog članka, a u dvorištima rekonstrukcija građevina u postojećim gabaritima i gradnja novih građevina sukladno članku 104. ovih odredbi i prema pravilima za dvorišnu gradnju ovog članka; 13. urbanistički planovi uređenja izrađuju se prema općim pravilima ovog članka, detaljnim konzervatorskim podlogama i programskim smjernicama za svaki od navedenih blokova. Uređenje prostora i opseg mogućeg zahvata definirat će se detaljnim konzervatorskim propozicijama za izradu urbanističkog plana uređenja, a grafički prikaz - kategorizacija građevnog fonda sastavni je dio konzervatorske podloge za izradu urbanističkog plana uređenja; 14. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke.", "(3) Programske smjernice: 1. UPU Ilica - Medulićeva - Deželićeva - Kačićeva Planom utvrditi namjene u okvirima mješovite namjene gradskog središta (članak 10.a); visina prema detaljnim pravilima ovog članka; revitalizacija dvorišta; prenamjene u prostore javnog korištenja - trgovine, ugostiteljstvo, kultura i slično; rekonstrukcije, rušenje i nova gradnja uz prethodnu integralnu valorizaciju stanja te povijesne i funkcionalne vrijednosti bloka, odnosno pojedinih građevina; pješački prolazi - otvoreni i natkriveni osobito u sjevernom dijelu unutrašnjosti bloka; zaštita i uređenje dječje ustanove s igralištima i postojećeg zelenila u južnom dijelu bloka; najveći kisn uskladiti s pretežitim kisn bloka; uz obveznu i prioritetnu izradu detaljne konzervatorske podloge ili utvrđivanje sustava mjera zaštite nepokretnih kulturnih dobara. 2. UPU Ilica - Frankopanska - Dalmatinska - Medulićeva Planom utvrditi namjene u okvirima mješovite namjene gradskog središta (članak 10.a); zadržavanje i uređenje kazališta i okolnog prostora s pješačkom vezom prema Ilici; revitalizacija dvorišta prenamjenom u prostore javnog korištenja - trgovine, ugostiteljstvo, kultura i slično; rekonstrukcije, rušenje i nova gradnja uz prethodnu integralnu valorizaciju stanja te povijesne i funkcionalne vrijednosti bloka, odnosno pojedinih građevina; prolazi kroz blok - otvoreni i isn uličnog poteza, ali ne može biti veći od 3,0, osim za javnu i društvenu namjenu prema članku 12. ove odluke; 7. najmanji udio prirodnog terena je 20% površine građevne čestice kod gradnje nove građevine, osim za uglovne čestice; 8. dubinu ulične građevine ili dvorišnih krila uskladiti s pretežitom dubinom gradnje uličnog poteza (predmetna strana ulice između dva prometna križanja ili potez određen 75 m lijevo i desno od mjesta zahvata); dvorišna krila ugrađenih građevina ne mogu biti udaljena manje od međe postojećih dvorišnih udaljenosti krila susjedne građevine, ali ne manje od 3 m; 9. najveću visinu ulične građevine uskladiti s pretežitom visinom u uličnom potezu; 10. najveća visina dvorišne građevine je četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; iznimno, za građevine javne i društvene namjene četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat, uz uvjet zadržavanja pretežite visine u odnosu na blok; 11. kod izgradnje novih građevina i rekonstrukcije postojećih uličnih građevina, u pravilu, u prizemlju planirati sadržaje u javnom korištenju (sadržaji kojima se osigurava intenzivno korištenje prizemlja, npr. trgovačka, ugostiteljska, poslovna, javna i društvena namjena i slično); 12. pri gradnji nove dvorišne građevine razmak između dvorišne građevine i ulične građevine mora biti najmanje jednak zbroju polovica njihovih visina; ova odredba primjenjuje se i pri gradnji nove građevine u unutrašnjosti bloka; 13. parkirališna mjesta za stambenu uličnu i dvorišnu gradnju osigurati, u pravilu, u bloku, prioritet podzemno, i to najviše1 PGM/1 stan; 14. građevni pravac ulične građevine je postojeći, osim kad se zadržava postojeće kvalitetno zelenilo; 15. ulične građevine su ugrađene, osim, iznimno, ako je razmak potreban prema lokalnim uvjetima; razmak između ulične i nove dvorišne građevine ne može biti manji od zbroja polovica njihovih visina do vijenca; 16. rekonstrukcija uličnih građevina se izvod ospodarske namjene (bilo kao samostalnih ili u sklopu stambene građevine), osim za dnevnu opskrbu, osobne usluge i manje uredske prostore;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "u svrhu zaštite urbaniteta, posebno uz formirane ulice, nije dozvoljeno uklanjanje postojećih građevina u svrhu gradnje parkirališta i/ili garaža kao isključive namjene; rampe za ulaz u garažu, dizala za automobile i sl. smjestiti unutar gabarita osnovne građevine;", "uređenje i ograđivanje građevne čestice, u skladu s uvjetima iz članka 35. ovih odredbi."], "zone": [{"zona": "u zoni stambene i mješovite namjene", "items": ["zadržavaju se oblik i veličina postojećih građevnih čestica; ne mogu se dijeliti postojeće građevne čestice radi oblikovanja dviju ili više građevnih čestica; iznimno dozvoljeno je spajanje manjih građevnih čestica na način da novoformirana građevna čestica oblikom i veličinom bude u skladu s ostalim građevnim česticama u ulici prema lokalnim uvjetima;", "izgrađenost građevne čestice određena je postojećom izgrađenošću okolnih građevnih čestica, ali ne može biti veća od 30% za slobodnostojeće, 40% za poluugrađene i 50% za ugrađene građevine; u gradnji interpolacija, rekonstrukciji, dogradnji i nadogradnji dubina tlocrta građevine može biti u skladu s pretežitom dubinom uličnog poteza u skladu s lokalnim uvjetima i vrijednostima prostora, odnosno do najviše 12,0 m ukoliko je dubina manja;", "najveća visina tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat;", "najveći kisn 1,0; najveći GBP 400 m²; najviše tri samostalne uporabne jedinice; u rekonstrukciji i zamjenskoj gradnji može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja;", "u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja;", "najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "obvezno zadržavanje postojećeg predvrta te izvedba predvrta u skladu s lokalnim uvjetima u ulici;", "najmanje 1 PGM/1 stan, obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), druge namjene prema normativima ove odluke;", "zadržava se kontinuirani građevni pravac postojećih građevina;", "najmanja udaljenost građevine od međe susjedne građevne čestice 3,0 m osim od međa na koju je prislonjena; postojeća manja udaljenost može se zadržati u rekonstrukciji;", "arhitektonsko oblikovanje građevine mora biti usklađeno s okolnom gradnjom; poluugrađene građevine građene kao dvojne te ugrađene građevine koje su dio planiranih nizova moraju biti oblikovno usklađene (visina vijenca, građevinska linija, oblik krova i dr.) s ostalim građevinama s kojima čine cjelinu; postojeće i zatečene zgrade u prostoru koje odudaraju od izvornog oblikovanja niza ili uličnog poteza ne mogu se uzimati kao referentne točke s kojima se usklađuju ostale građevine;", "iznimno, za naselje Dr. Ante Starčević u Dubravi, rekonstrukcija u gabaritima prema izvornom konceptu naselja, maksimalna dubina građevine iznosi 15,0 m (odnosi se na prizemni aneks, prema izvornom konceptu naselja); za naselje individualne izgradnje sjeverno od Borongajske ceste na Volovčici maksimalna dubina građevina je 12,0 m, a za područje Šćitarjevske ulice maksimalna dubina građevina je 16,0 m; ostali parametri prema detaljnim pravilima;", "iznimno, na prostoru Trnja, u Cvjetnom naselju, koje je zaštićeno kao povijesna graditeljska cjelina, gradnja novih i rekonstrukcija postojećih građevina moguća je prema konzervatorskim uvjetima nadležnog tijela zaštite; obavezno je zadržavanje postojeće parcelacije; gradnja slobodnostojećih građevina; obavezno je zadržavanje predvrta, visokog zelenila i transparentne ograde; najmanja površina prirodnog terena je 60% površine građevne čestice; najveća izgrađenost građevne čestice je 25%; najveći kisn 0,5; najveći GBP 400 m²; najmanja površina građevne čestice je 750 m²; u rekonstrukciji i gradnji zamjenskih građevina na građevnim česticama manjim od propisanih može se zadržati postojeća izgrađenost, visina, GBP i broj samostalnih uporabnih jedinica bez daljnjeg povećanja; ostali uvjeti prema detaljnim pravilima;", "iznimno, na prostoru Trnja, u naselju Kanal, uz ulični potez na sjevernoj strani Supilove i zapadnoj strani Zoranićeve ulice omogućava se gradnja građevina visine četiri nadzemne etaže, pri čemu je četvrta etaža oblikuje kao uvučeni kat; najveća izgrađenost je postojeća; najveći kisn je 2,0 za ugrađene građevine, a 1,5 za slobodnostojeće i poluugrađene građevine; najveći GBP je 450 m²; obavezno rješavanje parkirališnih potreba na građevnoj čestici osim za postojeće ugrađene građevine; građevina može imati najviše četiri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez povećanja; ostali parametri prema detaljnim pravilima;", "iznimno, na prostoru Trnja, u naselju Kanal, uz ulični potez Ul. grada Vukovara, Av. M. Držića i Trga L. Botića omogućava se gradnja građevina visine četiri nadzemne etaže pri čemu je četvrta etaža potkrovlje ili uvučeni kat; najveća izgrađenost građevnih čestica 40%, iznimno izgrađenost uglovnih građevnih čestica do 60%; kolne rampe odnosno ulaz u podzemnu garažu smjestiti unutar gabarita osnovne građevine; najveći kisn je 1,5; najveći GBP 500 m²; građevina može imati najviše četiri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema detaljnim pravilima;", "iznimno, na prostoru Trnja, u Murterskom naselju (omeđenom Rapskom, Pašmanskom, Brijunskom i Kornatskom ul.) obavezno je zadržavanje postojeće parcelacije; gradnja poluugrađenih i slobodnostojećih građevina; ne mogu se spajati niti dijeliti postojeće građevne čestice; obavezno je zadržavanje predvrta i visokog zelenila; visina građevine je dvije nadzemne etaže; obavezno je oblikovno usklađenje poluugrađenih građevina; omogućava se gradnja potkrovlja bez nadozida ukoliko i susjedna građevina na koju se prislanja već ima izgrađeno potkrovlje; najveća izgrađenost građevne čestice za slobodnostojeće građevine je 30%, za poluugrađene građevine je 35%; najveći kisn 0,7; najveći GBP 150 m² za poluugrađene, a 300 m² za slobodnostojeće; najmanja površina prirodnog terena je 40% površine građevne čestice; najmanja udaljenost građevine od međa je 3,0 m osim od međe na koju je prislonjena; obavezan smještaj vozila na građevnim česticama za prvi red gradnje uz ulicu; građevine mogu imati jednu uporabnu jedinicu; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema detaljnim pravilima;", "iznimno, za naselje I. hrvatske štedionice obavezno se izvodi kosi krov prema ulici koji mora biti usklađen s izvornom visinom vijenca i sljemena uličnog poteza; ostali parametri prema detaljnim pravilima, a za dio naselja južno od Krapinske ulice i prema konzervatorskim uvjetima nadležnog tijela zaštite;", "iznimno, na prostoru Maksimira i Peščenice, sjeverno i južno od Zvonimirove, obavezno zadržavanje predvrta i postojeće parcelacije, najveća visina je tri nadzemne etaže, pri čemu je treća etaža potkrovlje; najveći GBP je 400 m²; najveća izgrađenost uglovnih građevnih čestica je do 50%; najmanja površina prirodnog terena na uglovnim česticama je 20%, a na ostalim česticama 40% površine građevne čestice; građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema općim i detaljnim pravilima te prema uvjetima nadležnog tijela zaštite;", "iznimno, neposredno uz Heinzelovu, Zvonimirovu i Kolakovu ulicu u Dubravi, četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; najveća izgrađenost građevnih čestica je 40%; najveći GBP je 500 m²; obavezno zadržavanje i sadnja visokog zelenila na čestici, posebno u predvrtu; najmanji prirodni teren je 30% površine građevne čestice; građevina može imati najviše četiri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema općim i detaljnim pravilima te prema uvjetima nadležnog tijela zaštite;", "iznimno, na prostoru Ljubljanice i uličnog poteza Baštijanove ulice, dozvoljena je najveća visina četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; ostali uvjeti prema detaljnim pravilima;", "iznimno, za prostor Novog Retkovca urbana pravila se utvrđuju prema elaboratu \"Novi Retkovec - propozicije za gradnju i uređenje prostora\", Zagreb, siječanj 1999., što ga je izradio Gradski zavod za planiranje razvoja Grada i zaštitu okoliša;", "iznimno, za prostor zaštićene graditeljske cjeline naselja Istrana omogućuje se rekonstrukcija u postojećim gabaritima;", "iznimno, za naselje Trstik, najveća visina građevina je četiri nadzemne etaže, pri čemu se četvrta oblikuje kao potkrovlje, usklađeno s postojećom gradnjom u nizu; ostali uvjeti prema detaljnim pravilima;", "opća i detaljna pravila primjenjuju se i na gradnju građevina svih namjena osim javne i društvene koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene;"], "key": {"izgradenost": "izgrađenost građevne čestice određena je postojećom izgrađ rajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 6. u svrhu zaštite urbaniteta, posebno uz formirane ulice, nije dozvoljeno uklanjanje postojećih građevina u svrhu gradnje parkirališta i/ili garaža kao isključive namjene; rampe za ulaz u garažu, dizala za automobile i sl. smjestiti unutar gabarita osnovne građevine; 7. uređenje i ograđivanje građevne čestice, u skladu s uvjetima iz članka 35. ovih odredbi.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. zadržavaju se oblik i veličina postojećih građevnih čestica; ne mogu se dijeliti postojeće građevne čestice radi oblikovanja dviju ili više građevnih čestica; iznimno dozvoljeno je spajanje manjih građevnih čestica na način da novoformirana građevna čestica oblikom i veličinom bude u skladu s ostalim građevnim česticama u ulici prema lokalnim uvjetima; 2. izgrađenost građevne čestice određena je postojećom izgrađenošću okolnih građevnih čestica, ali ne može biti veća od 30% za slobodnostojeće, 40% za poluugrađene i 50% za ugrađene građevine; u gradnji interpolacija, rekonstrukciji, dogradnji i nadogradnji dubina tlocrta građevine može biti u skladu s pretežitom dubinom uličnog poteza u skladu s lokalnim uvjetima i vrijednostima prostora, odnosno do najviše 12,0 m ukoliko je dubina manja; 3. najveća visina tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 4. najveći kisn 1,0; najveći GBP 400 m²; najviše tri samostalne uporabne jedinice; u rekonstrukciji i zamjenskoj gradnji može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 5. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; 6. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 7. obvezno zadržavanje postojećeg predvrta te izvedba predvrta u skladu s lokalnim uvjetima u ulici; 8. najmanje 1 PGM/1 stan, obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), druge namjene prema normativima ove odluke; 9. zadržava se kontinuirani građevni pravac postojećih građevina; 10. najmanja udaljenost građevine od međe susjedne građevne čestice 3,0 m osim od međa na koju je prislonjena; postojeća manja udaljenost može se zadržati u rekonstrukciji; 11. arhitektonsko oblikovanje građevine mora biti usklađeno s okolnom gradnjom; poluugrađene građevine građene kao dvojne te ugrađene građevine koje su dio planiranih nizova moraju biti oblikovno usklađene (visina vijenca, građevinska linija, oblik krova i dr.) s ostalim građevinama s kojima čine cjelinu; postojeće i zatečene zgrade u prostoru koje odudaraju od izvornog oblikovanja niza ili uličnog poteza ne mogu se uzimati kao referentne točke s kojima se usklađuju ostale građevine; 12. iznimno, za naselje Dr. Ante Starčević u Dubravi, rekonstrukcija u gabaritima prema izvornom konceptu naselja, maksimalna dubina građevine iznosi 15,0 m (odnosi se na prizemni aneks, prema izvornom konceptu naselja); za naselje individualne izgradnje sjeverno od Borongajske ceste na Volovčici maksimalna dubina građevina je 12,0 m, a za područje Šćitarjevske ulice maksimalna dubina građevina je 16,0 m; ostali parametri prema detaljnim pravilima; 13. iznimno, na prostoru Trnja, u Cvjetnom naselju, koje je zaštićeno kao povijesna graditeljska cjelina, gradnja novih i rekonstrukcija postojećih građevina moguća je prema konzervatorskim uvjetima nadležnog tijela zaštite; obavezno je zadržavanje postojeće parcelacije; gradnja slobodnostojećih građevina; obavezno je zadržavanje predvrta, visokog zelenila i transparentne ograde; najmanja površina prirodnog terena je 60% površine građevne čestice; najveća izgrađenost građevne čestice je 25%; najveći kisn 0,5; najveći GBP 400 m²; najmanja površina građevne čestice je 750 m²; u rekonstrukciji i gradnji zamjenskih građevina na građevnim česticama manjim od propisanih može se zadržati postojeća izgrađenost, visina, GBP i broj samostalnih uporabnih jedinica bez daljnjeg povećanja; ostali uvjeti prema detaljnim pravilima; 14. iznimno, na prostoru Trnja, u naselju Kanal, uz ulični potez na sjevernoj strani Supilove i zapadnoj strani Zoranićeve ulice omogućava se gradnja građevina visine četiri nadzemne etaže, pri čemu je četvrta etaža oblikuje kao uvučeni kat; najveća izgrađenost je postojeća; najveći kisn je 2,0 za ugrađene građevine, a 1,5 za slobodnostojeće i poluugrađene građevine; najveći GBP je 450 m²; obavezno rješavanje parkirališnih potreba na građevnoj čestici osim za postojeće ugrađene građevine; građevina može imati najviše četiri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez povećanja; ostali parametri prema detaljnim pravilima; 15. iznimno, na prostoru Trnja, u naselju Kanal, uz ulični potez Ul. grada Vukovara, Av. M. Držića i Trga L. Botića omogućava se gradnja građevina visine četiri nadzemne etaže pri čemu je četvrta etaža potkrovlje ili uvučeni kat; najveća izgrađenost građevnih čestica 40%, iznimno izgrađenost uglovnih građevnih čestica do 60%; kolne rampe odnosno ulaz u podzemnu garažu smjestiti unutar gabarita osnovne građevine; najveći kisn je 1,5; najveći GBP 500 m²; građevina može imati najviše četiri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema detaljnim pravilima; 16. iznimno, na prostoru Trnja, u Murterskom naselju (omeđenom Rapskom, Pašmanskom, Brijunskom i Kornatskom ul.) obavezno je zadržavanje postojeće parcelacije; gradnja poluugrađenih i slobodnostojećih građevina; ne mogu se spajati niti dijeliti postojeće građevne čestice; obavezno je zadržavanje predvrta i visokog zelenila; visina građevine je dvije nadzemne etaže; obavezno je oblikovno usklađenje poluugrađenih građevina; omogućava se gradnja potkrovlja bez nadozida ukoliko i susjedna građevina na koju se prislanja već ima izgrađeno potkrovlje; najveća izgrađenost građevne čestice za slobodnostojeće građevine je 30%, za poluugrađene građevine je 35%; najveći kisn 0,7; najveći GBP 150 m² za poluugrađene, a 300 m² za slobodnostojeće; najmanja površina prirodnog terena je 40% površine građevne čestice; najmanja udaljenost građevine od međa je 3,0 m osim od međe na koju je prislonjena; obavezan smještaj vozila na građevnim česticama za prvi red gradnje uz ulicu; građevine mogu imati jednu uporabnu jedinicu; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema detaljnim pravilima; 17. iznimno, za naselje I. hrvatske štedionice obavezno se izvodi kosi krov prema ulici koji mora biti usklađen s izvornom visinom vijenca i sljemena uličnog poteza; ostali parametri prema detaljnim pravilima, a za dio naselja južno od Krapinske ulice i prema konzervatorskim uvjetima nadležnog tijela zaštite; 18. iznimno, na prostoru Maksimira i Peščenice, sjeverno i južno od Zvonimirove, obavezno zadržavanje predvrta i postojeće parcelacije, najveća visina je tri nadzemne etaže, pri čemu je treća etaža potkrovlje; najveći GBP je 400 m²; najveća izgrađenost uglovnih građevnih čestica je do 50%; najmanja površina prirodnog terena na uglovnim česticama je 20%, a na ostalim česticama 40% površine građevne čestice; građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema općim i detaljnim pravilima te prema uvjetima nadležnog tijela zaštite; 19. iznimno, neposredno uz Heinzelovu, Zvonimirovu i Kolakovu ulicu u Dubravi, četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; najveća izgrađenost građevnih čestica je 40%; najveći GBP je 500 m²; obavezno zadržavanje i sadnja visokog zelenila na čestici, posebno u predvrtu; najmanji prirodni teren je 30% površine građevne čestice; građevina može imati najviše četiri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenskih građevina može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; ostali uvjeti prema općim i detaljnim pravilima te prema uvjetima nadležnog tijela zaštite; 20. iznimno, na prostoru Ljubljanice i uličnog poteza Baštijanove ulice, dozvoljena je najveća visina četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; ostali uvjeti prema detaljnim pravilima; 21. iznimno, za prostor Novog Retkovca urbana pravila se utvrđuju prema elaboratu \"Novi Retkovec - propozicije za gradnju i uređenje prostora\", Zagreb, siječanj 1999., što ga je izradio Gradski zavod za planiranje razvoja Grada i zaštitu okoliša; 22. iznimno, za prostor zaštićene graditeljske cjeline naselja Istrana omogućuje se rekonstrukcija u postojećim gabaritima; 23. iznimno, za naselje Trstik, najveća visina građevina je četiri nadzemne etaže, pri čemu se četvrta oblikuje kao potkrovlje, usklađeno s postojećom gradnjom u nizu; ostali uvjeti prema detaljnim pravilima; 24. opća i detaljna pravila primjenjuju se i na gradnju građevina svih namjena osim javne i društvene koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene; b. u zoni javne i društvene namjene i sportsko-rekreacijske namjene - sport s gradnjom: 1. gradnja i rekonstrukcija prema programu i normativima osnovne namjene i vrijednostima prostora; 2. najveća izgrađenost građevne čestice je 30%; 3. najveća visina četiri nadzemne etaže, pri čemu je četvrta etaža potkrovlje bez nadozida; 4. najmanji prirodni teren 40% površine građevne čestice, ne namjene i vrijednostima prostora; 2. najveća izgrađenost građevne čestice je 30%; 3. najveća visina četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; 4. najmanji prirodni teren je 40% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen; 5. u rekonstrukciji postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren može biti postojeći; 6. gradnja novih građevina javne i društvene namjene prema javnom arhitektonskom natječaju u skladu s člankom 99. ovih odredbi."]}, "1.6.": {"clanak": "63", "naziv": "Zaštita i uređenje dovršenih naselja i dovršenih dijelova naselja", "prostori": "Voltino, Srednjaci, Jarun, Gredice, Knežija, Rudeš, Vrbani, Prečko, Špansko, Malešnica, Gajnice, Zapruđe, Savski gaj - sjever, Trnsko, Siget, Središće - istok, Sopot, Utrina, Travno, Sloboština - istok, Dugave, Ravnice, Volovčica, Folnegovićevo, Klaka, Grana, Studentski grad, Poljanice, Borovje, Poljane, Sigečica, Savica, Kanal, Martinovka, Brezje, Cvjetno naselje, prostor južno od Autobusnog kolodvora, Remetinečki gaj i drugi prema grafičkom prikazu.", "opca": ["zaštita, uređenje i urbana obnova urbanističkih cjelina naselja pretežito visoke gradnje;", "očuvanje izvorne tipologije i oblikovanja građevina, elemenata identiteta i slike naselja;", "poboljšavanje kvalitete stanovanja dovršetkom postojećih i uvođenjem novih sadržaja javne i društvene namjene iz članka 12. ovih odredbi, izgradnjom garaža za potrebe naselja i drugih sadržaja komunalnog standarda iz članka 22. ovih odredbi, sve u skladu s pravilima urbanističke struke uvažavajući koncepciju urbanističkog rješenja po kojoj je pretežiti dio naselja izgrađen;", "čuvanje i održavanje urbane matrice, javnih prostora i osobito postojećih vrijednih parkovnih površina naselja kao dijela zelenog infrastrukturnog sustava; vrijedne parkovne površine naselja prikazane , gradnja i rekonstrukcija omogućuje se prema urbanim pravilima iz članka 71. ove odluke;", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene;"], "key": {}}, {"zona": "u zoni javne i društvene i sportsko-rekreacijske namjene - sport s gradnjom", "items": ["gradnja građevina prema programu i normativima osnovne namjene i prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije;", "rekonstrukcija postojećih građevina prema programu i normativima osnovne namjene, u pravilu uz uvjet očuvanja izvornog arhitektonskog oblikovanja;", "potreban broj PGM-a osigurati na građevnoj čestici i/ili uz ulicu, uz obvezno očuvanje postojećih uređenih zelenih površina."], "key": {"pgm": "potreban broj PGM-a osigurati na građevnoj čestici i/ili uz ulicu, uz obvezno očuvanje postojećih uređenih zelenih površina."}}], "tekst": ["(1) Zaštita i uređenje dovršenih naselja i dovršenih dijelova naselja (1.6.) - prostori: Voltino, Srednjaci, Jarun, Gredice, Knežija, Rudeš, Vrbani, Prečko, Špansko, Malešnica, Gajnice, Zapruđe, Savski gaj - sjever, Trnsko, Siget, Središće - istok, Sopot, Utrina, Travno, Sloboština - istok, Dugave, Ravnice, Volovčica, Folnegovićevo, Klaka, Grana, Studentski grad, Poljanice, Borovje, Poljane, Sigečica, Savica, Kanal, Martinovka, Brezje, Cvjetno naselje, prostor južno od Autobusnog kolodvora, Remetinečki gaj i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita, uređenje i urbana obnova urbanističkih cjelina naselja pretežito visoke gradnje; 2. očuvanje izvorne tipologije i oblikovanja građevina, elemenata identiteta i slike naselja; 3. poboljšavanje kvalitete stanovanja dovršetkom postojećih i uvođenjem novih sadržaja javne i društvene namjene iz članka 12. ovih odredbi, izgradnjom garaža za potrebe naselja i drugih sadržaja komunalnog standarda iz članka 22. ovih odredbi, sve u skladu s pravilima urbanističke struke uvažavajući koncepciju urbanističkog rješenja po kojoj je pretežiti dio naselja izgrađen; 4. čuvanje i održavanje urbane matrice, javnih prostora i osobito postojećih vrijednih parkovnih površina naselja kao dijela zelenog infrastrukturnog sustava; vrijedne parkovne površine naselja prikazane su na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE UREĐENJE I ZAŠTITU PROSTORA - 4c. Zaštićeni i evidentirani dijelovi prirode - izmjene i dopune 2025. i štite se ovim planom; 5. gradnja građevina iz točke 3. ovog stavka moguća je uz očuvanje vrijednog zelenila, primjenom odgovarajućih odredbi iz točke 7. UVJETI UREĐENJA POSEBNO VRIJEDNIH I/ILI OSJETLJIVIH PODRUČJA I CJELINA ovih odredbi; 6. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 7. obvezno je uređenje prostora prema planu na snazi: UPU Groblje Stenjevec.", "(3) Detaljna pravila a. u zoni stambene, mješovite i poslovne namjene: 1. gradnja građevina iz stavka 2. točke 3. ovoga članka i rekonstrukcija građevina prema stavku 2. točke 2. ovoga članka; 2. povećane parkirališne potrebe u pravilu rješavati na postojećim parkirališnim površinama gradnjom nove etaže/etaža ako ne smeta stanovanju, odnosno gradnjom garaža u skladu s izvornim urbanističkim planom naselja; 3. kod rekonstrukcije postojećih građevina za nedostatak parkirališnogaražnih mjesta koja nije moguće osigurati na postojećim parkiralištima, moguće je izvršiti uplatu u skladu s člankom 39. ove odluke; 4. uređenje neuređenih javnih zelenih površina i igrališta za potrebe naselja u skladu s pravilima struke; 5. sanacija ravnog krova moguća je izvedbom blago skošenog krova nagiba do 6° skrivenoga u vijencu, da se ne naruši izvorno arhitektonsko oblikovanje građevine; 6. omogućava se zamjena dotrajalih građevina u okviru postojećih gabarita; 7. iznimno, za cjelovite prostore individualne izgradnje a koji su dijelovi starih naselja Gajnice, Špansko (između Korajčeve i Stulićeve ulice, između ulica Matije Divkovića i Dobriše Cesarića i duž ulica Špansko, Maršanići, Kaljska i Kotarnica), Malešnica, Rudeš, Prečko, Jarun te dio naselja Borongaj, Volovčica, gradnja i rekonstrukcija omogućuje se prema urbanim pravilima iz članka 71. ove odluke; 8. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene; b. u zoni javne i društvene i sportsko-rekreacijske namjene - sport s gradnjom: 1. gradnja građevina prema programu i normativima osnovne namjene i prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije; 2. rekonstrukcija postojećih građevina prema programu i normativima osnovne namjene, u pravilu uz uvjet očuvanja izvornog arhitektonskog oblikovanja; 3. potreban broj PGM-a osigurati na građevnoj čestici i/ili uz ulicu, uz obvezno očuvanje postojećih uređenih zelenih površina."]}, "1.7.": {"clanak": "64", "naziv": "Zaštita urbanog koncepta i uređenje prostora visoke i niske gradnje", "prostori": "Ulica grada Vukovara, Ulica Ivana Lučića (Sveučilišna avenija) i drugi prema grafičkom prikazu.", "opca": ["zaštita urbanog koncepta i uređenje urbanih poteza visoke i niske gradnje i uređenih javnih i zelenih površina;", "očuvanje izvornog oblikovanja arhitektonski vrijednih građevina moderne arhitekture, karakterističnih vizura, elemenata identiteta i slike poteza;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "područje izrazitih urbanih i ambijentalnih vrijednosti, unutar kojeg je definiran urbani koncept nastao na principima moderne štiti se ovim Planom, prikazan je na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025.."], "zone": [{"zona": "sve zone", "items": ["gradnja novih građevina preporuča se prema javnom arhitektonskom natječaju;", "parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih parkovnih površina;", "povećane parkirališne potrebe rješavati na postojećim parkirališnim površinama gradnjom nove etaže, ako ne smeta stanovanju;", "gradnja na građevnim česticama s postojećim kvalitetnim visokim zelenilom i na uređenim zelenim površinama nije moguća;", "rekonstrukcija postojećih građevina moguća je uz uvjet očuvanja osnovnoga arhitektonskog oblikovanja građevine;", "gradnja visokih objekata nije dopuštena uz Ulicu grada Vukovara unutar koridora definiranog postojećim građevinskim pravcima objekta Vukovarska 35 (arh. Galić) na sjeveru i Vukovarska 52 (arh. Fabris) na jugu; isto i za prostor Miramarske ulice definiran objektima Miramarska 22 i Miramarska 23;", "uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina osim dovršenja kompleksa Gradske uprave u zoni javne i društvene namjene; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti;", "radi afirmacije morfoloških i strukturalnih obilježja prostora uređenih prema regulatornoj osnovi iz 1953., koju karakterizira izgradnja soliternih objekata okruženih zelenilom, omogućuje se uređenje ovih prostora isključivo izgradnjom slobodnostojećih objekata s krajobrazno uređenim okolnim prostorom gdje preteže autohtono zelenilo."], "key": {}}], "tekst": ["(1) Zaštita urbanog koncepta i uređenje prostora visoke i niske gradnje (1.7.) - prostori: Ulica grada Vukovara, Ulica Ivana Lučića (Sveučilišna avenija) i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita urbanog koncepta i uređenje urbanih poteza visoke i niske gradnje i uređenih javnih i zelenih površina; 2. očuvanje izvornog oblikovanja arhitektonski vrijednih građevina moderne arhitekture, karakterističnih vizura, elemenata identiteta i slike poteza; 3. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 4. područje izrazitih urbanih i ambijentalnih vrijednosti, unutar kojeg je definiran urbani koncept nastao na principima moderne štiti se ovim Planom, prikazan je na kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025..", "(3) Detaljna pravila: 1. gradnja novih građevina preporuča se prema javnom arhitektonskom natječaju; 2. parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih parkovnih površina; 3. povećane parkirališne potrebe rješavati na postojećim parkirališnim površinama gradnjom nove etaže, ako ne smeta stanovanju; 4. gradnja na građevnim česticama s postojećim kvalitetnim visokim zelenilom i na uređenim zelenim površinama nije moguća; 5. rekonstrukcija postojećih građevina moguća je uz uvjet očuvanja osnovnoga arhitektonskog oblikovanja građevine; 6. gradnja visokih objekata nije dopuštena uz Ulicu grada Vukovara unutar koridora definiranog postojećim građevinskim pravcima objekta Vukovarska 35 (arh. Galić) na sjeveru i Vukovarska 52 (arh. Fabris) na jugu; isto i za prostor Miramarske ulice definiran objektima Miramarska 22 i Miramarska 23; 7. uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina osim dovršenja kompleksa Gradske uprave u zoni javne i društvene namjene; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti; 8. radi afirmacije morfoloških i strukturalnih obilježja prostora uređenih prema regulatornoj osnovi iz 1953., koju karakterizira izgradnja soliternih objekata okruženih zelenilom, omogućuje se uređenje ovih prostora isključivo izgradnjom slobodnostojećih objekata s krajobrazno uređenim okolnim prostorom gdje preteže autohtono zelenilo."]}, "1.8.": {"clanak": "65", "naziv": "Zaštita i uređenje cjelovitih kompleksa", "prostori": "SC Mladost, Studentski centar, RSC Jarun, kamp Jarun, Velesajam, Šestinski lagvić, groblje Mirogoj, Šalata, \"Ruđer Bošković\", Rebro, Svetice, Heinzelova, KB Dubrava, Grad mladih, Klaka, MUP - Savska, kompleks Pedagoške akademije, dvorana \"Vatroslav Lisinski\", Kemijski školski centar, Srednjoškolski centar u Držićevoj, NSK i HRT, MUP - Ilica, Brodarski institut, Rockefellerova i drugi prema grafičkom prikazu.", "opca": ["zaštita, čuvanje i uređenje vrijednosti kompleksa kao cjeline;", "očuvanje izvornog oblikovanja građevina, karakterističnih vizura, elemenata identiteta i slike kompleksa, kvalitetnih i uređenih zelenih površina (parkova i park - šuma);", "na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "obavezna je izrada planova UPU RSC Jarun i UPU Zagrebački velesajam, prema smjernicama iz stavka 4. ovog članka."], "zone": [{"zona": "sve zone", "items": ["gradnja (interpolacija) novih građevina samo iznimno, u funkciji osnovne namjene, uz zadržavanje uređenih zelenih površina i prema programu i normativima osnovne namjene;", "parkirališne potrebe rješavati prema normativima ove odluke; parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih zelenih površina;", "visinu građevine uskladiti s pretežitom visinom gradnje unutar kompleksa;", "gradnja (interpolacija) novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije;", "rekonstrukcija građevina moguća je u funkciji osnovne namjene i uz zadržavanje uređenih zelenih površina;", "iznimno, za prostor SRC Svetice promet u mirovanju moguće je rješavati u kontaktnoj zoni, a pri određivanju broja PGM može se računati na preklapanje u korištenju;", "pri rekonstrukciji i/ili gradnji novog nogometnog Stadiona u Maksimiru (unutar SRC Svetice) omogućuje se izgradnja i uređenje sportskih i pratećih sadržaja (poslovne namjene i trgovački kompleksi, ugostiteljsko-turističke, javne i društvene te druge namjene); pri čemu odnos sportskih i pratećih sadržaja nije propisan;", "iznimno, za prostor Zagrebačkog velesajma moguće je uvesti nove namjene koje svojim karakterom ne mijenjaju kvalitetu i organizaciju kompleksa kao urbanističke i arhitektonske cjeline;", "iznimno, unutar groblja Mirogoj moguća je gradnja upravne zgrade i proširivanje arkada prema javnom arhitektonskom natječaju, sukladno odredbama iz točke", "MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke, omogućiti optimalnu spomeničku prezentaciju nepokretnoga kulturnog dobra - graditeljskog sklopa Kompleksa groblja Mirogoj, odnosno uklanjanje uzroka i posljedica ugroženosti na prostoru duž zapadne strane Aleje Hermanna Bollea. Za prostor zapadno od Aleje Hermanna Bollea obuhvaćen urbanim pravilima 1.8. i 2.11. i prostornim međama kulturnog dobra, propisuje se obveza izrade urbanističkog plana uređenja UPU Hermanna Bollea - zapad;", "iznimno, zapadno od RSC Jarun moguće je uređenje kampa \"Jarun\", kapaciteta do 1000 posjetilaca, a sve prema posebnim propisima, uz prethodnu valorizaciju i maksimalno zadržavanje postojećeg zelenila; u dijelu površine moguće je uređenje i kamp odmorišta;", "uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti."], "key": {"pgm": "iznimno, za prostor SRC Svetice promet u mirovanju moguće je rješavati u kontaktnoj zoni, a pri određivanju broja PGM može se računati na preklapanje u korištenju;"}}], "tekst": ["(1) Zaštita i uređenje cjelovitih kompleksa (1.8.) - prostori: SC Mladost, Studentski centar, RSC Jarun, kamp Jarun, Velesajam, Šestinski lagvić, groblje Mirogoj, Šalata, \"Ruđer Bošković\", Rebro, Svetice, Heinzelova, KB Dubrava, Grad mladih, Klaka, MUP - Savska, kompleks Pedagoške akademije, dvorana \"Vatroslav Lisinski\", Kemijski školski centar, Srednjoškolski centar u Držićevoj, NSK i HRT, MUP - Ilica, Brodarski institut, Rockefellerova i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. zaštita, čuvanje i uređenje vrijednosti kompleksa kao cjeline; 2. očuvanje izvornog oblikovanja građevina, karakterističnih vizura, elemenata identiteta i slike kompleksa, kvalitetnih i uređenih zelenih površina (parkova i park - šuma); 3. na zahvate u prostoru u zaštićenim dijelovima prirode, na kulturnim dobrima i na nalazištima strogo zaštićenih i ugroženih biljnih vrsta na ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 4. obavezna je izrada planova UPU RSC Jarun i UPU Zagrebački velesajam, prema smjernicama iz stavka 4. ovog članka.", "(3) Detaljna pravila: 1. gradnja (interpolacija) novih građevina samo iznimno, u funkciji osnovne namjene, uz zadržavanje uređenih zelenih površina i prema programu i normativima osnovne namjene; 2. parkirališne potrebe rješavati prema normativima ove odluke; parkirališta i garaže smjestiti, u pravilu, na okolnom prostoru, ali ne na štetu uređenih zelenih površina; 3. visinu građevine uskladiti s pretežitom visinom gradnje unutar kompleksa; 4. gradnja (interpolacija) novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije; 5. rekonstrukcija građevina moguća je u funkciji osnovne namjene i uz zadržavanje uređenih zelenih površina; 6. iznimno, za prostor SRC Svetice promet u mirovanju moguće je rješavati u kontaktnoj zoni, a pri određivanju broja PGM može se računati na preklapanje u korištenju; 7. pri rekonstrukciji i/ili gradnji novog nogometnog Stadiona u Maksimiru (unutar SRC Svetice) omogućuje se izgradnja i uređenje sportskih i pratećih sadržaja (poslovne namjene i trgovački kompleksi, ugostiteljsko-turističke, javne i društvene te druge namjene); pri čemu odnos sportskih i pratećih sadržaja nije propisan; 8. iznimno, za prostor Zagrebačkog velesajma moguće je uvesti nove namjene koje svojim karakterom ne mijenjaju kvalitetu i organizaciju kompleksa kao urbanističke i arhitektonske cjeline; 9. iznimno, unutar groblja Mirogoj moguća je gradnja upravne zgrade i proširivanje arkada prema javnom arhitektonskom natječaju, sukladno odredbama iz točke 9. MJERE OČUVANJA I ZAŠTITE KRAJOBRAZNIH I PRIRODNIH VRIJEDNOSTI I NEPOKRETNIH KULTURNIH DOBARA ove odluke, omogućiti optimalnu spomeničku prezentaciju nepokretnoga kulturnog dobra - graditeljskog sklopa Kompleksa groblja Mirogoj, odnosno uklanjanje uzroka i posljedica ugroženosti na prostoru duž zapadne strane Aleje Hermanna Bollea. Za prostor zapadno od Aleje Hermanna Bollea obuhvaćen urbanim pravilima 1.8. i 2.11. i prostornim međama kulturnog dobra, propisuje se obveza izrade urbanističkog plana uređenja UPU Hermanna Bollea - zapad; 10. iznimno, zapadno od RSC Jarun moguće je uređenje kampa \"Jarun\", kapaciteta do 1000 posjetilaca, a sve prema posebnim propisima, uz prethodnu valorizaciju i maksimalno zadržavanje postojećeg zelenila; u dijelu površine moguće je uređenje i kamp odmorišta; 11. uz Ulicu grada Vukovara unutar zona određenim ovim urbanim pravilom prema kartografskom prikazu 4. UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA - 4a. Urbana pravila - izmjene i dopune 2025., gradnja novih visokih i/ili niskih građevina nije dopuštena ispred postojećih visokih građevina; nije dozvoljena nadogradnja i dogradnja postojećih građevina niti gradnja na zelenim površinama jer su to područja izrazitih urbanih vrijednosti, koncipirana na principima moderne i predstavljaju nasljeđe moderne, unutar kojeg je definiran urbani koncept s graditeljskom strukturom spomeničkih, ambijentalnih i graditeljskih vrijednosti.", "(4) Programske smjernice: 1. UPU Zagrebački velesajam 1.1. prostor određen za gradske projekte u skladu sa člankom 101. ovih odredbi; 1.2. zaštita, uređenje i djelomična preobrazba cjelovitog kompleksa u područje najvišeg urbanog standarda zasnovanog na principima niskougljičnog razvoja Grada - novo središte - centar Novog Zagreba; 1.3. planiranje pretežito poslovne namjene sa širokim spektrom pratećih sadržaja, mogućnost mješovite namjene (M) do 15% obuhvata plana; 1.4. svi zahvati u prostoru trebaju biti u skladu s konzervatorskim smjernicama - poštivanje mjera zaštite cjeline, paviljona Velesajma i zelenih poteza kompleksa; 1.5. preispitivanje mogućnosti gradnje građevina viših od 9 etaža; 1.6. omogućavanje sadržajnog i funkcionalno - prometnog povezivanja s prostorima užeg i šireg kontaktnog područja; 1.7. omogućavanje transparentnog, otvorenog i atraktivnog prostora za sve korisnike; 1.8. obavezna provedba javnog urbanističko-arhitektonskog natječaja kao podloge za izradu UPU-a. 2. UPU RSC Jarun 2.1. zadržati postojeću prostornu organizaciju uz zaštitu i očuvanje dvije temeljene prostorne vrijednosti: vode i krajobraza; 2.2. funkciju veslačkog centra, zagrebačkog kupališta i područja rekreacijskog kretanja u prirodi treba zadržati, uz očuvanje prirodnih resursa koji su osnova za odvijanje svih funkcija centra; 2.3. uređenje (sadržajna struktura, opremljenost građevinama i drugo) treba biti u funkciji temeljnog fenomena (vode sa svojim vodenim površinama i obalama), odnosno u funkciji sportova na vodi (veslanja i jedrenja) i kupališta, rekreacijskih i sportskih sadržaja, u skladu s podnosivim kapacitetom prostora, te obilježjima prirodnog krajolika i karakteristikama ekološkog sustava, uz obveznu primjenu rješenja temeljenih na prirodi; 2.4. izradi plana prethodi izrada prostorno-programske studije održivog razvoja."]}, "1.9.": {"clanak": "66", "naziv": "Zaštita, održavanje i njegovanje parkova i gradskih park-šuma", "prostori": "postojećih parkova i gradskih park-šuma Zelengaj - Tuškanac, Jelenovac, Pantovčak, Kraljevec, Prekrižje, Vrhovec, Cmrok, Mallinov park, Ribnjak, parkovi - trgovi Donjeg grada i Trnja, šumski kompleksi Remeta, Dotrščina, Miroševečina, Dankovečka, Oporovečka i Novoselečka šuma, Čulinečina, Resničina, parkovi Novog Zagreba, parkovi naselja i drugi prema grafičkom prikazu.", "opca": ["Parkovi: 1.1. održavanje, njegovanje i zaštita parkova, poštujući njihova oblikovna, ekološka, edukativna i rekreativna obilježja; 1.2. održavanje staza i putova te uređenje novih, ako nisu u koliziji s postojećom vegetacijom ili bitno ne mijenjaju postojeću matricu parternog uređenja parka; 1.3. zamjena i dopuna postojeće parkovne opreme te postava skulptura i rasvjete; 1.4. rekonstrukcija i prenamjena građevina u okvirima postojećih gabarita u skladu s funkcionalno-oblikovnim karakteristikama parka; 1.5. gradnja građevina koje dopunjuju komunalni standard parka (nadstrešnice za sklanjanje od nevremena, javni zahodi, paviljoni, manje komunalne građevine i TS, manje građevine što su u funkciji parka); 1.6. onemogućavanje gradnje ispod parkovnih površina, osim, iznimno, podzemne garaže ispod košarkaškog igrališta \"Cibona\" u Tuškancu i rekonstrukcije garaže sjeverno od zgrade Gradske uprave na Trgu Stjepana Radića; 1.7. omogućuje se rekonstrukcija i dogradnja građevine HNK ispod Trga Republike Hrvatske (dogradnja pratećih prostora osnovne namjene u podzemnom dijelu).", "Gradske park-šume: 2.1. njegovanje, održavanje i zaštita park-šuma za koje je izrađen program gospodarenja šumama odnosno Šumskogospodarska osnova provodi se na temelju šumskogospodarskih planova sukladno posebnim propisima iz područja šumarstva; 2.2. održavanje i rekonstrukcija postojećih putova, staza, građevina i rekreativnih sadržaja u gradskim park-šumama te oblikovanje odmorišta i postava higijensko-sanitarnih građevina moguća je samo bez sječe šume; 2.3. iznimno, u gradskoj park-šumi Tuškanac moguća je rekonstrukcija i restitucija ljetne pozornice Tuškanac; 2.4. ograničavanje mogućnosti izgradnje sukladno posebnim propisima prema uvjetima nadležnog javnopravnog tijela."], "zone": [], "tekst": ["(1) Zaštita, održavanje i njegovanje parkova i gradskih park-šuma (1.9.) - prostori postojećih parkova i gradskih park-šuma Zelengaj - Tuškanac, Jelenovac, Pantovčak, Kraljevec, Prekrižje, Vrhovec, Cmrok, Mallinov park, Ribnjak, parkovi - trgovi Donjeg grada i Trnja, šumski kompleksi Remeta, Dotrščina, Miroševečina, Dankovečka, Oporovečka i Novoselečka šuma, Čulinečina, Resničina, parkovi Novog Zagreba, parkovi naselja i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. Parkovi: 1.1. održavanje, njegovanje i zaštita parkova, poštujući njihova oblikovna, ekološka, edukativna i rekreativna obilježja; 1.2. održavanje staza i putova te uređenje novih, ako nisu u koliziji s postojećom vegetacijom ili bitno ne mijenjaju postojeću matricu parternog uređenja parka; 1.3. zamjena i dopuna postojeće parkovne opreme te postava skulptura i rasvjete; 1.4. rekonstrukcija i prenamjena građevina u okvirima postojećih gabarita u skladu s funkcionalno-oblikovnim karakteristikama parka; 1.5. gradnja građevina koje dopunjuju komunalni standard parka (nadstrešnice za sklanjanje od nevremena, javni zahodi, paviljoni, manje komunalne građevine i TS, manje građevine što su u funkciji parka); 1.6. onemogućavanje gradnje ispod parkovnih površina, osim, iznimno, podzemne garaže ispod košarkaškog igrališta \"Cibona\" u Tuškancu i rekonstrukcije garaže sjeverno od zgrade Gradske uprave na Trgu Stjepana Radića; 1.7. omogućuje se rekonstrukcija i dogradnja građevine HNK ispod Trga Republike Hrvatske (dogradnja pratećih prostora osnovne namjene u podzemnom dijelu). 2. Gradske park-šume: 2.1. njegovanje, održavanje i zaštita park-šuma za koje je izrađen program gospodarenja šumama odnosno Šumskogospodarska osnova provodi se na temelju šumskogospodarskih planova sukladno posebnim propisima iz područja šumarstva; 2.2. održavanje i rekonstrukcija postojećih putova, staza, građevina i rekreativnih sadržaja u gradskim park-šumama te oblikovanje odmorišta i postava higijensko-sanitarnih građevina moguća je samo bez sječe šume; 2.3. iznimno, u gradskoj park-šumi Tuškanac moguća je rekonstrukcija i restitucija ljetne pozornice Tuškanac; 2.4. ograničavanje mogućnosti izgradnje sukladno posebnim propisima prema uvjetima nadležnog javnopravnog tijela.", "(3) Iznimno, u gradskim park-šumama i parkovima mogu se zadržati postojeće stambene i gospodarske, te druge građevine, kad su zaštićene kao spomenici kulture ili su ovom odlukom utvrđene kao osobito vrijedne; u gradskim park-šumama i parkovima mogu se zadržati postojeće uređene površine i građevine.", "(4) Na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke.", "(5) Javna i društvena namjena: Rekonstrukcija građevina prema propozicijama nadležnog tijela zaštite, a gradnja novih građevina prema urbanim pravilima 1.8. ove odluke.", "(6) Sportsko rekreacijska namjena - sport bez gradnje - R2: 1. uređenje prostora prema propozicijama nadležnog tijela zaštite; 2. iznimno, omogućuje se gradnja podzemne garaže na lokaciji košarkaškog igrališta \"Cibone\" u Tuškancu."]}, "1.10.": {"clanak": "67", "naziv": "Održavanje i njegovanje zaštitnih zelenih površina", "prostori": "zaštitno zelenilo Okrugljak, vinogradi Oporovca, Novoselca, zaštitno zelenilo dolina potoka i drugi prema grafičkom prikazu.", "opca": ["održavanje, njegovanje i zaštita kultiviranog krajobraza (tradicionalno obrađivani vinogradi, voćnjaci, oranice i povrtnjaci);", "gradnja i rekonstrukcija građevina isključivo u funkciji zaštite nestabilnih padina, vodocrpilišta, površina drugih namjena uz ulice i drugih zaštitnih zelenih površina (potporni zidovi, zdenci, infrastruktura vodocrpilišta, zaštitni zidovi od buke i drugih zagađivanja, građevine za zaštitu od visokih voda i sl.);", "gradnja staza za šetnju i rekreaciju;", "postava skulptura i spomen-obilježja;", "na područjima zaštićenih vinograda može se graditi klijet kao jednoetažna građevina s podrumom, najvećeg GBP-a 40 m² u vinogradu površine najmanje 700 m²;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke;", "iznimno, na prostoru Jagodišća moguće je uređenje golfskog terena. 8.2.2. KONSOLIDIRANA GRADSKA PODRUČJA"], "zone": [], "tekst": ["(1) Održavanje i njegovanje zaštitnih zelenih površina (1.10.) - prostori: zaštitno zelenilo Okrugljak, vinogradi Oporovca, Novoselca, zaštitno zelenilo dolina potoka i drugi prema grafičkom prikazu.", "(2) Opća pravila: 1. održavanje, njegovanje i zaštita kultiviranog krajobraza (tradicionalno obrađivani vinogradi, voćnjaci, oranice i povrtnjaci); 2. gradnja i rekonstrukcija građevina isključivo u funkciji zaštite nestabilnih padina, vodocrpilišta, površina drugih namjena uz ulice i drugih zaštitnih zelenih površina (potporni zidovi, zdenci, infrastruktura vodocrpilišta, zaštitni zidovi od buke i drugih zagađivanja, građevine za zaštitu od visokih voda i sl.); 3. gradnja staza za šetnju i rekreaciju; 4. postava skulptura i spomen-obilježja; 5. na područjima zaštićenih vinograda može se graditi klijet kao jednoetažna građevina s podrumom, najvećeg GBP-a 40 m² u vinogradu površine najmanje 700 m²; 6. na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke; 7. iznimno, na prostoru Jagodišća moguće je uređenje golfskog terena. 8.2.2. KONSOLIDIRANA GRADSKA PODRUČJA"]}, "2.1.": {"clanak": "68", "naziv": "Zaštita, uređenje i dogradnja najsjevernijeg dijela podsljemenskog područja", "prostori": "Gornji i Donji Jarek, Bizek, Dubravica (sjever), Borčec, Gornje Vrapče, Mikulići - Lukšići, Šestine - sjever, Šestinski Kraljevec, Gračani - Bliznec, Gračani - Isce, Bačun, Markuševec, Markuševečka Dubrava, Jalševec, Slanovec, Čučerje i drugi prema grafičkom prikazu.", "opca": ["zaštita i uređenje vrijednosti prostora, osobito područja ekološke mreže, nalazišta strogo zaštićenih vrsta flore, park-šuma, parkova i pejsažnih i zaštitnih zelen  postojeće tipologije, i na građevnim česticama manjim od 800 m², uz uvjet da je najveći kisn 0,5, najveća visina dvije nadzemne etaže, pri čemu se druga etaža oblikuje kao potkrovlje ili uvučeni kat, udaljenost građevine od međe susjedne građevne čestice prema lokalnim uvjetima, ali ne manje od 1,0 m; najmanje 1 PGM/1 stan uz obvezan smještaj vozila na građevnoj čestici u garaži, ostalo prema detaljnim pravilima; u rekonstrukciji i gradnji zamjenske građevine postojeći kisn i visina, veći od propisanih, mogu se zadržati, ali bez povećavanja; 16. iznimno, uz ulicu Trdice, Vrapčansku, Šestinsku cestu i Mlinove, Gračansku, Markuševečku, Slanovečku, Ulicu Vida Ročića, ulicu Štefanovec i Čučersku cestu primjenjuju se urbana pravila članka 69. ove odluke; 17. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena osim javne i društvene koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene. b. u zoni javne i društvene i ugostiteljsko-turističke namjene: 1. gradnja i rekonstrukcija prema programu i normativima osnovne namjene i u skladu s vrijednostima prostora; 2. najveća izgrađenost građevne čestice je 30%; 3. visina građevine najviše tri nadzemne etaže, pri čemu je treća etaža potkrovlje bez nadozida; 4. najmanji prirodni teren je 40% građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen; 5. najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m; 6. najveći kisn za ugostiteljsko-turističku namjenu je 1,0, a najveći GBP je 600 m²; 7. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost građevne čestice i visina, veće od propisanih, mogu se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći; 8. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 99. ove odluke nije određeno drugačije."]}, "2.2.": {"clanak": "69", "naziv": "Zašt
