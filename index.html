, "(1) Opća pravila: 1. obnova i dovršavanje naselja gradnjom individualnih građevina, te građevina s javnim i društvenim sadržajima; 2. osiguravanje prostora za gradnju i rekonstrukciju ulica i komunalne infrastrukture; 3. za područje određenom ovim urbanim pravilom (prvi red gradnje južno od Ulice Bedema ljubavi), a za koje je propisana obveza donošenja UPU Sesvetski Kraljevec – jug prema smjernicama u članku 63.b ove odluke, do njegova donošenja mogući su zahvati u skladu s detaljnim pravilima ovog članka.", "(2) Detaljna pravila a. Na površinama stambene i mješovite, pretežito stambene namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. najveća visina građevina je podzemna etaža i tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 3. najmanja površina građevne čestice je 500 m² za slobodnostojeće građevine, 300 m² za poluugrađene građevine, a 200 m² za ugrađene građevine; 4. najveća izgrađenost građevne čestice je 30% za slobodnostojeće građevine, 40% za poluugrađene građevine, a 50 % za ugrađene građevine; 5. najveći kis je 1,0 za slobodnostojeće, 1,2 za dvojne i ugrađene građevine; 6. najveći GBP na građevnoj čestici je 400 m²; 7. građevinski je pravac udaljen od regulacijske linije ili ruba rezervacije proširenja postojeće ulice najmanje 5 m; 8. najmanja udaljenost građevine od međe susjedne građevne čestice je 3 m; 9. prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 10. uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke; 11. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 12. potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 13. prigodom interpolacije površina građevne čestice može biti manja od površine određene ovim člankom; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 14. prigodom gradnje zamjenske građevine površina građevne čestice može biti manja od površine određene ovim člankom; postojeći GBP i kis, veći od određenih ovim člankom, mogu se zadržati, ali bez povećavanja; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 15. prigodom rekonstrukcije postojećih građevina površina građevne čestice može biti manja od površine određene ovim člankom; postojeća udaljenost od međe susjedne građevne čestice koja nije manja od 1 m i postojeći građevinski pravac mogu se zadržati; drugi uvjeti prema detaljnim pravilima iz ovog članka; 16. iznimno, na česticama većim od 3.000 m² omogućuje se zadržavanje postojećih građevina i mogućnost rekonstrukcije unutar postojećih gabarita, uz moguće zadržavanje postojećih parametara većih od propisanih, ali bez povećanja te uz obavezno očuvanje postojećeg udjela prirodnog terena; 17. iznimno, za čestice stambene namjene zapadno od osnovne škole Luka (oznaka iznimke 5) omogućava se rekonstrukcija i nova gradnja prema detaljnim pravilima ovog članka uz uvjet najmanje udaljenosti građevine 10 m od granice građevne čestice osnovne škole; 18. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene, osim javne i društvene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene; b. Na površinama javne i društvene namjene: 1. gradnja slobodnostojećih građevina, te rekonstrukcija i gradnja zamjenskih građevina; 2. najveća visina građevine je podzemna etaža i tri nadzemne etaže; 3. najveća izgrađenost građevne čestice je 30%; 4. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2; 5. prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 6. potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a m đevne čestice za izgradnju trgovačko-uslužnog centra stambenog susjedstva, uz uvjet ozelenjivanja parkirališta sukladno članku 39. ove odluke, i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 11. uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke; 12. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 13. potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 14. prigodom gradnje zamjenske građevine površina građevne čestice može biti manja od 600 m²; postojeći GBP i kis, veći od određenih ovim člankom mogu se zadržati, ali bez povećavanja; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 15. prigodom rekonstrukcije postojećih građevina građevna čestica može biti manja od 600 m²; postojeća udaljenost od susjedne građevne čestice koja nije manja od 3 m može se zadržati; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 16. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene, osim javne i društvene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene; b. Na površinama javne i društvene namjene: 1. gradnja slobodnostojećih građevina, te rekonstrukcija i gradnja zamjenskih građevina; 2. najveća visina građevine je podzemna etaža i tri nadzemne etaže; 3. najveća izgrađenost građevne čestice je 30%; 4. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2; 5. prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 6. potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice) ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama; 7. prigodom rekonstrukcije i gradnje zamjenskih građevina ako su postojeća izgrađenost građevne čestice i visina građevine veće od određenih ovim člankom, mogu se zadržati, ali bez povećavanja; 8. gradnja novih građevina prema javnom arhitektonskom natječaju u skladu sa člankom 82. ove odluke, izuzev pratećih građevina javne i društvene namjene koje upotpunjuju osnovnu namjenu te infrastrukturnih objekata. Prostori novih regulacija"]}, "1.7.": {"clanak": "63.a", "naziv": "Prostori niske gradnje", "prostori": "", "opca": [], "zone": [], "tekst": ["Prostori niske gradnje (1.7.)", "(1) Na neizgrađenim prostorima Gajišća, Novog Brestja, Starog Brestja i Selčine planiraju se novi rezidencijalni prostori niske gradnje s mrežom javnih prostora i javnih i društvenih sadržaja, te drugim pratećim sadržajima stanovanja prema sljedećim općim uvjetima: a. gustoća stanovništva (Gnst) je najviše 150 st /ha; b. tipologija gradnje: 1. niske višestambene građevine; 2. uvjeti gradnje načelno prema urbanim pravilima iz članka 62. ove odluke, što će biti detaljnije analizirano i razrađeno urbanističkim planom uređenja; c. korištenje i namjena površina: 1. stanovanje i prateći sadržaji (predškolske i školske ustanove, ustanove zdravstvene zaštite, parkovi, dječja igrališta, trgovačko-uslužni centri stambenog susjedstva), 2. površina namijenjena za stanovanje je 60-70% površine obuhvata urbanističkog plana uređenja, 3. javne i zaštitne zelene površine su najmanje 10% površine obuhvata urbanističkog plana uređenja.", "(2) Osim općih uvjeta navedenih prethodnim stavkom navode se dodatne smjernice za izradu: 1. UPU Novo Brestje – zapad: 1.1. transformacija postojeće izgrađene strukture i omogućavanje nove stambeno-poslovne gradnje promjenom geometrije parcelacije; 1.2. formiranje uličnog pročelja uz produženu Branimirovu ulicu uz zadržavanje i unaprjeđenje postojećih pješačkih i biciklističkih komunikacija; 1.3. oblikovanje urbanog poteza uz Zagrebačku cestu i oblikovanje južnog ulaza u naselje, načelno prema uvjetima iz članka 64.b ove odluke; 2. UPU Staro Brestje – zapad: 2.1. nova stambena gradnja na neizgrađenom prostoru; 2.2. planiranje javnih i društvenih sadržaja (predškolska ustanova) i mreže javnih prostora (park susjedstva, uređenje pješačkih prostora uz vodotok); 2.3. mogućnost planiranja trgovačko-uslužnog centra stambenog susjedstva najveće GBP do 1.200 m²; 3. UPU Selčina – sjever: 3.1. nova stambena i stambeno-poslovna gradnja na neizgrađenom prostoru; 3.2. planiranje javnih i društvenih sadržaja (predškolska ustanova i dom za starije i nemoćne); 4. UPU Gajišće – jug: 4.1. zadržavanje postojeće izgrađene strukture i omogućavanje nove stambenoposlovne gradnje promjenom geometrije parcelacije; 4.2. planiranje javnih i društvenih sadržaja (predškolska ustanova) i mreže javnih prostora (novi gradski park i pješačke komunikacije prema središtu Sesveta)."]}, "1.8.": {"clanak": "63.b", "naziv": "Prostori mješovite gradnje", "prostori": "", "opca": [], "zone": [], "tekst": ["Prostori mješovite gradnje (1.8.)", "(1) Novi rezidencijalni prostori individualne, niske i visoke gradnje s mrežom javnih prostora i javnih i društvenih sadržaja, te drugim pratećim sadržajima stanovanja planiraju se na prostorima Staro Brestje – Delec, Sesvetska Selnica – jug, Sesvetski Kraljevec – jug i Jelkovec – sjever prema sljedećim uvjetima: a. gustoća stanovništva (Gnst) je najviše 100 st / ha; b. tipologija gradnje: 1. individualne građevine: slobodnostojeće, poluugrađene ili ugrađene; 2. niske višestambene građevine, uz mogućnost preispitivanja visoke gradnje do pet nadzemnih etaža za područje UPU Jelkovec – sjever; 3. uvjeti gradnje načelno prema urbanim pravilima iz članka 61. i članka 62. ove odluke, što će biti detaljnije analizirano i razrađeno urbanističkim planom uređenja. c. korištenje i namjena površina: 1. stanovanje i prateći sadržaji (predškolske i školske ustanove, ustanove socijalne i zdravstvene zaštite, parkovi, dječja igrališta, trgovačko-uslužni centri stambenog susjedstva); 2. površina namijenjena za stanovanje je 60 - 70% površine obuhvata urbanističkog plana uređenja; 3. javne i zaštitne zelene površine su najmanje 10% površine obuhvata urbanističkog plana uređenja.", "(2) Osim općih uvjeta navedenih prethodnim stavkom navode se dodatne smjernice za izradu: 1. Na području UPU Staro Brestje – Delec predviđa se dovršavanje naselja novom stambenom i mješovitom gradnjom uz planiranje javnih i društvenih sadržaja (školska i predškolska ustanova, ambulanta i dom za starije i nemoćne); 2. Na području UPU Sesvetska Selnica – jug predviđa se nova stambena i stambeno-poslovna gradnja na neizgrađenom prostoru uz planiranje javnih i društvenih sadržaja (školska i predškolska ustanova te vjerska namjena) i mreže javnih prostora; 3. Na području UPU Sesvetski Kraljevec – jug potrebno je: 3.1. planirati novu stambenu i stambeno-poslovnu gradnju na neizgrađenom prostoru s mrežom javnih i društvenih sadržaja (vjerska namjena) i javnih prostora, moguće je preispitati formiranje zone mješovite i poslovne namjene uz Strojarsku ulicu; 3.2. planirati prometnu mrežu i promet u mirovanju s posebnim obzirom na željezničko stajalište (park&ride lokacija) i denivelacije Strojarske ulice; 3.3. na području južno od Ulice Bedema ljubavi koje je obuhvaćeno urbanim pravilom 1.5. Uređenje i dogradnja prostora individualne gradnje moguća je rekonstrukcija i gradnja građevina prema detaljnim pravilima u članku 61. ove odluke; 4. Na području UPU Jelkovec – sjever potrebno je: 4.1. planirati novu stambenu i stambeno-poslovnu gradnju na neizgrađenom prostoru uz obzirno određivanje tipologije gradnje kao prijelaznog elementa uklapanja u prostor naglašeno različitih ambijenata (visoka gradnja planiranog naselja Novi Jelkovec naspram individualne gradnje ruralnog tipa u starom Jelkovcu i proizvodnih pogona uz Industrijsku cestu); 4.2. planirati mrežu javnih i društvenih sadržaja (školska i predškolska ustanova, sportsko-rekreacijski sadržaji) i javnih i zaštitnih zelenih površina; 4.3. obavezna provedba javnog urbanističkog natječaja u skladu sa člankom 82. ove odluke kao stručne podloge za izradu urbanističkog plana uređenja; 4.4. do donošenja urbanističkog plana uređenja ne dopušta se neposredno priključenje građevnih čestica na glavnu gradsku prometnicu Ulicu 144. brigade Hrvatske vojske (produžena Vukovarska ulica) koja prolazi južnim rubom obuhvata UPU-a, jer je natječajem za urbanističko rješenje potrebno odrediti koncepciju razmještaja javnih sadržaja, a UPU-om odrediti sekundarnu prometnu mrežu i pješačke komunikacije s okolnim naseljem. 2. PODRUČJA URBANITETA"]}, "2.1.": {"clanak": "64.a", "naziv": "Središte Sesveta", "prostori": "", "opca": ["prostor središta Sesveta pretežito je konsolidirano područje jasno definiranih funkcija među kojima je u proteklom razdoblju bila najvažnija funkcija nositelja identiteta mjesta, odnosno poslovnoga, administrativnog, kulturnog, zdravstvenog i prometnog gradskog središta. Za dio predmetnog područja na snazi je Urbanistički plan uređenja središta Sesveta;", "izgradnjom i konsolidacijom urbanog tkiva južno od željezničke pruge, osobito stambenog naselja Novi Jelkovec, ističe se potreba za proširenjem središta Sesveta na područje južno od željezničke pruge. S ciljem integralnog planiranja i povezivanja triju ključnih cjelina -središta Sesveta, prostora bivše tvornice Sljeme i naselja Novi Jelkovec propisuje se provedba javnog anketnog urbanističkog natječaja;", "za prostor središta Sesveta propisuje se obveza izrade urbanističkog plana uređenja čije granice su proširene u odnosu na važeći UPU i prikazane su na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026. Urbanistička rješenja dobivena anketnim natječajem predstavljaju stručna polazišta za razradu novog urbanističkog plana uređenja;", "do donošenja urbanističkog plana uređenja na područjima proširenog obuhvata moguća je gradnja i rekonstrukcija građevina u skladu sa člankom 86. ove odluke."], "zone": [], "tekst": ["Središte Sesveta (2.1.)", "(1) Opća pravila: 1. prostor središta Sesveta pretežito je konsolidirano područje jasno definiranih funkcija među kojima je u proteklom razdoblju bila najvažnija funkcija nositelja identiteta mjesta, odnosno poslovnoga, administrativnog, kulturnog, zdravstvenog i prometnog gradskog središta. Za dio predmetnog područja na snazi je Urbanistički plan uređenja središta Sesveta; 2. izgradnjom i konsolidacijom urbanog tkiva južno od željezničke pruge, osobito stambenog naselja Novi Jelkovec, ističe se potreba za proširenjem središta Sesveta na područje južno od željezničke pruge. S ciljem integralnog planiranja i povezivanja triju ključnih cjelina -središta Sesveta, prostora bivše tvornice Sljeme i naselja Novi Jelkovec propisuje se provedba javnog anketnog urbanističkog natječaja; 3. za prostor središta Sesveta propisuje se obveza izrade urbanističkog plana uređenja čije granice su proširene u odnosu na važeći UPU i prikazane su na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026. Urbanistička rješenja dobivena anketnim natječajem predstavljaju stručna polazišta za razradu novog urbanističkog plana uređenja; 4. do donošenja urbanističkog plana uređenja na područjima proširenog obuhvata moguća je gradnja i rekonstrukcija građevina u skladu sa člankom 86. ove odluke.", "(2) Smjernice za izradu UPU Središte Sesveta: 1. osnovni cilj izrade UPU-a je omogućiti urbanistički razvoj i transformaciju središnjeg prostora Sesveta kao nositelja povijesnog identiteta mjesta, s posebnim naglaskom na funkcionalnom i prometnom povezivanju s prostorima bivših tvornica Badel i Sljeme kao novim zonama centralnih sadržaja; 2. namjena: polazeći od postojećeg korištenja prostora, planirati zone mješovite, poslovne, kulturne, zdravstvene i druge javne i društvene namjene, te preispitati mogućnost planiranja novih javnih zelenih površina; 3. promet: detaljno planirati prometnu mrežu u skladu s potrebama razvoja planiranog prometnog terminala. Preispitati mogućnosti prometnog rasterećenja Ninske i Zagrebačke ulice, mogućnosti deniveliranog povezivanja s prostorom bivše tvornice Sljeme preko željezničke pruge, te mogućnosti formiranja pješačkih zona i poteza primjerenih središtu Sesveta; 4. promet u mirovanju: detaljno odrediti lokacije javnih garaža i parkirališta za potrebe prometnog terminala i drugih namjena; 5. morfologija: omogućiti transformaciju postojeće izgrađene strukture u tipologiju primjerenu prostoru urbaniteta, uzimajući u obzir očuvanje prostornih posebnosti, ambijentalnih vrijednosti i karaktera povijesne jezgre Sesveta."]}, "2.2.": {"clanak": "64.b", "naziv": "Linearni potezi urbaniteta", "prostori": "", "opca": ["linearni potezi urbaniteta su potezi uz glavne sesvetske ulice Zagrebačku, Bjelovarsku, Dugoselsku i Varaždinsku ulicu, te druge ulice, za koje se planira transformacija izgrađene strukture u cilju stvaranja urbanog identiteta uličnih poteza prepoznatljivih ambijentalnih i oblikovnih vrijednosti;", "omogućuje se gradnja novih građevina, interpolacija, rekonstrukcija i postupna zamjena trošnih građevina uz mogućnost promjene oblika i veličine građevnih čestica;", "tipologija gradnje koja oblikuje poteze urbaniteta određena je kao slobodnostojeća niska građevina."], "zone": [{"zona": "Na površinama mješovite namjene", "items": ["gradnja i rekonstrukcija slobodnostojećih građevina, iznimno poluugrađenih građevina kao dovršetak postojeće tipologije;", "najveća visina građevina je podzemna etaža i četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao uvučeni kat, uvučen u odnosu na pristupnu prometnicu;", "prizemlje građevine planirati većim dijelom poslovne namjene, sa završnom kotom prizemlja najviše 50 cm iznad kote pristupa s javnoprometne površine;", "pri oblikovanju dubina građevine (duljina bočnih pročelja) ne može biti više od dva puta dulja od širine uličnog pročelja;", "najmanja površina građevne čestice je 600 m²;", "najmanje 80 m² građevne čestice / 1 samostalna uporabna jedinica;", "najveća izgrađenost građevne čestice je 50%;", "najveći kisn je 1,0;", "najveća GBP je 800 m² za slobodnostojeće građevine, a za poluugrađene građevine koje se grade kao dovršetak postojeće tipologije ako je postojeća susjedna građevina poluugrađena, najveća GBP je 400 m²;", "građevinski je pravac udaljen od regulacijske linije pristupne ulice ili ruba rezervacije proširenja postojeće ulice najmanje 10 m, a od ostalih ulica najmanje 5 m;", "najmanja udaljenost građevine od međe susjedne građevne čestice je 5 m;", "prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "obavezno je uređenje predvrta na način da je najmanje 50% površine predvrta hortikulturno uređeno;", "uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke;", "uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke;", "potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);", "prigodom rekonstrukcije i gradnje zamjenskih građevina: 17.1. moguće je zadržati postojeću isključivo stambenu namjenu; 17.2. moguće je zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 17.3. površina postojeće građevne čestice može biti manja od određene ovim člankom, ali ne manja od 400 m²; 17.4. postojeća udaljenost od međe susjedne građevne čestice koja nije manja od 3 m može se zadržati, a ako je manja od 3 m omogućuje se samo rekonstrukcija postojeće građevine unutar postojećih gabarita; 17.5. drugi uvjeti prema detaljnim pravilima iz ovoga članka;", "opća i detaljna pravila primjenju vnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);"}}, {"zona": "Na površinama javne i društvene namjene", "items": ["gradnja slobodnostojećih građevina, te rekonstrukcija i gradnja zamjenskih građevina;", "najveća visina građevine je podzemna etaža i tri nadzemne etaže;", "najveća izgrađenost građevne čestice je 30%;", "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2;", "prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice) ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama;", "prigodom rekonstrukcije i gradnje zamjenskih građevina ako su postojeća izgrađenost građevne čestice i visina građevine veće od određenih ovim člankom, mogu se zadržati, ali bez povećavanja; prigodom rekonstrukcije moguće je zadržati postojeći poluugrađeni način gradnje;", "gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 82. ove odluke nije određeno drugačije, izuzev pratećih građevina javne i društvene namjene koje upotpunjuju osnovnu namjenu te infrastrukturnih objekata."], "key": {"visina": "najveća visina građevine je podzemna etaža i tri nadzemne etaže;", "izgradenost": "najveća izgrađenost građevne čestice je 30%;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2;", "teren": "prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "pgm": "potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice) ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama;"}}], "tekst": ["Linearni potezi urbaniteta (2.2.)", "(1) Opća pravila: 1. linearni potezi urbaniteta su potezi uz glavne sesvetske ulice Zagrebačku, Bjelovarsku, Dugoselsku i Varaždinsku ulicu, te druge ulice, za koje se planira transformacija izgrađene strukture u cilju stvaranja urbanog identiteta uličnih poteza prepoznatljivih ambijentalnih i oblikovnih vrijednosti; 2. omogućuje se gradnja novih građevina, interpolacija, rekonstrukcija i postupna zamjena trošnih građevina uz mogućnost promjene oblika i veličine građevnih čestica; 3. tipologija gradnje koja oblikuje poteze urbaniteta određena je kao slobodnostojeća niska građevina.", "(2) Detaljna pravila: a. Na površinama mješovite namjene: 1. gradnja i rekonstrukcija slobodnostojećih građevina, iznimno poluugrađenih građevina kao dovršetak postojeće tipologije; 2. najveća visina građevina je podzemna etaža i četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao uvučeni kat, uvučen u odnosu na pristupnu prometnicu; 3. prizemlje građevine planirati većim dijelom poslovne namjene, sa završnom kotom prizemlja najviše 50 cm iznad kote pristupa s javnoprometne površine; 4. pri oblikovanju dubina građevine (duljina bočnih pročelja) ne može biti više od dva puta dulja od širine uličnog pročelja; 5. najmanja površina građevne čestice je 600 m²; 6. najmanje 80 m² građevne čestice / 1 samostalna uporabna jedinica; 7. najveća izgrađenost građevne čestice je 50%; 8. najveći kisn je 1,0; 9. najveća GBP je 800 m² za slobodnostojeće građevine, a za poluugrađene građevine koje se grade kao dovršetak postojeće tipologije ako je postojeća susjedna građevina poluugrađena, najveća GBP je 400 m²; 10. građevinski je pravac udaljen od regulacijske linije pristupne ulice ili ruba rezervacije proširenja postojeće ulice najmanje 10 m, a od ostalih ulica najmanje 5 m; 11. najmanja udaljenost građevine od međe susjedne građevne čestice je 5 m; 12. prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 13. obavezno je uređenje predvrta na način da je najmanje 50% površine predvrta hortikulturno uređeno; 14. uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke; 15. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 16. potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 17. prigodom rekonstrukcije i gradnje zamjenskih građevina: 17.1. moguće je zadržati postojeću isključivo stambenu namjenu; 17.2. moguće je zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 17.3. površina postojeće građevne čestice može biti manja od određene ovim člankom, ali ne manja od 400 m²; 17.4. postojeća udaljenost od međe susjedne građevne čestice koja nije manja od 3 m može se zadržati, a ako je manja od 3 m omogućuje se samo rekonstrukcija postojeće građevine unutar postojećih gabarita; 17.5. drugi uvjeti prema detaljnim pravilima iz ovoga članka; 18. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene, osim javne i društvene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene; b. Na površinama poslovne namjene: 1. gradnja i rekonstrukcija slobodnostojećih građevina; 2. najveća visina građevina je podzemna etaža i tri nadzemne etaže; 3. prizemlje građevine planirati najviše 50 cm iznad kote pristupa s javnoprometne površine; 4. najmanja površina građevne čestice je 1.000 m²; 5. najveća izgrađenost građevne čestice je 40%; 6. najveći kisn je 1,0; 7. građevinski je pravac udaljen od regulacijske linije pristupne ulice ili ruba rezervacije proširenja postojeće ulice najmanje 10 m, a od ostalih ulica najmanje 5 m; 8. najmanja udaljenost građevine od međe susjedne građevne čestice je 5 m; 9. prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, obavezno je hortikulturno uređenje čestice prema pristupnoj ulici; 10. uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke; 11. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 12. potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 13. iznimno, na području južno od Zagrebačke ulice za postojeće građevine stambene namjene (oznaka iznimke 7) omogućuje se zadržavanje stambene namjene i rekonstrukcija unutar postojećih gabarita. Mogućnost rekonstrukcije uvjetuje se poštivanjem građevinskog pravca i minimalnog udjela prirodnog terena uz hortikulturno uređenje predvrta; 14. iznimno, u zoni poslovne namjene neposredno zapadno od križanja Zagrebačke ulice i Ulice Ljudevita Posavskog (oznaka iznimke 8) omogućuje se rekonstrukcija postojećih poslovnih građevina najveće GBP do 2400 m², drugi uvjeti prema detaljnim pravilima iz ovoga članka; 15. iznimno, u zoni poslovne namjene u Sesvetskom Kraljevcu (oznaka iznimke 9), omogućuje se rekonstrukcija poslovnih građevina ugostiteljske namjene najveće GBP do 3400 m²; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 16. iznimno, u zoni poslovne namjene neposredno sjeverno od križanja Avenije Dubrava i Ulice kneza Branimira (oznaka iznimke 10) omogućuje se zadržavanje i rekonstrukcija unutar postojećih gabarita poslovnih građevina; c. Na površinama javne i društvene namjene: 1. gradnja slobodnostojećih građevina, te rekonstrukcija i gradnja zamjenskih građevina; 2. najveća visina građevine je podzemna etaža i tri nadzemne etaže; 3. najveća izgrađenost građevne čestice je 30%; 4. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2; 5. prirodni teren mora biti najmanje 40% površine građevne čestice, parkovno uređen i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 6. potreban broj PGM-a rješava se prema normativima iz članka 39. ove odluke, a moguće ga je osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice) ili na javnim površinama (ulicama i posebnim parkirališnim površinama) i/ili u javnim garažama; 7. prigodom rekonstrukcije i gradnje zamjenskih građevina ako su postojeća izgrađenost građevne čestice i visina građevine veće od određenih ovim člankom, mogu se zadržati, ali bez povećavanja; prigodom rekonstrukcije moguće je zadržati postojeći poluugrađeni način gradnje; 8. gradnja novih građevina prema javnom arhitektonskom natječaju osim ako člankom 82. ove odluke nije određeno drugačije, izuzev pratećih građevina javne i društvene namjene koje upotpunjuju osnovnu namjenu te infrastrukturnih objekata."]}, "2.3.": {"clanak": "64.c", "naziv": "Lokalne zone urbaniteta", "prostori": "", "opca": ["na prostorima naselja Sopnica, Kraljevečki Novaki i Sesvetska Selnica planira se nova gradnja i transformacija postojeće izgrađene strukture u cilju stvaranja lokalnih zona urbanog identiteta, odnosno prostora prepoznatljivih ambijentalnih i oblikovnih vrijednosti u kojima se odvija veći intenzitet urbanih funkcija;", "omogućuje se gradnja novih građevina, interpolacija, rekonstrukcija i zamjenska gradnja uz mogućnost promjene oblika i veličine građevnih čestica."], "zone": [{"zona": "Na površinama mješovite namjene", "items": ["gradnja i rekonstrukcija slobodnostojećih i poluugrađenih građevina;", "najveća visina građevina je podzemna etaža i četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat;", "prizemlje građevine planirati većim dijelom poslovne namjene sa završnom kotom prizemlja najviše 50 cm iznad kote pristupa s javnoprometne površine;", "pri oblikovanju dubina građevine (duljina bočnih pročelja) ne može biti više od dva puta dulja od širine uličnog pr amjene prema pravilima za zonu javne i društvene namjene iz članka 62. ove odluke.", "GOSPODARSKE ZONE"], "key": {"visina": "najveća visina građevina je podzemna etaža i četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat;", "cestica": "najmanja površina građevne čestice je 600 m²;", "izgradenost": "najveća izgrađenost građevne čestice je 40%;", "kis": "najveći kisn je 1,0;", "gbp": "najveća GBP na građevnoj čestici je 600 m²;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je 5 m;", "teren": "prirodni teren mora biti najmanje 30% površine građevne čestice, iznimno može biti najmanje 15% površine građevne čestice za izgradnju trgovačkouslužnog centra stambenog susjedstva, i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "pgm": "potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);"}}], "tekst": ["Lokalne zone urbaniteta (2.3.)", "(1) Opća pravila: 1. na prostorima naselja Sopnica, Kraljevečki Novaki i Sesvetska Selnica planira se nova gradnja i transformacija postojeće izgrađene strukture u cilju stvaranja lokalnih zona urbanog identiteta, odnosno prostora prepoznatljivih ambijentalnih i oblikovnih vrijednosti u kojima se odvija veći intenzitet urbanih funkcija; 2. omogućuje se gradnja novih građevina, interpolacija, rekonstrukcija i zamjenska gradnja uz mogućnost promjene oblika i veličine građevnih čestica.", "(2) Detaljna pravila: a. Na površinama mješovite namjene: 1. gradnja i rekonstrukcija slobodnostojećih i poluugrađenih građevina; 2. najveća visina građevina je podzemna etaža i četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao potkrovlje ili uvučeni kat; 3. prizemlje građevine planirati većim dijelom poslovne namjene sa završnom kotom prizemlja najviše 50 cm iznad kote pristupa s javnoprometne površine; 4. pri oblikovanju dubina građevine (duljina bočnih pročelja) ne može biti više od dva puta dulja od širine uličnog pročelja; 5. najmanja površina građevne čestice je 600 m²; 6. najmanje 80 m² građevne čestice / 1 samostalna uporabna jedinica; 7. najveća izgrađenost građevne čestice je 40%; 8. najveći kisn je 1,0; 9. najveća GBP na građevnoj čestici je 600 m²; 10. građevinski je pravac udaljen od regulacijske linije pristupne ulice ili ruba rezervacije proširenja postojeće ulice najmanje 10 m, a od ostalih ulica najmanje 5 m; 11. najmanja udaljenost građevine od međe susjedne građevne čestice je 5 m; 12. prirodni teren mora biti najmanje 30% površine građevne čestice, iznimno može biti najmanje 15% površine građevne čestice za izgradnju trgovačkouslužnog centra stambenog susjedstva, i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 13. obavezno je uređenje predvrta na način da je najmanje 50% površine predvrta hortikulturno uređeno; 14. uvjeti za gradnju pomoćnih građevina određeni su člankom 35. ove odluke; 15. uvjeti za uređivanje građevne čestice određeni su člankom 36. ove odluke; 16. potreban broj PGM-a osigurati na građevnoj čestici prema normativu 1 PGM/1 stan, a za druge namjene prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 17. prigodom rekonstrukcije i gradnje zamjenskih građevina: 17.1. moguće je zadržati postojeću isključivo stambenu namjenu; 17.2. moguće je zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 17.3. površina postojeće građevne čestice može biti manja od određene ovim člankom, ali ne manja od 400 m²; 17.4. postojeća udaljenost od međe susjedne građevne čestice koja nije manja od 3 m može se zadržati, a ako je manja od 3 m omogućuje se samo rekonstrukcija postojeće građevine unutar postojećih gabarita; 17.5. drugi uvjeti prema detaljnim pravilima iz ovoga članka; 18. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni stambene i mješovite namjene, osim javne i društvene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene iz članka 62. ove odluke. 3. GOSPODARSKE ZONE"]}, "3.1.": {"clanak": "65", "naziv": "Gospodarska zona Sesvete", "prostori": "", "opca": ["gospodarska zona gradskog značenja sastoji se od lokacija sjever i jug, dijelom na arheološkom lokalitetu;", "uz Ulicu Ljudevita Posavskog i Slavonsku aveniju planira se poslovna namjena, a na drugim se prostorima planira i poslovna i proizvodna namjena;", "skladišta kao osnovna djelatnost ne mogu se graditi;", "skladišni prostor može biti površine do 20% GBP-a poslovne ili proizvodne građevine;", "površine za koje postoji obveza donošenja urbanističkog plana uređenja prikazane su u kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026.;", "do donošenja urbanističkog plana uređenja moguća je rekonstrukcija i gradnja građevina u skladu s odredbama članka 86. ove odluke;", "na području za koje ne postoji obveza donošenja urbanističkog plana uređenja mogu se graditi građevine i uređivati prostori prema detaljnim pravilima iz ovoga članka."], "zone": [{"zona": "na površinama gospodarske i poslovne namjene", "items": ["gradnja slobodnostojećih građevina;", "najveća visina građevine je podzemna etaža i tri nadzemne etaže;", "najmanja površina građevne čestice je 2.000 m²;", "najmanja širina građevne čestice na regulacijskoj liniji ili rubu rezervacije proširenja postojeće ulice je 20 m, a najveći omjer širine i dužine čestice određen je, u pravilu, 1:5;", "najveća izgrađenost građevne čestice je 50%;", "najveći kisn je 1,0;", "građevinski pravac od regulacijske linije ili ruba rezervacije proširenja postojeće ulice udaljen je najmanje 12 m, iznimno od izdvojenih pješačkih površina i biciklističkih staza najmanje 5 m;", "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2, ali ne manje od 3,0 m, iznimno za građevine gospodarske i proizvodne namjene udaljenost od međa drugih građevnih čestica unutar iste namjene može biti i manja od h/2, ali ne manje od 3,0 m;", "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);", "prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "građevna čestica mora biti hortikulturno uređena; prema susjednim česticama drugih namjena, potrebno je urediti pojaseve visokoga zaštitnog zelenila (ne unutar rezervacije proširenja postojeće ulice);", "prigodom gradnje zamjenske građevine površina građevne čestice može biti manja od površine određene ovim člankom; postojeći kig i kisn može se zadržati, ali bez povećanja; drugi uvjeti prema detaljnim pravilima iz ovoga članka;", "prigodom rekonstrukcije, postojećih građevina površina i širina građevne čestice mogu biti manje od određenih ovim člankom; najveći kisn je 1,0; postojeća udaljenost od susjedne građevne čestice koja nije manja od 3 m i postojeći građevinski pravac mogu se zadržati; drugi uvjeti prema detaljnim pravilima iz ovoga članka;", "iznimno, sjeverno od Slavonske avenije, a zapadno uz Savsku cestu (oznaka iznimke 11), najveći kisn građevne čestice je 2,0, drugi uvjeti prema detaljnim pravilima iz ovog članka;", "opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni gospodarske namjene, osim javne i društvene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene određenim člankom 62. ove odluke."], "key": {"visina": "najveća visina građevine je podzemna etaža i tri nadzemne etaže;", "cestica": "najmanja površina građevne čestice je 2.000 m²;", "izgradenost": "najveća izgrađenost građevne čestice je 50%;", "kis": "najveći kisn je 1,0;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2, ali ne manje od 3,0 m, iznimno za građevine gospodarske i proizvodne namjene udaljenost od međa drugih građevnih čestica unutar iste namjene može biti i manja od h/2, ali ne manje od 3,0 m;", "pgm": "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice);", "teren": "prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;"}}, {"zona": "na površinama infrastrukturnih sustava", "items": ["veličina građevne čestice, građevine i pratećih sadržaja određeni su tehnološkim zahtjevima;", "poštivanje mjera zaštite okoliša;", "prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;", "građevna čestica mora biti hortikulturno uređena; prema susjednim česticama drugih namjena, potrebno je urediti pojaseve visokoga zaštitnog zelenila (ne unutar rezervacije proširenja postojeće ulice)."], "key": {"teren": "prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;"}}, {"zona": "na površinama mješovite namjene", "items": ["do donošenja urbanističkog plana uređenja moguća je rekonstrukcija građevina u skladu s odredbom članka 86. ove odluke."], "key": {}}], "tekst": ["Gospodarska zona Sesvete (3.1.)", "(1) Opća pravila: 1. gospodarska zona gradskog značenja sastoji se od lokacija sjever i jug, dijelom na arheološkom lokalitetu; 2. uz Ulicu Ljudevita Posavskog i Slavonsku aveniju planira se poslovna namjena, a na drugim se prostorima planira i poslovna i proizvodna namjena; 3. skladišta kao osnovna djelatnost ne mogu se graditi; 4. skladišni prostor može biti površine do 20% GBP-a poslovne ili proizvodne građevine; 5. površine za koje postoji obveza donošenja urbanističkog plana uređenja prikazane su u kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026.; 6. do donošenja urbanističkog plana uređenja moguća je rekonstrukcija i gradnja građevina u skladu s odredbama članka 86. ove odluke; 7. na području za koje ne postoji obveza donošenja urbanističkog plana uređenja mogu se graditi građevine i uređivati prostori prema detaljnim pravilima iz ovoga članka.", "(2) Detaljna pravila: a. na površinama gospodarske i poslovne namjene: 1. gradnja slobodnostojećih građevina; 2. najveća visina građevine je podzemna etaža i tri nadzemne etaže; 3. najmanja površina građevne čestice je 2.000 m²; 4. najmanja širina građevne čestice na regulacijskoj liniji ili rubu rezervacije proširenja postojeće ulice je 20 m, a najveći omjer širine i dužine čestice određen je, u pravilu, 1:5; 5. najveća izgrađenost građevne čestice je 50%; 6. najveći kisn je 1,0; 7. građevinski pravac od regulacijske linije ili ruba rezervacije proširenja postojeće ulice udaljen je najmanje 12 m, iznimno od izdvojenih pješačkih površina i biciklističkih staza najmanje 5 m; 8. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2, ali ne manje od 3,0 m, iznimno za građevine gospodarske i proizvodne namjene udaljenost od međa drugih građevnih čestica unutar iste namjene može biti i manja od h/2, ali ne manje od 3,0 m; 9. potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 10. prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 11. građevna čestica mora biti hortikulturno uređena; prema susjednim česticama drugih namjena, potrebno je urediti pojaseve visokoga zaštitnog zelenila (ne unutar rezervacije proširenja postojeće ulice); 12. prigodom gradnje zamjenske građevine površina građevne čestice može biti manja od površine određene ovim člankom; postojeći kig i kisn može se zadržati, ali bez povećanja; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 13. prigodom rekonstrukcije, postojećih građevina površina i širina građevne čestice mogu biti manje od određenih ovim člankom; najveći kisn je 1,0; postojeća udaljenost od susjedne građevne čestice koja nije manja od 3 m i postojeći građevinski pravac mogu se zadržati; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 14. iznimno, sjeverno od Slavonske avenije, a zapadno uz Savsku cestu (oznaka iznimke 11), najveći kisn građevne čestice je 2,0, drugi uvjeti prema detaljnim pravilima iz ovog članka; 15. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena koje se mogu graditi u zoni gospodarske namjene, osim javne i društvene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene određenim člankom 62. ove odluke. b. na površinama infrastrukturnih sustava: 1. veličina građevne čestice, građevine i pratećih sadržaja određeni su tehnološkim zahtjevima; 2. poštivanje mjera zaštite okoliša; 3. prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 4. građevna čestica mora biti hortikulturno uređena; prema susjednim česticama drugih namjena, potrebno je urediti pojaseve visokoga zaštitnog zelenila (ne unutar rezervacije proširenja postojeće ulice). c. na površinama mješovite namjene: 1. do donošenja urbanističkog plana uređenja moguća je rekonstrukcija građevina u skladu s odredbom članka 86. ove odluke.", "(3) Osim općih i detaljnih pravila primjenjuju se i sljedeće smjernice za izradu urbanističkih planova uređenja: 1. UPU gospodarska zona Sesvete - sjever: 1.1. zbog potrebe integralnog sagledavanja i povezivanja prostora od središta Sesveta do naselja Novi Jelkovec propisuje se provedba javnog anketnog urbanističkog natječaja. Minimalno područje obuhvata javnog anketnog urbanističkog natječaja prikazano je na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026., a obuhvaća i prostore u obuhvatu UPU Gospodarska zona Sesvete - sjever: potez tematske zone i šumu Jelkovec. Urbanistička rješenja dobivena anketnim natječajem utječu na detaljnu razradu i mogu predstavljati stručna polazišta za izradu plana; 1.2. u istočnom dijelu obuhvata potrebno je planirati zadržavanje i razvoj postojećih gospodarskih i proizvodnih sadržaja, osobito prostora sajmišta i reciklažnog dvorišta, te humanizaciju postojeće ulične mreže (Industrijska cesta) uspostavom drvoreda i vegetacijskih pojasa prema planiranim kontaktnim zonama stanovanja; 1.3. u zapadnom dijelu obuhvata uz ulicu Ljudevita Posavskog potrebno je planirati transformaciju postojeće poslovne zone, odrediti uvjete gradnje i uređenja na površinama mješovite i sportsko-rekreacijske namjene, te na površinama javnih zelenih površina – tematske zone, prema urbanističkom rješenju odabranom anketnim natječajem, s naglaskom na integraciji prostora od središta Sesveta i bivše tvornice Sljeme do naselja Novi Jelkovec; 1.4. iznimno od detaljnih pravila ovog članka za poslovnu zonu uz istočnu stranu Ulice Ljudevita Posavskog planom je moguće odrediti kisn do 1,5 i visinu do četiri nadzemne etaže, pri čemu se četvrta etaža oblikuje kao uvučeni kat; 2. Na području UPU gospodarska zona Sesvete - jug planirati poslovnu i proizvodnu namjenu, te očuvanje postojećih elemenata zelene infrastrukture. Iznimno od detaljnih pravila ovog članka, na građevnim česticama većim od 4000 m² uz Slavonsku aveniju planom je moguće odrediti kisn do 2,0 i visinu poslovnih građevina do šest nadzemnih etaža uz obvezu provedbe javnog natječaja."]}, "3.2.": {"clanak": "66", "naziv": "Gospodarske zone Kobiljak i Sesvetski Kraljevec", "prostori": "", "opca": ["s obzirom na blizinu stanovanja, na ovom se području mogu graditi građevine za", "proizvodne, pretežito zanatske sadržaje s tehno t nadzemnih etaža, pri čemu se šesta etaža oblikuje kao uvučeni kat, ostali uvjeti prema detaljnim pravilima ovog članka."], "key": {"visina": "najveća visina građevine je podzemna etaža i tri nadzemne etaže;", "cestica": "najmanja površina građevne čestice je 2.000 m²;", "izgradenost": "najveća izgrađenost građevne čestice je 40%;", "kis": "najveći kisn je 1,0;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je h/2, ali ne manje od 3,0 m; iznimno, za građevine gospodarske i proizvodne namjene udaljenost od međa drugih građevnih čestica unutar iste namjene (G) može biti i manja od h/2, ali ne manje od 3,0 m;", "pgm": "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka", "teren": "prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice;"}}], "tekst": ["Gospodarske zone Kobiljak i Sesvetski Kraljevec (3.2.)", "(1) Opća pravila: s obzirom na blizinu stanovanja, na ovom se području mogu graditi građevine za proizvodne, pretežito zanatske sadržaje s tehnološki visoko razvijenom proizvodnjom i bez štetnih utjecaja na okoliš, te poslovne građevine za pretežito uslužne, trgovačke i komunalno - servisne sadržaje;", "(2) Detaljna pravila 1. gradnja slobodnostojećih građevina; 2. najveća visina građevine je podzemna etaža i tri nadzemne etaže; 3. najmanja površina građevne čestice je 2.000 m²; 4. najveća izgrađenost građevne čestice je 40%; 5. najveći kisn je 1,0; 6. građevinski pravac udaljen je od regulacijske linije ili ruba rezervacije proširenja postojeće ulice najmanje 10 m; 7. najmanja udaljenost građevine od međe susjedne građevne čestice je h/2, ali ne manje od 3,0 m; iznimno, za građevine gospodarske i proizvodne namjene udaljenost od međa drugih građevnih čestica unutar iste namjene (G) može biti i manja od h/2, ali ne manje od 3,0 m; 8. potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke (ne unutar rezervacije proširenja postojeće ulice); 9. prirodni teren mora biti najmanje 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 10. građevna čestica mora biti hortikulturno uređena; prema susjednim česticama drugih namjena, potrebno je urediti pojaseve visokoga zaštitnog zelenila (ne unutar rezervacije proširenja postojeće ulice); 11. prigodom gradnje zamjenske građevine površina građevne čestice može biti manja od površine određene ovim člankom; postojeći kisn veći od 1,0 može se zadržati, ali bez povećavanja; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 12. prigodom rekonstrukcije postojećih građevina građevna čestica može biti manja od 2.000 m²; najveći kisn je 1,0; postojeća udaljenost od susjedne građevne čestice koja nije manja od 3 m i postojeći građevinski pravac mogu se zadržati; drugi uvjeti prema detaljnim pravilima iz ovoga članka; 13. iznimno, za rekonstrukciju ugostiteljsko-turističkih građevina uz Kobiljačku cestu (oznaka iznimke 12), omogućuje se najveća visina građevina do šest nadzemnih etaža, pri čemu se šesta etaža oblikuje kao uvučeni kat, ostali uvjeti prema detaljnim pravilima ovog članka."]}, "3.3.": {"clanak": "66.a", "naziv": "Ugostiteljsko-turistička zona Sesvete", "prostori": "", "opca": ["uz Varaždinsku cestu određena je zona ugostiteljsko-turistička namjene planirana za gradnju i uređenje izletišta, kampa ili kamp odmorišta;", "s obzirom na blizinu šume, na ovom području ne mogu se graditi hoteli i ostali ugostiteljsko-turistički objekti, osim ugostiteljskih sadržaja kao pratećih sadržaja kampa prema posebnom propisu;"], "zone": [{"zona": "sve zone", "items": ["gradnja slobodnostojećih građevina;", "najveća visina građevine je prizemna etaža;", "građevna čestica formira se površine približno jednake površini pojedine zone;", "na građevnoj čestici moguće je graditi više građevina;", "najveća izgrađenost građevne čestice je 30%;", "broj smještajnih jedinica određuje se sukladno posebnom propisu, ali ne može biti veća od 25 smještajnih jedinica/ha;", "građevinski pravac udaljen je od regulacijske linije planiranih ili postojećih prometnica 10 m;", "najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m;", "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke;", "prirodni teren mora biti najmanje 40% površine građevne čestice;", "građevna čestica mora biti hortikulturno uređena uz primjereno vrednovanje i u što većoj mjeri očuvanje zatečene vegetacije i krajobraznih vrijednosti;", "gradnja zamjenske građevine i rekonstrukcija provodi se prema detaljnim pravilima ovoga članka.", "PROSTORI TRANSFORMACIJE"], "key": {"visina": "najveća visina građevine je prizemna etaža;", "izgradenost": "najveća izgrađenost građevne čestice je 30%;", "meda": "najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m;", "pgm": "potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke;", "teren": "prirodni teren mora biti najmanje 40% površine građevne čestice;"}}], "tekst": ["Ugostiteljsko-turistička zona Sesvete (3.3.)", "(1) Opća pravila: 1. uz Varaždinsku cestu određena je zona ugostiteljsko-turistička namjene planirana za gradnju i uređenje izletišta, kampa ili kamp odmorišta; 2. s obzirom na blizinu šume, na ovom području ne mogu se graditi hoteli i ostali ugostiteljsko-turistički objekti, osim ugostiteljskih sadržaja kao pratećih sadržaja kampa prema posebnom propisu;", "(2) Detaljna pravila: 1. gradnja slobodnostojećih građevina; 2. najveća visina građevine je prizemna etaža; 3. građevna čestica formira se površine približno jednake površini pojedine zone; 4. na građevnoj čestici moguće je graditi više građevina; 5. najveća izgrađenost građevne čestice je 30%; 6. broj smještajnih jedinica određuje se sukladno posebnom propisu, ali ne može biti veća od 25 smještajnih jedinica/ha; 7. građevinski pravac udaljen je od regulacijske linije planiranih ili postojećih prometnica 10 m; 8. najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m; 9. potreban broj PGM-a osigurati na građevnoj čestici prema normativima iz članka 39. ove odluke; 10. prirodni teren mora biti najmanje 40% površine građevne čestice; 11. građevna čestica mora biti hortikulturno uređena uz primjereno vrednovanje i u što većoj mjeri očuvanje zatečene vegetacije i krajobraznih vrijednosti; 12. gradnja zamjenske građevine i rekonstrukcija provodi se prema detaljnim pravilima ovoga članka. 4. PROSTORI TRANSFORMACIJE"]}, "4.1.": {"clanak": "67.a", "naziv": "Sljeme – Sesvete", "prostori": "", "opca": ["izgradnjom i konsolidacijom urbanog tkiva na prostorima između povijesnih naselja Sopnica i Jelkovec, osobito stambenog naselja Novi Jelkovec, nastala je potreba za kvalitetnijim prometnim i sadržajnim povezivanjem s povijesnim središtem Sesveta. Zbog neposrednog položaja uz željeznički kolodvor, kao i zbog primjerene vlasničke strukture i povijesnog značaja, planirana je transformacija prostora bivše tvornice Sljeme u novo kulturno, upravno, obrazovno i poslovno središta Sesveta južno od željezničke pruge. S ciljem integralnog planiranja i povezivanja triju ključnih cjelina - središta Sesveta, prostora bivše tvornice Sljeme i naselja Novi Jelkovec propisuje se provedba javnog anketnog urbanističkog natječaja;", "minimalno područje obuhvata javnog anketnog urbanističkog natječaja i granice obuhvata za koji je propisano donošenje UPU Sljeme - Sesvete prikazane su na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026.;", "do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija građevina u skladu sa člankom 86. ove odluke."], "zone": [], "tekst": ["Sljeme – Sesvete (4.1.)", "(1) Opća pravila: 1. izgradnjom i konsolidacijom urbanog tkiva na prostorima između povijesnih naselja Sopnica i Jelkovec, osobito stambenog naselja Novi Jelkovec, nastala je potreba za kvalitetnijim prometnim i sadržajnim povezivanjem s povijesnim središtem Sesveta. Zbog neposrednog položaja uz željeznički kolodvor, kao i zbog primjerene vlasničke strukture i povijesnog značaja, planirana je transformacija prostora bivše tvornice Sljeme u novo kulturno, upravno, obrazovno i poslovno središta Sesveta južno od željezničke pruge. S ciljem integralnog planiranja i povezivanja triju ključnih cjelina - središta Sesveta, prostora bivše tvornice Sljeme i naselja Novi Jelkovec propisuje se provedba javnog anketnog urbanističkog natječaja; 2. minimalno područje obuhvata javnog anketnog urbanističkog natječaja i granice obuhvata za koji je propisano donošenje UPU Sljeme - Sesvete prikazane su na kartografskom prikazu 4.c UVJETI ZA KORIŠTENJE, UREĐENJE I ZAŠTITU PROSTORA, Područja primjene planskih mjera zaštite – izmjene i dopune 2026.; 3. do donošenja urbanističkog plana uređenja moguća je gradnja i rekonstrukcija građevina u skladu sa člankom 86. ove odluke.", "(2) Smjernice za izradu UPU Sljeme – Sesvete: 1. osnovni cilj izrade UPU-a je omogućiti urbanistički razvoj i transformaciju bivših tvorničkih prostora u novo središte Sesveta; 2. namjena: planirati više različitih programa - sadržaji javne i društvene namjene, kulturne, upravne, obrazovne, poslovne, sadržaji stanovanja, ugostiteljstva i trgovine, javne zelene površine i tematske zone te drugi sadržaji koji nedostaju ili su komplementarni središtu Sesveta; 3. promet: detaljno planirati prometnu mrežu u skladu s potrebama razvoja planiranog prometnog terminala. Ostvariti pješačko povezivanje i preispitati mogućnosti deniveliranog kolnog povezivanja preko željezničke pruge s prostorom povijesnog središta Sesveta; 4. promet u mirovanju: detaljno odrediti lokacije javnih garaža i parkirališta za potrebe prometnog terminala i drugih namjena; 5. morfologija: omogućiti transformaciju postojeće izgrađene strukture u tipologiju primjerenu prostoru urbaniteta, primjenjujući načela kružnog gospodarenja zgradama i rješenja utemeljena na prirodi. Visina gradnje nije ograničena, ali je nužno voditi računa o kompozicijskim, panoramskim i vizurnim vrijednostima, kao i uklapanju u postojeći izgrađeni okoliš izvan granica obuhvata. Ukupni najmanji udio javnih i zaštitnih zelenih površina je 30% površine obuhvata."]}, "4.2.": {"clanak": "67.b", "naziv": "Zona Badel", "prostori": "", "opca": ["na prostoru bivšeg postrojenja industrije vrenja Badel planira se transformacija izgrađene strukture u cilju stvaranja urbane zone mješovitih i poslovnih sadržaja komplementarnih središnjim prostorima Sesveta, prepoznatljivih ambijentalnih i oblikovnih vrijednosti;", "omogućuje se nova gradnja, rekonstrukcija i zamjena postojećih građevina s mogućnošću promjene oblika i veličine građevnih čestica;", "prostorom obuhvata planira se gradska prometnica kao nastavak Ulice Otona Ivekovića kojom se omogućuje bolja protočnost šire zone. Također, planira se i nekategorizirana prometnica koja omogućuje pristup građevnim česticama, a u kojoj je potrebno primijeniti mjere smirivanja prometa."], "zone": [{"zona": "Na površinama mješovite-pretežito stambene namjene", "items": ["gradnja slobodnostojećih građevina;", "udio stambene namjene nije ograničen, ali je obavezno planiranje poslovnih, uslužnih ili javnih sadržaja u prizemlju građevina; nije dozvoljena gradnja isključivo poslovnih građevina na zasebnim građevnim česticama;", "najveća visina građevina je dvije podzemne etaže i šest nadzemnih etaža od kojih je šesta etaža uvučena i iznosi ukupno 50% površine dobivene vertikalnom projekcijom svih zatvorenih nadzemnih dijelova građevine, a preostala površina je neprohodni zeleni krov;", "najmanja površina građevne čestice je 2.000 m²; na jednoj građevnoj čestici moguće je graditi više građevina;", "najmanje 40 m² građevne čestice / 1 samostalna uporabna jedinica;", "najveća izgrađenost građevne čestice je 50%;", "najveći kisn je 2,5;", "građevinski pravac prem
