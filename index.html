 "(2) Opća pravila: 1. revalorizacija područja gradske periferije s karakteristikama substandardne stambene, pretežito neplanske gradnje; 2. podizanje standarda područja sanacijom, dogradnjom i transformacijom postojećih naselja, rekonstrukcijom postojeće i gradnjom nove prometne mreže, i osiguravanje prostora za realizaciju nužno potrebnih pratećih sadržaja koji će povećati urbanitet naselja; 3. poticanje transformacije slike naselja estetsko-oblikovnim komponentama (kvalitetnija gradnja u tehnološkom i oblikovnom smislu).", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja novih slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. najmanja površina građevne čestice za slobodnostojeće je 350 m², za poluugrađene 220 m², za ugrađene 132 m²; 3. najveća izgrađenost građevne čestice je 40% za slobodnostojeću i poluugrađenu, a 50% za ugrađenu građevinu; 4. najveći kisn 1,2; najveći GBP je 400 m²; 5. građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći veći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 6. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice; 7. najveća visina je tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 8. najmanje 1 PGM/1 stan, uz obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), druge namjene prema normativima ove odluke; 9. pomoćne građevine su iza građevnog pravca glavne građevine, na građevnoj čestici moguća je gradnja samo jedne pomoćne građevine; 10. udaljenost građevnog pravca glavne građevine od rubne linije rezervacije proširenja ulice, odnosno od regulacijske linije ako za ulicu nije planirano ili nije potrebno osigurati proširenje, najmanje je 3,0 m, iznimno, može i manje u skladu s kontinuiranim građevnim pravcem postojećih građevina; 11. najmanja udaljenost građevine od međe susjedne građevne čestice je 3,0 m; 12. najmanja udaljenost građevine koja je pretežito ili isključivo namijenjena poslovnoj namjeni ili radu ne može biti manja od 3,0 m od međe susjedne građevne čestice; 13. rekonstrukcija i gradnja građevina na česticama jednakim ili većim od propisanih izvodi se po pravilima za novu gradnju; u rekonstrukciji i gradnji zamjenskih građevina postojeći parametri koji nisu u skladu s propisanim mogu se zadržati, ali bez povećanja i pogoršanja uvjeta; 14. rekonstrukcija, gradnja građevina i interpolacija na građevnim česticama manjim od propisanih za novu gradnju, uz uvjet da je najveći kisn 1,2, najveća visina tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat i udaljenost građevine od međe susjedne građevne čestice je postojeća, ali ne manje od 1,0 m, potreban broj PGM-a osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), drugi lokacijski uvjeti prema detaljnim pravilima; u rekonstrukciji i gradnji zamjenske građevine postojeći kisn i visina, veći od propisanih, mogu se zadržati, ali bez povećavanja; 15. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena osim javne i društvene koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene. b. u zoni javne i društvene namjene: 1. gradnja i rekonstrukcija prema programu i normativima osnovne namjene; 2. najveća izgrađenost građevne čestice je 40%; 3. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen; 4. najmanja udaljenost građevine od međe susjedne građevne čestice je 3,0 m; 5. GBP, kis i visina građevine nisu propisani; 6. u rekonstrukciji i gradnji nove građevine postojeća izgrađenost građevne čestice veća od propisane može se zadržati, ali bez povećavanja; najmanji prirodni teren je pos a, ove odluke; 5. obvezno je uređenje prostora prema planu na snazi UPU Groblje Jakuševec.", "(3) Detaljna pravila a. u zoni stambene i mješovite namjene: 1. gradnja slobodnostojećih, poluugrađenih i ugrađenih građevina; 2. najmanja površina građevne čestice za slobodnostojeću građevinu je 500 m², za poluugrađenu 300 m², a za ugrađenu građevinu 180 m²; 3. najveća izgrađenost građevne čestice za slobodnostojeću i poluugrađenu je 40%, a 50% za ugrađenu građevinu; 4. najveći kisn 1,0; najveći GBP je 500 m²; 5. građevina može imati najviše tri samostalne uporabne jedinice; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeći broj samostalnih uporabnih jedinica, ali bez daljnjeg povećanja; 6. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar prostora rezerviranog za proširenje ulice; 7. najveća visina je tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat; 8. najmanje 1 PGM/1 stan, uz obvezan smještaj vozila na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), druge namjene prema normativima ove odluke; 9. pomoćne građevine su iza građevnog pravca glavne građevine; 10. u Novom Zagrebu gradnja slobodnostojećih i poluugrađenih građevina, na građevnoj čestici planirati najviše 4 samostalne uporabne jedinice, ostalo prema detaljnim pravilima; 11. udaljenost građevnog pravca glavne građevine od rubne linije rezervacije proširenja ulice, odnosno od regulacijske linije ako za ulicu nije planirano ili nije potrebno osigurati proširenje, najmanje je 3,0 m, iznimno, može i manje, u skladu s kontinuiranim građevnim pravcem postojećih građevina; 12. najmanja udaljenost građevine od međe susjedne građevne čestice je 3,0 m, iznimno može biti i manja, ali ne manja od 1,0 m; 13. najmanja udaljenost pomoćne građevine koja je pretežito ili isključivo namijenjena gospodarskoj namjeni ne može biti manja od 3,0 m od međe susjedne građevne čestice; 14. rekonstrukcija i gradnja građevine na česticama jednakim ili većim od propisanih izvodi se po pravilima za novu gradnju; u rekonstrukciji i gradnji zamjenskih građevina postojeći parametri koji nisu u skladu s propisanim mogu se zadržati, ali bez povećanja i pogoršanja uvjeta; 15. rekonstrukcija, gradnja građevina i interpolacija na građevnim česticama manjima od propisanih za novu gradnju, uz uvjet da je najveći kisn 1,0, najveća visina tri nadzemne etaže, pri čemu se treća etaža oblikuje kao potkrovlje ili uvučeni kat, udaljenost građevina od međe susjedne građevne čestice je postojeća, ali ne manje od 1,0 m,, udaljenost građevina od međe za interpolaciju i za poslovnu glavnu i pomoćnu građevinu ne može biti manja od 3,0 m, potreban broj PGM-a osigurati na građevnoj čestici (ne unutar rezervacije proširenja postojeće ulice), drugi lokacijski uvjeti prema detaljnim pravilima; u rekonstrukciji i gradnji zamjenske građevine postojeći kisn i visina, veći od propisanih, te postojeća udaljenost od međe, manja od propisane, mogu se zadržati, ali bez povećavanja odnosno smanjenja; 16. iznimno, uz Branimirovu i produženu Koledinečku ulicu primjenjuju se urbana pravila iz članka 74. ove odluke; 17. opća i detaljna pravila primjenjuju se i za gradnju građevina svih namjena osim javne i društvene koje se mogu graditi u zoni stambene i mješovite namjene. Gradnja građevina javne i društvene namjene prema pravilima za zonu javne i društvene namjene. b. u zoni javne i društvene namjene: 1. gradnja i rekonstrukcija prema programu i normativima osnovne namjene; 2. gradnja slobodnostojećih, a iznimno poluugrađenih građevina; 3. najveća izgrađenost građevne čestice je 40%; 4. najmanji prirodni teren je 30% površine građevne čestice i nije ga moguće planirati unutar rezervacije proširenja postojeće ulice, parkovno uređen; 5. najmanja udaljenost građevine od međe susjedne građevne čestice je 5,0 m za poluugrađenu građevinu iznimno može biti i manja, ali ne manje od 3,0 m; 6. GBP, kis i visina građevine nisu propisani; 7. u rekonstrukciji i gradnji zamjenske građevine postojeća izgrađenost veća od propisane može se zadržati, ali bez povećavanja; najmanji prirodni teren je postojeći; 8. odobravanju gradnje novih građevina prethodi javni arhitektonski natječaj osim ako člankom 99. ove odluke nije određeno drugačije. c. u zoni poslovne namjene: Gradnja prema urbanim pravilima iz članka 77. ove odluke."]}, "2.7.": {"clanak": "74", "naziv": "Uređenje i urbana obnova prostora niske gradnje", "prostori": "Škorpikova ulica - zapad, Donji Stenjevec, Ciglenica, Trešnjevka - centar, Ravnice, Konjščinska ulica, Kajzerica, Otok, Jakuševec, Klara, Blato, Podbrežje, Horvatovo naselje, Remetinec - Lanište i drugi prema grafičkom prikazu.", "opca": ["obnova i dovršetak naselja omogućavanjem promjena oblika i veličine građevnih čestica, gradnjom novih građevina, interpolacijom, rekonstrukcijom i postupnom zamjenom trošnih građevina;", "očuvanje elemenata identiteta naselja;", "podizanje standarda naselja rekonstrukcijom postojeće i gradnjom nove ulične mreže i komunalne infrastrukture, te osiguravanjem prostora za prateće sadržaje;", "na zahvate u prostoru u zaštićenim dijelovima prirode i na kulturnim dobrima u ovom prostoru primjenjuju se i odgovarajuće odredbe iz točke 9. Mjere očuvanja i zaštite krajobraznih i prirodnih vrijednosti i nepokretnih kulturnih dobara, ove odluke."], "zone": [{"zona": "u zoni stambene i mješovite namjene", "items": ["gradnja novih slobodnostojećih, poluugrađenih i ugrađenih građevina;", "najmanja površina građevne čestice je 500 m² za slobodnostojeću, 300 m² za poluugrađenu, 180 m² za ugrađenu građevinu;", "najveća izgrađenost građevne čestice je 30% za slobodnostojeću, 40% za poluugrađenu, a 50% za ugrađenu građevinu;", "najveći kisn 1,2; najveći GBP je 600 m²;", "građevina može imati najviše 8 samostalnih uporabnih jedinica; najmanje 80 m² građevne čestice/1 samostalna uporabna jedinica; u rekonstrukciji i gradnji zamjenske građevine može se zadržati postojeć
